name: Attendance UTC date display hotfix
on:
  pull_request:
    paths:
      - 'lamastudio-school-suite/attendance/student-attendance-v2.html'
      - 'lamastudio-school-suite/attendance/teacher-attendance.html'
      - 'lamastudio-school-suite/test-native-attendance-date-hotfix.cjs'
      - '.github/workflows/attendance-date-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-calendar-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native Sheets attendance date conversion
        run: node lamastudio-school-suite/test-native-attendance-date-hotfix.cjs
