name: School Circulars Mobile Layout
on:
  pull_request:
    paths:
      - 'lamastudio-school-suite/communications/notifications.html'
      - 'lamastudio-school-suite/communications/test-circulars-mobile-layout.cjs'
      - 'lamastudio-school-suite/communications/test-circulars-safe-render.cjs'
      - '.github/workflows/circulars-mobile-layout.yml'
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: node lamastudio-school-suite/communications/test-circulars-mobile-layout.cjs
      - run: node lamastudio-school-suite/communications/test-circulars-safe-render.cjs
