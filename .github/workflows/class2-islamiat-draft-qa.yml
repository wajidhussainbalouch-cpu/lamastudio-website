name: Class 2 Islamiat Draft QA

on:
  push:
    paths:
      - 'examination-system/data/class2-islamiat-batch*-500-draft.json'
      - 'examination-system/tools/class2-islamiat-*.cjs'
      - 'examination-system/tools/audit-class2-islamiat.cjs'
      - '.github/workflows/class2-islamiat-draft-qa.yml'
  pull_request:
    paths:
      - 'examination-system/data/class2-islamiat-batch*-500-draft.json'
      - 'examination-system/tools/class2-islamiat-*.cjs'
      - 'examination-system/tools/audit-class2-islamiat.cjs'
      - '.github/workflows/class2-islamiat-draft-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify draft adapter
        run: node examination-system/tools/class2-islamiat-draft-adapter.test.cjs
      - name: Audit 1,500 draft records
        run: node examination-system/tools/audit-class2-islamiat.cjs
      - name: Verify 300 concept families
        run: node examination-system/tools/class2-islamiat-concept-families.test.cjs
      - name: Verify paper-selection safeguards
        run: node examination-system/tools/class2-islamiat-paper-selection.test.cjs
      - name: Test concept-aware paper selection
        run: node examination-system/tools/class2-islamiat-paper-selector.test.cjs
      - name: Confirm real drafts cannot enter student papers
        run: node examination-system/tools/class2-islamiat-live-draft-guard.test.cjs
      - name: Validate teacher-review evidence rules
        run: node examination-system/tools/class2-islamiat-review-validation.test.cjs
      - name: Verify school-scoped review recommendations
        run: node examination-system/tools/class2-islamiat-review-decision.test.cjs
      - name: Verify review audit event chaining
        run: node examination-system/tools/class2-islamiat-review-audit.test.cjs
      - name: Verify review store concurrency simulation
        run: node examination-system/tools/class2-islamiat-review-store.test.cjs
      - name: Verify real-data teacher review queue
        run: node examination-system/tools/class2-islamiat-review-queue.test.cjs
      - name: Verify local review preview contract
        run: node examination-system/tools/class2-islamiat-review-preview.test.cjs
      - name: Verify trusted review service boundary
        run: node examination-system/tools/class2-islamiat-review-service.test.cjs
      - name: Verify school-scoped review read boundary
        run: node examination-system/tools/class2-islamiat-review-reader.test.cjs
      - name: Verify teacher-only question detail boundary
        run: node examination-system/tools/class2-islamiat-review-detail.test.cjs
      - name: Verify mock end-to-end teacher review flow
        run: node examination-system/tools/class2-islamiat-review-integration.test.cjs
