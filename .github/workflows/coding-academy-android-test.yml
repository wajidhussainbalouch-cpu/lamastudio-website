name: LAMA Coding Academy Android Test APK

on:
  pull_request:
    paths:
      - "coding-academy/**"
      - ".github/workflows/coding-academy-android-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    name: Build installable Android QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35 platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Bundle only public local-first academy assets
        run: python3 coding-academy/android-test/package_assets.py
      - name: Build Android debug APK
        working-directory: coding-academy/android-test
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature and prepare direct file
        run: |
          mkdir -p coding-academy/android-test/dist
          cp coding-academy/android-test/app/build/outputs/apk/debug/app-debug.apk \
             coding-academy/android-test/dist/LAMA-Coding-Academy-TEST-v0.16.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
             coding-academy/android-test/dist/LAMA-Coding-Academy-TEST-v0.16.apk
          sha256sum coding-academy/android-test/dist/*.apk \
             | tee coding-academy/android-test/dist/SHA256SUMS.txt
      - name: Publish test APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: LAMA-Coding-Academy-Android-Test
          path: coding-academy/android-test/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
