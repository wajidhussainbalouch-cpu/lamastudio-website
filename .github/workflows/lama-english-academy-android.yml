name: Lama English Academy Android CI
on:
  workflow_dispatch:
  push:
    branches: [dev/lama-english-speaking-academy]
    paths:
      - 'apps/lama-english-speaking-academy/**'
      - '.github/workflows/lama-english-academy-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lama-english-speaking-academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inspect Android SDK environment
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [ -d "${ANDROID_HOME:-/nonexistent}" ]; then
            echo "Available Android platforms:"
            ls "${ANDROID_HOME}/platforms" || true
            echo "Available build tools:"
            ls "${ANDROID_HOME}/build-tools" || true
          else
            echo "::error::ANDROID_HOME does not point to an installed Android SDK"
            exit 1
          fi
          echo "Gradle version:"
          gradle --version
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Check APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lama-english-academy-debug
          path: apps/lama-english-speaking-academy/app/build/outputs/apk/debug/*.apk
