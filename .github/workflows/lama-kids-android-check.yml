name: Lama Kids Android validation
on:
  workflow_dispatch:
  push:
    branches:
      - develop/lama-kids-learning
    paths:
      - 'lama-kids-learning/**'
      - '.github/workflows/lama-kids-android-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lama-kids-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK for internal testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lama-kids-debug-apk
          path: lama-kids-learning/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
