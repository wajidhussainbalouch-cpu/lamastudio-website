name: PPSC Academy Quality Checks
on:
  push:
    paths:
      - 'education-academy/**'
      - '.github/workflows/ppsc-academy-checks.yml'
  pull_request:
    paths:
      - 'education-academy/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-academy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in education-academy/*.js education-academy/*.cjs; do
            node --check "$file"
          done
      - name: Validate question bank
        run: node education-academy/validate-papers.cjs
      - name: Validate candidate password recovery redirect and token handling
        run: node education-academy/test-account-recovery.cjs
      - name: Validate HTML navigation targets
        run: node education-academy/check-links.cjs
      - name: Verify academy launch presentation and safety disclosures
        run: node education-academy/test-launch-polish.cjs

      - name: Validate exam integrity and public caching contracts
        run: node education-academy/check-exam-contract.cjs
      - name: Validate job-wise paper selection and saved states
        run: node education-academy/test-paper-library.cjs
      - name: Validate job-wise subject library and sequential paper menu
        run: node education-academy/test-jobwise-library.cjs
      - name: Verify new Headmaster Paper 2 and candidate answer key
        run: node education-academy/test-headmaster-paper2.cjs
      - name: Validate Headmaster Paper 3 originality and answer key
        run: node education-academy/test-headmaster-paper3.cjs
      - name: Validate Headmaster Paper 4 originality and answer key
        run: node education-academy/test-headmaster-paper4.cjs
      - name: Validate Headmaster Paper 5 originality and answer key
        run: node education-academy/test-headmaster-paper5.cjs
      - name: Validate Headmaster Paper 6 originality and answer key
        run: node education-academy/test-headmaster-paper6.cjs
      - name: Validate Headmaster Paper 7 originality and answer key
        run: node education-academy/test-headmaster-paper7.cjs
      - name: Validate Headmaster Paper 8 originality and answer key
        run: node education-academy/test-headmaster-paper8.cjs
      - name: Validate Headmaster Paper 9 originality and answer key
        run: node education-academy/test-headmaster-paper9.cjs
      - name: Validate Headmaster Paper 10 originality and answer key
        run: node education-academy/test-headmaster-paper10.cjs
      - name: Validate Headmaster Paper 11 originality and answer key
        run: node education-academy/test-headmaster-paper11.cjs
      - name: Validate Headmaster Paper 12 originality and answer key
        run: node education-academy/test-headmaster-paper12.cjs
      - name: Validate Headmaster Paper 13 originality and answer key
        run: node education-academy/test-headmaster-paper13.cjs
      - name: Validate Headmaster Paper 14 originality and answer key
        run: node education-academy/test-headmaster-paper14.cjs
      - name: Validate Headmaster Paper 15 originality and answer key
        run: node education-academy/test-headmaster-paper15.cjs
      - name: Validate Headmaster Paper 16 originality and answer key
        run: node education-academy/test-headmaster-paper16.cjs
      - name: Validate Headmaster Paper 17 originality and answer key
        run: node education-academy/test-headmaster-paper17.cjs
      - name: Validate Headmaster Paper 18 originality and answer key
        run: node education-academy/test-headmaster-paper18.cjs
      - name: Validate dynamic managed job catalog
        run: node education-academy/test-job-catalog.cjs
      - name: Validate private Admin question and registration boundaries
        run: node education-academy/test-private-admin-contract.cjs
