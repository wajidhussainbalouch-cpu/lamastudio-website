name: Syllabus Planner Tests
on:
  push:
    branches: [main]
    paths:
      - 'examination-system/syllabus-*.js'
      - 'examination-system/test-syllabus-*.js'
      - 'lamastudio-school-suite/backend-api/syllabus-approval.gs'
      - 'lamastudio-school-suite/backend-api/test-syllabus-approval.js'
      - 'lamastudio-school-suite/backend-api/syllabus-draft.gs'
      - 'lamastudio-school-suite/backend-api/test-syllabus-draft.js'
      - '.github/workflows/syllabus-planner-tests.yml'
  pull_request:
    paths:
      - 'examination-system/syllabus-*.js'
      - 'examination-system/test-syllabus-*.js'
      - '.github/workflows/syllabus-planner-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syllabus-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scheduler
        run: node examination-system/test-syllabus-scheduler.js
      - name: Progress
        run: node examination-system/test-syllabus-progress.js
      - name: Catalog
        run: node examination-system/test-syllabus-catalog.js
      - name: Calendar
        run: node examination-system/test-syllabus-calendar.js
      - name: Integrated preview
        run: node examination-system/test-syllabus-planner.js
      - name: Approval workflow
        run: node examination-system/test-syllabus-workflow.js
      - name: Safe replan
        run: node examination-system/test-syllabus-replan.js
      - name: Server policy contract
        run: node examination-system/test-syllabus-policy.js

      - name: Published diary suggestions
        run: node examination-system/test-syllabus-diary.js

      - name: Approval transaction contract
        run: node examination-system/test-syllabus-transaction.js

      - name: Scoped syllabus storage orchestration
        run: node examination-system/test-syllabus-store.js

      - name: Apps Script approval state machine
        run: node lamastudio-school-suite/backend-api/test-syllabus-approval.js

      - name: School-wide reporting
        run: node examination-system/test-syllabus-school-report.js

      - name: Chapter reporting
        run: node examination-system/test-syllabus-report.js

      - name: Manual draft validation
        run: node lamastudio-school-suite/backend-api/test-syllabus-draft.js
