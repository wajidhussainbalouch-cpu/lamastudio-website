name: Syllabus Planner Tests
on:
  push:
    branches: [main]
    paths:
      - 'examination-system/syllabus-*.js'
      - 'examination-system/test-syllabus-*.js'
      - 'lamastudio-school-suite/backend-api/syllabus-approval.gs'
      - 'lamastudio-school-suite/backend-api/test-syllabus-approval.js'
      - 'lamastudio-school-suite/backend-api/syllabus-draft.gs'
      - 'lamastudio-school-suite/backend-api/test-syllabus-draft.js'
      - '.github/workflows/syllabus-planner-tests.yml'
  pull_request:
    paths:
      - 'examination-system/syllabus-*.js'
      - 'examination-system/test-syllabus-*.js'
      - '.github/workflows/syllabus-planner-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syllabus-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scheduler
        run: node examination-system/test-syllabus-scheduler.js
      - name: Progress
        run: node examination-system/test-syllabus-progress.js
      - name: Catalog
        run: node examination-system/test-syllabus-catalog.js
      - name: Class 5 English capacity report
        run: node examination-system/test-syllabus-capacity-report.js
      - name: Read-only completion-risk preview
        run: node examination-system/test-syllabus-capacity-preview.js
      - name: Timetable capacity scenarios
        run: node examination-system/test-syllabus-capacity-scenarios.js
      - name: Read-only capacity audit
        run: node examination-system/test-syllabus-capacity-audit.js
      - name: Published teacher diary access checks
        run: node examination-system/test-syllabus-published-diary-gate.js
      - name: Teacher diary projection checks
        run: node examination-system/test-syllabus-teacher-diary-projection.js
      - name: Approval audit ledger integrity
        run: node examination-system/test-syllabus-approval-ledger.js
      - name: Syllabus snapshot integrity
        run: node examination-system/test-syllabus-division-snapshot.js
      - name: Draft lesson editor safeguards
        run: node examination-system/test-syllabus-draft-editor.js
      - name: Approval readiness safeguards
        run: node examination-system/test-syllabus-approval-readiness.js
      - name: Read-only admin schedule preview
        run: node examination-system/test-syllabus-admin-preview.js
      - name: School calendar and period capacity
        run: node examination-system/test-syllabus-school-calendar-2026.js
      - name: Class 5 English undated division
        run: node examination-system/test-syllabus-division-draft.js
      - name: Actual subject timetable periods
        run: node examination-system/test-syllabus-explicit-timetable.js
      - name: Completed lesson history integrity
        run: node examination-system/test-syllabus-completion-integrity.js
      - name: Same-day completed lesson chronology
        run: node examination-system/test-syllabus-same-day-progress.js
      - name: Approved division calendar reflow
        run: node examination-system/test-syllabus-calendar-engine.js
      - name: Calendar
        run: node examination-system/test-syllabus-calendar.js
      - name: Integrated preview
        run: node examination-system/test-syllabus-planner.js
      - name: Approval workflow
        run: node examination-system/test-syllabus-workflow.js
      - name: Safe replan
        run: node examination-system/test-syllabus-replan.js
      - name: Server policy contract
        run: node examination-system/test-syllabus-policy.js

      - name: Published diary suggestions
        run: node examination-system/test-syllabus-diary.js

      - name: Approval transaction contract
        run: node examination-system/test-syllabus-transaction.js

      - name: Scoped syllabus storage orchestration
        run: node examination-system/test-syllabus-store.js

      - name: Legacy dated plan compatibility audit
        run: node examination-system/test-syllabus-legacy-plan-audit.js

      - name: Apps Script approval state machine
        run: node lamastudio-school-suite/backend-api/test-syllabus-approval.js

      - name: Academic session and overlap safeguards
        run: node examination-system/test-syllabus-session-filter.js

      - name: Audited teacher progress reassignment
        run: node examination-system/test-syllabus-reassign.js

      - name: Apps Script progress store permissions
        run: node examination-system/test-syllabus-progress-store.js

      - name: School-wide reporting
        run: node examination-system/test-syllabus-school-report.js

      - name: Chapter reporting
        run: node examination-system/test-syllabus-report.js

      - name: Manual draft validation
        run: node lamastudio-school-suite/backend-api/test-syllabus-draft.js
