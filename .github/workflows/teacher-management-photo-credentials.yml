name: Teacher Management Credentials and Portrait Upload
on:
  pull_request:
    paths:
      - 'lamastudio-school-suite/staff/manage-teachers.html'
      - 'lamastudio-school-suite/staff/test-teacher-profile-security.cjs'
      - 'lamastudio-school-suite/staff/test-teacher-photo-size.cjs'
      - 'lamastudio-school-suite/backend-api/code.gs'
      - 'lamastudio-school-suite/js/api-client.js'
      - 'lamastudio-school-suite/js/teacher-photo-utils.js'
      - '.github/workflows/teacher-management-photo-credentials.yml'
  push:
    branches:
      - 'fix/teacher-profile-credentials-photos-20261117'
permissions:
  contents: read
jobs:
  credential-and-photo-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Teacher administrator credential and form security
        run: node lamastudio-school-suite/staff/test-teacher-profile-security.cjs
      - name: Teacher gallery/camera portrait crop and size
        run: node lamastudio-school-suite/staff/test-teacher-photo-size.cjs
