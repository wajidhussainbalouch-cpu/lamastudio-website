<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — lamaPhotoResizer</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<div class="admin-shell">

  <!-- ===================== LOGIN VIEW ===================== -->
  <section class="admin-login" id="loginView">
    <form class="login-card" id="loginForm">
      <span class="brand-seal" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.2 3.2"/>
          <text x="24" y="29" text-anchor="middle" font-family="Fraunces, serif" font-size="17" font-weight="700" fill="currentColor">L</text>
        </svg>
      </span>
      <h1>lamaPhotoResizer Admin</h1>
      <p class="panel-hint">Sign in with your admin account to review licenses and payment claims.</p>

      <label class="field">
        <span>Email</span>
        <input type="email" id="loginEmail" required autocomplete="username" />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </label>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
      <p class="claim-status" id="loginStatus"></p>
    </form>
  </section>

  <!-- ===================== DASHBOARD VIEW ===================== -->
  <div class="admin-dashboard" id="dashboardView" hidden>

    <header class="topbar">
      <div class="brand">
        <span class="brand-seal" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="30" height="30">
            <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.4"/>
            <text x="24" y="29" text-anchor="middle" font-family="Fraunces, serif" font-size="17" font-weight="700" fill="currentColor">L</text>
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-name">lama<em>PhotoResizer</em></span>
          <span class="brand-sub">admin dashboard</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="adminName" class="privacy-chip"></span>
        <button class="btn btn-small btn-ghost" id="logoutBtn" type="button">Sign out</button>
      </div>
    </header>

    <main class="admin-main">

      <section class="stat-grid" id="statGrid" aria-live="polite"></section>

      <section class="admin-panel">
        <div class="admin-panel-head">
          <h2>Payment claims</h2>
          <div class="tab-row" role="tablist" id="claimTabs">
            <button type="button" class="tab-btn" data-status="pending" aria-selected="true">Pending</button>
            <button type="button" class="tab-btn" data-status="approved" aria-selected="false">Approved</button>
            <button type="button" class="tab-btn" data-status="rejected" aria-selected="false">Rejected</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="admin-table" id="claimsTable">
            <thead>
              <tr>
                <th>Date</th><th>License</th><th>Method</th><th>TxID</th>
                <th>Amount</th><th>Plan</th><th>Contact</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="claimsTableBody"></tbody>
          </table>
          <p class="empty-note" id="claimsEmptyNote" hidden>Nothing here.</p>
        </div>
      </section>

      <section class="admin-panel">
        <div class="admin-panel-head">
          <h2>Licenses</h2>
          <input type="search" id="licenseSearch" class="select" placeholder="Search by key, email, device…" />
        </div>
        <div class="table-wrap">
          <table class="admin-table" id="licensesTable">
            <thead>
              <tr><th>Key</th><th>Status</th><th>Plan</th><th>Trial usage</th><th>Created</th></tr>
            </thead>
            <tbody id="licensesTableBody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
