<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us — lamaPixelStudio</title>
<meta name="description" content="Get in touch with the lamaPixelStudio team for support, feedback, or feature requests." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css" />
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <a href="../index.html" class="brand-seal" style="text-decoration:none; color:inherit;">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.2 3.2"/>
          <text x="24" y="29" text-anchor="middle" font-family="Fraunces, serif" font-size="17" font-weight="700" fill="currentColor">L</text>
        </svg>
      </a>
      <div class="brand-text">
        <span class="brand-name"><a href="../index.html" style="text-decoration:none; color:inherit;">lama<em>PixelStudio</em></a></span>
        <span class="brand-sub">Contact Us</span>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="../index.html" class="btn btn-small btn-ghost">← Back to Hub</a>
    </div>
  </header>

  <main class="main" style="max-width: 650px; margin: 40px auto; padding: 0 20px;">
    <h1 style="font-family: var(--font-display); font-size: 32px; margin-bottom: 12px;">Get in Touch</h1>
    <p style="color: var(--ink-soft); font-size: 15px; margin-bottom: 30px;">Have a feature request, bug report, or feedback? We'd love to hear from you.</p>

    <form class="card" style="padding: 30px; display: flex; flex-direction: column; gap: 20px;" onsubmit="event.preventDefault(); alert('Thanks for your message! We will get back to you soon.');">
      <label class="field">
        <span>Your Name</span>
        <input type="text" placeholder="John Doe" required style="width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px;" />
      </label>
      
      <label class="field">
        <span>Email Address</span>
        <input type="email" placeholder="john@example.com" required style="width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px;" />
      </label>

      <label class="field">
        <span>Message</span>
        <textarea rows="5" placeholder="Tell us what you think..." required style="width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font-family: inherit;"></textarea>
      </label>

      <button type="submit" class="btn btn-accent" style="padding: 12px; font-weight: 600;">Send Message</button>
    </form>
  </main>
</div>

</body>
</html>
