<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Color Picker from Image — lamaPixelStudio</title>
<meta name="description" content="Upload any photo to extract, pick, and copy precise HEX, RGB, and HSL color codes right inside your browser." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css" />
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <a href="../index.html" class="brand-seal" style="text-decoration:none; color:inherit;">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.2 3.2"/>
          <text x="24" y="29" text-anchor="middle" font-family="Fraunces, serif" font-size="17" font-weight="700" fill="currentColor">L</text>
        </svg>
      </a>
      <div class="brand-text">
        <span class="brand-name"><a href="../index.html" style="text-decoration:none; color:inherit;">lama<em>PixelStudio</em></a></span>
        <span class="brand-sub">Color Picker</span>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="../index.html" class="btn btn-small btn-ghost">← Back to Hub</a>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll">
        <section class="panel">
          <h2 class="panel-title"><span class="eyebrow">01</span> Selected Color</h2>
          <div id="colorPreviewBox" style="height: 80px; border-radius: 8px; background: #e5e5e5; border: 1px solid var(--line); margin-bottom: 16px;"></div>
          
          <label class="field">
            <span>HEX Code</span>
            <input type="text" id="hexInput" readonly value="#--.--.--" style="font-family: var(--font-mono);" />
          </label>
          <label class="field" style="margin-top: 10px;">
            <span>RGB Code</span>
            <input type="text" id="rgbInput" readonly value="rgb(0, 0, 0)" style="font-family: var(--font-mono);" />
          </label>
        </section>
      </div>
      <div class="sidebar-footer">
        <button id="copyColorBtn" class="btn btn-accent btn-block" type="button" disabled>Copy HEX Code</button>
      </div>
    </aside>

    <main class="main">
      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <div class="dropzone-inner">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 16V4M12 4 7 9M12 4l5 5"/>
            <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg>
          <p class="dz-title">Drop an image to pick colors</p>
          <p class="dz-sub">Click anywhere on the uploaded image to inspect colors</p>
        </div>
      </div>
      <div id="canvasContainer" style="margin-top:20px; text-align:center;" hidden></div>
      <p class="empty-note" id="emptyNote">Upload an image to start picking colors.</p>
    </main>
  </div>
</div>

<script src="../js/color-picker.js"></script>
</body>
</html>
