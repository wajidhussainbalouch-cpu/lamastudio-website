<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crop Image — lamaPixelStudio</title>
<meta name="description" content="Trim dimensions cleanly with interactive visual aspect ratios right in your browser." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css" />
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <a href="../index.html" class="brand-seal" style="text-decoration:none; color:inherit;">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.2 3.2"/>
          <text x="24" y="29" text-anchor="middle" font-family="Fraunces, serif" font-size="17" font-weight="700" fill="currentColor">L</text>
        </svg>
      </a>
      <div class="brand-text">
        <span class="brand-name"><a href="../index.html" style="text-decoration:none; color:inherit;">lama<em>PixelStudio</em></a></span>
        <span class="brand-sub">Image Cropper</span>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="../index.html" class="btn btn-small btn-ghost">← Back to Hub</a>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll">
        <section class="panel">
          <h2 class="panel-title"><span class="eyebrow">01</span> Aspect Ratio</h2>
          <div class="field-row">
            <select id="aspectRatio" class="select">
              <option value="free">Freehand</option>
              <option value="1">Square (1:1)</option>
              <option value="1.333">Standard (4:3)</option>
              <option value="1.777">Widescreen (16:9)</option>
              <option value="0.75">Portrait (3:4)</option>
            </select>
          </div>
        </section>
      </div>
      <div class="sidebar-footer">
        <button id="cropBtn" class="btn btn-accent btn-block" type="button" disabled>Crop &amp; Download</button>
      </div>
    </aside>

    <main class="main">
      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <div class="dropzone-inner">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 16V4M12 4 7 9M12 4l5 5"/>
            <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg>
          <p class="dz-title">Drop an image to crop here</p>
          <p class="dz-sub">Supports single image frame cropping</p>
        </div>
      </div>
      <div id="cropContainer" style="margin-top:20px; text-align:center;" hidden>
        <!-- Canvas/Editing preview area will hook here -->
      </div>
      <p class="empty-note" id="emptyNote">Upload an image to start cropping.</p>
    </main>
  </div>
</div>

<script src="../js/cropper.js"></script>
</body>
</html>
