<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Crop Image — lamaPixelStudio</title>
  <meta name="description" content="Trim dimensions cleanly with interactive visual aspect ratios right in your browser." />  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-main: #1C0A33;
      --surface: rgba(76, 29, 149, 0.22);
      --surface-hover: rgba(182, 252, 212, 0.12);
      --line: rgba(182, 252, 212, 0.2);
      --text-main: #F8FAFC;
      --ink-soft: #CBD5E1;
      --c-accent: #B6FCD4; /* Mint Frost */
      --c-secondary: #4C1D95; /* Royal Iris */
      --card-shadow: 0 16px 32px rgba(10, 3, 20, 0.5);
    }
    :root[data-theme="light"] {
      --bg-main: #F4F7FB;
      --surface: #FFFFFF;
      --surface-hover: rgba(76, 29, 149, 0.05);
      --line: #E2E8F0;
      --text-main: #231145;
      --ink-soft: #64748B;
      --c-accent: #4C1D95;
      --c-secondary: #B6FCD4;
      --card-shadow: 0 10px 25px rgba(76, 29, 149, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--bg-main);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      overflow: hidden;
      background: linear-gradient(135deg, #4C1D95, #B6FCD4);
      border: 1px solid rgba(182, 252, 212, 0.3);
      flex-shrink: 0;
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text { display: flex; flex-direction: column; }
    .brand-name { font-weight: 700; font-size: 0.95rem; }
    .brand-name em { font-style: normal; color: var(--c-accent); }
    .brand-sub { font-size: 0.68rem; color: var(--ink-soft); }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      min-height: 40px;
    }
    .btn:hover {
      border-color: var(--c-accent);
      background: var(--surface-hover);
      color: var(--c-accent);
    }
    .btn-accent {
      background: #B6FCD4;
      color: #231145;
      border: none;
    }
    :root[data-theme="light"] .btn-accent {
      background: #4C1D95;
      color: #F8FAFC;
    }
    .btn-accent:hover { opacity: 0.9; }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .app-body {
      display: grid;
      grid-template-columns: 280px 540px;
      flex-grow: 1;
      max-width: 880px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
      gap: 1.25rem;
      align-items: stretch;
    }
    @media (max-width: 860px) {
      .app-body { 
        grid-template-columns: 1fr; 
        margin: 1rem auto;
        max-width: 540px;
      }
    }

    .sidebar {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(12px);
    }
    .panel-title {
      font-family: 'Fraunces', serif;
      font-size: 1.05rem;
      margin-top: 0;
      margin-bottom: 0.4rem;
    }
    .panel-hint {
      font-size: 0.75rem;
      color: var(--ink-soft);
      margin-top: 0;
      margin-bottom: 1rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 0.85rem;
      font-size: 0.78rem;
      color: var(--ink-soft);
      font-weight: 500;
    }
    .select {
      background: var(--bg-main);
      border: 1px solid var(--line);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 100%;
      min-height: 40px;
    }

    .main {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--card-shadow);
      min-height: 100%;
      position: relative;
      overflow: hidden;
    }
    .dropzone {
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 2.5rem 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      width: 100%;
      background: var(--bg-main);
    }
    .dropzone:hover {
      border-color: var(--c-accent);
      background: var(--surface-hover);
    }
    .dz-title {
      font-weight: 600;
      font-size: 1rem;
      margin: 10px 0 4px 0;
    }
    .dz-sub {
      font-size: 0.78rem;
      color: var(--ink-soft);
      margin: 0;
    }
    #cropContainer {
      position: relative;
      max-width: 100%;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <img src="../apps/lamapixelstudio/lamapixelstudio_icon.png" alt="lamaPixelStudio Logo" onerror="this.src='https://placehold.co/40x40/4C1D95/B6FCD4?text=L'" />
      </div>
      <div class="brand-text">
        <span class="brand-name"><a href="../index.html" style="text-decoration:none; color:inherit;">lama<em>PixelStudio</em></a></span>
        <span class="brand-sub">Image Cropper</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="themeToggleBtn" class="btn" title="Toggle Theme" aria-label="Toggle Theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
      <a href="../index.html" class="btn">← Back</a>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div>
        <h2 class="panel-title">✂️ Crop Controls</h2>
        <p class="panel-hint">Select ratio or drag handles to freely crop any region.</p>
                     
        <label class="field">
          <span>Aspect Ratio</span>
          <select id="aspectRatioSelect" class="select">
            <option value="free">Freehand (Flexible)</option>
            <option value="1">Square (1:1)</option>
            <option value="1.333">Standard (4:3)</option>
            <option value="1.777">Widescreen (16:9)</option>
            <option value="0.75">Portrait (3:4)</option>
          </select>
        </label>
      </div>

      <div style="margin-top: 1rem; display: flex; flex-direction: column; gap: 8px;">
        <button id="cropBtn" class="btn btn-accent" style="width: 100%; display: none;" type="button">Crop &amp; Download</button>
        <button id="clearBtn" class="btn btn-danger" style="width: 100%; display: none;" type="button">Clear Selection</button>
      </div>
    </aside>

    <main class="main" id="mainContainer">
      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <div class="dropzone-inner">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--c-accent);">
            <path d="M12 16V4M12 4 7 9M12 4l5 5"/>
            <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg>
          <p class="dz-title">Tap or drop photo to crop</p>
          <p class="dz-sub">Supports single image frame cropping</p>
        </div>
      </div>
      <div id="cropContainer" hidden>
        <canvas id="cropCanvas"></canvas>
      </div>
      <p class="empty-note" id="emptyNote" style="margin-top: 10px; color: var(--ink-soft); font-size: 0.78rem; text-align: center;">Upload an image to start cropping.</p>
    </main>
  </div>

  <script>
    const htmlRoot = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlRoot.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      htmlRoot.setAttribute('data-theme', newTheme);
      localStorage.setItem('lps_theme', newTheme);
    });

    const savedTheme = localStorage.getItem('lps_theme');
    if (savedTheme) {
      htmlRoot.setAttribute('data-theme', savedTheme);
    }

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const cropContainer = document.getElementById('cropContainer');
    const cropCanvas = document.getElementById('cropCanvas');
    const ctx = cropCanvas.getContext('2d');
    const emptyNote = document.getElementById('emptyNote');
    const cropBtn = document.getElementById('cropBtn');
    const clearBtn = document.getElementById('clearBtn');
    const aspectRatioSelect = document.getElementById('aspectRatioSelect');

    let loadedImg = null;
    let dragMode = null; 
    let startX = 0, startY = 0;
    let cropRect = { x: 0, y: 0, w: 100, h: 100 };
    let initialRect = { x: 0, y: 0, w: 100, h: 100 };

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--c-accent)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--line)'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        loadImage(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        loadImage(e.target.files[0]);
      }
    });

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        loadedImg = new Image();
        loadedImg.onload = () => {
          dropzone.style.display = 'none';
          emptyNote.style.display = 'none';
          cropContainer.hidden = false;
          cropBtn.style.display = 'inline-flex';
          clearBtn.style.display = 'inline-flex';

          const maxWidth = 500;
          const scale = loadedImg.width > maxWidth ? maxWidth / loadedImg.width : 1;
          cropCanvas.width = loadedImg.width * scale;
          cropCanvas.height = loadedImg.height * scale;

          cropRect = {
            x: cropCanvas.width * 0.15,
            y: cropCanvas.height * 0.15,
            w: cropCanvas.width * 0.7,
            h: cropCanvas.height * 0.7
          };
          redrawCanvas();
        };
        loadedImg.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function redrawCanvas() {
      if (!loadedImg) return;
      ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      ctx.drawImage(loadedImg, 0, 0, cropCanvas.width, cropCanvas.height);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);

      ctx.save();
      ctx.beginPath();
      ctx.rect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      ctx.clip();
      ctx.drawImage(loadedImg, 0, 0, cropCanvas.width, cropCanvas.height);
      ctx.restore();

      ctx.strokeStyle = '#B6FCD4';
      ctx.lineWidth = 2;
      ctx.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);

      const handleSize = 8;
      ctx.fillStyle = '#B6FCD4';
      ctx.fillRect(cropRect.x - handleSize/2, cropRect.y - handleSize/2, handleSize, handleSize);
      ctx.fillRect(cropRect.x + cropRect.w - handleSize/2, cropRect.y - handleSize/2, handleSize, handleSize);
      ctx.fillRect(cropRect.x + cropRect.w - handleSize/2, cropRect.y + cropRect.h - handleSize/2, handleSize, handleSize);
      ctx.fillRect(cropRect.x - handleSize/2, cropRect.y + cropRect.h - handleSize/2, handleSize, handleSize);
    }

    function getMousePos(e) {
      const rect = cropCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startInteraction(e) {
      if (!loadedImg) return;
      const pos = getMousePos(e);
      startX = pos.x;
      startY = pos.y;
      initialRect = { ...cropRect };

      const handleRadius = 15;
      const isFree = aspectRatioSelect.value === 'free';

      if (isFree) {
        if (Math.hypot(pos.x - cropRect.x, pos.y - cropRect.y) < handleRadius) {
          dragMode = 'nw';
        } else if (Math.hypot(pos.x - (cropRect.x + cropRect.w), pos.y - cropRect.y) < handleRadius) {
          dragMode = 'ne';
        } else if (Math.hypot(pos.x - (cropRect.x + cropRect.w), pos.y - (cropRect.y + cropRect.h)) < handleRadius) {
          dragMode = 'se';
        } else if (Math.hypot(pos.x - cropRect.x, pos.y - (cropRect.y + cropRect.h)) < handleRadius) {
          dragMode = 'sw';
        } else if (pos.x >= cropRect.x && pos.x <= cropRect.x + cropRect.w && pos.y >= cropRect.y && pos.y <= cropRect.y + cropRect.h) {
          dragMode = 'move';
        } else {
          dragMode = 'create';
          cropRect.x = pos.x;
          cropRect.y = pos.y;
          cropRect.w = 10;
          cropRect.h = 10;
        }
      } else {
        if (pos.x >= cropRect.x && pos.x <= cropRect.x + cropRect.w && pos.y >= cropRect.y && pos.y <= cropRect.y + cropRect.h) {
          dragMode = 'move';
        } else {
          dragMode = 'create-ratio';
        }
      }
    }

    function moveInteraction(e) {
      if (!dragMode || !loadedImg) return;
      const pos = getMousePos(e);
      const dx = pos.x - startX;
      const dy = pos.y - startY;
      const ratioVal = aspectRatioSelect.value;

      if (dragMode === 'move') {
        cropRect.x = Math.max(0, Math.min(initialRect.x + dx, cropCanvas.width - cropRect.w));
        cropRect.y = Math.max(0, Math.min(initialRect.y + dy, cropCanvas.height - cropRect.h));
      } else if (dragMode === 'se') {
        cropRect.w = Math.max(20, Math.min(initialRect.w + dx, cropCanvas.width - initialRect.x));
        if (ratioVal === 'free') {
          cropRect.h = Math.max(20, Math.min(initialRect.h + dy, cropCanvas.height - initialRect.y));
        } else {
          cropRect.h = cropRect.w / parseFloat(ratioVal);
        }
      } else if (dragMode === 'nw') {
        let newW = initialRect.w - dx;
        let newX = initialRect.x + dx;
        if (newW > 20 && newX >= 0) {
          cropRect.x = newX;
          cropRect.w = newW;
        }
        let newH = initialRect.h - dy;
        let newY = initialRect.y + dy;
        if (newH > 20 && newY >= 0) {
          cropRect.y = newY;
          cropRect.h = newH;
        }
        if (ratioVal !== 'free') {
          cropRect.h = cropRect.w / parseFloat(ratioVal);
        }
      } else if (dragMode === 'ne') {
        let newW = initialRect.w + dx;
        if (newW > 20 && initialRect.x + newW <= cropCanvas.width) {
          cropRect.w = newW;
        }
        let newH = initialRect.h - dy;
        let newY = initialRect.y + dy;
        if (newH > 20 && newY >= 0) {
          cropRect.y = newY;
          cropRect.h = newH;
        }
        if (ratioVal !== 'free') {
          cropRect.h = cropRect.w / parseFloat(ratioVal);
        }
      } else if (dragMode === 'sw') {
        let newW = initialRect.w - dx;
        let newX = initialRect.x + dx;
        if (newW > 20 && newX >= 0) {
          cropRect.x = newX;
          cropRect.w = newW;
        }
        let newH = initialRect.h + dy;
        if (newH > 20 && initialRect.y + newH <= cropCanvas.height) {
          cropRect.h = newH;
        }
        if (ratioVal !== 'free') {
          cropRect.h = cropRect.w / parseFloat(ratioVal);
        }
      } else if (dragMode === 'create') {
        cropRect.w = Math.max(10, Math.abs(dx));
        cropRect.h = Math.max(10, Math.abs(dy));
        if (pos.x < startX) cropRect.x = pos.x;
        else cropRect.x = startX;
        if (pos.y < startY) cropRect.y = pos.y;
        else cropRect.y = startY;
      }
      redrawCanvas();
    }

    function endInteraction() {
      dragMode = null;
    }

    cropCanvas.addEventListener('mousedown', startInteraction);
    cropCanvas.addEventListener('mousemove', moveInteraction);
    window.addEventListener('mouseup', endInteraction);

    cropCanvas.addEventListener('touchstart', (e) => { startInteraction(e); e.preventDefault(); });
    cropCanvas.addEventListener('touchmove', (e) => { moveInteraction(e); e.preventDefault(); });
    window.addEventListener('touchend', endInteraction);

    aspectRatioSelect.addEventListener('change', () => {
      const val = aspectRatioSelect.value;
      if (val === 'free') return;
      const ratio = parseFloat(val);
      cropRect.w = Math.min(cropCanvas.width * 0.7, cropCanvas.height * 0.7);
      cropRect.h = cropRect.w / ratio;
      if (cropRect.y + cropRect.h > cropCanvas.height) {
        cropRect.h = cropCanvas.height - cropRect.y;
        cropRect.w = cropRect.h * ratio;
      }
      redrawCanvas();
    });

    cropBtn.addEventListener('click', () => {
      if (!loadedImg) return;
      const scaleRatio = loadedImg.width / cropCanvas.width;
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = cropRect.w * scaleRatio;
      exportCanvas.height = cropRect.h * scaleRatio;
      const exportCtx = exportCanvas.getContext('2d');

      exportCtx.drawImage(
        loadedImg,
        cropRect.x * scaleRatio, cropRect.y * scaleRatio,
        cropRect.w * scaleRatio, cropRect.h * scaleRatio,
        0, 0, exportCanvas.width, exportCanvas.height
      );

      const link = document.createElement('a');
      link.download = 'cropped_image.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    clearBtn.addEventListener('click', () => {
      loadedImg = null;
      fileInput.value = '';
      cropContainer.hidden = true;
      dropzone.style.display = 'block';
      emptyNote.style.display = 'block';
      cropBtn.style.display = 'none';
      clearBtn.style.display = 'none';
      aspectRatioSelect.value = 'free';
      ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
    });
  </script>
</body>
</html>
