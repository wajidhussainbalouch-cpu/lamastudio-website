<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Burn Rate Calculator — LamaStudio Business</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 600px; margin: 2rem auto; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .form-group input { width: 100%; padding: 0.75rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .calc-btn { background: var(--category-color); color: #fff; width: 100%; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 1rem; }
  .result-box { margin-top: 1.5rem; padding: 1.25rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; text-align: center; color: var(--category-color); }
</style>
</head>
<body style="--category-color: var(--c-business);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Burn Rate</small></span></a></div></header>
<main style="padding: 2rem 1rem;">
  <div class="tool-box">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">Startup Burn Rate Calculator</h1>
    <div class="form-group"><label>Starting Cash ($)</label><input type="number" id="startCash" value="200000"></div>
    <div class="form-group"><label>Ending Cash ($)</label><input type="number" id="endCash" value="160000"></div>
    <div class="form-group"><label>Time Period (Months)</label><input type="number" id="months" value="3"></div>
    <button class="calc-btn" onclick="calcBurn()">Calculate Net Burn Rate</button>
    <div class="result-box" id="output">Result will appear here...</div>
  </div>
</main>
<script>
function calcBurn() {
  const start = parseFloat(document.getElementById('startCash').value);
  const end = parseFloat(document.getElementById('endCash').value);
  const m = parseFloat(document.getElementById('months').value);
  if(m <= 0) { document.getElementById('output').innerText = "Months must be greater than zero."; return; }
  const netBurn = (start - end) / m;
  document.getElementById('output').innerHTML = `<strong>Net Monthly Burn Rate: $${netBurn.toFixed(2)}/mo</strong>`;
}
</script>
</body>
</html>
