<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAGR Growth Estimator — LamaStudio Business</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 600px; margin: 2rem auto; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .form-group input { width: 100%; padding: 0.75rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .calc-btn { background: var(--category-color); color: #fff; width: 100%; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 1rem; }
  .result-box { margin-top: 1.5rem; padding: 1.25rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; text-align: center; color: var(--category-color); }
</style>
</head>
<body style="--category-color: var(--c-business);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>CAGR Tool</small></span></a></div></header>
<main style="padding: 2rem 1rem;">
  <div class="tool-box">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">CAGR Growth Estimator</h1>
    <div class="form-group"><label>Initial Value ($)</label><input type="number" id="initVal" value="10000"></div>
    <div class="form-group"><label>Ending Value ($)</label><input type="number" id="endVal" value="25000"></div>
    <div class="form-group"><label>Number of Years</label><input type="number" id="yrs" value="4"></div>
    <button class="calc-btn" onclick="calcCAGR()">Calculate CAGR</button>
    <div class="result-box" id="output">Result will appear here...</div>
  </div>
</main>
<script>
function calcCAGR() {
  const init = parseFloat(document.getElementById('initVal').value);
  const end = parseFloat(document.getElementById('endVal').value);
  const n = parseFloat(document.getElementById('yrs').value);
  if(n <= 0 || init <= 0) { document.getElementById('output').innerText = "Please enter valid positive numbers."; return; }
  const cagr = (Math.pow(end / init, 1 / n) - 1) * 100;
  document.getElementById('output').innerHTML = `<strong>Compound Annual Growth Rate (CAGR): ${cagr.toFixed(2)}%</strong>`;
}
</script>
</body>
</html>
