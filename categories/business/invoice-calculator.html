<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Total Calculator — LamaStudio Business</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 600px; margin: 2rem auto; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .form-group input { width: 100%; padding: 0.75rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .calc-btn { background: var(--category-color); color: #fff; width: 100%; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 1rem; }
  .result-box { margin-top: 1.5rem; padding: 1.25rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; text-align: center; color: var(--category-color); }
</style>
</head>
<body style="--category-color: var(--c-business);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Invoice Calculator</small></span></a></div></header>
<main style="padding: 2rem 1rem;">
  <div class="tool-box">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">Invoice Total Calculator</h1>
    <div class="form-group"><label>Subtotal Amount ($)</label><input type="number" id="subtotal" value="1250"></div>
    <div class="form-group"><label>Tax Rate (%)</label><input type="number" id="taxRate" value="8.5"></div>
    <div class="form-group"><label>Shipping / Handling Fee ($)</label><input type="number" id="shipping" value="45"></div>
    <button class="calc-btn" onclick="calcInvoice()">Calculate Total Due</button>
    <div class="result-box" id="output">Result will appear here...</div>
  </div>
</main>
<script>
function calcInvoice() {
  const sub = parseFloat(document.getElementById('subtotal').value);
  const tax = parseFloat(document.getElementById('taxRate').value) / 100;
  const ship = parseFloat(document.getElementById('shipping').value);
  const taxAmount = sub * tax;
  const total = sub + taxAmount + ship;
  document.getElementById('output').innerHTML = `Tax Amount: $${taxAmount.toFixed(2)}<br><strong>Total Invoice Amount: $${total.toFixed(2)}</strong>`;
}
</script>
</body>
</html>
