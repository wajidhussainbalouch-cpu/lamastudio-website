<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Metrics & LTV:CAC Hub — LamaStudio Business</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 600px; margin: 2rem auto; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .form-group input { width: 100%; padding: 0.75rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .calc-btn { background: var(--category-color); color: #fff; width: 100%; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 1rem; }
  .result-box { margin-top: 1.5rem; padding: 1.25rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; text-align: center; color: var(--category-color); }
</style>
</head>
<body style="--category-color: var(--c-business);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>SaaS Metrics</small></span></a></div></header>
<main style="padding: 2rem 1rem;">
  <div class="tool-box">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">SaaS Metrics &amp; LTV:CAC Hub</h1>
    <div class="form-group"><label>Customer Lifetime Value (LTV) ($)</label><input type="number" id="ltv" value="1200"></div>
    <div class="form-group"><label>Customer Acquisition Cost (CAC) ($)</label><input type="number" id="cac" value="300"></div>
    <button class="calc-btn" onclick="calcSaaS()">Calculate LTV:CAC Ratio</button>
    <div class="result-box" id="output">Result will appear here...</div>
  </div>
</main>
<script>
function calcSaaS() {
  const ltv = parseFloat(document.getElementById('ltv').value);
  const cac = parseFloat(document.getElementById('cac').value);
  if(cac <= 0) { document.getElementById('output').innerText = "CAC must be greater than zero."; return; }
  const ratio = ltv / cac;
  document.getElementById('output').innerHTML = `<strong>LTV:CAC Ratio = ${ratio.toFixed(1)}:1</strong><br><span style="font-size:0.85rem; color:var(--text-muted);">${ratio >= 3 ? 'Healthy SaaS Performance (>3:1)' : 'Needs Optimization (<3:1)'}</span>`;
}
</script>
</body>
</html>
