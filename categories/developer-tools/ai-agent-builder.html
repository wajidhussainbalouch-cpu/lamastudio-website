<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Workflow Builder — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span>← Back to Developer Tools</span></a></div></header>
<main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
  <h2>🤖 AI Agent Workflow Builder</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Scaffold custom autonomous agent loops, prompt contexts, and tool-calling schemas instantly.</p>
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;">
    <label style="font-weight:600; display:block; margin-bottom:0.5rem;">Agent Prompt / Persona</label>
    <textarea id="agentPrompt" style="width:100%; height:120px; background:var(--background); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:0.75rem; font-family:inherit;" placeholder="You are a senior code reviewer..."></textarea>
    <button onclick="generateAgent()" class="portal-btn" style="margin-top:1rem; cursor:pointer; border:none;">Generate Agent Schema</button>
    <pre id="agentOutput" style="background:var(--background); padding:1rem; border-radius:8px; margin-top:1rem; border:1px solid var(--border); overflow-x:auto; font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--category-color);"></pre>
  </div>
</main>
<script>
function generateAgent() {
  const p = document.getElementById('agentPrompt').value || 'Default Agent';
  const schema = {
    version: "1.0",
    role: p,
    temperature: 0.2,
    tools: ["web_search", "code_interpreter", "file_reader"],
    loop: "react_cot"
  };
  document.getElementById('agentOutput').textContent = JSON.stringify(schema, null, 2);
}
</script>
</body>
</html>
