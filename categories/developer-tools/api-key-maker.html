<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure API Key Maker — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span>← Back to Developer Tools</span></a></div></header>
<main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
  <h2>🔑 Secure API Key Maker</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Generate high-entropy bearer secrets, salted tokens, and environment strings.</p>
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;">
    <button onclick="generateKey()" class="portal-btn" style="cursor:pointer; border:none;">Generate API Key</button>
    <div id="keyValue" style="background:var(--background); padding:1rem; border-radius:8px; margin-top:1rem; border:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:0.9rem; color:var(--category-color); word-break:break-all;">Click button above</div>
  </div>
</main>
<script>
function generateKey() {
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  const hex = Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
  document.getElementById('keyValue').textContent = `lama_live_${hex}`;
}
</script>
</body>
</html>
