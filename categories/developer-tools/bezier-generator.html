<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Cubic-Bezier Visualizer — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span>← Back to Developer Tools</span></a></div></header>
<main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
  <h2>📈 CSS Cubic-Bezier Animation Visualizer</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Test custom transition easing values live for layout motion design.</p>
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;">
    <div style="margin-bottom: 1.5rem; display:flex; gap:1rem; align-items:center;">
      <input type="text" id="curveInput" value="cubic-bezier(0.4, 0, 0.2, 1)" style="flex:1; padding:0.75rem; background:var(--background); color:var(--text); border:1px solid var(--border); border-radius:8px; font-family:'JetBrains Mono',monospace;">
      <button onclick="triggerAnim()" class="portal-btn" style="cursor:pointer; border:none; padding:0.75rem 1.5rem; border-radius:8px; font-weight:600;">Replay Animation</button>
    </div>
    <div style="background:var(--background); height:80px; border-radius:8px; border:1px solid var(--border); position:relative; overflow:hidden; display:flex; align-items:center; padding: 0 10px;">
      <div id="animBox" style="width:40px; height:40px; background:var(--category-color); border-radius:6px; position:relative; left:0; transition: left 1s ease;"></div>
    </div>
  </div>
</main>
<script>
let toggled = false;
function triggerAnim() {
  const box = document.getElementById('animBox');
  const curve = document.getElementById('curveInput').value.trim();
  box.style.transition = `left 1s ${curve}`;
  toggled = !toggled;
  box.style.left = toggled ? 'calc(100% - 50px)' : '0px';
}
</script>
</body>
</html>
