<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.env Secret Sanitizer — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span>← Back to Developer Tools</span></a></div></header>
<main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
  <h2>🔒 Environment Variable Sanitizer</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Safely scrub connection strings and production keys from `.env` dumps before sharing.</p>
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;">
    <textarea id="envInput" style="width:100%; height:110px; background:var(--background); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:0.75rem; margin-bottom:1rem; font-family:'JetBrains Mono',monospace;">DATABASE_URL=postgres://admin:SuperSecretPassword99@localhost:5432/prod
STRIPE_SECRET_KEY=sk_live_51NzYq90918273645
PORT=3000</textarea>
    <button onclick="sanitizeEnv()" class="portal-btn" style="cursor:pointer; border:none; padding:0.75rem 1.5rem; border-radius:8px; font-weight:600;">Sanitize Environment File</button>
    <pre id="envOutput" style="background:var(--background); padding:1rem; border-radius:8px; margin-top:1rem; border:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--category-color);"></pre>
  </div>
</main>
<script>
function sanitizeEnv() {
  const raw = document.getElementById('envInput').value;
  // Regex matches assignments containing high-entropy or password text and replaces values
  const sanitized = raw.split('\n').map(line => {
    if (!line.includes('=') || line.trim().startsWith('#')) return line;
    const parts = line.split('=');
    const key = parts[0];
    if (key.includes('PORT') || key.includes('NODE_ENV') || key.includes('HOST')) {
      return line; // keep non-secret items intact
    }
    return `${key}=REDACTED_SECURE_VAL`;
  }).join('\n');
  
  document.getElementById('envOutput').textContent = sanitized;
}
sanitizeEnv();
</script>
</body>
</html>
