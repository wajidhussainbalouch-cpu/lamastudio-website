  .hero-news-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 2rem;
    align-items: stretch;
    margin-bottom: 2.5rem;
  }
  @media(max-width: 1024px) {
    .hero-news-layout {
      grid-template-columns: 1fr;
    }
  }

  .side-news-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
    min-height: 280px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
  }
  .side-news-header {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 1rem;
    color: var(--category-color);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.6rem;
  }
  .vertical-ticker-wrapper {
    position: relative;
    height: 220px;
    overflow: hidden;
  }
  .vertical-ticker-track {
    position: absolute;
    width: 100%;
    animation: scrollVertical 15s linear infinite;
  }
  .vertical-ticker-track:hover {
    animation-play-state: paused;
  }
  .ticker-item {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    margin-bottom: 0.6rem;
    font-size: 0.82rem;
    color: var(--text);
  }
  .ticker-item span {
    display: block;
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 0.2rem;
  }

  @keyframes scrollVertical {
    0% { transform: translateY(0%); }

  }
  .rates-ticker-track-wrapper {

  }

    background: var(--background);
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .rate-chip span { color: var(--category-color); font-weight: 700; }

  @keyframes scrollHorizontal {

  }
