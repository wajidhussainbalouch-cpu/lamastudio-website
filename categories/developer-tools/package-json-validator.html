<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Package.json Dependency Audit — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span>← Back to Developer Tools</span></a></div></header>
<main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
  <h2>📦 Package.json SemVer Range Audit</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Validate semantic version safety rules, wildcards, and caret/tilde constraints for npm.</p>
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;">
    <textarea id="pkgInput" style="width:100%; height:110px; background:var(--background); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:0.75rem; margin-bottom:1rem; font-family:'JetBrains Mono',monospace;">{
  "dependencies": {
    "express": "^4.18.2",
    "lodash": "4.17.21",
    "axios": "*"
  }
}</textarea>
    <button onclick="auditPkg()" class="portal-btn" style="cursor:pointer; border:none; padding:0.75rem 1.5rem; border-radius:8px; font-weight:600;">Audit Dependencies</button>
    <pre id="pkgOutput" style="background:var(--background); padding:1rem; border-radius:8px; margin-top:1rem; border:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--category-color);">Ready for dependency check...</pre>
  </div>
</main>
<script>
function auditPkg() {
  const raw = document.getElementById('pkgInput').value;
  const out = document.getElementById('pkgOutput');
  
  try {
    const json = JSON.parse(raw);
    const deps = json.dependencies || {};
    let logs = [];
    
    for (const [pkg, version] of Object.entries(deps)) {
      if (version.startsWith('^')) {
        logs.push(`✅ [${pkg}]: Caret range (${version}) allows safe minor/patch upgrades.`);
      } else if (version.startsWith('~')) {
        logs.push(`✅ [${pkg}]: Tilde range (${version}) locks minor version updates.`);
      } else if (version === '*') {
        logs.push(`⚠️ [${pkg}]: Wildcard range (*) is insecure; consider pinning to a stable semver release.`);
      } else {
        logs.push(`🔒 [${pkg}]: Pinned precisely to static version (${version}).`);
      }
    }
    
    out.style.color = 'var(--category-color)';
    out.textContent = logs.join('\n');
  } catch(e) {
    out.style.color = '#ef4444';
    out.textContent = `Invalid JSON format: ${e.message}`;
  }
}
</script>
</body>
</html>
