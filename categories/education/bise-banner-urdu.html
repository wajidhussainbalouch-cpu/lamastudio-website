<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<title>BISE DG Khan 9th Class Result 2026 Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    background: #0b1120;
    font-family: 'Noto Nastaliq Urdu', serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Golden/Yellow Frame Border */
  .banner-frame {
    width: 1120px;
    height: 550px;
    border: 3px solid #eab308;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    box-shadow: inset 0 0 30px rgba(234, 179, 8, 0.1);
  }

  /* Top Badge */
  .top-badge {
    background: #1e293b;
    border: 1px solid #eab308;
    color: #eab308;
    padding: 10px 30px;
    border-radius: 8px;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 25px;
  }

  /* Main Title */
  h1 {
    font-size: 60px;
    margin: 0 0 15px 0;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: -1px;
  }

  /* Subtitle description */
  p {
    font-size: 24px;
    color: #cbd5e1;
    margin: 0 0 30px 0;
  }

  /* Date & Time Badge */
  .date-badge {
    background: #eab308;
    color: #0f172a;
    padding: 10px 30px;
    border-radius: 8px;
    font-size: 22px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    direction: ltr;
    display: inline-block;
  }
</style>
</head>
<body>

  <div class="banner-frame">
    <div class="top-badge">بورڈ آف انٹرمیڈیٹ اینڈ سیکنڈری ایجوکیشن ڈیرہ غازی خان</div>

    <h1>نویں جماعت سالانہ نتیجہ 2026</h1>

    <p>اپنا رول نمبر درج کریں اور آن لائن نتیجہ باآسانی معلوم کریں</p>

    <div class="date-badge">02/09/2026 — 10:00 AM</div>
  </div>

</body>
</html>
