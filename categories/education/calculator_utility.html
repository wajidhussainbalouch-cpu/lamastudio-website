<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA & Percentage Calculator — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
.util-container { max-width: 900px; margin: 30px auto; padding: 0 1rem; }
.tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
.tool-header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
.tool-header h1 { font-size: 1.8rem; color: var(--text); margin: 0 0 8px 0; }
.tool-header p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

.calc-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
.tab-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.tab-btn.active { background: var(--category-color); color: #fff; border-color: var(--category-color); }

.calc-section { display: none; }
.calc-section.active { display: block; }

.input-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; margin-bottom: 12px; align-items: center; }
@media(max-width: 650px) { .input-row { grid-template-columns: 1fr; } }

input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-family: inherit; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
input:focus, select:focus { outline: none; border-color: var(--category-color); }

.btn { background: var(--category-color); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.btn:hover { opacity: 0.9; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

.result-box { background: rgba(23, 78, 166, 0.08); border: 1px solid var(--category-color); border-radius: 12px; padding: 20px; text-align: center; margin-top: 25px; }
.result-box h3 { font-size: 2rem; color: var(--category-color); margin: 0 0 5px 0; font-family: 'JetBrains Mono', monospace; }
.result-box p { color: var(--text-muted); margin: 0; font-size: 0.9rem; }
</style>
</head>
<body style="--category-color: var(--c-education);">

<header class="site-header">
  <div class="util-row" style="width: 100%; display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: 0 auto; padding: 0 1rem;">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Education Hub</small></span></a>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>
  <div class="category-strip">
    <div class="category-track" role="tablist">
      <a href="index.html" class="cat-pill active" style="--pc:var(--c-education)"><span class="dot"></span>← Back to Education Hub</a>
    </div>
  </div>
</header>

<main class="util-container">
  <div class="tool-card">
    <div class="tool-header">
      <h1>GPA & Percentage Calculator</h1>
      <p>Calculate your semester Grade Point Average (GPA) or convert absolute marks into exact percentage metrics instantly.</p>
    </div>

    <div class="calc-tabs">
      <button class="tab-btn active" onclick="switchTab('gpa', event)">Semester GPA</button>
      <button class="tab-btn" onclick="switchTab('percentage', event)">Marks to Percentage</button>
    </div>

    <!-- GPA TAB -->
    <div id="gpaTab" class="calc-section active">
      <div id="courseRows">
        <div class="input-row">
          <input type="text" placeholder="Course Name (e.g., Physics)" class="course-name">
          <select class="course-grade">
            <option value="4.0">A (4.0)</option>
            <option value="3.7">A- (3.7)</option>
            <option value="3.3">B+ (3.3)</option>
            <option value="3.0" selected>B (3.0)</option>
            <option value="2.7">B- (2.7)</option>
            <option value="2.3">C+ (2.3)</option>
            <option value="2.0">C (2.0)</option>
            <option value="1.0">D (1.0)</option>
            <option value="0.0">F (0.0)</option>
          </select>
          <input type="number" placeholder="Credits" class="course-credits" value="3" min="1" max="6">
          <button class="btn btn-danger" onclick="removeRow(this)">✕</button>
        </div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn btn-outline" onclick="addCourseRow()">+ Add Another Course</button>
        <button class="btn" onclick="calculateGPA()">Calculate GPA</button>
      </div>
      <div class="result-box" id="gpaResultBox" style="display:none;">
        <h3 id="gpaOutput">0.00</h3>
        <p>Calculated Semester Grade Point Average (GPA)</p>
      </div>
    </div>

    <!-- PERCENTAGE TAB -->
    <div id="percentageTab" class="calc-section">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
        <div>
          <label style="display:block; font-size:0.85rem; margin-bottom:6px; color:var(--text-muted);">Obtained Marks / Score</label>
          <input type="number" id="obtainedMarks" placeholder="e.g., 850">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; margin-bottom:6px; color:var(--text-muted);">Total Marks</label>
          <input type="number" id="totalMarks" placeholder="e.g., 1100">
        </div>
      </div>
      <button class="btn" onclick="calculatePercentage()">Compute Percentage</button>
      <div class="result-box" id="percentageResultBox" style="display:none;">
        <h3 id="percentageOutput">0%</h3>
        <p>Overall Academic Percentage Evaluation</p>
      </div>
    </div>

  </div>
</main>

<script src="../../script.js"></script>
<script>
function switchTab(tabName, evt) {
  document.querySelectorAll('.calc-section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  if(tabName === 'gpa') {
    document.getElementById('gpaTab').classList.add('active');
  } else {
    document.getElementById('percentageTab').classList.add('active');
  }
  evt.currentTarget.classList.add('active');
}

function addCourseRow() {
  const container = document.getElementById('courseRows');
  const row = document.createElement('div');
  row.className = 'input-row';
  row.innerHTML = `
    <input type="text" placeholder="Course Name" class="course-name">
    <select class="course-grade">
      <option value="4.0">A (4.0)</option>
      <option value="3.7">A- (3.7)</option>
      <option value="3.3">B+ (3.3)</option>
      <option value="3.0" selected>B (3.0)</option>
      <option value="2.7">B- (2.7)</option>
      <option value="2.3">C+ (2.3)</option>
      <option value="2.0">C (2.0)</option>
      <option value="1.0">D (1.0)</option>
      <option value="0.0">F (0.0)</option>
    </select>
    <input type="number" placeholder="Credits" class="course-credits" value="3" min="1" max="6">
    <button class="btn btn-danger" onclick="removeRow(this)">✕</button>
  `;
  container.appendChild(row);
}

function removeRow(btn) {
  const rows = document.querySelectorAll('.input-row');
  if(rows.length > 1) {
    btn.closest('.input-row').remove();
  } else {
    alert("You need at least one course row.");
  }
}

function calculateGPA() {
  const grades = document.querySelectorAll('.course-grade');
  const credits = document.querySelectorAll('.course-credits');
  let totalPoints = 0;
  let totalCredits = 0;

  for(let i=0; i<grades.length; i++) {
    const gradeVal = parseFloat(grades[i].value);
    const creditVal = parseFloat(credits[i].value) || 0;
    totalPoints += gradeVal * creditVal;
    totalCredits += creditVal;
  }

  if(totalCredits === 0) {
    alert("Total credits cannot be zero.");
    return;
  }

  const gpa = (totalPoints / totalCredits).toFixed(2);
  document.getElementById('gpaOutput').innerText = gpa;
  document.getElementById('gpaResultBox').style.display = 'block';
}

function calculatePercentage() {
  const obtained = parseFloat(document.getElementById('obtainedMarks').value);
  const total = parseFloat(document.getElementById('totalMarks').value);

  if(isNaN(obtained) || isNaN(total) || total <= 0) {
    alert("Please enter valid numbers for obtained and total marks.");
    return;
  }

  const percentage = ((obtained / total) * 100).toFixed(2);
  document.getElementById('percentageOutput').innerText = percentage + '%';
  document.getElementById('percentageResultBox').style.display = 'block';
}
</script>
</body>
</html>
