<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Proficiency Test | LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
:root {
  --background: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-muted: #64748b;
  --category-color: #174ea6;
}
body { background-color: var(--background); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
.test-hub-container{max-width:800px;margin:30px auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 10px 25px rgba(0,0,0,.05)}
.sets-container{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.set-btn{padding:12px 24px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-weight:600;font-size:15px;cursor:pointer;transition:.2s}
.set-btn:hover,.set-btn.active{background:var(--category-color);color:#fff;border-color:var(--category-color);transform:translateY(-2px)}
.quiz-box{margin-top:20px;border-top:1px solid var(--border);padding-top:20px}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-weight:bold;color:var(--text-muted)}
.timer{background:#ef4444;color:#fff;padding:6px 14px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:14px}
.question{font-size:20px;font-weight:700;line-height:1.4;margin:20px 0;color:var(--text)}
.option{display:block;width:100%;padding:16px;margin:12px 0;border:2px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);text-align:left;font-size:16px;cursor:pointer;transition:.2s}
.option:hover:not(:disabled){background:rgba(23,78,166,0.05);border-color:var(--category-color)}
.option.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#15803d!important;font-weight:bold}
.option.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#b91c1c!important;font-weight:bold}
.option:disabled{cursor:default}
#next-btn{display:none;margin:25px auto 0;padding:14px 28px;border:0;border-radius:10px;background:var(--category-color);color:white;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
#next-btn:hover{opacity:0.9}
.back-hub-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;margin-bottom:15px;font-weight:600;transition:.2s}
.back-hub-btn:hover{background:var(--border)}
</style>
</head>
<body>

<header class="site-header" style="background:var(--surface); border-bottom:1px solid var(--border);">
  <div class="util-row" style="max-width:1000px; margin:0 auto; padding:15px 20px; display:flex; justify-content:space-between; align-items:center;">
    <a href="index.html" class="brand" style="text-decoration:none; display:flex; align-items:center; gap:10px; font-weight:700; color:var(--text);">
      <span class="brand-mark" style="background: var(--category-color); color:#fff; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:8px;">L</span>
      <span>LamaStudio <small style="color:var(--text-muted); font-weight:normal;">Education</small></span>
    </a>
  </div>
</header>

<main style="padding:20px;">
  <section style="max-width:800px; margin:20px auto 0;">
    <span style="color: var(--category-color); font-weight:700; text-transform:uppercase; font-size:12px; letter-spacing:1px;">English Hub</span>
    <h1 style="color: var(--text); margin:5px 0 10px 0; font-size:28px;">English Proficiency Test Sets</h1>
    <p style="color: var(--text-muted); font-size:15px; margin:0;">Select a test set below to practice grammar, vocabulary, and sentence structures with timed evaluations.</p>
  </section>

  <section>
    <div class="test-hub-container">
      
      <div id="set-select-view">
        <a href="index.html" class="back-hub-btn" style="display:inline-block; text-decoration:none;">← Back to Subjects</a>
        <h2 style="color:var(--text); margin-top:15px;">Select Test Set</h2>
        <div class="sets-container" id="englishSetsContainer"></div>
      </div>

      <div id="quiz-interface" style="display:none;">
        <button class="back-hub-btn" onclick="backToSets()">← Back to Sets</button>
        <div class="quiz-header">
          <span id="quiz-progress-text">Question 1 of 20</span>
          <div class="timer" id="timerDisplay">⏱ 05:00</div>
        </div>
        <div class="quiz-box">
          <div class="question" id="quizQuestionText">Loading question...</div>
          <div id="quizOptionsContainer"></div>
          <div id="quizFeedback" style="margin-top:15px; font-weight:bold; text-align:center;"></div>
          <button id="next-btn" onclick="nextQuestion()">Next Question →</button>
        </div>
      </div>

      <div id="quiz-result-view" style="display:none; text-align:center; padding:30px 20px;">
        <h2 style="color:var(--text); font-size:26px;">🎉 Test Completed!</h2>
        <p style="font-size:36px; font-weight:bold; color:var(--category-color); margin:10px 0;" id="finalScoreDisplay">0 / 20</p>
        <p style="font-size:18px; color:var(--text-muted);" id="finalPercentageDisplay">0% Accuracy</p>
        <p style="font-size:18px; margin:20px 0; font-weight:600;" id="finalPerformanceMessage"></p>
        <button class="set-btn" style="background:var(--category-color); color:#fff; margin:15px auto;" onclick="backToSets()">Choose Another Set</button>
      </div>

    </div>
  </section>
</main>

<script>
const englishSets = {
  "Set 1 (Core Grammar & Vocabulary)": [
    { q: "She _____ to school every day.", a: ["go","goes","going","gone"], c: 1 },
    { q: "I _____ this book twice.", a: ["read","have read","am reading","had read"], c: 1 },
    { q: "If I _____ enough money, I would buy a new laptop.", a: ["have","had","will have","having"], c: 1 },
    { q: "They _____ dinner when I arrived.", a: ["have","had","were having","are having"], c: 2 },
    { q: "He has lived in Lahore _____ 2019.", a: ["for","since","from","during"], c: 1 },
    { q: "Neither Ali nor his friends _____ coming today.", a: ["is","was","are","has"], c: 2 },
    { q: "This is the _____ movie I have ever watched.", a: ["better","best","good","well"], c: 1 },
    { q: "You _____ smoke in this building.", a: ["mustn't","don't have","wouldn't","couldn't"], c: 0 },
    { q: "The letter _____ yesterday.", a: ["sends","sent","was sent","has sent"], c: 2 },
    { q: "I am interested _____ learning English.", a: ["on","at","in","for"], c: 2 },
    { q: "The word 'rapid' means:", a: ["slow","quick","weak","difficult"], c: 1 },
    { q: "Someone who is 'generous' is:", a: ["willing to give","always angry","very lazy","afraid of people"], c: 0 },
    { q: "The opposite of 'ancient' is:", a: ["old","historic","modern","traditional"], c: 2 },
    { q: "If something is 'essential,' it is:", a: ["unnecessary","expensive","very important","unusual"], c: 2 },
    { q: "Choose the correct expression:", a: ["make a decision","do a decision","take a decisioning","create decision"], c: 0 },
    { q: "'I ran out of money' means:", a: ["I found some money","I lost my wallet","I had no money left","I borrowed money"], c: 2 },
    { q: "Choose the correct sentence:", a: ["She don't like tea.","She doesn't likes tea.","She doesn't like tea.","She not like tea."], c: 2 },
    { q: "Choose the correct sentence:", a: ["I have seen him yesterday.","I saw him yesterday.","I had see him yesterday.","I see him yesterday."], c: 1 },
    { q: "By the time we arrived, the train _____.", a: ["leaves","has left","had left","was leave"], c: 2 },
    { q: "If she had studied harder, she _____ the examination.", a: ["will pass","would pass","would have passed","passed"], c: 2 }
  ],
  "Set 2 (Advanced Structure & Expressions)": [
    { q: "Hardly had I arrived at the station _____ the train departed.", a: ["than", "when", "then", "before"], c: 1 },
    { q: "Choose the correct passive voice: 'They are building a new bridge.'", a: ["A new bridge is built.", "A new bridge is being built.", "A new bridge has been built.", "A new bridge was being built."], c: 1 },
    { q: "Unless you work hard, you _____ pass the exam.", a: ["will", "will not", "would", "would not"], c: 1 },
    { q: "The synonym of 'Benevolent' is:", a: ["Cruel", "Kind", "Hostile", "Selfish"], c: 1 },
    { q: "Identify the correct spelling:", a: ["Accomodation", "Accommodation", "Acommodation", "Acomodation"], c: 1 },
    { q: "He spoke as if he _____ everything.", a: ["know", "knew", "known", "had known"], c: 1 },
    { q: "The antonym of 'Transparent' is:", a: ["Clear", "Opaque", "Bright", "Translucent"], c: 1 },
    { q: "Bread and butter _____ my favorite breakfast.", a: ["is", "are", "were", "have been"], c: 0 },
    { q: "Choose the correct indirect speech: He said, 'I am writing a letter.'", a: ["He said that he is writing a letter.", "He said that he was writing a letter.", "He said he has been writing a letter.", "He told that he was writing."], c: 1 },
    { q: "Which word is a preposition in 'She sat under the tree'?", a: ["She", "sat", "under", "tree"], c: 2 }
  ],
  "Set 3 (Comprehensive Practice)": [
    { q: "Choose the correct plural form of 'Child':", a: ["Childs", "Children", "Childes", "Childrens"], c: 1 },
    { q: "The Sun _____ in the east.", a: ["rise", "rises", "rose", "rising"], c: 1 },
    { q: "He is senior _____ me in service.", a: ["to", "than", "from", "with"], c: 0 },
    { q: "Choose the correct article: He wants to become _____ engineer.", a: ["a", "an", "the", "no article"], c: 1 },
    { q: "The idiom 'A piece of cake' means:", a: ["Something very sweet", "Something very easy", "A birthday gift", "A difficult task"], c: 1 }
  ]
};

let activeQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let answered = false;
let timerInterval = null;
let timeLeft = 300;

function initSets() {
  const container = document.getElementById('englishSetsContainer');
  container.innerHTML = '';
  Object.keys(englishSets).forEach(setKey => {
    const btn = document.createElement('button');
    btn.className = 'set-btn';
    btn.textContent = setKey;
    btn.onclick = () => startTest(setKey);
    container.appendChild(btn);
  });
}

function startTest(setKey) {
  activeQuestions = englishSets[setKey];
  currentQuestionIndex = 0;
  score = 0;
  timeLeft = 300;

  document.getElementById('set-select-view').style.display = 'none';
  document.getElementById('quiz-interface').style.display = 'block';
  document.getElementById('quiz-result-view').style.display = 'none';

  startTimer();
  showQuestion();
}

function startTimer() {
  clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0) {
      clearInterval(timerInterval);
      showResult();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const secs = (timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `⏱ ${mins}:${secs}`;
}

function showQuestion() {
  answered = false;
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('quizFeedback').textContent = '';

  const item = activeQuestions[currentQuestionIndex];
  document.getElementById('quiz-progress-text').textContent = `Question ${currentQuestionIndex + 1} of ${activeQuestions.length} | Score: ${score}`;
  document.getElementById('quizQuestionText').textContent = item.q;

  const optionsContainer = document.getElementById('quizOptionsContainer');
  optionsContainer.innerHTML = '';

  item.a.forEach((ans, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<b>${String.fromCharCode(65 + idx)})</b> ${ans}`;
    btn.onclick = () => checkAnswer(idx);
    optionsContainer.appendChild(btn);
  });
}

function checkAnswer(selectedIdx) {
  if(answered) return;
  answered = true;

  const correctIdx = activeQuestions[currentQuestionIndex].c;
  const buttons = document.querySelectorAll('.option');

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if(idx === correctIdx) {
      btn.classList.add('correct');
      btn.innerHTML += "  🟢 CORRECT";
    }
  });

  if(selectedIdx === correctIdx) {
    score++;
    document.getElementById('quizFeedback').innerHTML = "<span style='color:#15803d;'>🟢 Correct!</span>";
  } else {
    buttons[selectedIdx].classList.add('wrong');
    buttons[selectedIdx].innerHTML += "  🔴 WRONG";
    document.getElementById('quizFeedback').innerHTML = "<span style='color:#b91c1c;'>🔴 Incorrect.</span>";
  }

  document.getElementById('quiz-progress-text').textContent = `Question ${currentQuestionIndex + 1} of ${activeQuestions.length} | Score: ${score}`;
  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('next-btn').textContent = (currentQuestionIndex === activeQuestions.length - 1) ? "🏆 View Results" : "Next Question →";
}

function nextQuestion() {
  if(currentQuestionIndex < activeQuestions.length - 1) {
    currentQuestionIndex++;
    showQuestion();
  } else {
    clearInterval(timerInterval);
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-interface').style.display = 'none';
  document.getElementById('quiz-result-view').style.display = 'block';

  const percentage = Math.round((score / activeQuestions.length) * 100);
  document.getElementById('finalScoreDisplay').textContent = `${score} / ${activeQuestions.length}`;
  document.getElementById('finalPercentageDisplay').textContent = `${percentage}% Accuracy`;

  let msg = "Keep practicing!";
  if(percentage >= 80) msg = "🌟 Outstanding performance!";
  else if(percentage >= 50) msg = "👍 Good job!";
  document.getElementById('finalPerformanceMessage').textContent = msg;
}

function backToSets() {
  clearInterval(timerInterval);
  document.getElementById('quiz-interface').style.display = 'none';
  document.getElementById('quiz-result-view').style.display = 'none';
  document.getElementById('set-select-view').style.display = 'block';
}

window.onload = initSets;
</script>

</body>
  </html>
