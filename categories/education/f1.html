<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berlitz English - Form 1</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdde1;
            --correct-color: #2ecc71;
            --incorrect-color: #e74c3c;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .back-btn { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; }
        .stats-bar { display: flex; justify-content: space-between; background: #f1f2f6; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        h1, h2, h3 { color: var(--primary-color); }
        .question-card { background: #fff; border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .question-title { font-weight: 600; margin-bottom: 12px; }
        .options label { display: block; margin-bottom: 8px; cursor: pointer; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        .options input { margin-right: 10px; }
        label.correct { background-color: rgba(46, 204, 113, 0.2) !important; border-color: var(--correct-color) !important; color: #155724; font-weight: bold; }
        label.incorrect { background-color: rgba(231, 76, 60, 0.2) !important; border-color: var(--incorrect-color) !important; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="back-btn">🏠 English Menu</a>
        <h2>Berlitz English - Form 1</h2>
    </div>

    <div class="stats-bar">
        <div>Score: <span id="score">0</span> / <span id="total-questions">2</span></div>
        <div>Time: <span id="timer">00:00</span></div>
    </div>

    <h2>Level Test 3 — Test Form 1</h2>
    
    <h3>Section 1: Listening Comprehension</h3>
    <div class="question-card" data-correct="c">
        <div class="question-title">1. Listen to the speaker, then choose the best response.</div>
        <div class="options">
            <label><input type="radio" name="f1_q1" value="a"> a) We like it very much.</label>
            <label><input type="radio" name="f1_q1" value="b"> b) We haven't moved yet.</label>
            <label><input type="radio" name="f1_q1" value="c"> c) No, we're still looking.</label>
        </div>
    </div>

    <div class="question-card" data-correct="c">
        <div class="question-title">2. Listen to the speaker, then choose the best response.</div>
        <div class="options">
            <label><input type="radio" name="f1_q2" value="a"> a) I had the pasta primavera.</label>
            <label><input type="radio" name="f1_q2" value="b"> b) I had some vegetables with the salmon.</label>
            <label><input type="radio" name="f1_q2" value="c"> c) The salmon was overcooked and the meal was overpriced.</label>
        </div>
    </div>
</div>

<script>
    let seconds = 0;
    const timerInterval = setInterval(() => {
        seconds++;
        let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        let secs = (seconds % 60).toString().padStart(2, '0');
        document.getElementById('timer').textContent = `${mins}:${secs}`;
    }, 1000);

    const answeredQuestions = new Set();
    let currentScore = 0;

    document.addEventListener('change', function(event) {
        if (event.target.matches('input[type="radio"]')) {
            const inputElement = event.target;
            const card = inputElement.closest('.question-card');
            const correctAnswer = card.getAttribute('data-correct');
            const questionName = inputElement.name;
            const labels = card.querySelectorAll('label');
            const alreadyAnswered = answeredQuestions.has(questionName);

            labels.forEach(label => {
                const radio = label.querySelector('input');
                label.classList.remove('correct', 'incorrect');
                if (radio.value === correctAnswer) {
                    label.classList.add('correct');
                } else if (radio.checked) {
                    label.classList.add('incorrect');
                }
            });

            if (!alreadyAnswered) {
                answeredQuestions.add(questionName);
                if (inputElement.value === correctAnswer) {
                    currentScore++;
                    document.getElementById('score').textContent = currentScore;
                }
            }
        }
    });
</script>

</body>
  </html>
