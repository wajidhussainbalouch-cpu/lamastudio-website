<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addition Tug of War — Learn With Fun — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --blue: #168be5;
    --red: #d9235b;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  h1 { margin-bottom: 5px; font-size: 2rem; text-align: center; }
  .game-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-top: 20px;
  }
  .screen { display: none; }
  .screen.active { display: block; }
  
  .team-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .team-card {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    text-align: center;
  }
  .team-blue { border-color: var(--blue); }
  .team-red { border-color: var(--red); }

  input, select {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    box-sizing: border-box;
    margin-top: 0.5rem;
  }
  input:focus, select:focus { outline: none; border-color: var(--text); }

  .btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 1rem 2rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }

  .hud {
    display: flex;
    justify-content: space-between;
    background: var(--bg);
    padding: 1rem 1.5rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 1.5rem;
    font-size: 1.1rem;
  }

  .tug-arena {
    background: linear-gradient(180deg, #090d16 0%, #1e293b 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    margin-bottom: 1.5rem;
    position: relative;
    overflow: hidden;
  }
  
  .question-box {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 2rem;
    text-align: center;
  }
  .math-problem {
    font-size: 3rem;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    margin: 1rem 0;
  }
  .answer-input {
    font-size: 2rem;
    width: 220px;
    text-align: center;
  }
  
  .moving-element {
    transition: transform 0.4s ease-out;
  }
</style>
</head>
<body>

<h1>⚔️ Addition Tug of War</h1>

<div class="game-container">
  
  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="screen active">
    <h3>Setup Competition</h3>
    <div class="team-grid">
      <div class="team-card team-blue">
        <h4 style="color: var(--blue); margin-top:0;" id="blueTitle">Team Blue</h4>
        <input type="text" id="nameBlue" value="Team Blue">
      </div>
      <div class="team-card team-red">
        <h4 style="color: var(--red); margin-top:0;" id="redTitle">Team Red</h4>
        <input type="text" id="nameRed" value="Team Red">
      </div>
    </div>
    
    <label style="font-weight: 600;">Difficulty:</label>
    <select id="difficulty" style="margin-bottom: 1.5rem;">
      <option value="easy">Easy (Numbers 1 - 20)</option>
      <option value="medium" selected>Medium (Numbers 10 - 100)</option>
      <option value="hard">Hard (Numbers 50 - 500)</option>
    </select>

    <button class="btn" onclick="startGame()">Start Battle 🚀</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div class="hud">
      <div>Turn: <span id="turnIndicator" style="font-weight: 700;">Team Blue</span></div>
      <div>Score: <span style="color:var(--blue);" id="scoreBlueText">0</span> &nbsp;-&nbsp; <span style="color:var(--red);" id="scoreRedText">0</span></div>
    </div>

    <div class="tug-arena">
      <svg viewBox="0 0 1000 160" width="100%" xmlns="http://www.w3.org/2000/svg">
        <!-- Background Rope Line -->
        <line x1="120" y1="80" x2="880" y2="80" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
        
        <!-- Center Flag / Marker -->
        <g id="centerFlag" transform="translate(500, 80)" class="moving-element">
          <line x1="0" y1="-50" x2="0" y2="50" stroke="#fbbf24" stroke-width="4" stroke-dasharray="4"/>
          <circle cx="0" cy="0" r="12" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
        </g>

        <!-- Blue Team Avatar (Now slides with the tug action) -->
        <g id="blueAvatar" transform="translate(100, 30)" class="moving-element">
          <rect x="0" y="0" width="50" height="80" rx="8" fill="var(--blue)"/>
          <circle cx="25" cy="-12" r="18" fill="#e2a37e"/>
        </g>

        <!-- Red Team Avatar (Now slides with the tug action) -->
        <g id="redAvatar" transform="translate(850, 30)" class="moving-element">
          <rect x="0" y="0" width="50" height="80" rx="8" fill="var(--red)"/>
          <circle cx="25" cy="-12" r="18" fill="#e2a37e"/>
        </g>
      </svg>
    </div>

    <div class="question-box">
      <div class="math-problem" id="mathProblem">5 + 3 = ?</div>
      <form id="answerForm" onsubmit="submitAnswer(event)">
        <input type="number" id="userAnswer" class="answer-input" placeholder="?" autofocus autocomplete="off" required>
        <button type="submit" style="display:none;"></button>
      </form>
    </div>
  </div>

  <!-- WIN SCREEN -->
  <div id="winScreen" class="screen" style="text-align: center;">
    <h2 id="winnerText" style="font-size: 2.5rem; margin-bottom: 1rem;">🎉 Team Wins! 🎉</h2>
    <button class="btn" onclick="location.reload()">Play Again</button>
  </div>

</div>

<script>
  let gameState = {
    teamBlueName: 'Team Blue',
    teamRedName: 'Team Red',
    currentTurn: 1, // 1 for Blue, 2 for Red
    scoreBlue: 0,
    scoreRed: 0,
    tugOffset: 0,   // 0 is dead center. Negative moves left, Positive moves right.
    difficulty: 'medium',
    currentAnswer: 0,
    usedQuestions: new Set()
  };

  function startGame() {
    gameState.teamBlueName = document.getElementById('nameBlue').value || 'Team Blue';
    gameState.teamRedName = document.getElementById('nameRed').value || 'Team Red';
    gameState.difficulty = document.getElementById('difficulty').value;
    
    document.getElementById('blueTitle').innerText = gameState.teamBlueName;
    document.getElementById('redTitle').innerText = gameState.teamRedName;

    document.getElementById('setupScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    nextQuestion();
  }

  function nextQuestion() {
    let num1, num2, ans, qKey;
    
    do {
      if (gameState.difficulty === 'easy') {
        num1 = Math.floor(Math.random() * 20) + 1;
        num2 = Math.floor(Math.random() * 20) + 1;
      } else if (gameState.difficulty === 'medium') {
        num1 = Math.floor(Math.random() * 90) + 10;
        num2 = Math.floor(Math.random() * 90) + 10;
      } else {
        num1 = Math.floor(Math.random() * 450) + 50;
        num2 = Math.floor(Math.random() * 450) + 50;
      }
      ans = num1 + num2;
      qKey = `${num1}+${num2}`;
    } while (gameState.usedQuestions.has(qKey));

    gameState.usedQuestions.add(qKey);
    gameState.currentAnswer = ans;

    document.getElementById('mathProblem').innerText = `${num1} + ${num2} = ?`;
    let turnName = gameState.currentTurn === 1 ? gameState.teamBlueName : gameState.teamRedName;
    document.getElementById('turnIndicator').innerText = turnName;
    document.getElementById('turnIndicator').style.color = gameState.currentTurn === 1 ? 'var(--blue)' : 'var(--red)';
    document.getElementById('userAnswer').value = '';
    document.getElementById('userAnswer').focus();
  }

  function submitAnswer(e) {
    e.preventDefault();
    let userVal = parseInt(document.getElementById('userAnswer').value);

    if (userVal === gameState.currentAnswer) {
      if (gameState.currentTurn === 1) {
        gameState.scoreBlue++;
        gameState.tugOffset -= 40; // Blue pulls left
      } else {
        gameState.scoreRed++;
        gameState.tugOffset += 40; // Red pulls right
      }
      updateVisuals();
      if (checkWin()) return;
    }

    // Switch turn
    gameState.currentTurn = gameState.currentTurn === 1 ? 2 : 1;
    nextQuestion();
  }

  function updateVisuals() {
    document.getElementById('scoreBlueText').innerText = gameState.scoreBlue;
    document.getElementById('scoreRedText').innerText = gameState.scoreRed;
    
    // Animate flag and both characters smoothly with the tug offset
    let flagX = 500 + gameState.tugOffset;
    let blueX = 100 + (gameState.tugOffset * 0.4); // Blue avatar follows slightly
    let redX = 850 + (gameState.tugOffset * 0.4);   // Red avatar follows slightly

    document.getElementById('centerFlag').style.transform = `translate(${flagX}px, 80px)`;
    document.getElementById('blueAvatar').style.transform = `translate(${blueX}px, 30px)`;
    document.getElementById('redAvatar').style.transform = `translate(${redX}px, 30px)`;
  }

  function checkWin() {
    let flagX = 500 + gameState.tugOffset;
    if (flagX <= 250 || flagX >= 750) {
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('winScreen').classList.add('active');
      let winner = flagX <= 250 ? gameState.teamBlueName : gameState.teamRedName;
      document.getElementById('winnerText').innerText = `🎉 ${winner} Wins the Competition! 🎉`;
      return true;
    }
    return false;
  }
</script>
</body>
</html>
