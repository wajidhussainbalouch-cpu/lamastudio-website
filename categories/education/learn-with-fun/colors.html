<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colors Practice — Learn With Fun — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #f0f4f8;
    --card-bg: #ffffff;
    --border-color: #cbd5e1;
    --text-main: #1e293b;
    --accent-blue: #3b82f6;
  }
  
  body {
    background: var(--bg-primary);
    color: var(--text-main);
    font-family: 'Space Grotesk', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    min-height: 100vh;
    box-sizing: border-box;
  }

  header {
    width: 100%;
    max-width: 950px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .logo {
    font-weight: 800;
    font-size: 1.25rem;
    color: #2563eb;
    background: #e0f2fe;
    padding: 6px 14px;
    border-radius: 20px;
    border: 2px solid #bae6fd;
  }

  .game-container {
    background: var(--card-bg);
    border: 4px solid #e2e8f0;
    border-radius: 24px;
    padding: 2rem;
    width: 100%;
    max-width: 950px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  /* Top Prompt Screen layout inspired by the reference screen */
  .screen-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #f1f5f9;
    padding-bottom: 1rem;
  }

  .prompt-title {
    font-size: 2.2rem;
    font-weight: 800;
    color: #0f172a;
    margin: 0;
  }

  .question-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    border: 3px solid #e2e8f0;
    border-radius: 20px;
    padding: 2rem;
    gap: 2rem;
  }

  .stage-preview {
    flex: 1;
    height: 220px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.06);
    border: 3px solid rgba(0,0,0,0.05);
    transition: background-color 0.4s ease;
  }

  .stage-content {
    text-align: center;
  }

  .color-name-display {
    font-size: 3rem;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    margin: 0;
  }

  .prompt-text {
    flex: 1;
    font-size: 2.2rem;
    font-weight: 700;
    color: #334155;
    line-height: 1.3;
  }

  /* Options Grid */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1.2rem;
  }

  .color-btn {
    background: #ffffff;
    border: 3px solid #cbd5e1;
    border-radius: 16px;
    padding: 1rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.02);
  }

  .color-btn:hover {
    transform: translateY(-4px);
    border-color: #3b82f6;
    box-shadow: 0 8px 15px rgba(59, 130, 246, 0.15);
  }

  .color-swatch {
    width: 100%;
    height: 90px;
    border-radius: 10px;
    border: 2px solid rgba(0,0,0,0.08);
  }

  .color-label {
    font-size: 1.2rem;
    font-weight: 700;
    color: #475569;
  }

  @media(max-width: 768px) {
    .question-box {
      flex-direction: column;
    }
    .prompt-text {
      font-size: 1.6rem;
      text-align: center;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🌟 LamaStudio Kids</div>
  <div style="font-weight: 700; color: #64748b;">Colors Practice Arena</div>
</header>

<div class="game-container">
  <div class="screen-header">
    <h2 class="prompt-title">🎨 Interactive Learning</h2>
    <div style="background: #e2e8f0; padding: 6px 12px; border-radius: 12px; font-weight: 700; font-size: 0.9rem;">Level 1</div>
  </div>

  <div class="question-box">
    <div class="stage-preview" id="stage">
      <div class="stage-content">
        <h1 class="color-name-display" id="colorTitle">Red</h1>
      </div>
    </div>
    <div class="prompt-text" id="colorDesc">
      Like strawberries and fire engines! Tap the matching card below.
    </div>
  </div>

  <div class="color-grid" id="colorGrid"></div>
</div>

<script>
  const colors = [
    {name: "Red", hex: "#ef4444", desc: "Like strawberries and fire engines!"},
    {name: "Blue", hex: "#3b82f6", desc: "Like the ocean and the clear sky!"},
    {name: "Green", hex: "#22c55e", desc: "Like grass, trees, and frogs!"},
    {name: "Yellow", hex: "#eab308", desc: "Like the warm sun and bananas!"},
    {name: "Orange", hex: "#f97316", desc: "Like juicy oranges and basketballs!"},
    {name: "Purple", hex: "#a855f7", desc: "Like grapes and eggplants!"},
    {name: "Pink", hex: "#ec4899", desc: "Like flamingos and cotton candy!"},
    {name: "Brown", hex: "#78350f", desc: "Like chocolate and friendly bears!"}
  ];

  function initColors() {
    let grid = document.getElementById('colorGrid');
    colors.forEach(c => {
      let btn = document.createElement('div');
      btn.className = 'color-btn';
      
      let swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.style.backgroundColor = c.hex;

      let label = document.createElement('span');
      label.className = 'color-label';
      label.innerText = c.name;

      btn.appendChild(swatch);
      btn.appendChild(label);
      
      btn.onclick = () => selectColor(c);
      grid.appendChild(btn);
    });
    selectColor(colors[0]);
  }

  function selectColor(c) {
    let stage = document.getElementById('stage');
    stage.style.backgroundColor = c.hex;
    document.getElementById('colorTitle').innerText = c.name;
    document.getElementById('colorDesc').innerText = `${c.desc}`;

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(`This is the color ${c.name}`);
      window.speechSynthesis.speak(utterance);
    }
  }

  initColors();
</script>
</body>
</html>
