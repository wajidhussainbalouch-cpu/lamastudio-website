<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colors Practice — Learn With Fun — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f8fafc;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  h1 { margin-bottom: 5px; font-size: 2rem; text-align: center; }
  .game-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-top: 20px;
    text-align: center;
  }
  .color-card-stage {
    height: 250px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 2rem;
    transition: background-color 0.4s ease;
    border: 2px solid var(--border);
  }
  .color-name {
    font-size: 3rem;
    font-weight: 800;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 0.5rem;
  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1rem;
  }
  .color-btn {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    transition: transform 0.2s;
  }
  .color-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>

<h1>🎨 Colors Practice Arena</h1>

<div class="game-container">
  <div class="color-card-stage" id="stage" style="background-color: #ef4444;">
    <div class="color-name" id="colorTitle">Red</div>
    <div style="font-size: 1.1rem; opacity: 0.9;" id="colorDesc">Like strawberries and fire engines!</div>
  </div>

  <div class="color-grid" id="colorGrid"></div>
</div>

<script>
  const colors = [
    {name: "Red", hex: "#ef4444", desc: "Like strawberries and fire engines!"},
    {name: "Blue", hex: "#3b82f6", desc: "Like the ocean and the clear sky!"},
    {name: "Green", hex: "#22c55e", desc: "Like grass, trees, and frogs!"},
    {name: "Yellow", hex: "#eab308", desc: "Like the warm sun and bananas!"},
    {name: "Orange", hex: "#f97316", desc: "Like juicy oranges and basketballs!"},
    {name: "Purple", hex: "#a855f7", desc: "Like grapes and eggplants!"},
    {name: "Pink", hex: "#ec4899", desc: "Like flamingos and cotton candy!"},
    {name: "Brown", hex: "#78350f", desc: "Like chocolate and friendly bears!"}
  ];

  function initColors() {
    let grid = document.getElementById('colorGrid');
    colors.forEach(c => {
      let btn = document.createElement('button');
      btn.className = 'color-btn';
      btn.style.backgroundColor = c.hex;
      btn.innerText = c.name;
      btn.onclick = () => selectColor(c);
      grid.appendChild(btn);
    });
    selectColor(colors[0]);
  }

  function selectColor(c) {
    let stage = document.getElementById('stage');
    stage.style.backgroundColor = c.hex;
    document.getElementById('colorTitle').innerText = c.name;
    document.getElementById('colorDesc').innerText = c.desc;

    if ('speechSynthesis' in window) {
      let utterance = new SpeechSynthesisUtterance(`This is the color ${c.name}`);
      window.speechSynthesis.speak(utterance);
    }
  }

  initColors();
</script>
</body>
</html>
