<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplication Tug of War — Learn With Fun — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --blue: #168be5;
    --red: #d9235b;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  h1 { margin-bottom: 5px; font-size: 2rem; text-align: center; }
  .game-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-top: 20px;
  }
  .screen { display: none; }
  .screen.active { display: block; }
  
  .team-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .team-card {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    text-align: center;
  }
  .team-blue { border-color: var(--blue); }
  .team-red { border-color: var(--red); }

  input, select {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    box-sizing: border-box;
    margin-top: 0.5rem;
  }
  input:focus, select:focus { outline: none; border-color: var(--text); }

  .btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 1rem 2rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }

  .hud {
    display: flex;
    justify-content: space-between;
    background: var(--bg);
    padding: 1rem 1.5rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 1.5rem;
    font-size: 1.1rem;
  }

  .tug-arena {
    background: linear-gradient(180deg, #090d16 0%, #1e293b 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    margin-bottom: 1.5rem;
    position: relative;
    overflow: hidden;
  }
  
  .question-box {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 2rem;
    text-align: center;
  }
  .math-problem {
    font-size: 3rem;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    margin: 1rem 0;
  }
  .answer-input {
    font-size: 2rem;
    width: 220px;
    text-align: center;
  }
  
  .avatar-group {
    transition: transform 0.4s ease-out;
  }

  @keyframes blueGlow {
    0%, 100% { filter: drop-shadow(0 0 4px var(--blue)); }
    50% { filter: drop-shadow(0 0 18px var(--blue)); }
  }
  @keyframes redGlow {
    0%, 100% { filter: drop-shadow(0 0 4px var(--red)); }
    50% { filter: drop-shadow(0 0 18px var(--red)); }
  }
  .glow-blue {
    animation: blueGlow 1.2s infinite ease-in-out;
  }
  .glow-red {
    animation: redGlow 1.2s infinite ease-in-out;
  }
</style>
</head>
<body>

<h1>⚔️ Multiplication Tug of War</h1>

<div class="game-container">
  
  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="screen active">
    <h3>Setup Competition</h3>
    <div class="team-grid">
      <div class="team-card team-blue">
        <h4 style="color: var(--blue); margin-top:0;" id="blueTitle">Team Blue</h4>
        <input type="text" id="nameBlue" value="Team Blue">
      </div>
      <div class="team-card team-red">
        <h4 style="color: var(--red); margin-top:0;" id="redTitle">Team Red</h4>
        <input type="text" id="nameRed" value="Team Red">
      </div>
    </div>
    
    <label style="font-weight: 600;">Difficulty:</label>
    <select id="difficulty" style="margin-bottom: 1.5rem;">
      <option value="easy">Easy (Times Tables 1 - 10)</option>
      <option value="medium" selected>Medium (Times Tables 2 - 15)</option>
      <option value="hard">Hard (Tables up to 25 &amp; 50)</option>
    </select>

    <button class="btn" onclick="startGame()">Start Battle 🚀</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div class="hud">
      <div>Turn: <span id="turnIndicator" style="font-weight: 700;">Team Blue</span></div>
      <div>Score: <span style="color:var(--blue);" id="scoreBlueText">0</span> &nbsp;-&nbsp; <span style="color:var(--red);" id="scoreRedText">0</span></div>
    </div>

    <div class="tug-arena">
      <svg viewBox="0 0 1000 160" width="100%" xmlns="http://www.w3.org/2000/svg">
        <!-- Background Rope Line -->
        <line x1="80" y1="80" x2="920" y2="80" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
        
        <!-- FIXED Center Line -->
        <line x1="500" y1="20" x2="500" y2="140" stroke="#fbbf24" stroke-width="4"/>

        <!-- Blue Team Avatar -->
        <g id="blueAvatar" transform="translate(150, 30)" class="avatar-group">
          <rect x="0" y="0" width="50" height="80" rx="8" fill="var(--blue)"/>
          <circle cx="25" cy="-12" r="18" fill="#e2a37e"/>
        </g>

        <!-- Red Team Avatar -->
        <g id="redAvatar" transform="translate(800, 30)" class="avatar-group">
          <rect x="0" y="0" width="50" height="80" rx="8" fill="var(--red)"/>
          <circle cx="25" cy="-12" r="18" fill="#e2a37e"/>
        </g>
      </svg>
    </div>

    <div class="question-box">
      <div class="math-problem" id="mathProblem">4 × 5 = ?</div>
      <form id="answerForm" onsubmit="submitAnswer(event)">
        <input type="number" id="userAnswer" class="answer-input" placeholder="?" autofocus autocomplete="off" required>
        <button type="submit" style="display:none;"></button>
      </form>
    </div>
  </div>

  <!-- WIN SCREEN -->
  <div id="winScreen" class="screen" style="text-align: center;">
    <h2 id="winnerText" style="font-size: 2.5rem; margin-bottom: 1rem;">🎉 Team Wins! 🎉</h2>
    <button class="btn" onclick="location.reload()">Play Again</button>
  </div>

</div>

<script>
  let gameState = {
    teamBlueName: 'Team Blue',
    teamRedName: 'Team Red',
    currentTurn: 1, // 1 for Blue, 2 for Red
    scoreBlue: 0,
    scoreRed: 0,
    blueX: 150,
    redX: 800,
    difficulty: 'medium',
    currentAnswer: 0,
    usedQuestions: new Set()
  };

  let audioCtx = null;
  let musicInterval = null;

  function startBackgroundMusic() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const notes = [130.81, 146.83, 164.81, 196.00, 220.00, 196.00, 164.81, 146.83];
    let step = 0;

    if (musicInterval) clearInterval(musicInterval);

    musicInterval = setInterval(() => {
      if (!audioCtx) return;
      
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[step], audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.28);

      step = (step + 1) % notes.length;
    }, 250);
  }

  function stopBackgroundMusic() {
    if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
  }

  function startGame() {
    startBackgroundMusic();

    gameState.teamBlueName = document.getElementById('nameBlue').value || 'Team Blue';
    gameState.teamRedName = document.getElementById('nameRed').value || 'Team Red';
    gameState.difficulty = document.getElementById('difficulty').value;
    
    document.getElementById('blueTitle').innerText = gameState.teamBlueName;
    document.getElementById('redTitle').innerText = gameState.teamRedName;

    document.getElementById('setupScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    
    nextQuestion();
  }

  function nextQuestion() {
    let num1, num2, ans, qKey;
    
    do {
      if (gameState.difficulty === 'easy') {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * 10) + 1;
      } else if (gameState.difficulty === 'medium') {
        num1 = Math.floor(Math.random() * 12) + 2;
        num2 = Math.floor(Math.random() * 12) + 2;
      } else {
        num1 = Math.floor(Math.random() * 20) + 5;
        num2 = Math.floor(Math.random() * 12) + 2;
      }
      ans = num1 * num2;
      qKey = `${num1}x${num2}`;
    } while (gameState.usedQuestions.has(qKey));

    gameState.usedQuestions.add(qKey);
    gameState.currentAnswer = ans;

    document.getElementById('mathProblem').innerText = `${num1} × ${num2} = ?`;
    
    let turnName = gameState.currentTurn === 1 ? gameState.teamBlueName : gameState.teamRedName;
    let turnIndicator = document.getElementById('turnIndicator');
    turnIndicator.innerText = turnName;
    turnIndicator.style.color = gameState.currentTurn === 1 ? 'var(--blue)' : 'var(--red)';

    let blueAv = document.getElementById('blueAvatar');
    let redAv = document.getElementById('redAvatar');
    if (gameState.currentTurn === 1) {
      blueAv.classList.add('glow-blue');
      redAv.classList.remove('glow-red');
    } else {
      redAv.classList.add('glow-red');
      blueAv.classList.remove('glow-blue');
    }

    document.getElementById('userAnswer').value = '';
    document.getElementById('userAnswer').focus();
  }

  function submitAnswer(e) {
    e.preventDefault();
    let userVal = parseInt(document.getElementById('userAnswer').value);

    if (userVal === gameState.currentAnswer) {
      if (gameState.currentTurn === 1) {
        gameState.scoreBlue++;
        gameState.redX -= 50;
        gameState.blueX -= 15;
      } else {
        gameState.scoreRed++;
        gameState.blueX += 50;
        gameState.redX += 15;
      }
      updateVisuals();
      if (checkWin()) return;
    }

    // Switch turn
    gameState.currentTurn = gameState.currentTurn === 1 ? 2 : 1;
    nextQuestion();
  }

  function updateVisuals() {
    document.getElementById('scoreBlueText').innerText = gameState.scoreBlue;
    document.getElementById('scoreRedText').innerText = gameState.scoreRed;
    
    document.getElementById('blueAvatar').style.transform = `translate(${gameState.blueX}px, 30px)`;
    document.getElementById('redAvatar').style.transform = `translate(${gameState.redX}px, 30px)`;
  }

  function checkWin() {
    if (gameState.blueX >= 450 || gameState.redX <= 450) {
      stopBackgroundMusic();
      let winner = gameState.blueX >= 450 ? gameState.teamRedName : gameState.teamBlueName;
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('winScreen').classList.add('active');
      document.getElementById('winnerText').innerText = `🎉 ${winner} Wins the Competition! 🎉`;
      return true;
    }
    return false;
  }
</script>
</body>
            </html>
