        cx="190"
        cy="245"
        rx="15"
        ry="11"
        fill="#e2a37e"
        transform="rotate(-20 190 245)"/>

    <!-- ROPE OVER HAND -->
    <path
        d="M177 245 L204 245"
        stroke="#292929"
        stroke-width="7"
        stroke-linecap="round"/>

    <!-- TROUSERS -->
    <path
        d="M62 245 L105 250 L90 350 L48 342Z"
        fill="#242b3a"/>

    <path
        d="M105 250 L145 245 L175 335 L135 348Z"
        fill="#242b3a"/>

    <!-- SHOES -->
