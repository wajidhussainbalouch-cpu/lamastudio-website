        d="M55 170
           Q35 205 70 245"
        fill="none"
        stroke="#168be5"
        stroke-width="30"
        stroke-linecap="round"/>

    <!-- LEFT HAND HOLDING ROPE -->
    <ellipse
        cx="72"
        cy="245"
        rx="14"
        ry="11"
        fill="#e2a37e"
        transform="rotate(-25 72 245)"/>

    <!-- RIGHT ARM TO ROPE -->
