<svg viewBox="0 0 1000 500"
     width="100%"
     xmlns="http://www.w3.org/2000/svg">

<style>
/* LEFT TEAM */
.left-team {
    animation: leftPull 2s ease-in-out infinite;
    transform-origin: center;
}

/* RIGHT TEAM */
.right-team {
    animation: rightPull 2s ease-in-out infinite;
    transform-origin: center;
}

/* ROPE */
.rope {
    animation: ropePull 2s ease-in-out infinite;
}

@keyframes leftPull {
    0%,100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(18px) rotate(-1deg); }
}

@keyframes rightPull {
    0%,100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(-18px) rotate(1deg); }
}

@keyframes ropePull {
    0%,100% { transform: translateX(0); }
    50% { transform: translateX(8px); }
}
</style>

<!-- ================================================= -->
<!-- ROPE -->
<!-- ================================================= -->

<g class="rope">

    <!-- Main rope -->
    <path
        d="M55 285
           C180 285 290 285 390 285
           C430 285 465 285 500 285
           C535 285 570 285 610 285
           C710 285 820 285 945 285"
        fill="none"
        stroke="#292929"
        stroke-width="7"
        stroke-linecap="round"
    />

    <!-- Center knot -->
    <g>
        <path
            d="M492 275
               L500 290
               L508 275"
            fill="none"
            stroke="#e52b63"
            stroke-width="7"
            stroke-linecap="round"
        />
        <path
            d="M500 289 L500 315"
            stroke="#e52b63"
            stroke-width="5"
            stroke-linecap="round"
        />
    </g>

</g>


<!-- ================================================= -->
<!-- LEFT PLAYER 1 -->
<!-- ================================================= -->

