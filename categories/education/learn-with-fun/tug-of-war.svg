    <!-- EYES -->
    <ellipse cx="89" cy="104" rx="5" ry="7" fill="#fff"/>
    <ellipse cx="121" cy="104" rx="5" ry="7" fill="#fff"/>

    <circle cx="90" cy="105" r="3" fill="#222"/>
    <circle cx="120" cy="105" r="3" fill="#222"/>

    <!-- EYEBROWS -->
    <path d="M82 94 Q90 89 97 94"
          fill="none"
          stroke="#593b2c"
          stroke-width="4"/>

    <path d="M113 94 Q121 89 128 94"
