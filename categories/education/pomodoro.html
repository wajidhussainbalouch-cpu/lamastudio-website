<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Pomodoro Timer — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
.util-container { max-width: 900px; margin: 30px auto; padding: 0 1rem; }
.tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); text-align: center; }
.tool-header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; text-align: left; }
.tool-header h1 { font-size: 1.8rem; color: var(--text); margin: 0 0 8px 0; }
.tool-header p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

.timer-modes { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
.mode-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.mode-btn.active { background: var(--category-color); color: #fff; border-color: var(--category-color); }

.timer-display { font-size: 5rem; font-family: 'JetBrains Mono', monospace; color: var(--text); font-weight: 700; margin: 20px 0; }

.timer-controls { display: flex; justify-content: center; gap: 15px; }
.btn { background: var(--category-color); color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
.btn:hover { opacity: 0.9; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body style="--category-color: var(--c-education);">

<header class="site-header">
  <div class="util-row" style="width: 100%; display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: 0 auto; padding: 0 1rem;">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Education Hub</small></span></a>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>
  <div class="category-strip">
    <div class="category-track" role="tablist">
      <a href="index.html" class="cat-pill active" style="--pc:var(--c-education)"><span class="dot"></span>← Back to Education Hub</a>
    </div>
  </div>
</header>

<main class="util-container">
  <div class="tool-card">
    <div class="tool-header">
      <h1>Study Pomodoro Timer</h1>
      <p>Boost your focus with structured 25-minute work blocks followed by refreshing breaks.</p>
    </div>

    <div class="timer-modes">
      <button class="mode-btn active" onclick="setMode(25, this)">Focus (25m)</button>
      <button class="mode-btn" onclick="setMode(5, this)">Short Break (5m)</button>
      <button class="mode-btn" onclick="setMode(15, this)">Long Break (15m)</button>
    </div>

    <div class="timer-display" id="timerDisplay">25:00</div>

    <div class="timer-controls">
      <button class="btn" id="startBtn" onclick="toggleTimer()">Start Timer</button>
      <button class="btn btn-outline" onclick="resetTimer()">Reset</button>
    </div>
  </div>
</main>

<script src="../../script.js"></script>
<script>
let totalSeconds = 25 * 60;
let timerInterval = null;
let isRunning = false;

function updateDisplay() {
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  document.getElementById('timerDisplay').innerText = 
    String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
}

function setMode(mins, btn) {
  stopTimer();
  totalSeconds = mins * 60;
  updateDisplay();
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleTimer() {
  if (isRunning) {
    stopTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('startBtn').innerText = 'Pause Timer';
  timerInterval = setInterval(() => {
    if (totalSeconds > 0) {
      totalSeconds--;
      updateDisplay();
    } else {
      stopTimer();
      alert("Time's up! Great job on your session.");
    }
  }, 1000);
}

function stopTimer() {
  isRunning = false;
  clearInterval(timerInterval);
  document.getElementById('startBtn').innerText = 'Start Timer';
}

function resetTimer() {
  stopTimer();
  const activeMode = document.querySelector('.mode-btn.active');
  if(activeMode.innerText.includes('25')) totalSeconds = 25 * 60;
  else if(activeMode.innerText.includes('5')) totalSeconds = 5 * 60;
  else totalSeconds = 15 * 60;
  updateDisplay();
}
</script>
</body>
</html>
