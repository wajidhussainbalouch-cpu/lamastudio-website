<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Salary & Tax Estimator — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
.util-container { max-width: 900px; margin: 30px auto; padding: 0 1rem; }
.tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
.tool-header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
.tool-header h1 { font-size: 1.8rem; color: var(--text); margin: 0 0 8px 0; }
.tool-header p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

.form-group { margin-bottom: 20px; }
label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 500; }
input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 8px; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
input:focus { outline: none; border-color: var(--category-color); }
.btn { background: var(--category-color); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; transition: opacity 0.2s; }
.btn:hover { opacity: 0.9; }

.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 25px; }
.result-box { background: rgba(23, 78, 166, 0.08); border: 1px solid var(--category-color); border-radius: 12px; padding: 20px; text-align: center; }
.result-box h3 { font-size: 1.6rem; color: var(--category-color); margin: 0 0 5px 0; font-family: 'JetBrains Mono', monospace; }
.result-box p { color: var(--text-muted); margin: 0; font-size: 0.85rem; }
</style>
</head>
<body style="--category-color: var(--c-education);">

<header class="site-header">
  <div class="util-row" style="width: 100%; display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: 0 auto; padding: 0 1rem;">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Education Hub</small></span></a>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>
  <div class="category-strip">
    <div class="category-track" role="tablist">
      <a href="index.html" class="cat-pill active" style="--pc:var(--c-education)"><span class="dot"></span>← Back to Education Hub</a>
    </div>
  </div>
</header>

<main class="util-container">
  <div class="tool-card">
    <div class="tool-header">
      <h1>Professional Salary & Tax Estimator</h1>
      <p>Estimate annual earnings, monthly take-home pay, and basic tax deductions for career planning.</p>
    </div>

    <div class="form-group">
      <label>Gross Annual Salary / Income</label>
      <input type="number" id="annualSalary" placeholder="e.g., 1200000" value="1200000">
    </div>

    <div class="form-group">
      <label>Estimated Tax Rate (%)</label>
      <input type="number" id="taxRate" placeholder="e.g., 15" value="15">
    </div>

    <button class="btn" onclick="calculateSalary()">Calculate Net Income</button>

    <div class="result-grid" id="salaryResults" style="display:none;">
      <div class="result-box"><h3 id="netAnnual">0</h3><p>Net Annual Income</p></div>
      <div class="result-box"><h3 id="netMonthly">0</h3><p>Net Monthly Take-Home</p></div>
      <div class="result-box"><h3 id="taxDeducted">0</h3><p>Annual Tax Amount</p></div>
    </div>
  </div>
</main>

<script src="../../script.js"></script>
<script>
function calculateSalary() {
  const salary = parseFloat(document.getElementById('annualSalary').value) || 0;
  const rate = parseFloat(document.getElementById('taxRate').value) || 0;

  const tax = salary * (rate / 100);
  const netAnnual = salary - tax;
  const netMonthly = netAnnual / 12;

  document.getElementById('netAnnual').innerText = '$' + netAnnual.toLocaleString(undefined, {maximumFractionDigits: 0});
  document.getElementById('netMonthly').innerText = '$' + netMonthly.toLocaleString(undefined, {maximumFractionDigits: 0});
  document.getElementById('taxDeducted').innerText = '$' + tax.toLocaleString(undefined, {maximumFractionDigits: 0});
  document.getElementById('salaryResults').style.display = 'grid';
}
</script>
</body>
</html>
