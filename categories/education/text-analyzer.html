<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Text & Word Counter — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
.util-container { max-width: 900px; margin: 30px auto; padding: 0 1rem; }
.tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
.tool-header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
.tool-header h1 { font-size: 1.8rem; color: var(--text); margin: 0 0 8px 0; }
.tool-header p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
.stat-box { background: rgba(23, 78, 166, 0.05); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; }
.stat-box h3 { font-size: 1.6rem; color: var(--category-color); margin: 0 0 4px 0; font-family: 'JetBrains Mono', monospace; }
.stat-box p { font-size: 0.85rem; color: var(--text-muted); margin: 0; }

textarea { width: 100%; height: 220px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 15px; border-radius: 12px; font-family: inherit; font-size: 1rem; resize: vertical; box-sizing: border-box; margin-bottom: 15px; }
textarea:focus { outline: none; border-color: var(--category-color); }
.btn { background: var(--category-color); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.btn:hover { opacity: 0.9; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body style="--category-color: var(--c-education);">

<header class="site-header">
  <div class="util-row" style="width: 100%; display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: 0 auto; padding: 0 1rem;">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Education Hub</small></span></a>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>
  <div class="category-strip">
    <div class="category-track" role="tablist">
      <a href="index.html" class="cat-pill active" style="--pc:var(--c-education)"><span class="dot"></span>← Back to Education Hub</a>
    </div>
  </div>
</header>

<main class="util-container">
  <div class="tool-card">
    <div class="tool-header">
      <h1>Live Text & Word Counter</h1>
      <p>Type or paste your essays, assignments, or notes below for instant real-time metrics.</p>
    </div>

    <div class="stats-grid">
      <div class="stat-box"><h3 id="wordCount">0</h3><p>Words</p></div>
      <div class="stat-box"><h3 id="charCount">0</h3><p>Characters</p></div>
      <div class="stat-box"><h3 id="sentenceCount">0</h3><p>Sentences</p></div>
      <div class="stat-box"><h3 id="readTime">0s</h3><p>Reading Time</p></div>
    </div>

    <textarea id="textInput" placeholder="Start typing or paste text here..." oninput="analyzeText()"></textarea>

    <div style="display: flex; gap: 10px;">
      <button class="btn btn-outline" onclick="clearText()">Clear Text</button>
      <button class="btn" onclick="copyText()">Copy Text</button>
    </div>
  </div>
</main>

<script src="../../script.js"></script>
<script>
function analyzeText() {
  const text = document.getElementById('textInput').value;
  
  // Characters
  const charCount = text.length;
  document.getElementById('charCount').innerText = charCount;

  // Words
  const words = text.trim() ? text.trim().split(/\s+/) : [];
  const wordCount = words.length;
  document.getElementById('wordCount').innerText = wordCount;

  // Sentences
  const sentences = text.split(/[.!?]+/).filter(Boolean);
  const sentenceCount = sentences.length;
  document.getElementById('sentenceCount').innerText = sentenceCount;

  // Reading time (approx 200 words per minute)
  const seconds = Math.ceil((wordCount / 200) * 60);
  document.getElementById('readTime').innerText = wordCount === 0 ? '0s' : seconds < 60 ? seconds + 's' : Math.ceil(seconds/60) + 'm';
}

function clearText() {
  document.getElementById('textInput').value = '';
  analyzeText();
}

function copyText() {
  const textarea = document.getElementById('textInput');
  textarea.select();
  navigator.clipboard.writeText(textarea.value);
  alert("Text copied to clipboard!");
}
</script>
</body>
</html>
