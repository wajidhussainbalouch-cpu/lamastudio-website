<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Unit Converter — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
.util-container { max-width: 900px; margin: 30px auto; padding: 0 1rem; }
.tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
.tool-header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
.tool-header h1 { font-size: 1.8rem; color: var(--text); margin: 0 0 8px 0; }
.tool-header p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

.converter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media(max-width: 600px) { .converter-grid { grid-template-columns: 1fr; } }

.form-group { margin-bottom: 15px; }
label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 500; }
input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 8px; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
input:focus, select:focus { outline: none; border-color: var(--category-color); }
.btn { background: var(--category-color); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; transition: opacity 0.2s; }
.btn:hover { opacity: 0.9; }

.result-box { background: rgba(23, 78, 166, 0.08); border: 1px solid var(--category-color); border-radius: 12px; padding: 20px; text-align: center; margin-top: 25px; }
.result-box h3 { font-size: 2rem; color: var(--category-color); margin: 0 0 5px 0; font-family: 'JetBrains Mono', monospace; }
.result-box p { color: var(--text-muted); margin: 0; font-size: 0.9rem; }
</style>
</head>
<body style="--category-color: var(--c-education);">

<header class="site-header">
  <div class="util-row" style="width: 100%; display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: 0 auto; padding: 0 1rem;">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Education Hub</small></span></a>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>
  <div class="category-strip">
    <div class="category-track" role="tablist">
      <a href="index.html" class="cat-pill active" style="--pc:var(--c-education)"><span class="dot"></span>← Back to Education Hub</a>
    </div>
  </div>
</header>

<main class="util-container">
  <div class="tool-card">
    <div class="tool-header">
      <h1>Comprehensive Scientific Unit Converter</h1>
      <p>Seamlessly convert length, mass, temperature, area, volume, time, speed, digital data, and energy metrics.</p>
    </div>

    <div class="form-group">
      <label>Conversion Category</label>
      <select id="convType" onchange="updateUnits()">
        <option value="length">Length & Distance</option>
        <option value="mass">Mass & Weight</option>
        <option value="temp">Temperature</option>
        <option value="area">Area</option>
        <option value="volume">Volume</option>
        <option value="time">Time</option>
        <option value="speed">Speed</option>
        <option value="digital">Digital Storage</option>
        <option value="energy">Energy</option>
      </select>
    </div>

    <div class="converter-grid">
      <div class="form-group">
        <label>From Unit</label>
        <select id="unitFrom"></select>
      </div>
      <div class="form-group">
        <label>To Unit</label>
        <select id="unitTo"></select>
      </div>
    </div>

    <div class="form-group">
      <label>Value to Convert</label>
      <input type="number" id="inputValue" value="1" placeholder="Enter numeric value">
    </div>

    <button class="btn" onclick="convertUnits()">Convert Units</button>

    <div class="result-box" id="convResultBox" style="display:none;">
      <h3 id="convOutput">0</h3>
      <p id="convLabel">Converted Result</p>
    </div>
  </div>
</main>

<script src="../../script.js"></script>
<script>
const unitsData = {
  length: {
    meters: 1,
    kilometers: 1000,
    centimeters: 0.01,
    millimeters: 0.001,
    miles: 1609.344,
    yards: 0.9144,
    feet: 0.3048,
    inches: 0.0254
  },
  mass: {
    kilograms: 1,
    grams: 0.001,
    milligrams: 0.000001,
    metric_tons: 1000,
    pounds: 0.45359237,
    ounces: 0.028349523125
  },
  area: {
    square_meters: 1,
    square_kilometers: 1000000,
    square_miles: 2589988.11,
    square_feet: 0.092903,
    acres: 4046.86,
    hectares: 10000
  },
  volume: {
    liters: 1,
    milliliters: 0.001,
    cubic_meters: 1000,
    gallons_us: 3.78541,
    fluid_ounces_us: 0.0295735
  },
  time: {
    seconds: 1,
    minutes: 60,
    hours: 3600,
    days: 86400,
    weeks: 604800,
    years: 31536000
  },
  speed: {
    meters_per_second: 1,
    kilometers_per_hour: 0.277778,
    miles_per_hour: 0.44704,
    knots: 0.514444
  },
  digital: {
    bytes: 1,
    kilobytes: 1024,
    megabytes: 1048576,
    gigabytes: 1073741824,
    terabytes: 1099511627776
  },
  energy: {
    joules: 1,
    kilojoules: 1000,
    calories: 4.184,
    kilocalories: 4184,
    watt_hours: 3600
  }
};

function updateUnits() {
  const type = document.getElementById('convType').value;
  const fromSelect = document.getElementById('unitFrom');
  const toSelect = document.getElementById('unitTo');
  fromSelect.innerHTML = '';
  toSelect.innerHTML = '';

  if (type === 'temp') {
    const tempUnits = ['Celsius', 'Fahrenheit', 'Kelvin'];
    tempUnits.forEach(u => {
      fromSelect.add(new Option(u, u));
      toSelect.add(new Option(u, u));
    });
    toSelect.selectedIndex = 1; // Default to Fahrenheit
  } else {
    const keys = Object.keys(unitsData[type]);
    keys.forEach(u => {
      const formattedName = u.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      fromSelect.add(new Option(formattedName, u));
      toSelect.add(new Option(formattedName, u));
    });
    if (keys.length > 1) toSelect.selectedIndex = 1;
  }
}

function convertUnits() {
  const type = document.getElementById('convType').value;
  const val = parseFloat(document.getElementById('inputValue').value);
  const from = document.getElementById('unitFrom').value;
  const to = document.getElementById('unitTo').value;

  if (isNaN(val)) {
    alert("Please enter a valid number to convert.");
    return;
  }

  let result = 0;

  if (type === 'temp') {
    if (from === to) {
      result = val;
    } else if (from === 'Celsius' && to === 'Fahrenheit') {
      result = (val * 9/5) + 32;
    } else if (from === 'Fahrenheit' && to === 'Celsius') {
      result = (val - 32) * 5/9;
    } else if (from === 'Celsius' && to === 'Kelvin') {
      result = val + 273.15;
    } else if (from === 'Kelvin' && to === 'Celsius') {
      result = val - 273.15;
    } else if (from === 'Fahrenheit' && to === 'Kelvin') {
      result = (val - 32) * 5/9 + 273.15;
    } else if (from === 'Kelvin' && to === 'Fahrenheit') {
      result = (val - 273.15) * 9/5 + 32;
    }
  } else {
    const baseVal = val * unitsData[type][from];
    result = baseVal / unitsData[type][to];
  }

  document.getElementById('convOutput').innerText = result.toLocaleString(undefined, {maximumFractionDigits: 4});
  document.getElementById('convLabel').innerText = `${val} ${from.replace(/_/g, ' ')} = ${result.toLocaleString(undefined, {maximumFractionDigits: 4})} ${to.replace(/_/g, ' ')}`;
  document.getElementById('convResultBox').style.display = 'block';
}

// Initialize on page load
updateUnits();
</script>
</body>
</html>
