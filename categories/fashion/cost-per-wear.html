<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outfit Cost-Per-Wear Calculator — LamaStudio Fashion Hub</title>
<meta name="description" content="Calculate the true financial value and longevity of your wardrobe investments per wear.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .form-control { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .form-control:focus { outline: none; border-color: var(--category-color); }
  .calc-btn { width: 100%; background: var(--category-color); color: #fff; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 2rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; display: none; }
  .result-value { font-size: 2.25rem; font-weight: 700; color: var(--category-color); font-family: 'JetBrains Mono', monospace; margin: 0.5rem 0; }
</style>
</head>
<body style="--category-color: var(--c-fashion, #e91e63);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Cost-Per-Wear</small></span></a>
    </div>
  </div>
</header>

<main class="tool-container">
  <div class="calc-card">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.4rem; margin-bottom: 1.5rem;">Cost-Per-Wear Calculator</h1>
    
    <div class="form-group">
      <label for="price">Garment Retail Price ($)</label>
      <input type="number" id="price" class="form-control" placeholder="e.g., 150" required>
    </div>

    <div class="form-group">
      <label for="wears">Estimated Number of Wears</label>
      <input type="number" id="wears" class="form-control" placeholder="e.g., 50" required>
    </div>

    <button type="button" class="calc-btn" onclick="calculateCPW()">Calculate Cost-Per-Wear</button>

    <div class="result-box" id="resultBox">
      <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Cost Per Single Wear</span>
      <div class="result-value" id="cpwOutput">$0.00</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Evaluating long-term wardrobe sustainability.</p>
    </div>
  </div>
</main>

<script>
function calculateCPW() {
  const price = parseFloat(document.getElementById('price').value);
  const wears = parseFloat(document.getElementById('wears').value);

  if (!price || !wears || wears <= 0) {
    alert('Please enter valid numerical values.');
    return;
  }

  const cpw = price / wears;
  document.getElementById('cpwOutput').innerText = "$" + cpw.toFixed(2);
  document.getElementById('resultBox').style.display = 'block';
}
</script>
<script src="../../script.js"></script>
</body>
</html>
