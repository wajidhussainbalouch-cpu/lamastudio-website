<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabric Care & Laundry Identifier — LamaStudio Fashion Hub</title>
<meta name="description" content="Look up proper washing temperatures, drying cycles, and ironing instructions for sensitive fabrics.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .form-control { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .form-control:focus { outline: none; border-color: var(--category-color); }
  .calc-btn { width: 100%; background: var(--category-color); color: #fff; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 2rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: none; }
  .care-text { font-size: 0.95rem; color: var(--text); line-height: 1.6; margin-top: 0.5rem; }
</style>
</head>
<body style="--category-color: var(--c-fashion, #e91e63);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Fabric Care</small></span></a>
    </div>
  </div>
</header>

<main class="tool-container">
  <div class="calc-card">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.4rem; margin-bottom: 1.5rem;">Fabric Care &amp; Laundry Identifier</h1>
    
    <div class="form-group">
      <label for="fabricType">Select Fabric Material</label>
      <select id="fabricType" class="form-control">
        <option value="silk">Silk</option>
        <option value="wool">Wool / Cashmere</option>
        <option value="denim">Denim</option>
        <option value="linen">Linen</option>
        <option value="cotton">Cotton</option>
      </select>
    </div>

    <button type="button" class="calc-btn" onclick="lookupFabric()">Get Care Instructions</button>

    <div class="result-box" id="resultBox">
      <span style="font-size: 0.85rem; color: var(--category-color); text-transform: uppercase; font-weight: 700;" id="fabricTitle"></span>
      <div class="care-text" id="careInstructions"></div>
    </div>
  </div>
</main>

<script>
function lookupFabric() {
  const fabric = document.getElementById('fabricType').value;
  let title = "";
  let instructions = "";

  if (fabric === 'silk') {
    title = "Silk Care Protocol";
    instructions = "Hand wash in cold water using a pH-neutral liquid detergent. Never wring or twist. Lay flat on a clean towel to dry away from direct sunlight.";
  } else if (fabric === 'wool') {
    title = "Wool & Cashmere Protocol";
    instructions = "Dry clean or hand wash cold with wool-specific shampoo. Reshape flat while damp. Never hang wet wool to prevent stretching.";
  } else if (fabric === 'denim') {
    title = "Denim Preservation Protocol";
    instructions = "Wash inside out in cold water infrequently to preserve indigo dye. Air dry naturally rather than using high machine heat.";
  } else if (fabric === 'linen') {
    title = "Linen Care Protocol";
    instructions = "Machine wash gentle in cool or lukewarm water. Line dry while damp to minimize wrinkles and maintain natural crisp fibers.";
  } else if (fabric === 'cotton') {
    title = "Cotton Care Protocol";
    instructions = "Machine wash regular with similar colors. Tolerates warm tumble drying, though low heat prevents shrinkage.";
  }

  document.getElementById('fabricTitle').innerText = title;
  document.getElementById('careInstructions').innerText = instructions;
  document.getElementById('resultBox').style.display = 'block';
}
</script>
<script src="../../script.js"></script>
</body>
</html>
