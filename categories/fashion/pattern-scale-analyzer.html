<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Scale & Proportion Matcher — LamaStudio Fashion Hub</title>
<meta name="description" content="Determine whether bold prints, stripes, or micro-patterns best suit your structural scale.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .form-control { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .form-control:focus { outline: none; border-color: var(--category-color); }
  .calc-btn { width: 100%; background: var(--category-color); color: #fff; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 2rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; display: none; }
  .result-value { font-size: 1.75rem; font-weight: 700; color: var(--category-color); margin: 0.5rem 0; }
</style>
</head>
<body style="--category-color: var(--c-fashion, #e91e63);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Pattern Scale</small></span></a>
    </div>
  </div>
</header>

<main class="tool-container">
  <div class="calc-card">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.4rem; margin-bottom: 1.5rem;">Pattern Scale &amp; Proportion Matcher</h1>
    
    <div class="form-group">
      <label for="stature">Your Overall Bone Structure &amp; Stature</label>
      <select id="stature" class="form-control">
        <option value="petite">Petite &amp; Delicate Framework</option>
        <option value="moderate">Moderate / Average Stature</option>
        <option value="tall">Tall &amp; Bold Framework</option>
      </select>
    </div>

    <button type="button" class="calc-btn" onclick="analyzePattern()">Determine Ideal Print Scale</button>

    <div class="result-box" id="resultBox">
      <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Recommended Print Scale</span>
      <div class="result-value" id="patternOutput">Medium Scale Prints</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0; line-height: 1.5;" id="patternAdvice"></p>
    </div>
  </div>
</main>

<script>
function analyzePattern() {
  const stature = document.getElementById('stature').value;
  let scale = "Medium Scale Prints";
  let advice = "You can balance moderately proportioned florals, geometric patterns, and medium stripes without overwhelming your frame.";

  if (stature === 'petite') {
    scale = "Micro & Delicate Prints";
    advice = "Large, oversized patterns can overwhelm a delicate frame. Stick to delicate florals, subtle polka dots, and fine pin-stripes.";
  } else if (stature === 'tall') {
    scale = "Large Scale & Bold Prints";
    advice = "You carry bold statement prints, oversized geometric blocks, and wide patterns effortlessly without looking overcrowded.";
  }

  document.getElementById('patternOutput').innerText = scale;
  document.getElementById('patternAdvice').innerText = advice;
  document.getElementById('resultBox').style.display = 'block';
}
</script>
<script src="../../script.js"></script>
</body>
</html>
