<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>International Clothing Size Converter — LamaStudio Fashion Hub</title>
<meta name="description" content="Convert apparel sizes instantly across US, UK, EU, and international standards.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .form-control { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .form-control:focus { outline: none; border-color: var(--category-color); }
  .calc-btn { width: 100%; background: var(--category-color); color: #fff; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 2rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; display: none; }
  .result-value { font-size: 2.25rem; font-weight: 700; color: var(--category-color); font-family: 'JetBrains Mono', monospace; margin: 0.5rem 0; }
</style>
</head>
<body style="--category-color: var(--c-fashion, #e91e63);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Size Converter</small></span></a>
    </div>
  </div>
</header>

<main class="tool-container">
  <div class="calc-card">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.4rem; margin-bottom: 1.5rem;">International Size Converter</h1>
    
    <div class="form-group">
      <label for="usSize">Select US Standard Size</label>
      <select id="usSize" class="form-control">
        <option value="XS">US Extra Small (XS / 0-2)</option>
        <option value="S">US Small (S / 4-6)</option>
        <option value="M">US Medium (M / 8-10)</option>
        <option value="L">US Large (L / 12-14)</option>
        <option value="XL">US Extra Large (XL / 16-18)</option>
      </select>
    </div>

    <button type="button" class="calc-btn" onclick="convertSize()">Convert Sizes</button>

    <div class="result-box" id="resultBox">
      <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">UK &amp; European Equivalents</span>
      <div class="result-value" id="convOutput">UK: 8 | EU: 36</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Standard cross-border sizing reference.</p>
    </div>
  </div>
</main>

<script>
function convertSize() {
  const size = document.getElementById('usSize').value;
  let res = "";

  if (size === 'XS') res = "UK: 4–6 | EU: 32–34 | IT: 38";
  else if (size === 'S') res = "UK: 8–10 | EU: 36–38 | IT: 40";
  else if (size === 'M') res = "UK: 12–14 | EU: 40–42 | IT: 44";
  else if (size === 'L') res = "UK: 16–18 | EU: 44–46 | IT: 46–48";
  else if (size === 'XL') res = "UK: 20 | EU: 48 | IT: 50";

  document.getElementById('convOutput').innerText = res;
  document.getElementById('resultBox').style.display = 'block';
}
</script>
<script src="../../script.js"></script>
</body>
        </html>
