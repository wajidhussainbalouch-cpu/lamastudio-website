<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardrobe Sustainability Scorecard — LamaStudio Fashion Hub</title>
<meta name="description" content="Evaluate your fashion consumption habits and check your eco-friendly footprint score.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .form-control { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .form-control:focus { outline: none; border-color: var(--category-color); }
  .calc-btn { width: 100%; background: var(--category-color); color: #fff; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 2rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; display: none; }
  .result-value { font-size: 2.25rem; font-weight: 700; color: var(--category-color); font-family: 'JetBrains Mono', monospace; margin: 0.5rem 0; }
</style>
</head>
<body style="--category-color: var(--c-fashion, #e91e63);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Sustainability Score</small></span></a>
    </div>
  </div>
</header>

<main class="tool-container">
  <div class="calc-card">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.4rem; margin-bottom: 1.5rem;">Wardrobe Sustainability Scorecard</h1>
    
    <div class="form-group">
      <label for="thrift">How often do you buy thrift or second-hand clothing?</label>
      <select id="thrift" class="form-control">
        <option value="30">Frequently / Most of my wardrobe</option>
        <option value="15">Occasionally / Sometimes</option>
        <option value="0">Rarely / Always buy brand new</option>
      </select>
    </div>

    <div class="form-group">
      <label for="lifespan">How long do you typically keep your garments?</label>
      <select id="lifespan" class="form-control">
        <option value="40">Multi-year investments (3+ years)</option>
        <option value="20">1 to 2 seasons</option>
        <option value="5">Fast fashion trend cycles (frequent turnover)</option>
      </select>
    </div>

    <button type="button" class="calc-btn" onclick="calculateScore()">Calculate Eco-Score</button>

    <div class="result-box" id="resultBox">
      <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Your Sustainability Rating</span>
      <div class="result-value" id="scoreOutput">0 / 100</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Eco-conscious wardrobe habit index.</p>
    </div>
  </div>
</main>

<script>
function calculateScore() {
  const thrift = parseInt(document.getElementById('thrift').value);
  const lifespan = parseInt(document.getElementById('lifespan').value);

  const total = thrift + lifespan + 35; // Base baseline
  document.getElementById('scoreOutput').innerText = total + " / 100 Points";
  document.getElementById('resultBox').style.display = 'block';
}
</script>
<script src="../../script.js"></script>
</body>
        </html>
