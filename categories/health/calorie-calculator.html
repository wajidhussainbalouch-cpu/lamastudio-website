<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorie Burn Estimator — LamaStudio Health Hub</title>
<meta name="description" content="Estimate active energy burned across various training sessions, running, cycling, and weightlifting.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .form-control { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .form-control:focus { outline: none; border-color: var(--category-color); }
  .calc-btn { width: 100%; background: var(--category-color); color: #fff; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 2rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; display: none; }
  .result-value { font-size: 2.25rem; font-weight: 700; color: var(--category-color); font-family: 'JetBrains Mono', monospace; margin: 0.5rem 0; }
</style>
</head>
<body style="--category-color: var(--c-health, #e74c3c);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Calorie Burner</small></span></a>
    </div>
  </div>
</header>

<main class="tool-container">
  <div class="calc-card">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.4rem; margin-bottom: 1.5rem;">Calorie Burn Estimator</h1>
    
    <div class="form-group">
      <label for="weight">Body Weight (kg)</label>
      <input type="number" id="weight" class="form-control" placeholder="e.g., 70" required>
    </div>

    <div class="form-group">
      <label for="activityType">Select Activity</label>
      <select id="activityType" class="form-control">
        <option value="8.0">Running (8 km/h)</option>
        <option value="11.5">Running (12 km/h)</option>
        <option value="7.5">Cycling (Moderate)</option>
        <option value="6.0">Swimming (Freestyle)</option>
        <option value="3.5">Weightlifting / Resistance Training</option>
        <option value="3.0">Walking (5 km/h)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="duration">Duration (Minutes)</label>
      <input type="number" id="duration" class="form-control" placeholder="e.g., 45" value="30">
    </div>

    <button type="button" class="calc-btn" onclick="calculateCalories()">Estimate Calories Burned</button>

    <div class="result-box" id="resultBox">
      <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Estimated Energy Expenditure</span>
      <div class="result-value" id="calorieOutput">0 kcal</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Total active calories burned during the session.</p>
    </div>
  </div>
</main>

<script>
function calculateCalories() {
  const weight = parseFloat(document.getElementById('weight').value);
  const met = parseFloat(document.getElementById('activityType').value);
  const durationMinutes = parseFloat(document.getElementById('duration').value);

  if (!weight || weight <= 0 || !durationMinutes || durationMinutes <= 0) {
    alert('Please enter valid weight and duration values.');
    return;
  }

  const totalCalories = (met * weight * 3.5 / 200) * durationMinutes;

  document.getElementById('calorieOutput').innerText = Math.round(totalCalories) + " kcal";
  document.getElementById('resultBox').style.display = 'block';
}
</script>
<script src="../../script.js"></script>
</body>
</html>
