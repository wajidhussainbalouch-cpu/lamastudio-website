<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideal Body Weight Calculator — LamaStudio Health Hub</title>
<meta name="description" content="Estimate your healthy weight range using standard medical formulas like Devine, Robinson, and Miller.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .form-control { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .form-control:focus { outline: none; border-color: var(--category-color); }
  .calc-btn { width: 100%; background: var(--category-color); color: #fff; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 2rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; display: none; }
  .result-value { font-size: 2rem; font-weight: 700; color: var(--category-color); font-family: 'JetBrains Mono', monospace; margin: 0.5rem 0; }
</style>
</head>
<body style="--category-color: var(--c-health, #e74c3c);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>IBW Calculator</small></span></a>
    </div>
  </div>
</header>

<main class="tool-container">
  <div class="calc-card">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.4rem; margin-bottom: 1.5rem;">Ideal Body Weight Calculator</h1>
    
    <div class="form-group">
      <label for="gender">Gender</label>
      <select id="gender" class="form-control">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="form-group">
      <label for="height">Height (cm)</label>
      <input type="number" id="height" class="form-control" placeholder="e.g., 175" required>
    </div>

    <button type="button" class="calc-btn" onclick="calculateIBW()">Calculate Ideal Weight</button>

    <div class="result-box" id="resultBox">
      <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Estimated Ideal Weight (Devine Formula)</span>
      <div class="result-value" id="ibwOutput">0.0 kg</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Standard clinical formula range estimate.</p>
    </div>
  </div>
</main>

<script>
function calculateIBW() {
  const gender = document.getElementById('gender').value;
  const heightCm = parseFloat(document.getElementById('height').value);

  if (!heightCm || heightCm <= 0) {
    alert('Please enter a valid height in centimeters.');
    return;
  }

  // Convert height to inches and check inches over 5 feet (60 inches)
  const heightInches = heightCm / 2.54;
  const inchesOver5Feet = heightInches - 60;

  let ibwKg = 0;
  if (inchesOver5Feet > 0) {
    if (gender === 'male') {
      ibwKg = 50 + (2.3 * inchesOver5Feet);
    } else {
      ibwKg = 45.5 + (2.3 * inchesOver5Feet);
    }
  } else {
    // Fallback baseline for heights under 5 feet
    ibwKg = gender === 'male' ? 50 : 45.5;
  }

  document.getElementById('ibwOutput').innerText = ibwKg.toFixed(1) + " kg";
  document.getElementById('resultBox').style.display = 'block';
}
</script>
<script src="../../script.js"></script>
</body>
</html>
