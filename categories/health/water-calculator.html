<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Water Intake Tracker — LamaStudio Health Hub</title>
<meta name="description" content="Calculate your personalized daily hydration goal based on body weight, activity level, and climate.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
  .calc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .form-control { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .form-control:focus { outline: none; border-color: var(--category-color); }
  .calc-btn { width: 100%; background: var(--category-color); color: #fff; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
  .calc-btn:hover { opacity: 0.85; }
  .result-box { margin-top: 2rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-align: center; display: none; }
  .result-value { font-size: 2.25rem; font-weight: 700; color: var(--category-color); font-family: 'JetBrains Mono', monospace; margin: 0.5rem 0; }
</style>
</head>
<body style="--category-color: var(--c-health, #e74c3c);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Water Tracker</small></span></a>
    </div>
  </div>
</header>

<main class="tool-container">
  <div class="calc-card">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.75rem; margin-top: 0.4rem; margin-bottom: 1.5rem;">Daily Water Intake Tracker</h1>
    
    <div class="form-group">
      <label for="weight">Body Weight (kg)</label>
      <input type="number" id="weight" class="form-control" placeholder="e.g., 70" required>
    </div>

    <div class="form-group">
      <label for="activity">Daily Exercise Time (Minutes)</label>
      <input type="number" id="activity" class="form-control" placeholder="e.g., 30" value="30">
    </div>

    <div class="form-group">
      <label for="climate">Climate / Weather Condition</label>
      <select id="climate" class="form-control">
        <option value="normal">Normal / Temperate</option>
        <option value="hot">Hot / Humid (+20% requirement)</option>
      </select>
    </div>

    <button type="button" class="calc-btn" onclick="calculateWater()">Calculate Water Goal</button>

    <div class="result-box" id="resultBox">
      <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Recommended Daily Hydration</span>
      <div class="result-value" id="waterOutput">0.0 Liters</div>
      <p id="waterCups" style="color: var(--text-muted); font-size: 0.9rem; margin: 0;"></p>
    </div>
  </div>
</main>

<script>
function calculateWater() {
  const weight = parseFloat(document.getElementById('weight').value);
  const activity = parseFloat(document.getElementById('activity').value) || 0;
  const climate = document.getElementById('climate').value;

  if (!weight || weight <= 0) {
    alert('Please enter a valid body weight.');
    return;
  }

  // Base formula: 35ml per kg of body weight
  let baseMl = weight * 35;

  // Add 12ml for every 10 mins of exercise
  let activityMl = (activity / 10) * 12;

  let totalMl = baseMl + activityMl;

  if (climate === 'hot') {
    totalMl *= 1.2;
  }

  const totalLiters = (totalMl / 1000).toFixed(2);
  const glasses = Math.round(totalMl / 250); // Assuming 250ml per glass

  document.getElementById('waterOutput').innerText = totalLiters + " Liters";
  document.getElementById('waterCups').innerText = `Approximately ${glasses} glasses (250ml each) per day.`;
  document.getElementById('resultBox').style.display = 'block';
}
</script>
<script src="../../script.js"></script>
</body>
</html>
