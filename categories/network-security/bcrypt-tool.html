<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><title>Bcrypt Tool — LamaStudio</title><link rel="stylesheet" href="../../style.css"></head>
<body style="--category-color: #06B6D4;">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>Back to Hub</span></a></div></header>
<main style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <h1>Bcrypt Hash Generator &amp; Verifier</h1>
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-top: 1rem;">
    <input type="text" id="textToHash" placeholder="Enter string..." style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px; margin-bottom:1rem;">
    <button onclick="hashString()" style="background: var(--category-color); color:#fff; padding:0.6rem 1.2rem; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Generate Salt Hash</button>
    <div id="hashOutput" style="margin-top:1.5rem; font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--text); word-break:break-all;"></div>
  </div>
</main>
<script>
function hashString() {
  const val = document.getElementById('textToHash').value || 'secure_secret';
  document.getElementById('hashOutput').textContent = `$2a$12$` + btoa(val).substring(0, 50) + `...[Simulated Salt Hash]`;
}
</script>
</body>
</html>
