<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><title>CORS Tester — LamaStudio</title><link rel="stylesheet" href="../../style.css"></head>
<body style="--category-color: #06B6D4;">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>Back to Hub</span></a></div></header>
<main style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <h1>CORS Policy Tester &amp; Validator</h1>
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-top: 1rem;">
    <p style="color:var(--text-muted); margin-bottom:1rem;">Check cross-origin resource sharing response headers for security compliance.</p>
    <input type="text" value="https://api.lamastudio.pk/v1/data" style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px; margin-bottom:1rem;">
    <div style="background:var(--background); padding:1rem; border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--text);">
      Access-Control-Allow-Origin: *<br>
      Access-Control-Allow-Methods: GET, POST, OPTIONS<br>
      Access-Control-Allow-Headers: Content-Type, Authorization
    </div>
  </div>
</main>
</body>
</html>
