<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><title>DNS Record Lookup — LamaStudio</title><link rel="stylesheet" href="../../style.css"></head>
<body style="--category-color: #06B6D4;">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>Back to Hub</span></a></div></header>
<main style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <h1>DNS Record Lookup (Dig Tool)</h1>
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-top: 1rem;">
    <input type="text" id="dnsTarget" value="lamastudio.pk" style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px; margin-bottom:1rem;">
    <button onclick="lookupDNS()" style="background: var(--category-color); color:#fff; padding:0.6rem 1.2rem; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Query DNS</button>
    <pre id="dnsOutput" style="margin-top:1.5rem; background:var(--background); padding:1rem; border-radius:6px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:0.85rem; overflow-x:auto;"></pre>
  </div>
</main>
<script>
function lookupDNS() {
  const t = document.getElementById('dnsTarget').value;
  document.getElementById('dnsOutput').textContent = `; <<>> LamaStudio Dig v1.0 <<>> ${t} A, MX, TXT\n;; ANSWER SECTION:\n${t}.\t300\tIN\tA\t192.0.2.45\n${t}.\t300\tIN\tMX\t10 mail.${t}.\n${t}.\t300\tIN\tTXT\t"v=spf1 include:_spf.${t} ~all"`;
}
</script>
</body>
</html>
