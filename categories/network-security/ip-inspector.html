<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My IP & Geolocation Inspector — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: #06B6D4;">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>Back to Security Hub</span></a></div></header>
<main style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <h1>My IP &amp; Geolocation Inspector</h1>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Inspect simulated network attributes and connection headers.</p>
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px;">
    <button onclick="inspectIP()" style="background: var(--category-color); color:#fff; padding:0.6rem 1.2rem; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Inspect Connection</button>
    <div id="ipResult" style="margin-top:1.5rem; font-family:'JetBrains Mono', monospace; font-size:0.9rem; color:var(--text);"></div>
  </div>
</main>
<script>
function inspectIP() {
  document.getElementById('ipResult').innerHTML = `
    <p><strong>Public IPv4:</strong> 103.255.4.192 (Simulated)</p>
    <p><strong>ISP:</strong> PakTelecom Broadband Gateway</p>
    <p><strong>Location:</strong> Lahore / DG Khan, Pakistan</p>
    <p><strong>Protocol:</strong> HTTP/3 Secure Transport</p>
  `;
}
</script>
</body>
</html>
