<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><title>Password Strength Tester — LamaStudio</title><link rel="stylesheet" href="../../style.css"></head>
<body style="--category-color: #06B6D4;">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>Back to Hub</span></a></div></header>
<main style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <h1>Password Strength &amp; Entropy Tester</h1>
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-top: 1rem;">
    <input type="password" id="pwdInput" placeholder="Enter password to test..." oninput="evalPwd()" style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px; margin-bottom:1rem;">
    <div id="pwdScore" style="font-weight:700; color:var(--category-color); margin-bottom:0.5rem;">Score: 0 / 100</div>
    <div id="pwdDetails" style="font-size:0.9rem; color:var(--text-muted);"></div>
  </div>
</main>
<script>
function evalPwd() {
  const p = document.getElementById('pwdInput').value;
  let score = Math.min(100, p.length * 8 + (/[A-Z]/.test(p)?15:0) + (/[0-9]/.test(p)?15:0) + (/[\W]/.test(p)?20:0));
  document.getElementById('pwdScore').textContent = `Score: ${score} / 100`;
  document.getElementById('pwdDetails').innerHTML = `Entropy Bits: ~${Math.round(p.length * 4.5)} bits<br>Estimated Brute-Force Time: ${score > 75 ? 'Centuries' : score > 40 ? 'Hours / Days' : 'Instant'}`;
}
</script>
</body>
</html>
