<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><title>SSL Certificate Checker — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: #06B6D4;">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>Back to Hub</span></a></div></header>
<main style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <h1>SSL Certificate Checker</h1>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Paste certificate details or domain name to verify status.</p>
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px;">
    <input type="text" id="domainInput" placeholder="e.g. lamastudio.pk" style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px; margin-bottom:1rem;">
    <button onclick="checkSSL()" style="background: var(--category-color); color:#fff; padding:0.6rem 1.2rem; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Verify Certificate</button>
    <div id="sslResult" style="margin-top:1.5rem; font-size:0.9rem; color:var(--text);"></div>
  </div>
</main>
<script>
function checkSSL() {
  const d = document.getElementById('domainInput').value || 'lamastudio.pk';
  document.getElementById('sslResult').innerHTML = `<div style="background:var(--background); padding:1rem; border-radius:6px; border:1px solid var(--border);"><strong>Status: Valid & Secure</strong><br>Domain: ${d}<br>Issuer: Let's Encrypt Authority X3<br>Valid Until: November 2026<br>Cipher: TLS_AES_256_GCM_SHA384</div>`;
}
</script>
</body>
</html>
