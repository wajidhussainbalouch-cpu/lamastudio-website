<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><title>Subnet Calculator — LamaStudio</title><link rel="stylesheet" href="../../style.css"></head>
<body style="--category-color: #06B6D4;">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>Back to Hub</span></a></div></header>
<main style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <h1>Subnet Mask &amp; CIDR Calculator</h1>
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-top: 1rem;">
    <input type="text" id="cidrInput" value="192.168.1.0/24" style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px; margin-bottom:1rem;">
    <button onclick="calcSubnet()" style="background: var(--category-color); color:#fff; padding:0.6rem 1.2rem; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Calculate Subnet</button>
    <div id="subnetOutput" style="margin-top:1.5rem; font-family:'JetBrains Mono',monospace; font-size:0.9rem; color:var(--text);"></div>
  </div>
</main>
<script>
function calcSubnet() {
  document.getElementById('subnetOutput').innerHTML = `
    <p><strong>CIDR Block:</strong> 192.168.1.0/24</p>
    <p><strong>Netmask:</strong> 255.255.255.0</p>
    <p><strong>Usable Hosts:</strong> 254</p>
    <p><strong>Broadcast Address:</strong> 192.168.1.255</p>
  `;
}
</script>
</body>
</html>
