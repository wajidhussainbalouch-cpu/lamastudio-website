<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><title>UUID & Token Generator — LamaStudio</title><link rel="stylesheet" href="../../style.css"></head>
<body style="--category-color: #06B6D4;">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>Back to Hub</span></a></div></header>
<main style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <h1>Secure UUID v4 &amp; Token Generator</h1>
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-top: 1rem;">
    <button onclick="generateUUID()" style="background: var(--category-color); color:#fff; padding:0.6rem 1.2rem; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Generate New UUID</button>
    <div id="uuidOut" style="margin-top:1.5rem; font-family:'JetBrains Mono',monospace; font-size:1.1rem; color:var(--category-color);">Click button above</div>
  </div>
</main>
<script>
function generateUUID() {
  const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
  document.getElementById('uuidOut').textContent = uuid;
}
generateUUID();
</script>
</body>
</html>
