<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breaking News Feed Aggregator — LamaStudio</title>
<meta name="description" content="Simulate real-time feed compilation across technology, markets, and global geopolitics instantly.">
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-news);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>News Tool</small></span></a></div></header>
<main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem;">
    <h1>📡 Breaking News Feed Aggregator</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Select category to compile breaking wire reports.</p>
    <div style="margin-bottom: 1rem;"><label style="display:block; font-weight:600; margin-bottom:0.5rem;">Category</label><select id="cat" style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:8px;"><option value="tech">Technology & AI</option><option value="markets">Financial Markets</option></select></div>
    <button onclick="run()" style="background:var(--category-color); color:#fff; border:none; padding:0.75rem 1.5rem; font-weight:700; border-radius:8px; cursor:pointer;">Fetch Headlines</button>
    <div id="out" style="margin-top:1.5rem; background:var(--background); border:1px solid var(--border); padding:1rem; border-radius:8px; font-family:monospace;">Ready...</div>
  </div>
  <div style="margin:2rem 0; padding:1rem; background:var(--surface); border:1px dashed var(--border); text-align:center; font-size:0.8rem; color:var(--text-muted);">ADVERTISEMENT UNIT (Google AdSense)</div>
</main>
<script>
function run() {
  document.getElementById('out').innerText = "[LIVE FEED COMPILED]\n- Semiconductor output increases by 15% globally.\n- Major regulatory frameworks ratified for global markets.";
}
</script>
</body>
</html>
