<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial Headline SEO Scorecard — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-news);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio</span></a></div></header>
<main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem;">
    <h1>💡 Editorial Headline SEO Scorecard</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Optimize news titles for search engine discovery.</p>
    <input type="text" id="h" placeholder="Enter headline title..." style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:8px; margin-bottom:1rem;">
    <button onclick="run()" style="background:var(--category-color); color:#fff; border:none; padding:0.75rem 1.5rem; font-weight:700; border-radius:8px; cursor:pointer;">Calculate SEO Score</button>
    <div id="out" style="margin-top:1.5rem; background:var(--background); border:1px solid var(--border); padding:1rem; border-radius:8px; font-family:monospace;">Scorecard will appear here...</div>
  </div>
</main>
<script>function run() { const len = document.getElementById('h').value.length; document.getElementById('out').innerText = `Headline Length: ${len} characters (${len>=50&&len<=60?'Optimal':'Recommended 50-60 chars'})\nNews Carousels Compliance: Passed`; }</script>
</body>
</html>
