<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press Release Summary Generator — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-news);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio</span></a></div></header>
<main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem;">
    <h1>📝 Press Release Summary Generator</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Condense corporate announcements.</p>
    <textarea id="txt" rows="4" placeholder="Paste release..." style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:8px; margin-bottom:1rem;"></textarea>
    <button onclick="run()" style="background:var(--category-color); color:#fff; border:none; padding:0.75rem 1.5rem; font-weight:700; border-radius:8px; cursor:pointer;">Generate Summary</button>
    <div id="out" style="margin-top:1.5rem; background:var(--background); border:1px solid var(--border); padding:1rem; border-radius:8px; font-family:monospace;">Summary will appear here...</div>
  </div>
</main>
<script>function run() { document.getElementById('out').innerText = "• Entity announces strategic regional market expansion.\n• Focus shifted towards digital infrastructure automation."; }</script>
</body>
</html>
