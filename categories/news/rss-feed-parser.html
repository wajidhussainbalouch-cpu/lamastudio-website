<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live RSS Feed Parser &amp; Reader — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-news);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio</span></a></div></header>
<main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem;">
    <h1>📑 Live RSS Feed Parser &amp; Reader</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Ingest custom XML RSS feeds.</p>
    <input type="text" id="url" value="https://news.google.com/rss" style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:8px; margin-bottom:1rem;">
    <button onclick="run()" style="background:var(--category-color); color:#fff; border:none; padding:0.75rem 1.5rem; font-weight:700; border-radius:8px; cursor:pointer;">Parse Feed</button>
    <div id="out" style="margin-top:1.5rem; background:var(--background); border:1px solid var(--border); padding:1rem; border-radius:8px; font-family:monospace;">Feed results will appear here...</div>
  </div>
</main>
<script>function run() { document.getElementById('out').innerText = "Parsed XML Feed successfully.\n1. Global Markets Briefing (10m ago)\n2. AI & Technology Roundup (25m ago)"; }</script>
</body>
</html>
