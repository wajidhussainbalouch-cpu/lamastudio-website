<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Timezone News Briefing Sync — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: var(--c-news);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio</span></a></div></header>
<main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem;">
    <h1>🌍 Global Timezone News Briefing Sync</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Coordinate international press releases.</p>
    <select id="city" style="width:100%; padding:0.75rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:8px; margin-bottom:1rem;"><option value="London">London (GMT)</option><option value="New York">New York (EST)</option><option value="Islamabad">Islamabad (PKT)</option></select>
    <button onclick="run()" style="background:var(--category-color); color:#fff; border:none; padding:0.75rem 1.5rem; font-weight:700; border-radius:8px; cursor:pointer;">Sync Timezone</button>
    <div id="out" style="margin-top:1.5rem; background:var(--background); border:1px solid var(--border); padding:1rem; border-radius:8px; font-family:monospace;">Time data will appear here...</div>
  </div>
</main>
<script>function run() { document.getElementById('out').innerText = "Current Local Time: " + new Date().toLocaleTimeString() + "\nBriefing window is active."; }</script>
</body>
</html>
