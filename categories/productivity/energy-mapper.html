<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Level Rhythm Mapper — LamaStudio</title>
<meta name="description" content="Identify your peak circadian rhythm hours for high-focus tasks vs routine administrative work.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://lamastudio.com/categories/productivity/energy-mapper.html">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text); margin: 0; padding: 0; }
  .app-container { max-width: 760px; margin: 3rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .nav-back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--category-color); font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .energy-block { display: flex; justify-content: space-between; align-items: center; background: var(--background); border: 1px solid var(--border); padding: 1rem; border-radius: 10px; margin-bottom: 0.75rem; }
  .energy-block select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem; border-radius: 6px; }
  .adsense-slot { margin: 2rem 0; padding: 1rem; background: var(--background); border: 1px dashed var(--border); border-radius: 10px; text-align: center; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body style="--category-color: #10B981;">
<main class="app-container">
  <a href="index.html" class="nav-back">← Back to Productivity Hub</a>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 style="font-size: 1.75rem; margin: 0;">🔋 Energy Level Rhythm Mapper</h1>
    <button id="themeToggle" style="background:none; border:1px solid var(--border); padding:0.5rem 0.75rem; border-radius:8px; cursor:pointer; color:var(--text)">🌓 Theme</button>
  </div>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Map your daily energy cycles to schedule high-focus tasks during peak hours.</p>

  <div style="margin-top: 2rem;">
    <div class="energy-block"><span>08:00 AM - 10:00 AM</span><select><option>⚡ Peak Focus</option><option>Moderate Energy</option><option>Low Energy / Groggy</option></select></div>
    <div class="energy-block"><span>10:00 AM - 12:00 PM</span><select><option>⚡ Peak Focus</option><option selected>Moderate Energy</option><option>Low Energy / Groggy</option></select></div>
    <div class="energy-block"><span>01:00 PM - 03:00 PM</span><select><option>⚡ Peak Focus</option><option>Moderate Energy</option><option selected>Low Energy / Post-Lunch Dip</option></select></div>
    <div class="energy-block"><span>03:00 PM - 06:00 PM</span><select><option>⚡ Peak Focus</option><option selected>Moderate Energy</option><option>Low Energy / Groggy</option></select></div>
  </div>

  <div class="adsense-slot" role="region" aria-label="Advertisement">Sponsored Ad Slot (Energy Mapper Footer)</div>
</main>
<script>
  document.getElementById('themeToggle').onclick = () => {
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
</script>
</body>
</html>
