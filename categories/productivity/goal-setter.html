<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART Goal Setter & Breakdown — LamaStudio</title>
<meta name="description" content="Deconstruct massive projects into actionable, measurable quarterly milestones using the SMART framework.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://lamastudio.com/categories/productivity/goal-setter.html">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text); margin: 0; padding: 0; }
  .app-container { max-width: 760px; margin: 3rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .nav-back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--category-color); font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .goal-field { margin-bottom: 1.25rem; }
  .goal-field label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; color: var(--category-color); }
  .goal-field textarea, .goal-field input { width: 100%; background: var(--background); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
  .adsense-slot { margin: 2rem 0; padding: 1rem; background: var(--background); border: 1px dashed var(--border); border-radius: 10px; text-align: center; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body style="--category-color: #10B981;">
<main class="app-container">
  <a href="index.html" class="nav-back">← Back to Productivity Hub</a>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 style="font-size: 1.75rem; margin: 0;">🎯 SMART Goal Setter &amp; Breakdown</h1>
    <button id="themeToggle" style="background:none; border:1px solid var(--border); padding:0.5rem 0.75rem; border-radius:8px; cursor:pointer; color:var(--text)">🌓 Theme</button>
  </div>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Deconstruct massive projects into actionable, measurable weekly milestones.</p>

  <div style="margin-top: 2rem;">
    <div class="goal-field"><label>Specific (What exactly do you want to accomplish?)</label><textarea id="g1" rows="2" placeholder="e.g., Build and launch a new SaaS productivity web app..."></textarea></div>
    <div class="goal-field"><label>Measurable (How will you track progress?)</label><textarea id="g2" rows="2" placeholder="e.g., Reach 1,000 active users within 30 days of release..."></textarea></div>
    <div class="goal-field"><label>Achievable (What resources are required?)</label><textarea id="g3" rows="2" placeholder="e.g., Allocate 2 hours daily to frontend architecture..."></textarea></div>
    <div class="goal-field"><label>Relevant (Why does this matter right now?)</label><textarea id="g4" rows="2" placeholder="e.g., Aligns with quarterly career growth milestones..."></textarea></div>
    <div class="goal-field"><label>Time-bound (Target deadline)</label><input type="date" id="g5"></div>
  </div>

  <div class="adsense-slot" role="region" aria-label="Advertisement">Sponsored Ad Slot (Goal Setter Footer)</div>
</main>
<script>
  ['g1','g2','g3','g4','g5'].forEach(id => {
    const el = document.getElementById(id);
    el.value = localStorage.getItem('lamastudio_' + id) || '';
    el.oninput = () => localStorage.setItem('lamastudio_' + id, el.value);
  });
  document.getElementById('themeToggle').onclick = () => {
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
</script>
</body>
</html>
