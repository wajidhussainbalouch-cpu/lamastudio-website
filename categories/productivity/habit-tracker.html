<title>Daily Habit Tracker — LamaStudio</title>

</head>
<body style="--category-color: #10B981;">
<main style="max-width: 700px; margin: 4rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;">

  <h1 style="margin-top: 1rem;">🔄 Daily Habit Streak Tracker</h1>

    <label style="background: var(--background); padding: 1rem; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; gap: 1rem;"><input type="checkbox" style="width: 20px; height: 20px;"> <span>Deep Work Block (90 Mins) — 🔥 5 Day Streak</span></label>
    <label style="background: var(--background); padding: 1rem; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; gap: 1rem;"><input type="checkbox" style="width: 20px; height: 20px;"> <span>Evening Physical Stretching — 🔥 8 Day Streak</span></label>
