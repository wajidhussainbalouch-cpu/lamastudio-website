<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Cost & Time Calculator — LamaStudio</title>
<meta name="description" content="Calculate real-time financial overhead of corporate team meetings based on attendee hourly rates and duration.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://lamastudio.com/categories/productivity/meeting-cost-calculator.html">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text); margin: 0; padding: 0; }
  .app-container { max-width: 640px; margin: 3rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .nav-back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--category-color); font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .calc-field { margin-bottom: 1.25rem; }
  .calc-field label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; color: var(--text); }
  .calc-field input { width: 100%; background: var(--background); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
  .result-box { background: var(--background); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; text-align: center; margin-top: 1.5rem; }
  .result-value { font-size: 3rem; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--category-color); margin-top: 0.5rem; }
  .adsense-slot { margin: 2rem 0; padding: 1rem; background: var(--background); border: 1px dashed var(--border); border-radius: 10px; text-align: center; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body style="--category-color: #10B981;">
<main class="app-container">
  <a href="index.html" class="nav-back">← Back to Productivity Hub</a>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 style="font-size: 1.75rem; margin: 0;">⚡ Meeting Cost Calculator</h1>
    <button id="themeToggle" style="background:none; border:1px solid var(--border); padding:0.5rem 0.75rem; border-radius:8px; cursor:pointer; color:var(--text)">🌓 Theme</button>
  </div>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Calculate corporate team meeting overhead based on attendee size and hourly rates.</p>

  <div style="margin-top: 2rem;">
    <div class="calc-field"><label>Number of Attendees</label><input type="number" id="att" value="5" min="1"></div>
    <div class="calc-field"><label>Average Hourly Rate ($)</label><input type="number" id="rate" value="50" min="0"></div>
    <div class="calc-field"><label>Meeting Duration (Minutes)</label><input type="number" id="mins" value="60" min="1"></div>
  </div>

  <div class="result-box">
    <div style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Total Estimated Financial Overhead</div>
    <div class="result-value" id="costResult">$250.00</div>
  </div>

  <div class="adsense-slot" role="region" aria-label="Advertisement">Sponsored Ad Slot (Calculator Footer)</div>
</main>
<script>
  const att = document.getElementById('att');
  const rate = document.getElementById('rate');
  const mins = document.getElementById('mins');
  const costResult = document.getElementById('costResult');

  function calculate() {
    const a = parseFloat(att.value) || 0;
    const r = parseFloat(rate.value) || 0;
    const m = parseFloat(mins.value) || 0;
    const total = (a * r * (m / 60)).toFixed(2);
    costResult.textContent = `$${total}`;
  }

  [att, rate, mins].forEach(el => el.oninput = calculate);
  document.getElementById('themeToggle').onclick = () => {
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
  calculate();
</script>
</body>
</html>
