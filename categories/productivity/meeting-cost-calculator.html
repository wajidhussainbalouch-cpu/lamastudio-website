<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Cost Calculator — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: #10B981;">
<main style="max-width: 600px; margin: 4rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;">
  <a href="index.html" style="color: var(--category-color); text-decoration: none; font-weight: 600;">← Back to Productivity</a>
  <h1 style="margin-top: 1rem;">⚡ Meeting Cost Calculator</h1>
  <label style="display:block; margin: 1rem 0;">Attendees: <input id="att" type="number" value="5" style="width:100%; padding:0.5rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px;"></label>
  <label style="display:block; margin: 1rem 0;">Avg Hourly Rate ($): <input id="rate" type="number" value="50" style="width:100%; padding:0.5rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px;"></label>
  <label style="display:block; margin: 1rem 0;">Duration (Mins): <input id="mins" type="number" value="60" style="width:100%; padding:0.5rem; background:var(--background); border:1px solid var(--border); color:var(--text); border-radius:6px;"></label>
  <div style="font-size: 1.5rem; font-weight: 700; color: var(--category-color); margin-top: 1.5rem;">Estimated Cost: $250.00</div>
</main>
</body>
</html>
