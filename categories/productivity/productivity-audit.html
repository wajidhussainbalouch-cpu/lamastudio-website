<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Productivity Audit Matrix — LamaStudio</title>
<meta name="description" content="Review completed tasks, assess friction bottlenecks, and score your weekly performance with our interactive audit matrix.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://lamastudio.com/categories/productivity/productivity-audit.html">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text); margin: 0; padding: 0; }
  .app-container { max-width: 760px; margin: 3rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .nav-back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--category-color); font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .audit-row { background: var(--background); border: 1px solid var(--border); padding: 1.25rem; border-radius: 12px; margin-bottom: 1rem; }
  .audit-row label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
  .audit-row select { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.6rem; border-radius: 8px; font-family: inherit; }
  .adsense-slot { margin: 2rem 0; padding: 1rem; background: var(--background); border: 1px dashed var(--border); border-radius: 10px; text-align: center; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body style="--category-color: #10B981;">
<main class="app-container">
  <a href="index.html" class="nav-back">← Back to Productivity Hub</a>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 style="font-size: 1.75rem; margin: 0;">📊 Weekly Productivity Audit Matrix</h1>
    <button id="themeToggle" style="background:none; border:1px solid var(--border); padding:0.5rem 0.75rem; border-radius:8px; cursor:pointer; color:var(--text)">🌓 Theme</button>
  </div>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Review completed tasks, assess friction bottlenecks, and score weekly performance.</p>

  <div style="margin-top: 2rem;">
    <div class="audit-row">
      <label>1. Deep Work Consistency Score (1 to 10)</label>
      <select id="score1"><option>10 - Outstanding</option><option>8 - Good</option><option>6 - Average</option><option>4 - Needs Improvement</option></select>
    </div>
    <div class="audit-row">
      <label>2. Distraction & Notification Resistance</label>
      <select id="score2"><option>High Discipline</option><option>Moderate Discipline</option><option>Frequent Context Switching</option></select>
    </div>
    <div class="audit-row">
      <label>3. Core Project Milestone Delivery</label>
      <select id="score3"><option>Completed Ahead of Schedule</option><option>Completed On Time</option><option>Delayed / Blocked</option></select>
    </div>
  </div>

  <div class="adsense-slot" role="region" aria-label="Advertisement">Sponsored Ad Slot (Audit Footer)</div>
</main>
<script>
  document.getElementById('themeToggle').onclick = () => {
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
</script>
</body>
</html>
