<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Scratchpad — LamaStudio</title>

<body style="--category-color: #10B981;">
<main style="max-width: 700px; margin: 4rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;">

  <h1 style="margin-top: 1rem;">📝 Quick Scratchpad &amp; Auto-Saver</h1>
  <textarea id="pad" style="width: 100%; height: 250px; background: var(--background); border: 1px solid var(--border); color: var(--text); padding: 1rem; border-radius: 8px; margin-top: 1rem;" placeholder="Type notes here..."></textarea>
