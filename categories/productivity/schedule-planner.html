<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Blocking Schedule Planner — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body style="--category-color: #10B981;">
<main style="max-width: 700px; margin: 4rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;">
  <a href="index.html" style="color: var(--category-color); text-decoration: none; font-weight: 600;">← Back to Productivity</a>
  <h1 style="margin-top: 1rem;">📅 Time Blocking Schedule Planner</h1>
  <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
    <div style="padding: 0.75rem; background: var(--background); border-left: 4px solid var(--category-color); border-radius: 6px;"><strong>08:00 - 09:00</strong> — Morning Routine & Strategy Planning</div>
    <div style="padding: 0.75rem; background: var(--background); border-left: 4px solid var(--category-color); border-radius: 6px;"><strong>09:00 - 11:30</strong> — Deep Work Sprint (Code / Core Projects)</div>
    <div style="padding: 0.75rem; background: var(--background); border-left: 4px solid var(--border); border-radius: 6px;"><strong>11:30 - 12:30</strong> — Email triage and Team Communications</div>
  </div>
