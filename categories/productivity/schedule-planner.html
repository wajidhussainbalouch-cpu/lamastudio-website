<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Blocking Schedule Planner — LamaStudio</title>
<meta name="description" content="Allocate dedicated hours to specific projects with our time-blocking planner. Eliminate multitasking fatigue and structure your day effectively.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://lamastudio.com/categories/productivity/schedule-planner.html">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text); margin: 0; padding: 0; }
  .app-container { max-width: 760px; margin: 3rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .nav-back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--category-color); font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .slot-row { display: flex; gap: 1rem; align-items: center; background: var(--background); border: 1px solid var(--border); padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 0.75rem; }
  .slot-row time { font-weight: 700; color: var(--category-color); min-width: 110px; font-size: 0.9rem; }
  .slot-row input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 0.95rem; outline: none; }
  .adsense-slot { margin: 2rem 0; padding: 1rem; background: var(--background); border: 1px dashed var(--border); border-radius: 10px; text-align: center; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body style="--category-color: #10B981;">
<main class="app-container">
  <a href="index.html" class="nav-back">← Back to Productivity Hub</a>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 style="font-size: 1.75rem; margin: 0;">📅 Time Blocking Schedule Planner</h1>
    <button id="themeToggle" style="background:none; border:1px solid var(--border); padding:0.5rem 0.75rem; border-radius:8px; cursor:pointer; color:var(--text)">🌓 Theme</button>
  </div>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Plan your hours in blocks to maintain extreme mental clarity.</p>

  <div id="scheduleContainer" style="margin-top: 2rem;"></div>

  <div class="adsense-slot" role="region" aria-label="Advertisement">Sponsored Ad Slot (Schedule Footer)</div>
</main>
<script>
  const hours = ["08:00 - 09:00", "09:00 - 11:30", "11:30 - 12:30", "12:30 - 13:30", "13:30 - 16:00", "16:00 - 17:30", "17:30 - 19:00"];
  let schedule = JSON.parse(localStorage.getItem('lamastudio_schedule')) || {
    "08:00 - 09:00": "Morning Routine & Strategy Planning",
    "09:00 - 11:30": "Deep Work Sprint (Code / Core Projects)",
    "11:30 - 12:30": "Email triage and Team Communications",
    "12:30 - 13:30": "Lunch & Rest Break",
    "13:30 - 16:00": "Client Meetings & Operations",
    "16:00 - 17:30": "Documentation & Review",
    "17:30 - 19:00": "Personal Growth & Shutdown Routine"
  };

  const container = document.getElementById('scheduleContainer');
  hours.forEach(h => {
    const div = document.createElement('div');
    div.className = 'slot-row';
    div.innerHTML = `<time>${h}</time><input type="text" value="${schedule[h] || ''}" data-hour="${h}">`;
    container.appendChild(div);
  });

  container.querySelectorAll('input').forEach(inp => {
    inp.oninput = (e) => {
      schedule[e.target.getAttribute('data-hour')] = e.target.value;
      localStorage.setItem('lamastudio_schedule', JSON.stringify(schedule));
    };
  });

  document.getElementById('themeToggle').onclick = () => {
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
</script>
</body>
</html>
