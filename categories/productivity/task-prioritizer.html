<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eisenhower Task Prioritizer — LamaStudio</title>
<link rel="stylesheet" href="../../style.css">
<style>
  .matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
  .quadrant { background: var(--background); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; min-height: 180px; }
  .quadrant h3 { font-size: 0.95rem; color: var(--category-color); margin-bottom: 0.75rem; }
  input { width: 100%; padding: 0.5rem; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; margin-bottom: 0.5rem; }
</style>
</head>
<body style="--category-color: #10B981;">
<main style="max-width: 800px; margin: 4rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;">
  <a href="index.html" style="color: var(--category-color); text-decoration: none; font-weight: 600;">← Back to Productivity</a>
  <h1 style="margin-top: 1rem;">📋 Eisenhower Task Prioritizer</h1>
  <div class="matrix">
    <div class="quadrant"><h3>🔥 Urgent & Important (Do First)</h3><input placeholder="Add task..." type="text"><ul id="q1"></ul></div>
    <div class="quadrant"><h3>📅 Not Urgent & Important (Schedule)</h3><input placeholder="Add task..." type="text"><ul id="q2"></ul></div>
    <div class="quadrant"><h3>⚡ Urgent & Not Important (Delegate)</h3><input placeholder="Add task..." type="text"><ul id="q3"></ul></div>
    <div class="quadrant"><h3>🗑️ Not Urgent & Not Important (Eliminate)</h3><input placeholder="Add task..." type="text"><ul id="q4"></ul></div>
  </div>
</main>
</body>
</html>
