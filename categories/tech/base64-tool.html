<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Encoder &amp; Decoder — LamaStudio Tech</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 650px; margin: 2rem auto; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .form-group textarea { width: 100%; height: 120px; padding: 0.75rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; resize: vertical; }
  .btn-row { display: flex; gap: 1rem; margin-top: 1rem; }
  .calc-btn { background: var(--category-color); color: #fff; flex: 1; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .calc-btn.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Base64 Tool</small></span></a></div></header>
<main style="padding: 2rem 1rem;">
  <div class="tool-box">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">Base64 Encoder &amp; Decoder</h1>
    <div class="form-group"><label>Input Text / Base64 String</label><textarea id="inputText" placeholder="Enter text here..."></textarea></div>
    <div class="btn-row">
      <button class="calc-btn" onclick="encodeBase64()">Encode to Base64</button>
      <button class="calc-btn secondary" onclick="decodeBase64()">Decode from Base64</button>
    </div>
    <div class="form-group" style="margin-top: 1.5rem;"><label>Result Output</label><textarea id="outputText" readonly placeholder="Output will appear here..."></textarea></div>
  </div>
</main>
<script>
function encodeBase64() {
  try {
    const val = document.getElementById('inputText').value;
    document.getElementById('outputText').value = btoa(unescape(encodeURIComponent(val)));
  } catch(e) {
    document.getElementById('outputText').value = "Error: Invalid string for Base64 encoding.";
  }
}
function decodeBase64() {
  try {
    const val = document.getElementById('inputText').value;
    document.getElementById('outputText').value = decodeURIComponent(escape(atob(val)));
  } catch(e) {
    document.getElementById('outputText').value = "Error: Invalid Base64 input string.";
  }
}
</script>
</body>
</html>
