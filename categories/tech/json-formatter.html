<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter &amp; Validator — LamaStudio Tech</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 650px; margin: 2rem auto; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .form-group textarea { width: 100%; height: 140px; padding: 0.75rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; resize: vertical; }
  .btn-row { display: flex; gap: 1rem; margin-top: 1rem; }
  .calc-btn { background: var(--category-color); color: #fff; flex: 1; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .calc-btn.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>JSON Formatter</small></span></a></div></header>
<main style="padding: 2rem 1rem;">
  <div class="tool-box">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">JSON Formatter &amp; Validator</h1>
    <div class="form-group"><label>Raw JSON Input</label><textarea id="jsonInput" placeholder='{"key": "value"}'></textarea></div>
    <div class="btn-row">
      <button class="calc-btn" onclick="formatJSON()">Beautify JSON</button>
      <button class="calc-btn secondary" onclick="minifyJSON()">Minify JSON</button>
    </div>
    <div class="form-group" style="margin-top: 1.5rem;"><label>Formatted Output / Status</label><textarea id="jsonOutput" readonly placeholder="Output or validation status..."></textarea></div>
  </div>
</main>
<script>
function formatJSON() {
  try {
    const raw = document.getElementById('jsonInput').value;
    const parsed = JSON.parse(raw);
    document.getElementById('jsonOutput').value = JSON.stringify(parsed, null, 2);
  } catch(e) {
    document.getElementById('jsonOutput').value = "JSON Syntax Error: " + e.message;
  }
}
function minifyJSON() {
  try {
    const raw = document.getElementById('jsonInput').value;
    const parsed = JSON.parse(raw);
    document.getElementById('jsonOutput').value = JSON.stringify(parsed);
  } catch(e) {
    document.getElementById('jsonOutput').value = "JSON Syntax Error: " + e.message;
  }
}
</script>
</body>
</html>
