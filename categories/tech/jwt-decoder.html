<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWT Inspector &amp; Decoder — LamaStudio Tech</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 650px; margin: 2rem auto; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .form-group textarea { width: 100%; height: 100px; padding: 0.75rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; resize: vertical; }
  .calc-btn { background: var(--category-color); color: #fff; width: 100%; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
  .result-box { margin-top: 1.25rem; padding: 1rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; white-space: pre-wrap; color: var(--text); }
</style>
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>JWT Decoder</small></span></a></div></header>
<main style="padding: 2rem 1rem;">
  <div class="tool-box">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">JSON Web Token (JWT) Decoder</h1>
    <div class="form-group"><label>Encoded JWT String</label><textarea id="jwtInput" placeholder="Paste eyJhbGciOi..."></textarea></div>
    <button class="calc-btn" onclick="decodeJWT()">Decode Token Parts</button>
    <div class="result-box" id="output">Decoded payload will appear here...</div>
  </div>
</main>
<script>
function decodeJWT() {
  try {
    const token = document.getElementById('jwtInput').value.trim();
    const parts = token.split('.');
    if(parts.length !== 3) throw new Error("Invalid JWT format (must have 3 parts)");
    const header = JSON.parse(atob(parts[0].replace(/-/g, '+').replace(/_/g, '/')));
    const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
    document.getElementById('output').innerHTML = `<strong>HEADER:</strong>\n${JSON.stringify(header, null, 2)}\n\n<strong>PAYLOAD:</strong>\n${JSON.stringify(payload, null, 2)}`;
  } catch(e) {
    document.getElementById('output').innerText = "Error decoding JWT: " + e.message;
  }
}
</script>
</body>
</html>
