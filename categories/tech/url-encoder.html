<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Encoder &amp; Decoder — LamaStudio Tech</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; max-width: 650px; margin: 2rem auto; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .form-group textarea { width: 100%; height: 110px; padding: 0.75rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; resize: vertical; }
  .btn-row { display: flex; gap: 1rem; margin-top: 1rem; }
  .calc-btn { background: var(--category-color); color: #fff; flex: 1; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .calc-btn.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body style="--category-color: var(--c-tech);">
<header class="site-header"><div class="util-row"><a href="index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>URL Tool</small></span></a></div></header>
<main style="padding: 2rem 1rem;">
  <div class="tool-box">
    <span class="eyebrow" style="color: var(--category-color);">Interactive Utility</span>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">URL Encoder &amp; Decoder</h1>
    <div class="form-group"><label>Input String / URL</label><textarea id="inputStr" placeholder="Enter query string or URL..."></textarea></div>
    <div class="btn-row">
      <button class="calc-btn" onclick="encodeURL()">Encode URL</button>
      <button class="calc-btn secondary" onclick="decodeURL()">Decode URL</button>
    </div>
    <div class="form-group" style="margin-top: 1.5rem;"><label>Output Result</label><textarea id="outputStr" readonly placeholder="Result..."></textarea></div>
  </div>
</main>
<script>
function encodeURL() {
  document.getElementById('outputStr').value = encodeURIComponent(document.getElementById('inputStr').value);
}
function decodeURL() {
  try {
    document.getElementById('outputStr').value = decodeURIComponent(document.getElementById('inputStr').value);
  } catch(e) {
    document.getElementById('outputStr').value = "Error: Invalid encoded sequence.";
  }
}
</script>
</body>
</html>
