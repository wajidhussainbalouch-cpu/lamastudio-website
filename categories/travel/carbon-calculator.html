<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Carbon Footprint Calculator — LamaStudio Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; max-width: 700px; margin: 2rem auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
  .input-group { margin-bottom: 1.5rem; }
  .input-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .input-group input { width: 100%; padding: 0.75rem 1rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; }
  .calc-btn { width: 100%; padding: 0.85rem; background: var(--category-color); color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .result-box { margin-top: 2rem; padding: 1.5rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; display: none; }
</style>
</head>
<body style="--category-color: var(--c-travel);">
<header class="site-header"><div class="util-row"><a href="../../index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Travel</small></span></a></div></header>
<main>
  <section class="dashboard" style="display: block; max-width: 800px; margin: 0 auto; padding: 2rem 1rem;">
    <div class="hero-panel" style="border-left: 4px solid var(--category-color); text-align: center; margin-bottom: 1rem;">
      <span class="eyebrow" style="color: var(--category-color);">Travel Tool 05</span>
      <h1>Flight Carbon Footprint Calculator</h1>
      <p class="lede">Estimate environmental emissions per flight route for eco-conscious travel.</p>
    </div>
    <div class="tool-container">
      <div class="input-group">
        <label>Approximate Flight Distance (Kilometers)</label>
        <input type="number" id="distanceKm" placeholder="e.g. 3500">
      </div>
      <button class="calc-btn" onclick="calculateCarbon()">Calculate Emissions</button>
      <div class="result-box" id="carbonResult">
        <h4 style="color: var(--category-color); margin-bottom: 0.5rem;">Estimated Carbon Output</h4>
        <p id="carbonText" style="font-size: 1rem; color: var(--text);"></p>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer"><div class="footer-bottom" style="text-align:center; padding: 2rem;"><span>© 2026 LamaStudio</span></div></footer>
<script>
  function calculateCarbon() {
    const km = parseFloat(document.getElementById('distanceKm').value) || 0;
    const res = document.getElementById('carbonResult');
    const txt = document.getElementById('carbonText');
    const kgCarbon = (km * 0.15).toFixed(1);
    txt.innerHTML = `Your flight generates approximately <strong>${kgCarbon} kg of CO2</strong> per passenger. Consider certified local offset initiatives to balance your environmental footprint.`;
    res.style.display = 'block';
  }
</script>
<script src="../../script.js"></script>
</body>
</html>
