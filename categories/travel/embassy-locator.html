<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Emergency Embassy & Consulate Locator — LamaStudio Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Leaflet CSS for Interactive Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root {
    --bg-light: #f8fafc;
    --surface-light: #ffffff;
    --text-light: #1e293b;
    --text-muted-light: #64748b;
    --border-light: #cbd5e1;

    --bg-dark: #0f172a;
    --surface-dark: #1e293b;
    --text-dark: #f1f5f9;
    --text-muted-dark: #94a3b8;
    --border-dark: #334155;
  }

  [data-theme="light"] {
    --background: var(--bg-light);
    --surface: var(--surface-light);
    --text: var(--text-light);
    --text-muted: var(--text-muted-light);
    --border: var(--border-light);
  }

  [data-theme="dark"] {
    --background: var(--bg-dark);
    --surface: var(--surface-dark);
    --text: var(--text-dark);
    --text-muted: var(--text-muted-dark);
    --border: var(--border-dark);
  }

  body {
    background-color: var(--background);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 0;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
  }

  .util-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
  }

  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    background: #3b82f6;
  }

  .theme-toggle-btn {
    background: var(--background);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 0.85rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
  }

  .tool-container { 
    background: var(--surface); 
    border: 1px solid var(--border); 
    border-radius: 16px; 
    padding: 2.5rem; 
    max-width: 950px; 
    margin: 2rem auto; 
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); 
  }

  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  @media(max-width: 768px) { .input-grid { grid-template-columns: 1fr; } }
  
  .input-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); font-size: 0.9rem; text-transform: uppercase; }
  .input-group select { width: 100%; padding: 0.75rem 1rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; }
  
  .calc-btn { width: 100%; padding: 0.85rem; background: #3b82f6; color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
  .calc-btn:hover { opacity: 0.85; }
  
  .result-box { margin-top: 2rem; padding: 1.5rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; display: none; }
  
  #map {
    width: 100%;
    height: 480px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-top: 1rem;
    z-index: 1;
  }

  .embassy-list {
    margin-top: 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  
  .embassy-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .embassy-card strong { color: #3b82f6; display: block; margin-bottom: 0.25rem; }
</style>
<!-- Script to apply theme immediately before paint to prevent flashing -->
<script>
  (function() {
    const savedTheme = localStorage.getItem('lamastudio_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="util-row">
    <a href="#" class="brand"><span class="brand-mark">L</span><span>LamaStudio<small>Travel</small></span></a>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <button class="theme-toggle-btn" id="themeToggleBtn" type="button">🌓 Toggle Light/Dark</button>
      <a href="#" style="font-size: 0.9rem; font-weight: 600; color: #3b82f6; text-decoration: none;">← Back</a>
    </div>
  </div>
</header>

<main>
  <section style="display: block; max-width: 1000px; margin: 0 auto; padding: 2rem 1rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 2rem; margin-bottom: 0.5rem;">Global Embassy & Consulate Locator</h1>
      <p style="color: var(--text-muted); font-size: 1rem;">Pinpoint all high commissions, embassies, and regional consulates for any country simultaneously on one map.</p>
    </div>
    
    <div class="tool-container">
      <div class="input-grid">
        <!-- Destination Country -->
        <div class="input-group">
          <label for="destCountry">1. Where are you traveling to?</label>
          <select id="destCountry">
            <option value="pk">Pakistan</option>
            <option value="usa">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="uae">United Arab Emirates</option>
            <option value="sa">Saudi Arabia</option>
            <option value="tr">Turkey</option>
            <option value="fr">France</option>
            <option value="ca">Canada</option>
            <option value="au">Australia</option>
          </select>
        </div>

        <!-- Embassy Representation Country -->
        <div class="input-group">
          <label for="embassyCountry">2. Whose embassy do you need?</label>
          <select id="embassyCountry">
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="pk">Pakistan</option>
            <option value="uae">United Arab Emirates</option>
            <option value="ca">Canada</option>
            <option value="au">Australia</option>
            <option value="fr">France</option>
            <option value="cn">China</option>
            <option value="sa">Saudi Arabia</option>
          </select>
        </div>
      </div>
      
      <button class="calc-btn" id="mapSubmitBtn" type="button">Map All Missions on Page</button>
      
      <div class="result-box" id="embassyResult">
        <h4 style="color: #3b82f6; margin-bottom: 0.5rem;">Diplomatic Mission Network Map</h4>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Inspect individual pins on the map or review emergency hotlines below.</p>
        
        <div id="map"></div>
        <div class="embassy-list" id="embassyListContainer"></div>
      </div>
    </div>
  </section>
</main>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  let mapInstance = null;
  let markersLayer = null;

  // Global Directory Matrix covering multi-city branches
  const globalEmbassiesDatabase = {
    "pk_us": {
      center: [30.3, 69.3], zoom: 5,
      missions: [
        { name: "U.S. Embassy - Islamabad", address: "Ramna 5, Diplomatic Enclave, Islamabad", phone: "+92 51 201 4000", lat: 33.7294, lng: 73.1118 },
        { name: "U.S. Consulate General - Karachi", address: "Plot 4-5 Air Force Officers Housing Scheme, Karachi", phone: "+92 21 3527 5000", lat: 24.8471, lng: 67.0326 },
        { name: "U.S. Consulate General - Lahore", address: "Lake Road, Old Campus, Lahore", phone: "+92 42 3603 4000", lat: 31.5600, lng: 74.3220 }
      ]
    },
    "pk_uk": {
      center: [30.3, 69.3], zoom: 5,
      missions: [
        { name: "British High Commission - Islamabad", address: "Ramna 5, Diplomatic Enclave, Islamabad", phone: "+92 51 201 2000", lat: 33.7262, lng: 73.1132 },
        { name: "British Deputy High Commission - Karachi", address: "Shahrah-e-Iran, Clifton, Karachi", phone: "+92 21 3582 7000", lat: 24.8138, lng: 67.0311 }
      ]
    },
    "pk_pk": {
      center: [33.68, 73.04], zoom: 11,
      missions: [
        { name: "Ministry of Foreign Affairs - Islamabad", address: "Constitution Ave, G-5, Islamabad", phone: "+92 51 921 0335", lat: 33.7275, lng: 73.0850 }
      ]
    },
    "usa_us": {
      center: [38.89, -77.04], zoom: 12,
      missions: [{ name: "U.S. Department of State - Washington D.C.", address: "2201 C St NW, Washington, DC", phone: "+1 202 501 4444", lat: 38.8951, lng: -77.0478 }]
    },
    "usa_pk": {
      center: [38.94, -77.06], zoom: 5,
      missions: [
        { name: "Embassy of Pakistan - Washington D.C.", address: "3517 International Ct NW, Washington, DC", phone: "+1 202 243 6500", lat: 38.9431, lng: -77.0625 },
        { name: "Pakistan Consulate General - New York", address: "12 E 65th St, New York, NY", phone: "+1 212 879 5800", lat: 40.7650, lng: -73.9680 }
      ]
    }
  };

  function loadGlobalMappedEmbassies() {
    const dest = document.getElementById('destCountry').value;
    const embassy = document.getElementById('embassyCountry').value;
    const key = `${dest}_${embassy}`;
    
    const record = globalEmbassiesDatabase[key] || {
      center: [33.72, 73.11], zoom: 6,
      missions: [
        { name: "Embassy/Consulate Representation", address: "Capital Diplomatic Core Area", phone: "+1 (800) 555-0199", lat: 33.7294, lng: 73.1118 },
        { name: "Consular Regional Branch", address: "Secondary Commercial District Hub", phone: "+1 (800) 555-0188", lat: 24.8471, lng: 67.0326 }
      ]
    };

    const resultBox = document.getElementById('embassyResult');
    const listContainer = document.getElementById('embassyListContainer');

    resultBox.style.display = 'block';
    listContainer.innerHTML = '';

    setTimeout(() => {
      if (!mapInstance) {
        mapInstance = L.map('map').setView(record.center, record.zoom);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap contributors'
        }).addTo(mapInstance);
      } else {
        mapInstance.setView(record.center, record.zoom);
      }

      mapInstance.invalidateSize();

      if (markersLayer) {
        mapInstance.removeLayer(markersLayer);
      }

      markersLayer = L.layerGroup();

      record.missions.forEach(mission => {
        const marker = L.marker([mission.lat, mission.lng]);
        marker.bindPopup(`<b>${mission.name}</b><br>${mission.address}<br>📞 ${mission.phone}`);
        markersLayer.addLayer(marker);

        const card = document.createElement('div');
        card.className = 'embassy-card';
        card.innerHTML = `
          <strong>📍 ${mission.name}</strong>
          <p style="margin: 0.25rem 0; color: var(--text-muted);">${mission.address}</p>
          <p style="margin: 0.25rem 0;">📞 <strong>Hotline:</strong> ${mission.phone}</p>
          <a href="https://maps.google.com/?q=${mission.lat},${mission.lng}" target="_blank" style="display: inline-block; margin-top: 0.5rem; color: #3b82f6; font-weight: 700; text-decoration: none;">Get Directions ↗</a>
        `;
        listContainer.appendChild(card);
      });

      markersLayer.addTo(mapInstance);
    }, 150);
  }

  // Event Listeners setup
  document.addEventListener('DOMContentLoaded', () => {
    const themeBtn = document.getElementById('themeToggleBtn');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('lamastudio_theme', newTheme);
      });
    }

    const submitBtn = document.getElementById('mapSubmitBtn');
    if (submitBtn) {
      submitBtn.addEventListener('click', loadGlobalMappedEmbassies);
    }
  });
</script>
</body>
</html>
