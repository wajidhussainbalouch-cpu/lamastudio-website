  function locateEmbassy() {
    const home = document.getElementById('homeCountry').value;
    const dest = document.getElementById('destCountry').value;
    const lookupKey = `${home}_${dest}`;
    
    // Fallback if specific pairing isn't explicitly pre-mapped
    const info = embassyDatabase[lookupKey] || {
      name: "Global Consular Emergency Assistance Desk",
      address: "Primary diplomatic mission office in capital destination center.",
      phone: "+1 (888) 407-4747 (Worldwide Emergency Hotline)",
      lat: 33.7294, lng: 73.1118, 
      maps: "https://maps.google.com/?q=Embassy+Consulate+Emergency"
    };

    const resultBox = document.getElementById('embassyResult');
    const titleElem = document.getElementById('embassyTitle');
    const textElem = document.getElementById('embassyText');

    resultBox.style.display = 'block';
    titleElem.textContent = info.name;
    textElem.innerHTML = `
      📍 <strong>Address:</strong> ${info.address}<br>
      📞 <strong>Emergency Hotline:</strong> ${info.phone}<br>
      ⚠️ <em>In case of lost documentation or emergencies, keep a digital backup copy of your passport handy.</em><br><br>
      <a href="${info.maps}" target="_blank" style="display: inline-block; padding: 0.6rem 1.2rem; background: var(--category-color); color: #fff; font-weight: 700; border-radius: 6px; text-decoration: none;">Get Turn-by-Turn Directions ↗</a>
    `;

    setTimeout(() => {
      if (!map) {
        map = L.map('map').setView([info.lat, info.lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        marker = L.marker([info.lat, info.lng]).addTo(map);
        marker.bindPopup(`<b>${info.name}</b><br>${info.address}`).openPopup();
      } else {
        map.setView([info.lat, info.lng], 14);
        marker.setLatLng([info.lat, info.lng]);
        marker.setPopupContent(`<b>${info.name}</b><br>${info.address}`).openPopup();
        map.invalidateSize();
      }
    }, 100);
  }
