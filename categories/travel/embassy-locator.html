<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Embassy & Consulate Locator — LamaStudio Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Leaflet CSS for Interactive Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="../../style.css">
<style>
  .tool-container { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; max-width: 800px; margin: 2rem auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
  .input-group { margin-bottom: 1.5rem; }
  .input-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
  .input-group select { width: 100%; padding: 0.75rem 1rem; background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; }
  .calc-btn { width: 100%; padding: 0.85rem; background: var(--category-color); color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
  .calc-btn:hover { opacity: 0.85; }
  
  .result-box { margin-top: 2rem; padding: 1.5rem; background: var(--background); border: 1px solid var(--border); border-radius: 12px; display: none; }
  .embassy-details { margin-bottom: 1.25rem; font-size: 0.95rem; color: var(--text); line-height: 1.6; }
  .embassy-details strong { color: var(--category-color); }
  
  /* Map Container */
  #map {
    width: 100%;
    height: 350px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-top: 1rem;
    z-index: 1;
  }
</style>
</head>
<body style="--category-color: var(--c-travel);">

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="../../index.html" class="brand"><span class="brand-mark" style="background: var(--category-color);">L</span><span>LamaStudio<small>Travel</small></span></a>
    </div>
    <div class="header-actions">
      <a href="index.html" style="font-size: 0.9rem; font-weight: 600; color: var(--category-color); text-decoration: none;">← Back to Travel Tools</a>
    </div>
  </div>
</header>

<main>
  <section class="dashboard" style="display: block; max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
    <div class="hero-panel" style="border-left: 4px solid var(--category-color); text-align: center; margin-bottom: 1rem;">
      <span class="eyebrow" style="color: var(--category-color);">Travel Tool 10</span>
      <h1>Emergency Embassy &amp; Consulate Locator</h1>
      <p class="lede">Interactive mapper and directory guidance for localized diplomatic and passport emergency support.</p>
    </div>
    
    <div class="tool-container">
      <div class="input-group">
        <label for="country">Select Home Country Representation</label>
        <select id="country">
          <option value="us">United States Embassy (Islamabad, Pakistan)</option>
          <option value="uk">British High Commission (Islamabad, Pakistan)</option>
          <option value="pk">Embassy of Pakistan (Washington D.C., USA)</option>
          <option value="uae">Embassy of UAE (Islamabad, Pakistan)</option>
        </select>
      </div>
      
      <button class="calc-btn" onclick="locateEmbassy()">Locate Embassy &amp; View Map</button>
      
      <div class="result-box" id="embassyResult">
        <h4 style="color: var(--category-color); margin-bottom: 0.5rem;" id="embassyTitle">Diplomatic Mission Details</h4>
        <div class="embassy-details" id="embassyText"></div>
        <div id="map"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" style="margin-top: 4rem;">
  <div class="footer-bottom" style="text-align:center; padding: 2rem;"><span>© 2026 LamaStudio. All rights reserved.</span></div>
</footer>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  let map = null;
  let marker = null;

  // Database of embassies with coordinates
  const embassyData = {
    us: {
      name: "Embassy of the United States - Islamabad",
      address: "RAMNA 4, Diplomatic Enclave, Islamabad, Pakistan",
      phone: "+92 51 201 4000",
      lat: 33.7294,
      lng: 73.1118,
      googleMaps: "https://maps.google.com/?q=US+Embassy+Islamabad"
    },
    uk: {
      name: "British High Commission - Islamabad",
      address: "Ramna 5, Diplomatic Enclave, Islamabad, Pakistan",
      phone: "+92 51 201 2000",
      lat: 33.7262,
      lng: 73.1132,
      googleMaps: "https://maps.google.com/?q=British+High+Commission+Islamabad"
    },
    pk: {
      name: "Embassy of Pakistan - Washington D.C.",
      address: "3517 International Ct NW, Washington, DC 20008, USA",
      phone: "+1 202 243 6500",
      lat: 38.9431,
      lng: -77.0625,
      googleMaps: "https://maps.google.com/?q=Embassy+of+Pakistan+Washington+DC"
    },
    uae: {
      name: "Embassy of the United Arab Emirates - Islamabad",
      address: "Plot No. 1-2, Diplomatic Enclave Sector G-5, Islamabad, Pakistan",
      phone: "+92 51 209 8888",
      lat: 33.7251,
      lng: 73.1105,
      googleMaps: "https://maps.google.com/?q=UAE+Embassy+Islamabad"
    }
  };

  function locateEmbassy() {
    const selectedKey = document.getElementById('country').value;
    const info = embassyData[selectedKey];
    const resultBox = document.getElementById('embassyResult');
    const titleElem = document.getElementById('embassyTitle');
    const textElem = document.getElementById('embassyText');

    if (!info) return;

    // Show result container
    resultBox.style.display = 'block';
    titleElem.textContent = info.name;
    textElem.innerHTML = `
      📍 <strong>Address:</strong> ${info.address}<br>
      📞 <strong>Emergency Hotline:</strong> ${info.phone}<br>
      ⚠️ <em>In case of lost passports or legal crises, keep digital copies of your identification handy and call ahead.</em><br><br>
      <a href="${info.googleMaps}" target="_blank" style="display: inline-block; padding: 0.5rem 1rem; background: var(--category-color); color: #fff; font-weight: 700; border-radius: 6px; text-decoration: none;">Open Directions in Google Maps ↗</a>
    `;

    // Initialize or Update Leaflet Map
    setTimeout(() => {
      if (!map) {
        map = L.map('map').setView([info.lat, info.lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        marker = L.marker([info.lat, info.lng]).addTo(map);
        marker.bindPopup(`<b>${info.name}</b><br>${info.address}`).openPopup();
      } else {
        map.setView([info.lat, info.lng], 15);
        marker.setLatLng([info.lat, info.lng]);
        marker.setPopupContent(`<b>${info.name}</b><br>${info.address}`).openPopup();
        map.invalidateSize();
      }
    }, 100);
  }
</script>
<script src="../../script.js"></script>
</body>
</html>
