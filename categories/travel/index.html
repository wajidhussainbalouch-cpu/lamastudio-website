<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LamaStudio — Travel & Tourism Tools & Flight Booking Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<style>
  /* Layout container for Hero + Right Side News Ticker */
  .hero-news-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 2rem;
    align-items: stretch;
    margin-bottom: 2.5rem;
  }
  @media(max-width: 1024px) {
    .hero-news-layout {
      grid-template-columns: 1fr;
    }
  }

  /* Vertical Right-Side News Ticker Styles */
  .side-news-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
    min-height: 280px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
  }
  .side-news-header {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 1rem;
    color: var(--category-color);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.6rem;
  }
  .vertical-ticker-wrapper {
    position: relative;
    height: 220px;
    overflow: hidden;
  }
  .vertical-ticker-track {
    position: absolute;
    width: 100%;
    animation: scrollVertical 15s linear infinite;
  }
  .vertical-ticker-track:hover {
    animation-play-state: paused;
  }
  .ticker-item {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    margin-bottom: 0.6rem;
    font-size: 0.82rem;
    color: var(--text);
  }
  .ticker-item span {
    display: block;
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 0.2rem;
  }

  @keyframes scrollVertical {
    0% { transform: translateY(0%); }
    100% { transform: translateY(-50%); }
  }

  /* Portal Banner Link Style with Live Ticker Slot */
  .portal-banner {
    background: linear-gradient(135deg, rgba(52, 152, 219, 0.1), rgba(155, 89, 182, 0.1));
    border: 2px dashed var(--category-color);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 2.5rem;
  }
  .portal-content-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1.5rem;
  }
  .portal-banner h3 { font-size: 1.3rem; color: var(--text); margin-bottom: 0.3rem; }
  .portal-banner p { font-size: 0.9rem; color: var(--text-muted); }
  .portal-btn {
    background: var(--category-color);
    color: #fff;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 700;
    text-decoration: none;
    display: inline-block;
    transition: opacity 0.2s;
  }
  .portal-btn:hover { opacity: 0.85; }

  /* Live Rates Ticker Underneath */
  .live-rates-ticker-container {
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    overflow: hidden;
    white-space: nowrap;
  }
  .live-rates-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--category-color);
    background: var(--background);
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .rates-ticker-track-wrapper {
    overflow: hidden;
    width: 100%;
    position: relative;
  }
  .rates-ticker-track {
    display: flex;
    gap: 2rem;
    animation: scrollHorizontal 20s linear infinite;
  }
  .rates-ticker-track:hover {
    animation-play-state: paused;
  }
  .rate-chip {
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    background: var(--background);
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .rate-chip span { color: #2ecc71; font-weight: 700; }

  @keyframes scrollHorizontal {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-50%); }
  }

  /* Category Hub Ad Banner Style */
  .category-ad-banner {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(147, 51, 234, 0.1));
    border: 1px dashed var(--category-color);
    border-radius: 12px;
    padding: 1.75rem;
    text-align: center;
    margin: 3rem 0;
  }
  .category-ad-banner h4 { margin: 0 0 0.5rem 0; color: var(--category-color); font-size: 1.2rem; }
  .category-ad-banner p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }

  /* Tool Card Icon Enhancements */
  .tool-icon {
    font-size: 2rem;
    margin-bottom: 0.75rem;
    display: inline-block;
  }
</style>
</head>
<body style="--category-color: var(--c-travel);">

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
