<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monsoon & Rainfall Flood Risk Map — LamaStudio</title>
<meta name="description" content="Analyze topographic weather radar overlays and flash-flood vulnerability indexes with LamaStudio's flood risk map.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body style="--category-color: var(--c-weather);">
<header class="site-header">
  <div class="util-row"><div style="display: flex; align-items: center; gap: 1rem;"><a href="index.html" class="utility-btn" style="padding: 8px 12px; font-size: 0.8rem;">&larr; Back to LamaSky Engine</a></div></div>
</header>
<main class="dashboard" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  <div class="hero-panel" style="border-left: 4px solid var(--category-color);">
    <span class="hub-badge" style="display: inline-block; background: rgba(56, 189, 248, 0.1); color: var(--category-color); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 12px;">Radar Module</span>
    <h1>Monsoon & Rainfall Flood Risk Map</h1>
    <p class="lede">Topographic weather radar and precipitation accumulation scanner.</p>
  </div>
  <div class="utility-panel" style="background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; margin-top: 25px;">
    <h3>Active Precipitation & Flood Vulnerability Radar</h3>
    <div style="width: 100%; height: 450px; margin-top: 15px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border);">
      <div id="floodMap" style="width: 100%; height: 100%;"></div>
    </div>
  </div>
</main>
<script>
window.onload = function() {
    const map = L.map('floodMap').setView([31.52, 74.35], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
    L.marker([31.52, 74.35]).addTo(map).bindPopup('<b>Lahore Basin</b><br>Precipitation Risk: Low to Moderate').openPopup();
};
</script>
</body>
</html>
