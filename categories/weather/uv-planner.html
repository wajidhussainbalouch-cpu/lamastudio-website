<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UV Index & Sun Protection Planner — LamaStudio</title>
<meta name="description" content="Track hourly ultraviolet radiation intensity curves and safe outdoor exposure windows with LamaStudio's UV planner.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="--category-color: var(--c-weather);">
<header class="site-header">
  <div class="util-row"><div style="display: flex; align-items: center; gap: 1rem;"><a href="index.html" class="utility-btn" style="padding: 8px 12px; font-size: 0.8rem;">&larr; Back to LamaSky Engine</a></div></div>
</header>
<main class="dashboard" style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
  <div class="hero-panel" style="border-left: 4px solid var(--category-color);">
    <span class="hub-badge" style="display: inline-block; background: rgba(56, 189, 248, 0.1); color: var(--category-color); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 12px;">Solar Module</span>
    <h1>UV Index & Sun Protection Planner</h1>
    <p class="lede">Hourly ultraviolet radiation intensity curves and protective advisory windows.</p>
  </div>
  <div class="utility-panel" style="background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; margin-top: 25px;">
    <h3>Peak UV Intensity Curve</h3>
    <div style="background: var(--background); padding: 20px; border-radius: 10px; border: 1px solid var(--border); margin-top: 15px;">
      <canvas id="uvChart" style="width: 100%; height: 260px;"></canvas>
    </div>
  </div>
</main>
<script>
window.onload = function() {
    const ctx = document.getElementById('uvChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['8 AM', '10 AM', '12 PM', '2 PM', '4 PM', '6 PM'],
            datasets: [{ label: 'UV Index Score', data: [1.2, 4.5, 8.1, 7.3, 3.2, 0.5], borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', borderWidth: 2, fill: true, tension: 0.3 }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }, y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } } } }
    });
};
</script>
</body>
</html>
