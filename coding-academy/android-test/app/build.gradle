plugins {
    id 'com.android.application'
}

android {
    namespace 'pk.lamastudio.codingacademy.testing'
    compileSdk 35

    defaultConfig {
        applicationId 'pk.lamastudio.codingacademy.testing'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '0.11.0-test'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
