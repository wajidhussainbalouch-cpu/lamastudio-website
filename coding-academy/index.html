<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10192c">
<meta name="description" content="LAMA Coding Academy: learn coding from zero with guided lessons, a safe browser lab, real projects and career maps.">
<title>LAMA Coding Academy | From zero to developer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#080e1c;--surface:#111b2c;--surface2:#16223a;--border:#293954;--text:#f0f5ff;--muted:#a8b7cf;--accent:#58e1bd;--accent2:#8ba2ff;--radius:17px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 80% -15%,#1f365c 0%,transparent 43%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);line-height:1.5}
a{color:inherit}
button,select,textarea{font:inherit}
button,select{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #80e5cf;outline-offset:3px}
.top{position:sticky;top:0;z-index:15;background:#0a1221ef;border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
.topin{max-width:1360px;margin:auto;padding:11px 22px;display:flex;align-items:center;gap:20px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:11px;font-weight:850;text-decoration:none;min-width:0;letter-spacing:-.3px}
.logo-icon{display:grid;place-items:center;background:linear-gradient(145deg,#49deb9,#83a9ff);color:#10192a;font-family:monospace;width:43px;height:43px;border-radius:13px;font-weight:900;font-size:21px}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.nav button,.nav a{border:0;background:transparent;color:var(--muted);font-size:13px;padding:10px 13px;border-radius:11px;font-weight:700;text-decoration:none;white-space:nowrap}
.nav button:hover,.nav button.active,.nav a:hover{background:var(--surface2);color:var(--text)}
.return{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:9px}
.wrap{max-width:1360px;margin:0 auto;padding:26px 22px 80px}
.kicker{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(29px,4vw,52px);letter-spacing:-1.7px;line-height:1.12;margin:12px 0}
h2{font-size:clamp(21px,2.2vw,29px);letter-spacing:-.65px}
h3{font-size:17px}
p{color:var(--muted)}
.lead{font-size:16px;max-width:680px}
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);gap:20px;margin:8px 0 28px}
.hero-main{background:linear-gradient(125deg,#1b3150 0%,#131d35 75%);border:1px solid #344869;border-radius:24px;padding:clamp(22px,3.5vw,46px)}
.hero-main em{font-style:normal;color:var(--accent)}
.hero-side{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:27px}
.hero-side strong{font-size:37px}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid #526581;border-radius:11px;padding:11px 16px;background:var(--surface2);color:var(--text);font-weight:750;min-height:45px}
.btn.primary{color:#09251f;background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:37px;padding:8px 12px;font-size:13px}
.btn:hover{filter:brightness(1.12)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:21px}
.card p:last-child{margin-bottom:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}
.tag{display:inline-block;padding:5px 9px;border:1px solid #375570;background:#1b3249;color:#7df0d5;font-size:11px;font-weight:800;border-radius:30px;margin-bottom:12px}
.progress{height:10px;border-radius:30px;background:#304159;overflow:hidden;margin:11px 0 7px}
.progress>div{height:100%;border-radius:30px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.goal{width:100%;border:1px solid var(--border);background:#0e192c;color:var(--text);padding:11px;border-radius:11px;margin:6px 0 13px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:25px 0 16px}
.section-head p{margin:0}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.step{min-height:115px;border:1px solid var(--border);border-radius:13px;background:#0f192a;padding:14px;text-align:left}
.step b{display:block;font-size:14px;margin:7px 0}
.step small{color:var(--muted)}
.step.done{border-color:#488a7c;background:#102d2e}
.step.now{border-color:#87a9f1}
.step .num{color:var(--accent);font-family:monospace;font-size:12px}
.learn-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.lesson-list{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;position:sticky;top:83px;max-height:calc(100vh - 100px);overflow:auto}
.lesson-list button{display:block;text-align:left;width:100%;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:10px;padding:12px 11px;font-size:13px;line-height:1.4}
.lesson-list button strong{display:block;color:var(--text);font-size:14px}
.lesson-list button.active{background:#1c3252;border-color:#51759b}
.lesson-list button.done strong:after{content:" ✓";color:var(--accent)}
.lesson-list small{display:block;letter-spacing:.8px;text-transform:uppercase;font-size:10px;color:var(--accent)}
.lesson-body{min-width:0}
.lesson-head{background:linear-gradient(135deg,#1a2c48,#111b2c);border:1px solid var(--border);border-radius:18px;padding:25px;margin-bottom:15px}
.lesson-head p{margin-bottom:0}
.note{padding:13px 15px;background:#182f40;border-left:3px solid var(--accent);border-radius:7px;font-size:14px;color:#d4e4ed;margin:14px 0}
.lab{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.editor,.preview{min-width:0;overflow:hidden;border:1px solid var(--border);background:#0a1324;border-radius:14px}
.panelbar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#16263d;color:#c9d5e6;font-size:12px;font-weight:800;border-bottom:1px solid var(--border)}
#editor{width:100%;min-height:395px;resize:vertical;padding:16px;background:#0b1322;color:#c9f5e1;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;border:0;border-radius:0;tab-size:2}
#preview{width:100%;height:395px;background:#fff;border:0}
.question{padding:15px 0}
.option{display:flex;align-items:flex-start;gap:11px;padding:10px;border:1px solid var(--border);border-radius:10px;margin:7px 0;cursor:pointer;font-size:14px;color:var(--text)}
.option:hover{background:#1a2b44}
.option input{margin-top:3px;accent-color:var(--accent)}
.result{margin-top:12px;padding:14px;border-radius:10px;font-size:14px}
.result.ok{background:#153d35;border:1px solid #2a8a75;color:#b5f7dd}
.result.bad{background:#433029;border:1px solid #94614c;color:#ffe0be}
.project{display:flex;flex-direction:column;gap:9px}
.project .btn{margin-top:auto;align-self:flex-start}
.footer{border-top:1px solid var(--border);padding:24px 0;color:var(--muted);font-size:12px;margin-top:45px}
ul,ol{padding-left:20px;color:var(--muted)}
li{margin-bottom:7px}
.checks{padding:14px 18px;background:#101f32;border:1px solid var(--border);border-radius:12px}
.skill{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin:15px 0}
code{font-family:ui-monospace,monospace;color:#9ff2d1}
@media(max-width:1050px){.grid.four,.steps{grid-template-columns:repeat(3,1fr)}.nav button{padding:8px}.learn-layout{grid-template-columns:225px minmax(0,1fr)}}
@media(max-width:760px){.topin{flex-wrap:wrap;padding:10px 14px}.nav{width:100%;overflow-x:auto;flex-wrap:nowrap;order:3}.nav button{white-space:nowrap}.return{margin-left:auto}.wrap{padding:17px 13px 65px}.hero,.learn-layout,.lab{grid-template-columns:1fr}.grid,.grid.two,.grid.four{grid-template-columns:1fr 1fr}.steps{grid-template-columns:repeat(2,1fr)}.lesson-list{position:static;max-height:200px}.hero-main,.hero-side{padding:22px}.lab #editor,.lab #preview{height:290px;min-height:290px}.skill{grid-template-columns:1fr;gap:3px}}
@media(max-width:480px){.grid,.grid.two,.grid.four{grid-template-columns:1fr}.logo{font-size:13px}.logo-icon{width:37px;height:37px}.section-head{align-items:start;flex-direction:column}.step{min-height:98px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.progress>div{transition:none}}
</style>
</head>

<script>
(function(){
'use strict';
var KEY='lama-coding-academy-v1';
var paths=[
{id:'web',icon:'🌐',name:'Website / Web App',label:'Build sites people use',steps:['HTML + CSS + JavaScript','Responsive layouts and accessibility','Git / GitHub and debugging','APIs, testing and framework basics','Publish a portfolio and maintain a real project'],project:'A usable school, business or community website',live:true},
{id:'mobile',icon:'📱',name:'Mobile Apps',label:'Build Android and cross-platform apps',steps:['Complete the web coding foundations','Learn programming logic and data structures','Pick Kotlin or Flutter / Dart','Build app screens, storage and navigation','Test on devices, privacy and release processes'],project:'An offline student attendance helper',live:false},
{id:'data',icon:'📊',name:'Data & AI',label:'Make sense of information',steps:['Computing and programming basics','Python syntax, functions and files','Spreadsheets, SQL and data cleaning','Charts, statistics and model evaluation','Build ethical, reproducible data projects'],project:'A school attendance insights dashboard',live:false},
{id:'automation',icon:'⚙️',name:'Business Automation',label:'Solve repetitive real problems',steps:['Programming fundamentals','JavaScript or Python scripts','CSV, files and API fundamentals','Error handling and secure credentials','Automation testing, logs and documentation'],project:'An expense statement organizer',live:false},
{id:'security',icon:'🔐',name:'Cybersecurity',label:'Defend systems responsibly',steps:['Web, operating system and network basics','Python and command-line fundamentals','Authentication and secure coding','Legal practice labs and threat modeling','Security testing with written authorization'],project:'A password-strength education demo',live:false},
{id:'games',icon:'🎮',name:'Games & Interactivity',label:'Create playful experiences',steps:['Programming logic and events','JavaScript and browser canvas basics','Game loops, states and input','Accessibility, graphics and sound','Testing, optimization and distribution'],project:'An interactive learning quiz',live:false}
];
var lessons=[
{id:'h1',stage:'Foundation',title:'1. Your first line of code',time:'8 min',concept:'A website is made of elements. HTML headings tell the browser and people what a page is about.',why:'A school website needs a clear page title.',task:'Change the heading to exactly Hello, Developer! and run your page.',hint:'Look between the opening <h1> and closing </h1> tags.',starter:'<!doctype html>\n<html>\n<head><title>My first page</title></head>\n<body>\n  <h1>Hello, World!</h1>\n  <p>My developer journey starts here.</p>\n</body>\n</html>',checks:[[/<h1\b[^>]*>\s*Hello,\s*Developer!\s*<\/h1>/i,'The h1 heading says Hello, Developer!']],quiz:['What does the HTML h1 element represent?',['A main heading','A file download','A database'],0]},
{id:'p',stage:'Foundation',title:'2. Tell your story',time:'9 min',concept:'A paragraph element <p> holds readable text. A class lets you style or select an element later.',why:'Every portfolio needs a short introduction.',task:'Add a paragraph with class="intro" containing the words I am learning to code.',hint:'Example: <p class="intro">I am learning to code.</p>',starter:'<!doctype html>\n<html><body>\n  <h1>About me</h1>\n  <!-- Add your introductory paragraph here -->\n</body></html>',checks:[[/<p\b[^>]*class\s*=\s*["']intro["'][^>]*>[\s\S]*?I am learning to code[\s\S]*?<\/p>/i,'A paragraph with class intro includes your introduction']],quiz:['What is a paragraph used for?',['To store passwords','To organize text','To execute JavaScript'],1]},
{id:'link',stage:'Foundation',title:'3. Connect to resources',time:'10 min',concept:'Anchor <a> links connect pages. The href attribute holds the destination.',why:'Business websites send visitors to important resources.',task:'Add a link to https://developer.mozilla.org with the visible text Learn on MDN.',hint:'An anchor looks like <a href="https://...">Link text</a>.',starter:'<!doctype html>\n<html><body><h1>Helpful links</h1>\n  <!-- Put a useful learning link here -->\n</body></html>',checks:[[/<a\b[^>]*href\s*=\s*["']https:\/\/developer\.mozilla\.org\/?["'][^>]*>\s*Learn on MDN\s*<\/a>/i,'A correct MDN link with clear text']],quiz:['Which attribute contains a link destination?',['alt','href','class'],1]},
{id:'semantic',stage:'Foundation',title:'4. Design a meaningful page',time:'12 min',concept:'Semantic HTML like <main> and <section> describes the role of content. This helps accessibility and maintenance.',why:'Real organizations need pages that are clear to visitors and assistive technologies.',task:'Put a <section> with an <h2>About our school</h2> inside the <main> element.',hint:'Write <main><section><h2>About our school</h2></section></main>.',starter:'<!doctype html>\n<html><body><header><h1>Our School</h1></header>\n  <main>\n    <!-- Add a section and h2 here -->\n  </main>\n</body></html>',checks:[[/<main\b[^>]*>[\s\S]*<section\b[^>]*>[\s\S]*<h2\b[^>]*>\s*About our school\s*<\/h2>[\s\S]*<\/section>[\s\S]*<\/main>/i,'A section with its heading appears within main']],quiz:['Why prefer semantic HTML?',['It explains content structure','It replaces CSS','It guarantees a job'],0]},
{id:'css',stage:'Build',title:'5. Style a card with CSS',time:'12 min',concept:'CSS selects elements and controls appearance. Padding creates space inside an element. Border radius softens corners.',why:'You will style cards in dashboards, shop pages and admin panels.',task:'In the .card CSS rule add padding: 20px and border-radius: 12px.',hint:'Add both declarations inside .card { ... }.',starter:'<!doctype html>\n<html><head><style>\nbody{font-family:Arial;background:#eef4ff}\n.card{background:white}\n</style></head><body>\n<div class="card"><h1>My first card</h1><p>Made with CSS.</p></div>\n</body></html>',checks:[[/\.card\s*\{[^}]*padding\s*:\s*20px\s*;/i,'The card uses 20px padding'],[/\.card\s*\{[^}]*border-radius\s*:\s*12px\s*;?/i,'The card uses 12px rounded corners']],quiz:['Which property adds space INSIDE an element?',['margin','padding','display'],1]},
{id:'layout',stage:'Build',title:'6. Make a responsive layout',time:'15 min',concept:'Flexbox arranges items. A media query lets the layout adapt to screen size.',why:'Most industry websites must work on phones and computers.',task:'Make .items use display:flex and add a media query with max-width:600px.',hint:'Try .items{display:flex;gap:12px} and @media(max-width:600px){.items{display:block}}.',starter:'<!doctype html>\n<html><head><style>\nbody{font-family:Arial}\n.items{gap:12px}\n.item{padding:20px;background:#ccebe6;margin:4px}\n/* Add a phone-sized media query */\n</style></head><body>\n<h1>Courses</h1><div class="items"><div class="item">HTML</div><div class="item">CSS</div><div class="item">JavaScript</div></div>\n</body></html>',checks:[[/\.items\s*\{[^}]*display\s*:\s*flex\s*;?/i,'The item layout uses Flexbox'],[/@media\s*\([^)]*max-width\s*:\s*600px[^)]*\)/i,'A 600px mobile media query exists']],quiz:['What does a media query help with?',['Adapting to screen sizes','Saving a password','Creating database tables'],0]},
{id:'variable',stage:'Logic',title:'7. Meet JavaScript variables',time:'14 min',concept:'A variable stores information. JavaScript can read it and update what people see.',why:'A dashboard can greet someone using their name.',task:'Declare const learnerName = "Amina"; and set the #greeting element textContent to "Welcome, " + learnerName.',hint:'Use document.getElementById("greeting").textContent = "Welcome, " + learnerName;',starter:'<!doctype html>\n<html><body style="font-family:Arial">\n<h1 id="greeting">Welcome!</h1>\n<script>\n  // Add a variable and update the greeting\n<\/script>\n</body></html>',checks:[[/const\s+learnerName\s*=\s*["']Amina["']\s*;/i,'A learnerName variable stores Amina'],[/getElementById\s*\(\s*["']greeting["']\s*\)\.textContent\s*=/i,'JavaScript updates the greeting text']],quiz:['What does const do here?',['Defines a variable','Creates a paragraph','Changes CSS spacing'],0]},
{id:'click',stage:'Logic',title:'8. Respond to button clicks',time:'15 min',concept:'Events let an app respond to actions. An event listener runs when an event happens.',why:'Real apps use button clicks for saving, searching and navigation.',task:'Connect the #hello button to a click event listener, then change the textContent of #message.',hint:'document.getElementById("hello").addEventListener("click", function(){ ... });',starter:'<!doctype html>\n<html><body style="font-family:Arial">\n<button id="hello">Say hello</button><p id="message">Nothing yet</p>\n<script>\n  // Add a click event listener here\n<\/script>\n</body></html>',checks:[[/getElementById\s*\(\s*["']hello["']\s*\)\.addEventListener\s*\(\s*["']click["']/i,'The hello button listens for clicks'],[/getElementById\s*\(\s*["']message["']\s*\)\.textContent\s*=/i,'The event changes the message text']],quiz:['What runs when a visitor presses a button?',['An event listener','A CSS variable','An HTML title'],0]},
{id:'functions',stage:'Logic',title:'9. Reuse logic with functions',time:'15 min',concept:'A function is a reusable set of instructions. Parameters supply different inputs each time.',why:'Shopping carts and billing apps calculate totals repeatedly.',task:'Write function calculateTotal(price, quantity) that returns price * quantity.',hint:'function calculateTotal(price, quantity) { return price * quantity; }',starter:'<!doctype html>\n<html><body style="font-family:Arial">\n<h1>Shop total</h1><p id="bill"></p>\n<script>\n  // Define calculateTotal here\n  // document.getElementById("bill").textContent = calculateTotal(250, 3);\n<\/script>\n</body></html>',checks:[[/function\s+calculateTotal\s*\(\s*price\s*,\s*quantity\s*\)/i,'The function accepts price and quantity'],[/return\s+price\s*\*\s*quantity\s*;/i,'The function multiplies price by quantity']],quiz:['Why write a function?',['To reuse logic','To hide all errors','To replace HTML'],0]},
{id:'array',stage:'Logic',title:'10. Work with collections',time:'16 min',concept:'Arrays hold ordered lists of values. forEach lets us perform an action for each item.',why:'School apps display lists of students, subjects and records.',task:'Create const skills = ["HTML","CSS","JavaScript"] and use skills.forEach to list them.',hint:'skills.forEach(function(skill){ document.getElementById("list").innerHTML += "<li>" + skill + "</li>"; });',starter:'<!doctype html>\n<html><body style="font-family:Arial">\n<h1>My skills</h1><ul id="list"></ul>\n<script>\n  // Create your skills array and loop\n<\/script>\n</body></html>',checks:[[/const\s+skills\s*=\s*\[\s*["']HTML["']\s*,\s*["']CSS["']\s*,\s*["']JavaScript["']\s*\]/i,'The three skills are stored in an array'],[/skills\.forEach\s*\(/i,'You use a forEach loop']],quiz:['What does an array store?',['An ordered collection','Only page colors','One HTML tag'],0]},
{id:'access',stage:'Professional',title:'11. Build for everyone',time:'13 min',concept:'Accessibility makes websites usable by more people. Form labels and descriptive images are fundamental.',why:'Professional software should support keyboard and assistive-technology users.',task:'Add a <label for="email">Email</label> and an <input id="email" type="email" required>.',hint:'The label for value should match the input id.',starter:'<!doctype html>\n<html><body style="font-family:Arial">\n<h1>Get in touch</h1><form>\n  <!-- Add a label and email input here -->\n  <button type="button">Submit</button>\n</form></body></html>',checks:[[/<label\b[^>]*for\s*=\s*["']email["'][^>]*>\s*Email\s*<\/label>/i,'An Email label is linked to its input'],[/<input\b(?=[^>]*\bid\s*=\s*["']email["'])(?=[^>]*\btype\s*=\s*["']email["'])(?=[^>]*\brequired\b)[^>]*>/i,'An email input is required and correctly identified']],quiz:['What should a form input have?',['A useful associated label','Only a placeholder','A random ID'],0]},
{id:'portfolio',stage:'Professional',title:'12. Publish-ready portfolio',time:'20 min',concept:'A portfolio shows your work. It should explain the problem, the code you wrote, and the result. Use Git to track versions before publishing.',why:'Employers and clients evaluate evidence of working projects, not only course badges.',task:'Add a <section id="projects"> with the heading My Projects and a link to your GitHub profile (github.com).',hint:'Use <section id="projects"><h2>My Projects</h2><a href="https://github.com/">My work</a></section>.',starter:'<!doctype html>\n<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>\nbody{font-family:Arial;max-width:700px;margin:40px auto;padding:18px}\n</style></head><body>\n<h1>Hello, I am a developer in training</h1>\n<p>I build useful projects and keep improving.</p>\n<!-- Show your projects and portfolio link below -->\n</body></html>',checks:[[/<section\b[^>]*id\s*=\s*["']projects["'][^>]*>[\s\S]*?<h2\b[^>]*>\s*My Projects\s*<\/h2>/i,'The projects section has a heading'],[/<a\b[^>]*href\s*=\s*["']https:\/\/github\.com\/[^"']*["'][^>]*>/i,'A GitHub portfolio link exists']],quiz:['Which portfolio item best shows practical skill?',['A working project with explanation','A high streak without code','A downloaded picture'],0]}
];
var defaults={goal:'web',name:'',progress:{},drafts:{},quiz:{},lastLesson:'h1'};
var state=load(),screen='home',current='h1';
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');return v&&typeof v==='object'?{goal:typeof v.goal==='string'?v.goal:'web',name:typeof v.name==='string'?v.name.slice(0,70):'',progress:v.progress&&typeof v.progress==='object'?v.progress:{},drafts:v.drafts&&typeof v.drafts==='object'?v.drafts:{},quiz:v.quiz&&typeof v.quiz==='object'?v.quiz:{},lastLesson:typeof v.lastLesson==='string'?v.lastLesson:'h1'}:JSON.parse(JSON.stringify(defaults));}catch(e){return JSON.parse(JSON.stringify(defaults));}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){var el=document.getElementById('storageWarning');if(el)el.textContent='This browser is not saving progress. Enable site storage to keep your work.';}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function count(){return lessons.filter(function(l){return !!state.progress[l.id];}).length;}
function percent(){return Math.round(count()*100/lessons.length);}
function next(){return lessons.find(function(l){return !state.progress[l.id];})||lessons[lessons.length-1];}
function path(){return paths.find(function(p){return p.id===state.goal;})||paths[0];}
function progressBar(){return '<div class="progress" role="progressbar" aria-label="Lesson completion" aria-valuenow="'+percent()+'" aria-valuemin="0" aria-valuemax="100"><div style="width:'+percent()+'%"></div></div>';}
function go(to,id){screen=to;if(id){current=id;state.lastLesson=id;save();}render();window.scrollTo({top:0,behavior:'auto'});}
function render(){document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.screen===screen);});var app=document.getElementById('app');if(screen==='home')app.innerHTML=home();if(screen==='paths')app.innerHTML=careers();if(screen==='projects')app.innerHTML=projects();if(screen==='profile')app.innerHTML=profile();if(screen==='learn')lessonPage();app.insertAdjacentHTML('beforeend','<footer class="footer">LAMA Coding Academy · A project of <a href="../index.html">LAMA Studio</a> · Original guided practice, not an accredited qualification. <span id="storageWarning"></span></footer>');}
function home(){var p=path(),n=next();return '<section class="hero"><div class="hero-main"><span class="kicker">A developer is made, one project at a time</span><h1>Start at zero.<br><em>Build something real.</em></h1><p class="lead">No confusing starting point. Learn a small idea, change working code, see it run and prove your understanding. Start on your phone or computer.</p><div class="inline"><button class="btn primary" data-action="lesson" data-id="'+n.id+'">▶ '+(count()?'Continue learning':'Start my first lesson')+'</button><button class="btn ghost" data-screen="paths">Explore careers</button><a class="btn primary" href="./practice.html" style="text-decoration:none">Try 18 industry coding challenges</a></div></div><div class="hero-side"><span class="kicker">My learning journey</span><p style="margin:12px 0 0"><strong>'+percent()+'%</strong> of hands-on core lessons completed</p>'+progressBar()+'<p class="sub">'+count()+' of '+lessons.length+' lessons passed (practice and quiz)</p><label for="goal"><b>What do you dream of building?</b></label><select class="goal" id="goal">'+paths.map(function(t){return '<option value="'+t.id+'"'+(state.goal===t.id?' selected':'')+'>'+t.icon+' '+t.name+'</option>';}).join('')+'</select><p class="sub">Recommended: Start with web basics for programming foundations. Your dream path guides later projects.</p></div></section><div class="section-head"><div><span class="kicker">The Dream → Developer method</span><h2>Six steps to real ability</h2></div></div><div class="steps">'+[['01','Understand','A short simple idea'],['02','Try','Edit real code'],['03','Run','See instant output'],['04','Debug','Use hints to fix'],['05','Prove','Pass code + quiz'],['06','Build','Keep a project']].map(function(a){return '<div class="step"><span class="num">'+a[0]+'</span><b>'+a[1]+'</b><small>'+a[2]+'</small></div>';}).join('')+'</div><div class="section-head"><div><span class="kicker">Next up</span><h2>What you will learn</h2><p>Starting with skills used in many real software projects.</p></div><button class="btn small" data-screen="learn">All lessons →</button></div><div class="grid">'+['Foundation','Build','Logic','Professional'].map(function(s){var a=lessons.filter(function(l){return l.stage===s});return '<div class="card"><span class="tag">'+s+'</span><h3>'+a.length+' practical lessons</h3><p>'+({'Foundation':'Understand web pages and content structure.','Build':'Make responsive designs for real people.','Logic':'Use programming to make things work.','Professional':'Create accessible work and show it clearly.'}[s])+'</p><p class="sub">'+a.filter(function(l){return !!state.progress[l.id];}).length+' / '+a.length+' completed</p></div>';}).join('')+'</div><div class="section-head"><div><span class="kicker">Your direction</span><h2>'+p.icon+' '+p.name+'</h2></div></div><div class="card"><p>'+p.label+'. Suggested project: <b>'+p.project+'</b>.</p><button class="btn small" data-screen="paths">See the industry roadmap</button></div>';}
function careers(){return '<span class="kicker">Find the field that inspires you</span><h1>There is more than one way to be a developer.</h1><p class="lead">Choose your ambition. The interactive beginner course currently teaches HTML, CSS and JavaScript. The other tracks are honest career roadmaps, not completed courses.</p><div class="grid two">'+paths.map(function(p){return '<article class="card"><span class="tag">'+(p.live?'Hands-on foundation available':'Roadmap guide')+'</span><h2>'+p.icon+' '+p.name+'</h2><p>'+p.label+'</p><ol>'+p.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol><p class="sub">Portfolio target: '+esc(p.project)+'</p><button class="btn '+(p.id===state.goal?'primary':'small')+'" data-action="choose" data-id="'+p.id+'">'+(p.id===state.goal?'✓ My chosen dream':'Choose this dream')+'</button></article>';}).join('')+'</div><div class="note">Industry reality: Employers expect debugging, communication, teamwork, version control, accessible and secure code, testing and real project experience. A roadmap is a guide, not a job guarantee.</div>';}
function projects(){var a=[['🌟','Personal profile','Write an accessible introduction, contact section and projects gallery.','h1',['Heading and description','Mobile-friendly styling','A working projects link']],['🏫','School information page','Create a page with useful sections, clear buttons and responsive layout.','semantic',['Headings and sections','Responsive card layout','Accessible contact form']],['🧮','Shopping total','Use a function to calculate quantities and show the correct amount.','functions',['Reusable function','Working example with price and quantity','Explanation of your logic']],['🎯','My developer portfolio','Explain the problem, show screenshots and link working code.','portfolio',['Three skill descriptions','One real solved problem','GitHub code and future improvements']]];return '<span class="kicker">Evidence beats memorization</span><h1>Build projects that matter.</h1><p class="lead">Each project is a practical brief with a starting lesson. Download the code you write, save it, and develop it further on a computer or in a code hosting service.</p><div class="grid two">'+a.map(function(t,i){return '<article class="card project"><span class="tag">Project '+(i+1)+'</span><h2>'+t[0]+' '+t[1]+'</h2><p>'+t[2]+'</p><ul>'+t[4].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul><button class="btn small" data-action="lesson" data-id="'+t[3]+'">Open starting lesson →</button></article>';}).join('')+'</div><div class="note">A real project needs manual review and testing. Passing a short practice checker does not prove that your whole product is secure, accessible, bug-free or ready for employment.</div>';}
function profile(){return '<span class="kicker">My work, my growth</span><h1>Developer progress</h1><p class="lead">Your learning data is stored on this device in your browser. No account or server upload is required for this first version.</p><div class="grid two"><div class="card"><label for="learnerName"><b>My name / portfolio label</b></label><input class="goal" id="learnerName" maxlength="70" placeholder="Your name (optional)" value="'+esc(state.name)+'"><p class="sub">Visible only on this device.</p><h2>'+count()+' / '+lessons.length+'</h2><p>Hands-on challenges completed</p>'+progressBar()+'</div><div class="card"><span class="tag">Next step</span><h3>'+esc(next().title)+'</h3><p>'+esc(next().concept)+'</p><button class="btn primary" data-action="lesson" data-id="'+next().id+'">Continue practicing</button></div></div><div class="section-head"><div><h2>Skills demonstrated</h2><p>Completion requires a code pattern check and a correct concept question.</p></div></div><div class="card">'+['Foundation','Build','Logic','Professional'].map(function(s){var a=lessons.filter(function(l){return l.stage===s});var c=a.filter(function(l){return state.progress[l.id];}).length;return '<div class="skill"><b>'+s+'</b><div><div class="progress"><div style="width:'+Math.round(c/a.length*100)+'%"></div></div><span class="sub">'+c+' of '+a.length+' lessons passed</span></div></div>';}).join('')+'</div><div class="section-head"><h2>Keep control of your work</h2></div><div class="card inline"><button class="btn small" data-action="export">Export progress as JSON</button><button class="btn small" data-action="reset">Reset learning on this device</button></div>';}
function lessonPage(){var l=lessons.find(function(x){return x.id===current;})||lessons[0];current=l.id;state.lastLesson=l.id;save();var pos=lessons.indexOf(l),done=!!state.progress[l.id];document.getElementById('app').innerHTML='<div class="section-head"><div><span class="kicker">12 guided labs · complete beginner</span><h2>Learn by creating</h2></div><span class="sub">'+count()+' / '+lessons.length+' passed</span></div><div class="learn-layout"><aside class="lesson-list" aria-label="Lessons">'+lessons.map(function(x){return '<button data-action="lesson" data-id="'+x.id+'" class="'+(x.id===l.id?'active ':'')+(state.progress[x.id]?'done':'')+'"><small>'+x.stage+' · '+x.time+'</small><strong>'+esc(x.title)+'</strong></button>';}).join('')+'</aside><div class="lesson-body"><section class="lesson-head"><span class="tag">'+esc(l.stage)+' · Lesson '+(pos+1)+' / 12'+(done?' · Passed ✓':'')+'</span><h1 style="font-size:clamp(24px,3vw,35px)">'+esc(l.title)+'</h1><p>'+esc(l.concept)+'</p><div class="note"><b>Industry connection:</b> '+esc(l.why)+'</div><h3>Your mission</h3><p style="color:var(--text)">'+esc(l.task)+'</p><details><summary style="cursor:pointer;color:var(--accent)">Need a hint?</summary><p>'+esc(l.hint)+'</p></details></section><div class="lab"><section class="editor"><div class="panelbar"><span>main.html · Your code</span><span>Auto-saved locally</span></div><textarea id="editor" spellcheck="false" aria-label="Code editor"></textarea></section><section class="preview"><div class="panelbar"><span>Live browser preview</span><span>Isolated sandbox</span></div><iframe id="preview" title="Your running code preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></section></div><div class="inline"><button class="btn primary" data-action="run">▶ Run my code</button><button class="btn" data-action="check">✓ Check my solution</button><button class="btn" data-action="download">↓ Download HTML</button><button class="btn small ghost" data-action="starter">Restore starter</button></div><p class="sub">The preview runs in a restricted, separate frame. Practice checks are simple learning hints, not full test automation. Never paste passwords or secrets into code examples.</p><section class="card" style="margin-top:18px"><h3>Concept check</h3><p>'+esc(l.quiz[0])+'</p>'+l.quiz[1].map(function(op,i){return '<label class="option"><input type="radio" name="quiz" value="'+i+'"'+(Number(state.quiz[l.id])===i&&state.quiz[l.id]!==undefined?' checked':'')+'> '+esc(op)+'</label>';}).join('')+'<div id="result" aria-live="polite"></div></section><div class="inline" style="justify-content:space-between;margin-top:18px"><button class="btn small" data-action="lesson" data-id="'+(lessons[Math.max(0,pos-1)].id)+'"'+(pos===0?' disabled':'')+'>← Previous lesson</button><button class="btn small primary" data-action="lesson" data-id="'+(lessons[Math.min(lessons.length-1,pos+1)].id)+'"'+(pos===lessons.length-1?' disabled':'')+'>Next lesson →</button></div></div></div>';
var ed=document.getElementById('editor');ed.value=typeof state.drafts[l.id]==='string'?state.drafts[l.id]:l.starter;run();ed.addEventListener('input',function(){state.drafts[l.id]=ed.value;save();});document.querySelectorAll('input[name="quiz"]').forEach(function(q){q.addEventListener('change',function(){state.quiz[l.id]=Number(q.value);save();});});}
function run(){var ed=document.getElementById('editor'),frame=document.getElementById('preview');if(!ed||!frame)return;var policy='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data:; font-src data:; connect-src \'none\'; form-action \'none\'; base-uri \'none\';">';var code=ed.value;frame.srcdoc=/<head(\s[^>]*)?>/i.test(code)?code.replace(/<head(\s[^>]*)?>/i,function(t){return t+policy;}):policy+code;}
function check(){var l=lessons.find(function(x){return x.id===current;}),ed=document.getElementById('editor'),out=document.getElementById('result');if(!l||!ed||!out)return;state.drafts[l.id]=ed.value;save();var missing=l.checks.filter(function(c){return !c[0].test(ed.value);}).map(function(c){return c[1];});if(state.quiz[l.id]===undefined||Number(state.quiz[l.id])!==l.quiz[2])missing.push('Choose the correct concept-check answer.');if(missing.length){out.className='result bad';out.innerHTML='<b>Almost there. Try again:</b><ul style="margin-bottom:0">'+missing.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>';return;}state.progress[l.id]=new Date().toISOString();save();out.className='result ok';out.innerHTML='✓ Lesson passed! Your code includes the required elements and your concept answer is correct. Try running it, then continue to the next lesson.';document.querySelectorAll('.lesson-list button[data-id="'+l.id+'"]').forEach(function(b){b.classList.add('done');});}
function download(name,content,type){var a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);}
document.addEventListener('click',function(e){var b=e.target.closest('button[data-screen],button[data-action]');if(!b||b.disabled)return;if(b.dataset.screen){go(b.dataset.screen);return;}var id=b.dataset.id,action=b.dataset.action;if(action==='lesson'){go('learn',id);return;}if(action==='choose'){state.goal=id;save();go('paths');return;}if(action==='run'){run();return;}if(action==='check'){check();return;}if(action==='download'){download('lama-'+current+'.html',document.getElementById('editor').value,'text/html');return;}if(action==='starter'){if(confirm('Replace your current code with the starting example?')){var l=lessons.find(function(x){return x.id===current;});state.drafts[l.id]=l.starter;save();document.getElementById('editor').value=l.starter;run();}return;}if(action==='export'){download('lama-coding-progress.json',JSON.stringify({name:state.name,goal:state.goal,progress:state.progress,exportedAt:new Date().toISOString()},null,2),'application/json');return;}if(action==='reset'){if(confirm('Delete saved lesson progress and draft code from this browser? This cannot be undone.')){state=JSON.parse(JSON.stringify(defaults));save();go('home');}return;}});
document.addEventListener('change',function(e){if(e.target.id==='goal'){state.goal=e.target.value;save();render();}if(e.target.id==='learnerName'){state.name=e.target.value.slice(0,70);save();}});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
render();
})();
