<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#103d34"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="./assets/lama-ppsc-approved-192.png">
<title>Set a New Password · LAMA PPSC Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#edf5f1;color:#153e33;font:16px/1.55 system-ui,Arial,sans-serif;display:grid;place-items:center;padding:18px}
main{background:white;border:1px solid #d5e6dc;box-shadow:0 8px 35px #14362922;border-radius:20px;padding:clamp(18px,5vw,30px);max-width:480px;width:100%}
.logo{display:block;width:90px;height:90px;object-fit:contain;margin:0 auto 10px}h1{font-size:clamp(1.4rem,5vw,1.8rem);line-height:1.2;text-align:center;margin:4px 0 12px}
p{margin:10px 0 16px}.muted{color:#52675e;font-size:.92rem}form[hidden]{display:none!important}label{display:block;font-weight:700;margin:13px 0 6px}
.field{display:flex;gap:6px}.field input{width:100%;min-width:0;flex:1;padding:12px;border:1px solid #98b7a7;border-radius:10px;font:inherit}.field button{flex:none;background:#eaf4ee;color:#165a44;border:1px solid #c3ddcd;border-radius:9px;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}
button[type=submit],a.primary{width:100%;padding:13px 16px;display:inline-block;text-align:center;background:#156a50;border:0;color:#fff;border-radius:10px;text-decoration:none;font:inherit;font-weight:750;cursor:pointer;margin-top:17px}button:disabled{opacity:.55;cursor:not-allowed}
#status{padding:12px 14px;border:1px solid #c5ded0;border-radius:11px;background:#f0f8f2;overflow-wrap:anywhere}#status.error{border-color:#e7b5ad;background:#fff0ef;color:#8c2d25}
.footer{text-align:center;margin:18px 0 0;font-size:.88rem;color:#4e645a}a{color:#105f48}
</style>
</head><body><main>
<img class="logo" src="./assets/lama-ppsc-approved-192.png" alt="LAMA PPSC Preparation Academy">
<h1>Set your new password</h1>
<p class="muted">Use only the password-recovery link sent to your registered email address. Your password is never shown to academy staff.</p>
<p id="status" role="status" aria-live="polite">Checking your secure recovery link…</p>
<form id="recoveryForm" hidden>
<label for="password">New password (at least 12 characters)</label>
<div class="field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="button" class="toggle" aria-label="Show new password" data-target="password">Show</button></div>
<label for="confirmPassword">Confirm new password</label>
<div class="field"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="button" class="toggle" aria-label="Show confirmed password" data-target="confirmPassword">Show</button></div>
<button id="savePassword" type="submit">Save new password</button>
</form>
<a id="return" class="primary" href="./section.html?view=account">Return to Candidate Login</a>
<p class="footer">LAMA Studio · Software · Education · Innovation</p>
</main>
<script src="./supabase-config.js"></script>
<script>
'use strict';
(()=>{
 const $=id=>document.getElementById(id),message=$('status'),form=$('recoveryForm');
 const settings=window.LAMA_PPSC_SUPABASE||{};
 const hash=new URLSearchParams(location.hash.slice(1));
 const token=hash.get('access_token')||'';
 const kind=hash.get('type')||'';
 const error=hash.get('error_description')||hash.get('error')||'';
 // Remove bearer tokens from browser navigation history immediately.
 if(location.hash)history.replaceState(null,'',location.pathname);
 function status(text,isError=false){message.textContent=text;message.classList.toggle('error',isError)}
 if(error){status('This recovery link could not be verified. Request a fresh password-reset email from Candidate Login.',true);return}
 if(kind!=='recovery'||!token||token.length<50||!settings.enabled){
  status('No valid recovery session is available. Open the recovery email link or request a new one from Candidate Login.',true);
  return;
 }
 status('Recovery link received. Enter a new password below.');
 form.hidden=false;
 document.querySelectorAll('button.toggle').forEach(button=>button.addEventListener('click',()=>{
  const input=$(button.dataset.target);
  const visible=input.type==='password';
  input.type=visible?'text':'password';button.textContent=visible?'Hide':'Show';button.setAttribute('aria-label',visible?'Hide password':'Show password');
 }));
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  const password=$('password').value,confirmation=$('confirmPassword').value;
  if(password.length<12||password.length>128){status('Use a password of at least 12 and no more than 128 characters.',true);return}
  if(password!==confirmation){status('The two passwords do not match.',true);return}
  const save=$('savePassword');save.disabled=true;status('Updating your password securely…');
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
   const response=await fetch(settings.url.replace(/\/$/,'')+'/auth/v1/user',{
    method:'PUT',headers:{'apikey':settings.publishableKey,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({password}),cache:'no-store',signal:controller.signal
   });
   const result=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(result.msg||result.error_description||result.message||'This recovery session may have expired.');
   form.hidden=true;$('password').value='';$('confirmPassword').value='';
   status('Password updated successfully. Return to Candidate Login and sign in with your new password.');
   // Best-effort revocation of the temporary recovery session.
   fetch(settings.url.replace(/\/$/,'')+'/auth/v1/logout',{method:'POST',headers:{apikey:settings.publishableKey,Authorization:'Bearer '+token},cache:'no-store'}).catch(()=>{});
  }catch(error){status(error.name==='AbortError'?'The request timed out. Check your connection and try again.':error.message||'Password change failed. Request a fresh recovery link.',true)}
  finally{clearTimeout(timer);save.disabled=false}
 });
})();
</script>
</body></html>
