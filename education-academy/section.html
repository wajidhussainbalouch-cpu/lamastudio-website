<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#103d34">
<title>LAMA PPSC Preparation Academy · Section</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f1f6f3;color:#153e33}header{background:#103d34;color:white;padding:22px 16px}header a{color:#d4f6e2}main{max-width:720px;margin:auto;padding:20px 16px}.notice{background:#fff;padding:20px;border-radius:14px;line-height:1.6;box-shadow:0 4px 18px #103d341a}h1{font-size:1.4rem}
</style>
</head>
<body>
<header><a href="./index.html">← Academy Dashboard</a><h1 id="heading">Academy Section</h1></header>
<main><div class="notice" id="message" role="status">Opening your academy section…</div></main>
<script>
'use strict';
(()=>{
 const params=new URLSearchParams(location.search);
 const view=params.get('view')||'';
 const job=params.get('job')||'';
 const labels={studyPlanner:'My Study Plan',papers:'Papers & Examinations',resources:'Syllabus & Resources',performance:'My Scores',subscription:'Membership',account:'Registration & Login',paper:'Free Practice Paper',jobDetail:'Job Details'};
 const heading=document.getElementById('heading'),message=document.getElementById('message');
 if(!Object.prototype.hasOwnProperty.call(labels,view)){location.replace('./index.html');return}
 document.title='LAMA PPSC · '+labels[view];heading.textContent=labels[view];
 // Non-teaching job tracks must not silently display the Headmaster paper.
 if(view==='paper'&&job&&job!=='teaching'&&!job.startsWith('teaching:')){
  const target=new URL('./index.html',location.href);target.searchParams.set('job',job);target.hash='papers';location.replace(target.href);return;
 }
 // Navigate to the existing single-page academy router. No nested iframe or double padding.
 const target=new URL('./index.html',location.href);if(job)target.searchParams.set('job',job);target.hash=encodeURIComponent(view);location.replace(target.href);
})();
</script>
</body>
</html>
