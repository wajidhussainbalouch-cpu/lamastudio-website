<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LamaStudio — Portal</title>
<style>
/* ... (Keep existing CSS variables and base styles) ... */
/* Adjusted Sidebar to LEFT */
.sidebar-drawer {
  left: -360px; /* Hidden state on left */
  right: auto;
  border-left: none;
  border-right: 1px solid var(--card-border);
  transition: left 0.35s var(--ease);
}
.sidebar-overlay.is-open .sidebar-drawer { left: 0; }

/* Responsive adjustments */
@media (max-width: 600px) {
  .ind-banner { font-size: 0.75rem; padding: 0.5rem; }
  .dashboard { padding-top: 1rem; }
}

/* YouTube Integration Styles */
.social-btns { display: flex; gap: 10px; margin-top: 1rem; }
.btn-social { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--card-border); }
.btn-yt { background: #ff0000; color: white; }
.btn-fb { background: #1877f2; color: white; }
</style>
</head>
<body>

<div class="ind-banner">
  <span>14 August</span> Happy Independence Day!
</div>

<header class="site-header">
  <div class="util-row">
    <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
    <a href="#" class="brand">LamaStudio</a>
  </div>
</header>

<!-- Sidebar (Left) -->
<div class="sidebar-overlay" id="sidebarOverlay">
  <div class="sidebar-drawer" id="sidebarDrawer">
    <!-- Our Apps and Softwares shown first -->
    <div class="sidebar-nav-group">
      <h5>Our Apps & Softwares</h5>
      <ul>
        <li><a href="#">LamaVPN Pro</a></li>
        <li><a href="#">LamaSky</a></li>
        <li><a href="#">Dashboard Hub</a></li>
      </ul>
    </div>
    <!-- Others shown below -->
    <div class="sidebar-nav-group">
      <h5>Menu</h5>
      <ul>
        <li><a href="#">Services</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Blogs</a></li>
        <li><a href="#">Privacy</a></li>
      </ul>
    </div>
  </div>
</div>

<main>
  <!-- YouTube Embed -->
  <section class="section">
    <div style="aspect-ratio: 16/9; max-width: 800px; margin: auto;">
      <iframe width="100%" height="100%" src="https://www.youtube.com/embed/BwOW3MkqaKc" frameborder="0" allowfullscreen></iframe>
    </div>
    <div class="social-btns" style="justify-content: center;">
      <a href="https://www.youtube.com/channel/UCi1w07U76CVSjA9yuJArxEQ" target="_blank" class="btn-social btn-yt">Subscribe</a>
      <a href="https://www.facebook.com/lamastudiopk" target="_blank" class="btn-social btn-fb">Follow on Facebook</a>
    </div>
  </section>

  <!-- ... (Existing content) ... -->

  <!-- Ticker moved to bottom -->
  <section class="section">
    <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>
  </section>
</main>

<script>
  // Add sidebar toggle logic (left-side)
  document.getElementById('menuToggle').addEventListener('click', function() {
    document.getElementById('sidebarOverlay').classList.add('is-open');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', function(e) {
    if(e.target === this) this.classList.remove('is-open');
  });
  // ... (Remainder of existing logic)
</script>

</body>
</html>
