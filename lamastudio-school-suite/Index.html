<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamastudio School Management Suite | Registration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white transition-colors duration-300">

    <!-- Top Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/85 backdrop-blur-md sticky top-0 z-50 py-4 px-6 md:px-12 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">lamastudio<span class="text-indigo-600 dark:text-indigo-400">.pk</span></h1>
                <p class="text-xs text-slate-500">School Management Suite</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <a href="login.html" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Already registered? Login</a>
            <button onclick="toggleTheme()" id="themeIconBtn" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-yellow-400 text-xs">☀️</button>
        </div>
    </header>

    <!-- Main Registration Container -->
    <main class="max-w-xl mx-auto px-6 py-12 flex-grow flex flex-col justify-center w-full">
        <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-2xl p-8 shadow-2xl">
            <div class="mb-6">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white">New School Registration</h3>
                <p id="stepIndicator" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold mt-1">Step 1 of 2: Create Administrator Credentials</p>
            </div>

            <!-- STEP 1: Username & Password Form -->
            <form id="step1Form" onsubmit="handleStep1(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Admin Username</label>
                    <input type="text" id="adminUsername" required placeholder="e.g., principal_almadina" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Admin Password</label>
                    <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 mt-2">
                    Create Credentials & Continue &rarr;
                </button>
            </form>

            <!-- STEP 2: Full School Details Form (Hidden Initially) -->
            <form id="step2Form" onsubmit="handleStep2(event)" class="space-y-4 hidden">
                <div class="bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-xl text-emerald-700 dark:text-emerald-300 text-xs mb-4">
                    ✓ Credentials created! Now enter your school profile details.
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">School Name</label>
                    <input type="text" id="schoolName" required placeholder="e.g., Al-Madina Model School" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">School Level</label>
                        <select id="schoolLevel" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white">
                            <option value="Primary">Primary</option>
                            <option value="Middle">Middle</option>
                            <option value="High">High</option>
                            <option value="Higher Secondary" selected>Higher Secondary</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Gender Type</label>
                        <select id="schoolGender" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white">
                            <option value="Combined" selected>Combined</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Students Enrollment</label>
                        <input type="number" id="studentEnrollment" required placeholder="450" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">City / Location</label>
                        <input type="text" id="schoolCity" required placeholder="DG Khan" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Principal</label>
                        <input type="text" id="principalName" required placeholder="Prof. Ahmed" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Phone</label>
                        <input type="text" id="principalPhone" required placeholder="0300-1234567" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email</label>
                        <input type="email" id="adminEmail" required placeholder="admin@school.pk" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-900 dark:text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Subscription Tier</label>
                    <select id="selectedPackage" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white">
                        <option value="Standard Tier">Standard Tier</option>
                        <option value="Professional Tier" selected>Professional Tier</option>
                        <option value="Enterprise Tier">Enterprise Tier</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-600/30 mt-2">
                    Finish & Open Dashboard 🚀
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 lamastudio.pk</p>
    </footer>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('lamastudio_theme', html.classList.contains('dark') ? 'dark' : 'light');
        }
        if(localStorage.getItem('lamastudio_theme') === 'dark') document.documentElement.classList.add('dark');

        function handleStep1(event) {
            event.preventDefault();
            localStorage.setItem('lamastudio_admin_username', document.getElementById('adminUsername').value);
            localStorage.setItem('lamastudio_admin_password', document.getElementById('adminPassword').value);

            document.getElementById('step1Form').classList.add('hidden');
            document.getElementById('step2Form').classList.remove('hidden');
            document.getElementById('stepIndicator').textContent = 'Step 2 of 2: Complete School Profile';
        }

        function handleStep2(event) {
            event.preventDefault();
            localStorage.setItem('lamastudio_registered_school', document.getElementById('schoolName').value);
            localStorage.setItem('lamastudio_school_level', document.getElementById('schoolLevel').value);
            localStorage.setItem('lamastudio_school_gender', document.getElementById('schoolGender').value);
            localStorage.setItem('lamastudio_enrollment', document.getElementById('studentEnrollment').value);
            localStorage.setItem('lamastudio_school_city', document.getElementById('schoolCity').value);
            localStorage.setItem('lamastudio_principal', document.getElementById('principalName').value);
            localStorage.setItem('lamastudio_phone', document.getElementById('principalPhone').value);
            localStorage.setItem('lamastudio_admin_email', document.getElementById('adminEmail').value);
            localStorage.setItem('lamastudio_school_package', document.getElementById('selectedPackage').value);

            // Set active session token so user stays logged in
            localStorage.setItem('lamastudio_logged_in', 'true');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
    </html>
