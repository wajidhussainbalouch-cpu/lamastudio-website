<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate School | LamaStudio</title><script src="https://cdn.tailwindcss.com"></script><script src="js/api-client.js"></script></head><body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4"><main class="max-w-md w-full bg-slate-900 border border-slate-700 rounded-2xl p-7 space-y-5"><h1 class="text-xl font-bold">Activate Your School</h1><p class="text-sm text-slate-300">Your school was approved. Set a private administrator password (12 characters or more). This link can be used only once within 48 hours.</p><form id="form" class="space-y-4"><label class="block text-sm">New Password<input id="password" type="password" required minlength="12" autocomplete="new-password" class="mt-2 w-full bg-slate-950 border border-slate-600 p-3 rounded-xl"></label><label class="block text-sm">Confirm Password<input id="confirm" type="password" required minlength="12" autocomplete="new-password" class="mt-2 w-full bg-slate-950 border border-slate-600 p-3 rounded-xl"></label><button id="submit" class="w-full bg-indigo-600 rounded-xl p-3 font-bold">Activate School</button></form><p id="message" role="status" class="text-sm"></p><a href="login.html" class="text-cyan-400 text-sm">School Login</a></main><script>
const params=new URLSearchParams(location.search);
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,msg=document.getElementById('message'),btn=document.getElementById('submit');if(password!==confirm){msg.textContent='Passwords do not match.';return;}btn.disabled=true;msg.textContent='Activating...';try{await LamaAPI.activateSchoolApplication({requestId:params.get('requestId'),token:params.get('token'),password});history.replaceState({},'',location.pathname);document.getElementById('form').hidden=true;msg.textContent='Your school is active. Sign in using your principal email and new password.';}catch(err){msg.textContent=err.message;btn.disabled=false;}});
</script></body></html>
