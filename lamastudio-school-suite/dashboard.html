<script>
    let telemetryChart = null;

    window.addEventListener('DOMContentLoaded', () => {
        let school = null;

        // Step 1: Read the active school session saved during login.html
        try {
            const activeSession = localStorage.getItem('lamastudio_active_school') || 
                                  localStorage.getItem('current_school_session');
            if (activeSession) {
                school = JSON.parse(activeSession);
            }
        } catch (e) {
            console.warn("Failed to read active school session from localStorage:", e);
        }

        // Step 2: Fallback default if no session is active
        if (!school) {
            school = {
                "schoolName": "GPS Shah Sadar Din",
                "schoolCodeId": "GSS",
                "schoolSector": "Government",
                "schoolDistrict": "Shah Sadar Din",
                "principalName": "Wajid Hussain",
                "enrollment": "300",
                "totalStaff": "10"
            };
        }

        // Map properties matching your Code.gs backend keys
        const schoolName = school.schoolName || school.name || 'Campus Command Hub';
        const schoolCodeRaw = school.schoolCodeId || school.shortCode || 'GPS';
        const shortCode = schoolCodeRaw.substring(0, 3).toUpperCase();
        const totalStudents = school.enrollment || school.totalStudents || '300';
        const totalStaff = school.totalStaff || '10';
        const principalName = school.principalName || school.principal || 'Wajid Hussain';
        const schoolSector = school.schoolSector || school.sector || 'Government';
        const schoolDistrict = school.schoolDistrict || school.address || 'Shah Sadar Din';
        const schoolLogoUrl = school.logoUrl || '';

        // Populate DOM elements
        document.getElementById('pageTitle').innerText = `${schoolName} | Campus Command Hub`;
        document.getElementById('navSchoolName').innerText = schoolName;
        document.getElementById('heroSchoolName').innerText = schoolName;
        document.getElementById('schoolAddressDisplay').innerText = `District / Location: ${schoolDistrict}`;
        document.getElementById('principalDisplay').innerText = principalName;
        document.getElementById('totalStudentsCount').innerText = totalStudents;
        document.getElementById('totalStaffCount').innerText = totalStaff;
        document.getElementById('badgeSector').innerText = `${schoolSector} Sector Node`;
        document.getElementById('footerText').innerHTML = `&copy; 2026 ${schoolName} &bull; Google Sheets Cloud Architecture`;

        const logoContainer = document.getElementById('schoolLogoContainer');
        if (schoolLogoUrl && schoolLogoUrl.trim() !== '') {
            logoContainer.innerHTML = `<img src="${schoolLogoUrl}" alt="${schoolName} Logo" class="w-full h-full object-cover">`;
        } else {
            logoContainer.innerHTML = `<span class="text-xs font-black text-white">${shortCode}</span>`;
        }

        renderTelemetryChart(parseInt(totalStudents, 10) || 300);
    });

    window.handleLogout = function() {
        localStorage.removeItem('lamastudio_active_school');
        localStorage.removeItem('current_school_session');
        window.location.href = "login.html";
    };

    function renderTelemetryChart(totalCount) {
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const data = {
            labels: ['Oct', 'Nov', 'Dec', 'Jan', 'Feb (Live)'],
            datasets: [
                {
                    label: 'Enrollment Growth',
                    data: [
                        Math.max(10, totalCount - 40),
                        Math.max(20, totalCount - 30),
                        Math.max(30, totalCount - 20),
                        Math.max(40, totalCount - 10),
                        totalCount
                    ],
                    borderColor: '#a855f7',
                    backgroundColor: 'rgba(168, 85, 247, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#a855f7'
                },
                {
                    label: 'Pass Rate %',
                    data: [82, 84, 85, 87, 88.7],
                    borderColor: '#06b6d4',
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.4,
                    pointBackgroundColor: '#06b6d4'
                }
            ]
        };
        const options = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(255, 255, 255, 0.03)' } },
                y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(255, 255, 255, 0.03)' } }
            }
        };

        if (telemetryChart) {
            telemetryChart.data = data;
            telemetryChart.update();
        } else {
            telemetryChart = new Chart(ctx, { type: 'line', data, options });
        }
    }
</script>
