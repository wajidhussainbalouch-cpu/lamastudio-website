<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Examination Date Sheet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/config.css">
<script src="js/api-client.js"></script>
<style>
    body { background-color: #0b0f19; }
    @media print {
        body { background: #ffffff !important; }
        .no-print { display: none !important; }
        .print-sheet {
            width: 100% !important; max-width: none !important; margin: 0 !important;
            padding: 8mm 10mm !important; border: none !important; box-shadow: none !important;
            background: #ffffff !important; color: #0f172a !important;
        }
        .ds-table th, .ds-table td { color: #0f172a !important; border-color: #94a3b8 !important; }
        @page { size: A4 landscape; margin: 6mm; }
    }
    .print-sheet { background: #ffffff; color: #0f172a; }
    .ds-table th, .ds-table td { border: 1px solid #334155; padding: 5px 6px; text-align: center; font-size: 10px; }
</style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Control Bar -->
    <div class="no-print max-w-7xl w-full mb-4 flex flex-col lg:flex-row justify-between gap-3 items-stretch lg:items-center bg-slate-900 border border-slate-800 text-white px-6 py-4 rounded-2xl shadow-xl">
        <div>
            <h2 class="text-xs font-black uppercase tracking-wider text-cyan-400">Examination Matrix Builder</h2>
            <p class="text-[10px] text-slate-400">Configure exam type and school grade configuration</p>
        </div>
        <div class="flex flex-wrap gap-2 items-center">
            <!-- Exam Type Selection -->
            <select id="examTypeSelect" class="bg-slate-950 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 outline-none focus:border-cyan-500">
                <option value="First-Term School-Based Assessment (SBA)">First Term</option>
                <option value="Mid-Term Examination">Mid-Term</option>
                <option value="Final / Annual Examination">Final / Annual</option>
                <option value="Quarterly Assessment">Quarterly</option>
                <option value="Semester Examination">Semester</option>
            </select>

            <!-- School Type Preset Selection -->
            <select id="schoolTypePreset" onchange="changePreset(this.value)" class="bg-slate-950 border border-slate-700 text-cyan-400 font-bold text-xs rounded-xl px-3 py-2.5 outline-none focus:border-cyan-500">
                <option value="private_primary">Private Primary (ECCE/PG, KG, Prep, 1-5)</option>
                <option value="govt_primary">Govt Primary (ECCE, Katchii, 1-5)</option>
                <option value="elementary">Elementary (Grades 1 - 8)</option>
                <option value="middle_high">Middle / High (Grades 6 - 10)</option>
            </select>

            <button onclick="addDateRow()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition">+ Add Date</button>
            <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">🖨️ Print</button>
            <a href="dashboard.html" class="bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition">&larr; Hub</a>
            <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition">Logout</button>
        </div>
    </div>

    <!-- DATE SHEET MATRIX SHEET -->
    <div class="print-sheet cyber-card max-w-7xl w-full p-6 rounded-2xl space-y-4">

        <!-- Header -->
        <div class="text-center border-b-2 border-cyan-600 pb-3">
            <div id="schoolLogoBox" class="w-12 h-12 mx-auto rounded-lg bg-cyan-600 text-white flex items-center justify-center text-xs font-black uppercase mb-1">SCH</div>
            <h1 id="headerSchoolName" class="text-2xl font-black tracking-wide uppercase mt-1">School Name</h1>
            <p id="headerSchoolMeta" class="text-[9px] font-semibold text-slate-500 mt-1">Address • UAN</p>
            <p id="examTitleDisplay" class="text-[11px] uppercase tracking-widest font-extrabold text-cyan-600 mt-2">DATE SHEET FOR FIRST-TERM SCHOOL-BASED ASSESSMENT (SBA) 2026-27</p>
            <input type="text" id="shiftTimingInput" class="no-print bg-transparent text-center text-[10px] font-bold text-slate-400 mt-1 w-full outline-none" value="MORNING SHIFT TIMING: 10:00 AM To 12:00 PM">
            <p id="shiftDisplay" class="hidden print-block text-[10px] font-bold text-slate-600 mt-1">MORNING SHIFT TIMING: 10:00 AM To 12:00 PM</p>
        </div>

        <div class="overflow-x-auto">
            <table class="ds-table w-full border-collapse">
                <thead>
                    <tr id="tableHeaderRow" class="bg-cyan-600 text-white text-[10px] uppercase">
                        <!-- Dynamically filled columns -->
                    </tr>
                </thead>
                <tbody id="rowsBody"></tbody>
            </table>
        </div>

        <div id="emptyState" class="text-center py-8 text-sm text-slate-400 hidden">
            No schedule entries yet. Click <b>+ Add Date</b> above to build the matrix.
        </div>
    </div>

    <script>
        function handleLogout() {
            LamaAPI.logout();
            window.location.href = 'login.html';
        }

        const DATESHEET = 'datesheet_dynamic_matrix';

        // Grade presets corresponding to school types
        const PRESETS = {
            'private_primary': ['ECCE/PG', 'KG', 'Prep', 'Grade-1', 'Grade-2', 'Grade-3', 'Grade-4', 'Grade-5'],
            'govt_primary': ['ECCE', 'Katchii', 'Grade-1', 'Grade-2', 'Grade-3', 'Grade-4', 'Grade-5'],
            'elementary': ['Grade-1', 'Grade-2', 'Grade-3', 'Grade-4', 'Grade-5', 'Grade-6', 'Grade-7', 'Grade-8'],
            'middle_high': ['Grade-6', 'Grade-7', 'Grade-8', 'Grade-9', 'Grade-10']
        };

        let currentPresetKey = 'private_primary';
        let currentGrades = PRESETS[currentPresetKey];
        let cachedRows = [];

        function changePreset(key) {
            currentPresetKey = key;
            currentGrades = PRESETS[key];
            renderTableHeaders();
            renderRows();
        }

        function renderTableHeaders() {
            const headerRow = document.getElementById('tableHeaderRow');
            let html = `
                <th class="px-3 py-2 text-left w-28">Date</th>
                <th class="px-3 py-2 text-left w-28">Day</th>
            `;
            currentGrades.forEach(grade => {
                html += `<th>${grade}</th>`;
            });
            html += `<th class="no-print w-10">Action</th>`;
            headerRow.innerHTML = html;
        }

        async function renderHeader() {
            const school = (await LamaAPI.getActiveSchool()) || {};
            const schoolName = school.name || 'School Name';
            const shortCode = school.shortCode || LamaAPI.deriveShortCode(schoolName);
            document.getElementById('pageTitle').innerText = `${schoolName} | Date Sheet`;
            document.getElementById('headerSchoolName').innerText = schoolName;
            document.getElementById('headerSchoolMeta').innerText = [school.address, school.phone ? `UAN: ${school.phone}` : ''].filter(Boolean).join(' • ');
            const logoBox = document.getElementById('schoolLogoBox');
            if (school.logo) {
                logoBox.innerHTML = `<img src="${school.logo}" class="w-full h-full object-cover rounded-lg">`;
            } else {
                logoBox.innerText = shortCode.slice(0, 3).toUpperCase();
            }
        }

        function dayFromDate(dateStr) {
            if (!dateStr) return '-';
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return days[new Date(dateStr).getDay()];
        }

        async function renderRows() {
            try {
                cachedRows = await LamaAPI.list(DATESHEET);
            } catch (e) {
                alert('Could not load the date sheet: ' + e.message);
                return;
            }
            const rows = [...cachedRows].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            const tbody = document.getElementById('rowsBody');
            document.getElementById('emptyState').classList.toggle('hidden', rows.length > 0);

            tbody.innerHTML = rows.map(row => {
                const computedDay = dayFromDate(row.date);
                return `
                    <tr>
                        <td class="text-left"><input type="date" class="row-input w-full bg-transparent text-xs" data-id="${row.id}" data-field="date" value="${row.date || ''}"></td>
                        <td class="text-left font-semibold text-slate-700 dark:text-slate-300" id="day-${row.id}">${computedDay}</td>
                        ${currentGrades.map(grade => `
                            <td><input class="row-input w-full bg-transparent text-center text-xs" data-id="${row.id}" data-field="grade_${grade}" value="${row['grade_' + grade] || '---'}" placeholder="---"></td>
                        `).join('')}
                        <td class="no-print text-center"><button onclick="deleteRow('${row.id}')" class="text-red-500 hover:text-red-400 font-bold px-2">✕</button></td>
                    </tr>
                `;
            }).join('');

            document.querySelectorAll('.row-input').forEach(input => {
                input.addEventListener('change', async (e) => {
                    const { id, field } = e.target.dataset;
                    let val = e.target.value;
                    const updatePayload = { [field]: val };
                    
                    if (field === 'date') {
                        updatePayload.day = dayFromDate(val);
                        document.getElementById(`day-${id}`).innerText = updatePayload.day;
                    }

                    try {
                        await LamaAPI.update(DATESHEET, id, updatePayload);
                    } catch (err) {
                        alert('Could not save that change: ' + err.message);
                    }
                });
            });
        }

        async function addDateRow() {
            try {
                const emptyRow = { date: '', day: '-' };
                currentGrades.forEach(g => emptyRow['grade_' + g] = '---');
                await LamaAPI.add(DATESHEET, emptyRow);
                renderRows();
            } catch (e) {
                alert('Could not add a date row: ' + e.message);
            }
        }

        async function deleteRow(id) {
            try {
                await LamaAPI.remove(DATESHEET, id);
                renderRows();
            } catch (e) {
                alert('Could not delete this row: ' + e.message);
            }
        }

        // Update Exam Title Display on selection change
        document.getElementById('examTypeSelect').addEventListener('change', (e) => {
            const examTypeText = e.target.value;
            document.getElementById('examTitleDisplay').innerText = `DATE SHEET FOR ${examTypeText.toUpperCase()} 2026-27`;
        });

        document.getElementById('shiftTimingInput').addEventListener('input', (e) => {
            document.getElementById('shiftDisplay').innerText = e.target.value;
        });

        async function init() {
            await renderHeader();
            renderTableHeaders();
            await renderRows();
        }

        if (LamaAPI.requireLogin('school')) {
            init();
        }
    </script>
</body>
</html>
