<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Examination Date Sheet | Next-Gen Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            900: '#4c1d95',
                            950: '#2e1065'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/config.css" onerror="console.warn('config.css missing; using inline fallback.');">
    <script src="js/api-client.js" onerror="console.warn('api-client.js missing; using fallback data engine.');"></script>
    <style>
        @keyframes floatOrb { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-40px) scale(1.12); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .orb { position: fixed; border-radius: 9999px; filter: blur(90px); animation: floatOrb 16s ease-in-out infinite; pointer-events: none; z-index: 0; }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        
        .glass-panel { 
            background: rgba(15, 23, 42, 0.82); 
            backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        html:not(.dark) .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .glass-pill { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        html:not(.dark) .glass-pill {
            background: rgba(241, 245, 249, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #1e293b;
        }

        .custom-gradient { background: linear-gradient(135deg, #7c3aed 0%, #db2777 50%, #6366f1 100%); }

        @media print {
            body { background: #ffffff !important; color: #0f172a !important; }
            .no-print { display: none !important; }
            .orb { display: none !important; }
            .print-sheet {
                width: 100% !important; max-width: none !important; margin: 0 !important;
                padding: 10mm 12mm !important; border: none !important; box-shadow: none !important;
                background: #ffffff !important; color: #0f172a !important;
            }
            .print-sheet * { background: transparent !important; color: #0f172a !important; border-color: #cbd5e1 !important; box-shadow: none !important; }
            .ds-table th { background: #7c3aed !important; color: #ffffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .ds-table th, .ds-table td { color: #0f172a !important; border-color: #cbd5e1 !important; }
            .ds-table input { color: #0f172a !important; border: none !important; }
            @page { size: A4 landscape; margin: 8mm; }
        }
        .ds-table th, .ds-table td { border: 1px solid rgba(128, 128, 128, 0.2); padding: 8px 10px; text-align: center; }
        .ds-table input { outline: none; text-align: center; }
    </style>
</head>
<body id="pageBody" class="bg-[#030712] dark:bg-[#030712] text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col items-center py-10 px-4 relative overflow-x-hidden transition-colors duration-300">

    <div class="orb w-96 h-96 bg-purple-600/20 top-[-10rem] -left-20"></div>
    <div class="orb w-96 h-96 bg-pink-600/15 top-1/2 -right-20" style="animation-delay: -5s;"></div>

    <!-- Control Bar -->
    <div class="no-print max-w-7xl w-full mb-6 flex flex-col sm:flex-row justify-between gap-4 items-stretch sm:items-center glass-panel px-6 py-4 rounded-2xl shadow-2xl relative z-10 fade-in">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl custom-gradient flex items-center justify-center font-black text-xs text-white shadow-lg">📅</div>
            <div>
                <h2 id="controlBarTitle" class="text-xs font-black uppercase tracking-wider text-purple-600 dark:text-purple-300">Matrix Date Sheet</h2>
                <p id="controlBarSubtitle" class="text-[10px] text-slate-500 dark:text-slate-400">Date/Time on rows & Grades as columns</p>
            </div>
        </div>
        <div class="flex flex-wrap gap-2 items-center">
            
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="glass-pill hover:opacity-80 font-bold text-xs px-3 py-2.5 rounded-xl transition shadow cursor-pointer flex items-center gap-1.5" title="Toggle Light/Dark Theme">
                <span id="themeIcon">☀️</span> <span id="themeText" class="hidden sm:inline">Theme</span>
            </button>

            <!-- School Level Selector (Hidden for Student/Parent Portals) -->
            <div id="schoolLevelControlBox" class="flex items-center gap-1.5 bg-slate-200/80 dark:bg-slate-950/80 border border-black/10 dark:border-white/10 rounded-xl px-2 py-1">
                <span class="text-[10px] uppercase font-bold text-slate-500">Level:</span>
                <select id="schoolLevelSelect" onchange="handleLevelSelect(this.value)" class="bg-transparent text-xs outline-none cursor-pointer py-1.5 text-slate-900 dark:text-white font-semibold">
                    <option value="Primary">Primary (ECCE - 5)</option>
                    <option value="Middle">Middle (1 - 8)</option>
                    <option value="High">High (1 - 10)</option>
                    <option value="Higher Secondary">Higher Secondary (1 - 12)</option>
                    <option value="custom">✏️ Custom Range (e.g. 1-12)</option>
                </select>
                <input type="text" id="customLevelInput" placeholder="e.g. 1-12" class="hidden bg-white dark:bg-slate-900 border border-purple-500/50 text-xs rounded-lg px-2 py-1 w-24 outline-none text-slate-900 dark:text-white" oninput="updateCustomLevel(this.value)">
            </div>

            <!-- Exam Title Selector -->
            <div id="examTitleControlBox" class="flex items-center gap-1.5 bg-slate-200/80 dark:bg-slate-950/80 border border-black/10 dark:border-white/10 rounded-xl px-2 py-1">
                <select id="examTitleSelect" onchange="handleExamSelect(this.value)" class="bg-transparent text-xs outline-none cursor-pointer py-1.5 text-slate-900 dark:text-white">
                    <option value="SBA First Term">SBA First Term</option>
                    <option value="SBA Mid Term">SBA Mid Term</option>
                    <option value="SBA Final Term">SBA Final Term</option>
                    <option value="custom">✏️ Custom Title...</option>
                </select>
                <input type="text" id="customExamInput" placeholder="Title..." class="hidden bg-white dark:bg-slate-900 border border-purple-500/50 text-xs rounded-lg px-2 py-1 w-24 outline-none text-slate-900 dark:text-white" oninput="updateCustomExamTitle(this.value)">
            </div>

            <!-- Student Class Filter Dropdown (Visible only if viewing as Student/Parent) -->
            <div id="studentClassFilterBox" class="hidden flex items-center gap-1.5 bg-purple-500/20 border border-purple-500/40 rounded-xl px-2.5 py-1">
                <span class="text-[10px] uppercase font-bold text-purple-300">My Class:</span>
                <select id="studentClassSelect" onchange="handleStudentClassFilter(this.value)" class="bg-transparent text-xs outline-none cursor-pointer py-1.5 text-white font-bold">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <button id="addRowBtn" onclick="addRow()" class="custom-gradient hover:opacity-95 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl transition shadow-lg cursor-pointer">+ Date Row</button>
            <button id="addColumnBtn" onclick="addColumn()" class="glass-pill hover:opacity-80 font-bold text-xs px-3 py-2.5 rounded-xl transition shadow-lg cursor-pointer">+ Col</button>
            <button onclick="window.print()" class="glass-pill hover:opacity-80 font-bold text-xs px-3 py-2.5 rounded-xl transition shadow-lg cursor-pointer">🖨️ Print</button>
            <a href="dashboard.html" class="glass-pill hover:opacity-80 font-bold text-xs px-3.5 py-2.5 rounded-xl transition shadow-lg">&larr; Hub</a>
            <button onclick="handleLogout()" class="glass-pill hover:opacity-80 font-bold text-xs px-3 py-2.5 rounded-xl transition shadow-lg cursor-pointer">Logout</button>
        </div>
    </div>

    <!-- DATE SHEET CONTAINER -->
    <div id="printSheetContainer" class="print-sheet glass-panel max-w-7xl w-full p-6 sm:p-8 rounded-[2rem] space-y-6 relative z-10 shadow-2xl fade-in transition-all duration-300">

        <!-- Header -->
        <div id="sheetHeaderBox" class="text-center border-b border-black/10 dark:border-white/10 pb-5">
            <div id="schoolLogoBox" class="w-16 h-16 mx-auto rounded-2xl custom-gradient text-white flex items-center justify-center text-sm font-black uppercase mb-2 shadow-lg border-2 border-white/20 overflow-hidden">SCH</div>
            <h1 id="headerSchoolName" class="text-2xl sm:text-3xl font-black tracking-tight">School Name</h1>
            <p id="headerSchoolMeta" class="text-xs text-slate-600 dark:text-slate-400 mt-1">Address • UAN</p>
            <p id="examTitleDisplay" class="text-[11px] uppercase tracking-wider font-bold text-purple-600 dark:text-purple-400 mt-2.5 bg-purple-100 dark:bg-purple-950/30 border border-purple-500/20 py-1.5 px-4 rounded-xl inline-block">PRIMARY SECTION — FIRST-TERM SCHOOL-BASED ASSESSMENT (SBA) 2026-27</p>
        </div>

        <!-- Render Target for Matrix Table -->
        <div id="sheetContentArea"></div>

        <div id="emptyState" class="text-center py-12 text-sm text-slate-500 dark:text-slate-400 hidden">
            <p class="text-lg">📭</p>
            <p class="mt-2">No exam schedule entries yet.</p>
            <p id="emptyStateSub" class="text-xs text-slate-400 dark:text-slate-500 mt-1">Click <b>+ Date Row</b> above to build the date sheet.</p>
        </div>
    </div>

    <script>
        window.LamaAPI = window.LamaAPI || {
            logout: function() { localStorage.clear(); },
            requireLogin: function() { return true; },
            deriveShortCode: function(name) { return (name || 'SCH').split(' ').map(w => w[0]).join('').slice(0, 3).toUpperCase(); },
            getActiveSchool: async function() { return JSON.parse(localStorage.getItem('lama_active_school') || '{}'); },
            list: async function(key) { return JSON.parse(localStorage.getItem('lama_' + key) || '[]'); },
            add: async function(key, item) {
                const list = JSON.parse(localStorage.getItem('lama_' + key) || '[]');
                item.id = 'row_' + Date.now() + Math.random().toString(36).substr(2, 4);
                list.push(item);
                localStorage.setItem('lama_' + key, JSON.stringify(list));
                return item;
            },
            update: async function(key, id, patch) {
                const list = JSON.parse(localStorage.getItem('lama_' + key) || '[]');
                const idx = list.findIndex(i => i.id === id);
                if (idx >= 0) {
                    list[idx] = { ...list[idx], ...patch };
                    localStorage.setItem('lama_' + key, JSON.stringify(list));
                }
            },
            remove: async function(key, id) {
                let list = JSON.parse(localStorage.getItem('lama_' + key) || '[]');
                list = list.filter(i => i.id !== id);
                localStorage.setItem('lama_' + key, JSON.stringify(list));
            }
        };

        function handleLogout() {
            LamaAPI.logout();
            window.location.href = 'login.html';
        }

        function toggleTheme() {
            const htmlEl = document.documentElement;
            const isDark = htmlEl.classList.toggle('dark');
            localStorage.setItem('lama_theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (isDark) {
                icon.innerText = '☀️';
                if(text) text.innerText = 'Light';
            } else {
                icon.innerText = '🌙';
                if(text) text.innerText = 'Dark';
            }
        }

        const DATESHEET = 'matrix_datesheet_v5';
        const CONFIG_KEY = 'matrix_config_v5';
        let cachedRows = [];

        // Detect if current logged-in user is a Student or Parent
        const currentUserRole = localStorage.getItem('lama_user_role') || 'school'; // 'school', 'teacher', 'student', 'parent'
        const isStudentOrParent = ['student', 'parent'].includes(currentUserRole.toLowerCase());
        
        // Student/Parent specific selected class filter
        let selectedStudentClass = localStorage.getItem(CONFIG_KEY + '_student_class') || '';

        const LEVEL_COLUMNS = {
            'Primary': [
                { key: 'ecce', label: 'ECCE' },
                { key: 'kg', label: 'KG' },
                { key: 'grade1', label: 'GRADE-1' },
                { key: 'grade2', label: 'GRADE-2' },
                { key: 'grade3', label: 'GRADE-3' },
                { key: 'grade4', label: 'GRADE-4' },
                { key: 'grade5', label: 'GRADE-5' }
            ],
            'Middle': [
                { key: 'grade1', label: 'GRADE-1' },
                { key: 'grade2', label: 'GRADE-2' },
                { key: 'grade3', label: 'GRADE-3' },
                { key: 'grade4', label: 'GRADE-4' },
                { key: 'grade5', label: 'GRADE-5' },
                { key: 'grade6', label: 'GRADE-6' },
                { key: 'grade7', label: 'GRADE-7' },
                { key: 'grade8', label: 'GRADE-8' }
            ],
            'High': [
                { key: 'grade1', label: 'GRADE-1' },
                { key: 'grade2', label: 'GRADE-2' },
                { key: 'grade3', label: 'GRADE-3' },
                { key: 'grade4', label: 'GRADE-4' },
                { key: 'grade5', label: 'GRADE-5' },
                { key: 'grade6', label: 'GRADE-6' },
                { key: 'grade7', label: 'GRADE-7' },
                { key: 'grade8', label: 'GRADE-8' },
                { key: 'grade9', label: 'GRADE-9' },
                { key: 'grade10', label: 'GRADE-10' }
            ],
            'Higher Secondary': [
                { key: 'grade1', label: 'GRADE-1' },
                { key: 'grade2', label: 'GRADE-2' },
                { key: 'grade3', label: 'GRADE-3' },
                { key: 'grade4', label: 'GRADE-4' },
                { key: 'grade5', label: 'GRADE-5' },
                { key: 'grade6', label: 'GRADE-6' },
                { key: 'grade7', label: 'GRADE-7' },
                { key: 'grade8', label: 'GRADE-8' },
                { key: 'grade9', label: 'GRADE-9' },
                { key: 'grade10', label: 'GRADE-10' },
                { key: 'grade11', label: 'GRADE-11' },
                { key: 'grade12', label: 'GRADE-12' }
            ]
        };

        function parseRangeToColumns(rangeStr) {
            if (!rangeStr) return LEVEL_COLUMNS['Primary'];
            const cleaned = rangeStr.trim();
            const parts = cleaned.split(/[-–to]+/);
            if (parts.length === 2) {
                const start = parseInt(parts[0].trim(), 10);
                const end = parseInt(parts[1].trim(), 10);
                if (!isNaN(start) && !isNaN(end) && start <= end) {
                    const cols = [];
                    for (let i = start; i <= end; i++) {
                        cols.push({ key: 'grade' + i, label: 'GRADE-' + i });
                    }
                    return cols;
                }
            }
            if (cleaned.includes(',')) {
                const items = cleaned.split(',');
                return items.map((item, idx) => {
                    const cleanName = item.trim();
                    return { key: 'custom_' + idx, label: cleanName.toUpperCase().startsWith('GRADE') ? cleanName.toUpperCase() : 'GRADE-' + cleanName.toUpperCase() };
                });
            }
            return [{ key: 'custom_0', label: cleaned.toUpperCase() }];
        }

        function getColumnsForLevel(level, customVal) {
            if (LEVEL_COLUMNS[level]) return LEVEL_COLUMNS[level];
            if (level === 'custom') return parseRangeToColumns(customVal);
            const saved = localStorage.getItem(CONFIG_KEY + '_cols');
            if (saved) {
                try { return JSON.parse(saved); } catch(e) {}
            }
            return LEVEL_COLUMNS['Primary'];
        }

        let currentLevel = localStorage.getItem(CONFIG_KEY + '_level') || 'Primary';
        let customVal = localStorage.getItem(CONFIG_KEY + '_custom_level') || '1-12';
        let dsColumns = getColumnsForLevel(currentLevel, customVal);

        function updateBadgeText() {
            const levelVal = localStorage.getItem(CONFIG_KEY + '_level') || 'Primary';
            const titleVal = localStorage.getItem(CONFIG_KEY + '_title') || 'SBA First Term';
            const customLvl = localStorage.getItem(CONFIG_KEY + '_custom_level') || '1-12';
            
            if (isStudentOrParent) {
                const activeClassLabel = selectedStudentClass ? dsColumns.find(c => c.key === selectedStudentClass)?.label || selectedStudentClass : 'MY CLASS';
                document.getElementById('examTitleDisplay').innerText = `${activeClassLabel} — ${titleVal.toUpperCase()} 2026-27`;
            } else {
                const levelDisplay = levelVal === 'custom' ? `GRADES (${customLvl.toUpperCase()}) SECTION` : `${levelVal.toUpperCase()} SECTION`;
                document.getElementById('examTitleDisplay').innerText = `${levelDisplay} — ${titleVal.toUpperCase()} 2026-27`;
            }
        }

        function handleLevelSelect(val) {
            const customInput = document.getElementById('customLevelInput');
            localStorage.setItem(CONFIG_KEY + '_level', val);
            if (val === 'custom') {
                customInput.classList.remove('hidden');
                customInput.focus();
                const currentCustom = customInput.value || localStorage.getItem(CONFIG_KEY + '_custom_level') || '1-12';
                dsColumns = getColumnsForLevel('custom', currentCustom);
            } else {
                customInput.classList.add('hidden');
                dsColumns = getColumnsForLevel(val);
            }
            localStorage.setItem(CONFIG_KEY + '_cols', JSON.stringify(dsColumns));
            updateStudentClassDropdown();
            updateBadgeText();
            renderRows();
        }

        function updateCustomLevel(val) {
            localStorage.setItem(CONFIG_KEY + '_custom_level', val);
            dsColumns = getColumnsForLevel('custom', val);
            localStorage.setItem(CONFIG_KEY + '_cols', JSON.stringify(dsColumns));
            updateStudentClassDropdown();
            updateBadgeText();
            renderRows();
        }

        function handleExamSelect(val) {
            const customInput = document.getElementById('customExamInput');
            if (val === 'custom') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                localStorage.setItem(CONFIG_KEY + '_title', val);
            }
            updateBadgeText();
        }

        function handleStudentClassFilter(key) {
            selectedStudentClass = key;
            localStorage.setItem(CONFIG_KEY + '_student_class', key);
            updateBadgeText();
            renderRows();
        }

        function updateCustomExamTitle(val) {
            localStorage.setItem(CONFIG_KEY + '_title', val);
            updateBadgeText();
        }

        function updateStudentClassDropdown() {
            const select = document.getElementById('studentClassSelect');
            if (!select) return;
            select.innerHTML = dsColumns.map(col => `<option value="${col.key}">${col.label}</option>`).join('');
            if (!selectedStudentClass || !dsColumns.some(c => c.key === selectedStudentClass)) {
                selectedStudentClass = dsColumns[0]?.key || '';
            }
            select.value = selectedStudentClass;
        }

        async function renderHeader() {
            const savedTheme = localStorage.getItem('lama_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                updateThemeUI(false);
            } else {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            }

            let school = {};
            try { school = (await LamaAPI.getActiveSchool()) || {}; } catch(e) {}
            
            const schoolName = school.name || 'School Name';
            const shortCode = school.shortCode || LamaAPI.deriveShortCode(schoolName);
            document.getElementById('pageTitle').innerText = `${schoolName} | Date Sheet`;
            document.getElementById('headerSchoolName').innerText = schoolName;
            document.getElementById('headerSchoolMeta').innerText = [school.address, school.phone ? `UAN: ${school.phone}` : ''].filter(Boolean).join(' • ');
            const logoBox = document.getElementById('schoolLogoBox');
            if (school.logo) {
                logoBox.innerHTML = `<img src="${school.logo}" class="w-full h-full object-cover rounded-2xl">`;
            } else {
                logoBox.innerText = shortCode.slice(0, 3).toUpperCase();
            }

            // Adapt UI based on Role (Student/Parent vs School Admin/Teacher)
            if (isStudentOrParent) {
                document.getElementById('controlBarTitle').innerText = 'Student Exam Schedule';
                document.getElementById('controlBarSubtitle').innerText = 'Viewing your personal class date sheet';
                document.getElementById('schoolLevelControlBox').classList.add('hidden');
                document.getElementById('addRowBtn').classList.add('hidden');
                document.getElementById('addColumnBtn').classList.add('hidden');
                document.getElementById('studentClassFilterBox').classList.remove('hidden');
                updateStudentClassDropdown();
            } else {
                const savedLevel = localStorage.getItem(CONFIG_KEY + '_level') || 'Primary';
                const levelSelect = document.getElementById('schoolLevelSelect');
                levelSelect.value = ['Primary', 'Middle', 'High', 'Higher Secondary'].includes(savedLevel) ? savedLevel : 'custom';
                if (levelSelect.value === 'custom') {
                    document.getElementById('customLevelInput').classList.remove('hidden');
                    document.getElementById('customLevelInput').value = localStorage.getItem(CONFIG_KEY + '_custom_level') || '1-12';
                }
            }

            const savedTitle = localStorage.getItem(CONFIG_KEY + '_title') || 'SBA First Term';
            const selectEl = document.getElementById('examTitleSelect');
            selectEl.value = ['SBA First Term', 'SBA Mid Term', 'SBA Final Term'].includes(savedTitle) ? savedTitle : 'custom';
            if(selectEl.value === 'custom') {
                document.getElementById('customExamInput').classList.remove('hidden');
                document.getElementById('customExamInput').value = savedTitle;
            }

            updateBadgeText();
        }

        function dayFromDate(dateStr) {
            if (!dateStr) return '-';
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? '-' : days[d.getDay()];
        }

        function updateColumnLabel(idx, newLabel) {
            dsColumns[idx].label = newLabel;
            localStorage.setItem(CONFIG_KEY + '_cols', JSON.stringify(dsColumns));
            renderRows();
        }

        function addColumn() {
            const name = prompt('Enter grade / column name (e.g. GRADE-13):');
            if (!name || !name.trim()) return;
            const key = 'col_' + Date.now() + Math.random().toString(36).substr(2, 4);
            dsColumns.push({ key, label: name.trim() });
            localStorage.setItem(CONFIG_KEY + '_cols', JSON.stringify(dsColumns));
            renderRows();
        }

        function deleteColumn(idx) {
            if (confirm(`Remove grade column "${dsColumns[idx].label}"?`)) {
                dsColumns.splice(idx, 1);
                localStorage.setItem(CONFIG_KEY + '_cols', JSON.stringify(dsColumns));
                renderRows();
            }
        }

        async function renderRows() {
            try {
                cachedRows = await LamaAPI.list(DATESHEET) || [];
                if (cachedRows.length === 0) {
                    const sampleRows = [
                        { date: '2026-09-18', time: '10:00 AM - 12:00 PM', grade1: 'English', grade2: 'GK', grade3: 'Islamiat', grade4: 'Urdu', grade5: 'Science', grade6: 'Math', grade7: 'Math', grade8: 'Science', grade9: 'English', grade10: 'Physics', grade11: 'Chemistry', grade12: 'Biology' },
                        { date: '2026-09-21', time: '10:00 AM - 12:00 PM', grade1: 'Mathematics', grade2: 'English', grade3: 'GK', grade4: 'Science', grade5: 'Mathematics', grade6: 'English', grade7: 'Science', grade8: 'Mathematics', grade9: 'Urdu', grade10: 'Math', grade11: 'English', grade12: 'Physics' }
                    ];
                    for (const r of sampleRows) {
                        await LamaAPI.add(DATESHEET, r);
                    }
                    cachedRows = await LamaAPI.list(DATESHEET) || [];
                }
            } catch (e) {
                cachedRows = [];
            }

            const rows = [...cachedRows];
            const contentArea = document.getElementById('sheetContentArea');
            document.getElementById('emptyState').classList.toggle('hidden', rows.length > 0);

            if (isStudentOrParent) {
                // RENDER FOCUSED SINGLE-CLASS SCHEDULE FOR STUDENT/PARENT PORTAL
                const currentClassCol = dsColumns.find(c => c.key === selectedStudentClass) || dsColumns[0];
                const classKey = currentClassCol ? currentClassCol.key : 'grade1';
                const classLabel = currentClassCol ? currentClassCol.label : 'Class';

                contentArea.innerHTML = `
                    <div class="mb-4 text-center">
                        <span class="text-xs font-bold text-purple-400 bg-purple-950/50 px-3 py-1 rounded-full border border-purple-500/30">
                            📋 Exam Schedule for: <span class="text-white underline">${classLabel}</span>
                        </span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="ds-table w-full text-xs border-collapse">
                            <thead>
                                <tr class="bg-purple-100 dark:bg-purple-900/40 text-purple-900 dark:text-purple-200 text-[11px] uppercase tracking-wider font-bold">
                                    <th class="px-4 py-3">DATE</th>
                                    <th class="px-4 py-3">DAY</th>
                                    <th class="px-4 py-3">TIME</th>
                                    <th class="px-4 py-3 text-purple-300 font-black text-sm">${classLabel} SUBJECT</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.map(row => `
                                    <tr class="hover:bg-black/[0.01] dark:hover:bg-white/[0.02] transition">
                                        <td class="px-4 py-3 font-semibold">${row.date || 'TBD'}</td>
                                        <td class="px-4 py-3 text-slate-400 font-medium">${dayFromDate(row.date)}</td>
                                        <td class="px-4 py-3 text-center">${row.time || '10:00 AM'}</td>
                                        <td class="px-4 py-3 font-bold text-purple-300 text-sm">${row[classKey] || '<span class="text-slate-500 italic">No Exam / Holiday</span>'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                // RENDER FULL MATRIX TABLE FOR SCHOOL ADMIN / TEACHER
                contentArea.innerHTML = `
                    <div class="overflow-x-auto">
                        <table class="ds-table w-full text-xs border-collapse">
                            <thead>
                                <tr class="bg-purple-100 dark:bg-purple-900/40 text-purple-900 dark:text-purple-200 text-[11px] uppercase tracking-wider font-bold">
                                    <th class="px-3 py-2.5 w-28">DATE</th>
                                    <th class="px-3 py-2.5 w-24">DAY</th>
                                    <th class="px-3 py-2.5 w-32">TIME</th>
                                    ${dsColumns.map((col, idx) => `
                                        <th class="px-3 py-2.5">
                                            <div class="flex items-center justify-between gap-1 group">
                                                <input class="bg-transparent font-bold uppercase w-full text-center outline-none hover:bg-black/5 dark:hover:bg-white/5 px-1 py-0.5 rounded cursor-pointer text-purple-900 dark:text-purple-200" 
                                                       value="${col.label}" 
                                                       onchange="updateColumnLabel(${idx}, this.value)"
                                                       title="Click to rename column">
                                                <button type="button" onclick="deleteColumn(${idx})" class="text-red-500 hover:text-red-400 text-xs px-1.5 py-0.5 rounded bg-red-500/10 hover:bg-red-500/20 transition cursor-pointer" title="Delete column">✕</button>
                                            </div>
                                        </th>
                                    `).join('')}
                                    <th class="no-print w-12">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.map(row => `
                                    <tr class="hover:bg-black/[0.01] dark:hover:bg-white/[0.02] transition">
                                        <td class="px-2 py-2">
                                            <input type="date" class="row-input w-full bg-transparent px-1 py-1 rounded border border-transparent hover:border-black/10 dark:hover:border-white/10 focus:border-purple-500 text-slate-900 dark:text-white" 
                                                   data-id="${row.id}" data-field="date" value="${row.date || ''}">
                                        </td>
                                        <td class="px-2 py-2 text-slate-500 dark:text-slate-400 font-medium">
                                            ${dayFromDate(row.date)}
                                        </td>
                                        <td class="px-2 py-2">
                                            <input type="text" class="row-input w-full bg-transparent px-1 py-1 rounded border border-transparent hover:border-black/10 dark:hover:border-white/10 focus:border-purple-500 text-slate-900 dark:text-white text-center" 
                                                   data-id="${row.id}" data-field="time" value="${row.time || ''}" placeholder="10:00 AM...">
                                        </td>
                                        ${dsColumns.map(col => `
                                            <td class="px-2 py-2">
                                                <input type="text" class="row-input w-full bg-transparent px-2 py-1 rounded border border-transparent hover:border-black/10 dark:hover:border-white/10 focus:border-purple-500 text-slate-900 dark:text-white" 
                                                       data-id="${row.id}" data-field="${col.key}" value="${row[col.key] || ''}" placeholder="Subject...">
                                            </td>
                                        `).join('')}
                                        <td class="no-print text-center px-2 py-2">
                                            <button onclick="deleteRow('${row.id}')" class="w-7 h-7 rounded-lg bg-red-500/15 hover:bg-red-500/25 text-red-500 font-bold transition flex items-center justify-center mx-auto cursor-pointer" title="Delete date row">✕</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                document.querySelectorAll('.row-input').forEach(input => {
                    input.addEventListener('change', async (e) => {
                        const { id, field } = e.target.dataset;
                        try {
                            await LamaAPI.update(DATESHEET, id, { [field]: e.target.value });
                            if (field === 'date') renderRows();
                        } catch (err) {
                            alert('Could not save: ' + err.message);
                        }
                    });
                });
            }
        }

        async function addRow() {
            try {
                const newRow = { date: '', time: '10:00 AM - 12:00 PM' };
                dsColumns.forEach(c => { newRow[c.key] = ''; });
                await LamaAPI.add(DATESHEET, newRow);
                renderRows();
            } catch (e) {
                alert('Could not add date row: ' + e.message);
            }
        }

        async function deleteRow(id) {
            try {
                await LamaAPI.remove(DATESHEET, id);
                renderRows();
            } catch (e) {
                alert('Could not delete: ' + e.message);
            }
        }

        async function init() {
            await renderHeader();
            await renderRows();
        }

        if (typeof LamaAPI.requireLogin === 'function' ? LamaAPI.requireLogin('school') : true) {
            init();
        }
    </script>
</body>
</html>
