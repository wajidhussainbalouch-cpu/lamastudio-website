<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance & Daily Expenses — Lama School Suite</title><style>body{margin:0;background:#080d1d;color:#e5e7eb;font:15px system-ui,Arial}header{background:#101b33;border-bottom:1px solid #334155;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}main{max-width:1200px;margin:25px auto;padding:0 18px}.panel{background:#111e34;border:1px solid #334155;border-radius:18px;padding:20px;margin-bottom:18px}h1,h2{margin:0 0 15px}label{display:block;font-size:13px;color:#cbd5e1;margin:10px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;background:#0b1426;color:white;border:1px solid #475569;border-radius:9px;padding:11px}textarea{min-height:85px}button,.btn{background:#0ea5e9;color:#03111d;border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#334155;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{background:#172b44;border-radius:12px;padding:14px}.metric strong{font-size:23px;display:block}table{width:100%;border-collapse:collapse;min-width:680px}td,th{text-align:left;padding:10px;border-bottom:1px solid #334155}th{color:#67e8f9}.scroll{overflow:auto}.muted{color:#94a3b8}.err{color:#fca5a5}.ok{color:#6ee7b7}a{color:#67e8f9}nav{display:flex;gap:14px;flex-wrap:wrap}small{color:#94a3b8}@media print{header,.no-print,form,button{display:none!important}body{background:#fff;color:#111}.panel,.metric{background:#fff;color:#111;border:1px solid #aaa}th,small{color:#111}table{min-width:0}}</style></head><body><header><strong>🎓 Lama School Suite · Finance & Daily Expenses</strong><nav><a href="dashboard.html">School Dashboard</a><a href="finance-center.html">Finance</a><a href="leave-manager.html">Leave Manager</a><a href="document-import.html">Import</a><a href="identity-cards.html">ID Cards</a></nav></header><main><h1>Finance & Daily Expenses</h1><p id="notice" aria-live="polite" class="muted"></p><section class="metrics" id="metrics"></section><section class="panel no-print"><h2>Add transaction</h2><form id="txn"><div class="grid"><div><label>Type</label><select id="type"><option value="expenses">Expense</option><option value="income">Other Income</option></select></div><div><label>Date</label><input id="date" type="date" required></div><div><label>Amount (PKR)</label><input id="amount" type="number" min="0.01" step="0.01" required></div><div><label>Category</label><select id="category"><option>Utilities</option><option>Salary</option><option>Stationery</option><option>Maintenance</option><option>Transport</option><option>Rent</option><option>Donation</option><option>Other</option></select></div><div><label>Payment method</label><select id="method"><option>Cash</option><option>Bank</option><option>JazzCash</option><option>Easypaisa</option><option>Other</option></select></div><div><label>Reference</label><input id="reference" maxlength="100"></div><div><label>Vendor / source</label><input id="vendor" maxlength="100"></div></div><label>Description</label><textarea id="description" maxlength="500"></textarea><p><button type="submit">Save transaction</button> <button class="secondary" type="button" onclick="window.print()">Print report / PDF</button> <button class="secondary" type="button" id="csv">Export CSV</button></p></form></section><section class="panel"><h2>Financial ledger</h2><div class="grid no-print"><div><label>From</label><input type="date" id="from"></div><div><label>To</label><input type="date" id="to"></div><div><label>Type</label><select id="filter"><option value="all">All</option><option value="expenses">Expenses</option><option value="income">Other income</option></select></div></div><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Method</th><th>Reference</th><th class="no-print">Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="js/api-client.js"></script><script>const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>'Rs. '+Number(x||0).toLocaleString();const today=()=>new Date().toLocaleDateString('en-CA');function notice(s,er=false){$('notice').textContent=s;$('notice').className=er?'err':'ok'}function err(e){notice(e.message||String(e),true)}if(LamaAPI.requireLogin('school','login.html')){(async()=>{try{let ledger=[];$('date').value=today();const fees=await LamaAPI.list('fees').catch(()=>[]);async function reload(){const [ex,inc]=await Promise.all([LamaAPI.list('expenses'),LamaAPI.list('income')]);ledger=[...ex.map(x=>({...x,type:'expenses'})),...inc.map(x=>({...x,type:'income'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));draw()}function visible(){return ledger.filter(x=>(!$('from').value||x.date>=$('from').value)&&(!$('to').value||x.date<=$('to').value)&&($('filter').value==='all'||x.type===$('filter').value))}function draw(){let rows=visible(),ex=rows.filter(x=>x.type==='expenses').reduce((a,x)=>a+Number(x.amount||0),0),inc=rows.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0);let feeTotal=fees.filter(f=>!$('from').value||String(f.date||f.paymentDate||'')>=$('from').value).filter(f=>!$('to').value||String(f.date||f.paymentDate||'')<=$('to').value).filter(f=>String(f.status||'paid').toLowerCase()==='paid').reduce((a,f)=>a+Number(f.amount||f.paidAmount||0),0);$('metrics').innerHTML=[['Recorded expenses',ex],['Other income',inc],['Fee receipts (existing records)',feeTotal],['Net cash movement',inc+feeTotal-ex]].map(([k,v])=>`<div class="metric"><small>${esc(k)}</small><strong>${money(v)}</strong></div>`).join('');$('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.category)}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${esc(x.paymentMethod)}</td><td>${esc(x.reference)}</td><td class="no-print"><button class="secondary" data-type="${esc(x.type)}" data-id="${esc(x.id)}">Delete</button></td></tr>`).join('')||'<tr><td colspan="8">No transactions yet</td></tr>'}for(const id of ['from','to','filter'])$(id).addEventListener('change',draw);$('txn').onsubmit=async e=>{e.preventDefault();try{await LamaAPI.add($('type').value,{date:$('date').value,amount:Number($('amount').value),category:$('category').value,description:$('description').value,paymentMethod:$('method').value,reference:$('reference').value,vendor:$('vendor').value});$('txn').reset();$('date').value=today();await reload();notice('Transaction saved')}catch(e){err(e)}};$('rows').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b||!confirm('Delete this transaction?'))return;try{await LamaAPI.remove(b.dataset.type,b.dataset.id);await reload();notice('Transaction deleted')}catch(e){err(e)}};$('csv').onclick=()=>{const values=[['Date','Type','Category','Description','Amount','Payment method','Reference'],...visible().map(x=>[x.date,x.type,x.category,x.description,x.amount,x.paymentMethod,x.reference])];const csv=values.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='lama-finance.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};await reload();}catch(e){err(e)}})()}</script></body></html>
