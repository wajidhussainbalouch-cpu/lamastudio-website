<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help & Support · LAMA School Suite</title><style>body{margin:0;background:#edf5f3;color:#183e38;font:16px system-ui}main{max-width:760px;margin:auto;padding:18px}header{background:#104d48;color:#fff;padding:20px;border-radius:16px}a{color:inherit}section{background:#fff;padding:20px;border-radius:16px;margin-top:16px;box-shadow:0 3px 16px #173b3820}input,select,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:7px 0 13px;border:1px solid #a6c6bb;border-radius:10px}button{background:#13675d;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6}article{padding:15px 0;border-top:1px solid #dce8e4;overflow-wrap:anywhere}small{color:#52736b}#message{white-space:pre-wrap} .reply{background:#e8f4ef;padding:12px;border-radius:10px;margin-top:8px}</style></head><body><main><header><a href="dashboard.html">← School Dashboard</a><h1>Help & Support</h1><p>Report a problem to LAMA Studio Super Admin and track the solution here.</p></header><section><h2>Submit a support request</h2><form id="form"><label>Issue category<select id="category"><option>Login & Accounts</option><option>Students & Admissions</option><option>Teachers & Classes</option><option>Attendance</option><option>Fees & Subscription</option><option>Reports & Exams</option><option>Other</option></select></label><label>Subject<input id="subject" minlength="5" maxlength="120" required placeholder="Brief description of the problem"></label><label>Details<textarea id="description" rows="5" minlength="10" maxlength="3000" required placeholder="What happened? Which page? What did you expect?"></textarea></label><button id="send" type="submit">Send to Super Admin</button></form><p id="message" role="status"></p></section><section><h2>My school's requests</h2><button id="refresh" type="button">↻ Refresh tickets</button><div id="tickets"></div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbz8Num29Df94i-TNlX4ggN6nveyVLpoPDo4feStMXV3DuAx-JoRD3nZH1Q90kVuEH57/exec';const el=id=>document.getElementById(id);let auth;try{auth=JSON.parse(sessionStorage.getItem('lama_school_admin_auth')||'null')}catch(_){};if(!auth?.schoolId||!auth?.token){el('message').textContent='School administrator session required. Sign in to the school dashboard first.';el('send').disabled=true;el('refresh').disabled=true}async function api(action,data={}){if(!auth?.schoolId||!auth?.token)throw Error('School administrator login required.');const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,schoolId:auth.schoolId,token:auth.token,...data})});const json=await res.json();if(json.status!=='success')throw Error(json.message||'Request failed');return json}async function load(){el('tickets').textContent='Loading…';try{const result=await api('supportList');el('tickets').replaceChildren();if(!result.tickets.length){el('tickets').textContent='No requests yet.';return}for(const t of result.tickets){const a=document.createElement('article');const title=document.createElement('strong');title.textContent=t.subject+' · '+t.status;const details=document.createElement('p');details.textContent=t.description;const meta=document.createElement('small');meta.textContent=t.ticketId+' · '+t.category+' · '+t.createdAt;a.append(title,meta,details);if(t.reply){const reply=document.createElement('div');reply.className='reply';reply.textContent='Super Admin reply: '+t.reply;a.append(reply)}el('tickets').append(a)}}catch(e){el('tickets').textContent=e.message}}el('refresh').onclick=load;el('form').onsubmit=async e=>{e.preventDefault();el('send').disabled=true;el('message').textContent='Submitting…';try{const result=await api('supportCreate',{category:el('category').value,subject:el('subject').value,description:el('description').value});el('message').textContent='Request submitted. Ticket: '+result.ticket.ticketId;el('form').reset();await load()}catch(err){el('message').textContent=err.message}finally{el('send').disabled=false}};if(auth?.token)load();
</script></body></html>
