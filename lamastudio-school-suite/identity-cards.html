<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lama School Suite | Print ID Cards</title><script src="js/api-client.js"></script><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e9f1ff;background:#0c1425}*{box-sizing:border-box}body{margin:0;padding:24px}header,.toolbar,.notice{max-width:1180px;margin:0 auto 18px}h1{margin:0 0 8px;font-size:25px}p{color:#aebed4}button,select,input{border:1px solid #41536d;border-radius:9px;padding:11px;background:#182640;color:#fff}button{background:#17a9bd;color:#041821;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.08)}.toolbar{background:#16233a;border:1px solid #344660;padding:16px;border-radius:16px;display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolbar label{display:flex;flex-direction:column;gap:5px;font-size:12px}.toolbar input{min-width:200px}.notice{font-size:13px;color:#bdd0e8}.sheet{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}.pair{display:flex;gap:8px;flex-wrap:wrap;break-inside:avoid;page-break-inside:avoid}.card{width:54mm;height:85.6mm;position:relative;background:white;color:#1b2939;border-radius:3mm;overflow:hidden;border:1px solid #d7dce4;box-shadow:0 6px 22px #0004;print-color-adjust:exact;-webkit-print-color-adjust:exact}.card .top{height:32mm;position:relative;background:#202b3b;border-radius:0 0 52% 18%;border-bottom:3mm solid #fff;z-index:0}.card.student .top{background:#1d293a}.card.teacher .top{background:#079ebf}.top:after{content:'';position:absolute;left:-15mm;bottom:-14mm;width:65mm;height:22mm;background:#55d9d9;border-radius:50%;transform:rotate(18deg);z-index:-1}.teacher .top:after{background:#f7a349}.schoolhead{position:absolute;top:5mm;left:4mm;right:4mm;display:flex;align-items:center;gap:2mm;color:white}.logo{width:10mm;height:10mm;border-radius:50%;background:#fff;color:#0c879d;display:grid;place-items:center;object-fit:contain;font-size:12px;font-weight:900;flex-shrink:0}.schoolname{font-size:10px;font-weight:900;line-height:1.1;overflow-wrap:anywhere}.cardtype{font-size:7px;letter-spacing:1px;margin-top:2px}.portrait{position:absolute;top:21mm;left:50%;transform:translateX(-50%);width:25mm;height:25mm;border:1.8mm solid #fff;border-radius:50%;background:#d6e3ec;object-fit:cover;box-shadow:0 2px 8px #0003;display:grid;place-items:center;color:#667788;font-size:10px;z-index:2}.details{position:absolute;top:48mm;left:3.5mm;right:3.5mm;text-align:center}.name{font-size:12px;font-weight:900;line-height:1.1;overflow-wrap:anywhere;text-transform:uppercase}.designation{color:#00a6b9;font-size:9px;font-weight:800;margin:1.5mm 0 2mm}.teacher .designation{color:#e88b1d}.data{width:100%;border-collapse:collapse;text-align:left;font-size:8px}.data td{padding:1.1mm 0;border-bottom:1px solid #71d9dd;vertical-align:top;overflow-wrap:anywhere}.data td:first-child{width:35%;font-weight:700}.teacher .data td{border-color:#f6bd74}.bottomwave{position:absolute;bottom:-9mm;left:-8mm;width:72mm;height:16mm;background:#54dada;border-radius:50%;transform:rotate(-7deg)}.teacher .bottomwave{background:#f9a444}.back{background:#fff}.back .top{height:32mm;border-radius:0 0 55% 35%;background:#fff;border:0}.back .top:after{background:#55d9d9;bottom:-7mm;height:20mm;left:-6mm;transform:rotate(17deg)}.back.teacher .top:after{background:#15b5d3}.back .schoolhead{color:#1b2939}.backbody{padding:8mm 5mm 0;font-size:9px;line-height:1.5}.backbody strong{font-size:10px}.backbody ul{padding-left:4mm}.backbody li{margin:2.5mm 0}.signature{position:absolute;bottom:15mm;left:6mm;right:6mm;border-top:1px solid #3d8192;text-align:center;padding-top:2mm;font-size:8px;font-weight:800}.back .bottomwave{height:11mm;bottom:-6mm}.back.teacher .bottomwave{background:#f5a348}.hint{font-size:9px;color:#516577;margin-top:2mm}.empty{padding:24px;border:1px dashed #66758a;border-radius:10px}.checkbox{flex-direction:row!important;align-items:center}.checkbox input{min-width:0}.watermark{position:absolute;bottom:5mm;right:4mm;font-size:7px;color:#6b7280}@page{size:A4;margin:10mm}@media print{body{padding:0;background:#fff}header,.toolbar,.notice{display:none!important}.sheet{max-width:none;display:flex;gap:3mm}.pair{gap:2mm;margin:0 0 3mm}.card{box-shadow:none;border:.2mm solid #e2e8f0;border-radius:2mm}*{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}}
</style></head><body><header><h1>School Identity Cards</h1><p>Double-sided student and employee cards · 54 × 85.6 mm portrait · A4 print-ready</p></header><section class="toolbar"><label>Card type<select id="kind"><option value="students">Student</option><option value="teachers">Teacher / Employee</option></select></label><label>Search<input id="search" placeholder="Name, ID or class"></label><label>Print cards<select id="scope"><option value="one">Selected person</option><option value="all">All matching people</option></select></label><label>Select person<select id="person"></select></label><label class="checkbox"><input type="checkbox" id="backs" checked> Include back side</label><button id="print">Print / Save as PDF</button></section><div id="status" class="notice">Loading school records…</div><main id="cards" class="sheet"></main><script>
'use strict';const $=x=>document.getElementById(x);const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=x=>escapeHtml(x||'—');let records=[],school={},role='',allowedKind='';const fields={student:[['Student ID','enrlNo'],['Class','class'],['Guardian','fatherGuardian'],['Date of birth','dob'],['Contact','contact']],teacher:[['Employee ID','loginId'],['Subject','subject'],['Designation','designation'],['Contact','contact'],['Joined','joiningDate']]};function safeImg(v){try{const u=new URL(v,location.href);return ['https:','http:','data:'].includes(u.protocol)?escapeHtml(u.href):''}catch{return ''}}function logo(){const url=safeImg(school.logo);return url?`<img class="logo" src="${url}" alt="School logo">`:'<div class="logo">LS</div>'}function head(type,back){return `<div class="top"><div class="schoolhead">${logo()}<div><div class="schoolname">${clean(school.name||'SCHOOL NAME')}</div><div class="cardtype">${back?'IDENTITY CARD · REVERSE':type==='student'?'STUDENT ID CARD':'EMPLOYEE ID CARD'}</div></div></div></div>`}function front(r,type){const photo=safeImg(r.photo||r.photoUrl||r.image);const id=type==='student'?(r.enrlNo||r.admissionNo||r.id):(r.loginId||r.teacherId||r.email||r.id);const normalized={...r,loginId:id,enrlNo:id};return `<article class="card ${type}">${head(type,false)}${photo?`<img class="portrait" src="${photo}" alt="Portrait">`:'<div class="portrait">PHOTO</div>'}<div class="details"><div class="name">${clean(r.name)}</div><div class="designation">${clean(type==='student'?'STUDENT':r.designation||'TEACHER')}</div><table class="data">${fields[type].map(([label,key])=>`<tr><td>${label}</td><td>${clean(normalized[key])}</td></tr>`).join('')}</table></div><div class="bottomwave"></div></article>`}function back(type){return `<article class="card back ${type}">${head(type,true)}<div class="backbody"><strong>Rules & Instructions</strong><ul><li>This card must be carried while on school premises.</li><li>Report a lost or damaged card to the school office.</li><li>This card belongs to the issuing school.</li><li>Return the card when enrollment or employment ends.</li></ul><div class="hint">${clean(school.address||'School address')}<div>${clean(school.phone||'School contact')}</div></div></div><div class="signature">AUTHORIZING SIGNATURE</div><div class="bottomwave"></div></article>`}function key(r){return String(r.id||r.enrlNo||r.loginId||r.email||r.name)}function render(){const q=$('search').value.toLowerCase().trim();const filtered=records.filter(r=>[r.name,r.enrlNo,r.loginId,r.teacherId,r.email,r.class].some(x=>String(x||'').toLowerCase().includes(q)));const prev=$('person').value;$('person').innerHTML=filtered.map(r=>`<option value="${escapeHtml(key(r))}">${clean(r.name)} — ${clean(r.enrlNo||r.loginId||r.teacherId||r.email)}</option>`).join('');if(filtered.some(r=>key(r)===prev))$('person').value=prev;const chosen=$('scope').value==='all'?filtered:filtered.filter(r=>key(r)===$('person').value);const type=$('kind').value==='students'?'student':'teacher';$('cards').innerHTML=chosen.map(r=>`<div class="pair">${front(r,type)}${$('backs').checked?back(type):''}</div>`).join('')||'<div class="empty">No cards to preview.</div>';$('status').textContent=`${chosen.length} card(s) ready. In Print settings choose A4, scale 100%, and enable Background graphics. For double-sided physical printing, confirm front/back alignment with a test sheet.`}async function load(){try{const requested=new URLSearchParams(location.search).get('role');const choices=['school','teacher','student'];role=choices.includes(requested)?requested:(choices.find(x=>LamaAPI.getSession(x))||'');if(!role||!LamaAPI.getSession(role)){location.href=role==='teacher'?'teacher-login.html':role==='student'?'student-login.html':'login.html';return}if(typeof LamaAPI.requireLogin==='function')LamaAPI.requireLogin(role);allowedKind=role==='teacher'?'teachers':role==='student'?'students':'';if(allowedKind){$('kind').value=allowedKind;$('kind').disabled=true;$('scope').value='one';$('scope').disabled=true;$('search').disabled=true;$('person').disabled=true}const s=LamaAPI.getSession(role);school={name:s.schoolName||s.school?.name||'School',logo:s.schoolLogo||s.logo||'',address:s.schoolAddress||'',phone:s.schoolPhone||''};if(role==='school'){records=await LamaAPI.list($('kind').value)}else if(role==='student'){const r=await LamaAPI.get('students',s.studentId||s.id);records=r?[r]:[]}else{records=[{...s,id:s.teacherId||s.id,loginId:s.loginId||s.email}]}render()}catch(e){$('status').textContent='Could not load cards: '+e.message}}$('kind').addEventListener('change',()=>{if(role==='school')load();});['search','scope','person','backs'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('print').addEventListener('click',()=>window.print());load();
</script></body></html>
