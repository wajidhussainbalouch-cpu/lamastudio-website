<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave Request Management — Lama School Suite</title><style>body{margin:0;background:#080d1d;color:#e5e7eb;font:15px system-ui,Arial}header{background:#101b33;border-bottom:1px solid #334155;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}main{max-width:1200px;margin:25px auto;padding:0 18px}.panel{background:#111e34;border:1px solid #334155;border-radius:18px;padding:20px;margin-bottom:18px}h1,h2{margin:0 0 15px}label{display:block;font-size:13px;color:#cbd5e1;margin:10px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;background:#0b1426;color:white;border:1px solid #475569;border-radius:9px;padding:11px}textarea{min-height:85px}button,.btn{background:#0ea5e9;color:#03111d;border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#334155;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{background:#172b44;border-radius:12px;padding:14px}.metric strong{font-size:23px;display:block}table{width:100%;border-collapse:collapse;min-width:680px}td,th{text-align:left;padding:10px;border-bottom:1px solid #334155}th{color:#67e8f9}.scroll{overflow:auto}.muted{color:#94a3b8}.err{color:#fca5a5}.ok{color:#6ee7b7}a{color:#67e8f9}nav{display:flex;gap:14px;flex-wrap:wrap}small{color:#94a3b8}@media print{header,.no-print,form,button{display:none!important}body{background:#fff;color:#111}.panel,.metric{background:#fff;color:#111;border:1px solid #aaa}th,small{color:#111}table{min-width:0}}</style></head><body><header><strong>🎓 Lama School Suite · Leave Request Management</strong><nav><a href="dashboard.html">School Dashboard</a><a href="finance-center.html">Finance</a><a href="leave-manager.html">Leave Manager</a><a href="document-import.html">Import</a><a href="identity-cards.html">ID Cards</a></nav></header><main><h1>Leave Request Management</h1><p id="notice" aria-live="polite" class="muted"></p><section class="metrics" id="stats"></section><section class="panel"><h2>Teacher leave requests</h2><div class="scroll"><table><thead><tr><th>Teacher</th><th>From</th><th>To</th><th>Reason</th><th>Status</th><th>Admin reply</th><th>Decision</th></tr></thead><tbody id="teacherRows"></tbody></table></div></section><section class="panel"><h2>Student leave & help requests</h2><div class="scroll"><table><thead><tr><th>Student</th><th>Class</th><th>Request</th><th>Dates</th><th>Message</th><th>Status</th><th>Action</th></tr></thead><tbody id="studentRows"></tbody></table></div></section></main><script src="js/api-client.js"></script><script>const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>'Rs. '+Number(x||0).toLocaleString();const today=()=>new Date().toLocaleDateString('en-CA');function notice(s,er=false){$('notice').textContent=s;$('notice').className=er?'err':'ok'}function err(e){notice(e.message||String(e),true)}if(LamaAPI.requireLogin('school','login.html')){(async()=>{try{async function load(){const [ts,ss]=await Promise.all([LamaAPI.list('teacherLeaves'),LamaAPI.list('studentRequests')]);$('stats').innerHTML=[['Pending teacher leave',ts.filter(x=>x.status==='Pending').length],['Pending student requests',ss.filter(x=>x.status==='Pending').length]].map(([k,v])=>`<div class="metric"><small>${esc(k)}</small><strong>${v}</strong></div>`).join('');$('teacherRows').innerHTML=ts.map(x=>`<tr><td>${esc(x.teacherName)}</td><td>${esc(x.leaveFrom)}</td><td>${esc(x.leaveTo)}</td><td>${esc(x.reason)}</td><td>${esc(x.status)}</td><td>${esc(x.adminReply)}</td><td><button data-kind="teacherLeaves" data-id="${esc(x.id)}" data-status="Approved">Approve</button> <button class="secondary" data-kind="teacherLeaves" data-id="${esc(x.id)}" data-status="Rejected">Reject</button></td></tr>`).join('')||'<tr><td colspan="7">No requests</td></tr>';$('studentRows').innerHTML=ss.map(x=>`<tr><td>${esc(x.studentName)}</td><td>${esc(x.class)}</td><td>${esc(x.requestType)}</td><td>${esc(x.leaveFrom)} — ${esc(x.leaveTo)}</td><td>${esc(x.message)}</td><td>${esc(x.status)}</td><td><button data-kind="studentRequests" data-id="${esc(x.id)}" data-status="Approved">Approve</button> <button class="secondary" data-kind="studentRequests" data-id="${esc(x.id)}" data-status="Rejected">Reject</button></td></tr>`).join('')||'<tr><td colspan="7">No requests</td></tr>'}document.querySelector('main').onclick=async e=>{const b=e.target.closest('button[data-kind]');if(!b)return;const reply=prompt('Optional message to applicant:')??'';try{await LamaAPI.update(b.dataset.kind,b.dataset.id,b.dataset.kind==='teacherLeaves'?{status:b.dataset.status,adminReply:reply}:{status:b.dataset.status,adminReply:reply});await load();notice('Decision saved')}catch(e){err(e)}};await load();}catch(e){err(e)}})()}</script></body></html>
