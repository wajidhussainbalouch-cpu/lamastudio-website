<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Login | lamastudio.pk</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/85 backdrop-blur-md py-4 px-6 md:px-12 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">lamastudio<span class="text-indigo-600 dark:text-indigo-400">.pk</span></h1>
                <p class="text-xs text-slate-500">School Portal Login</p>
            </div>
        </div>
        <a href="index.html" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">New School? Register</a>
    </header>

    <main class="max-w-md mx-auto px-6 py-12 flex-grow flex flex-col justify-center w-full">
        <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-2xl p-8 shadow-2xl">
            <div class="mb-6">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white">Welcome Back</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your admin credentials to access your dashboard.</p>
            </div>

            <div id="loginError" class="hidden bg-red-500/10 border border-red-500/30 p-3 rounded-xl text-red-600 dark:text-red-400 text-xs mb-4">
                Invalid Username or Password. Please try again.
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Admin Username</label>
                    <input type="text" id="loginUsername" required placeholder="e.g., principal_almadina" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Admin Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 mt-2">
                    Login to Dashboard 🚀
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 lamastudio.pk</p>
    </footer>

    <script>
        if(localStorage.getItem('lamastudio_theme') === 'dark') document.documentElement.classList.add('dark');

        function handleLogin(event) {
            event.preventDefault();
            const inputUser = document.getElementById('loginUsername').value.trim();
            const inputPass = document.getElementById('loginPassword').value.trim();

            const savedUser = localStorage.getItem('lamastudio_admin_username');
            const savedPass = localStorage.getItem('lamastudio_admin_password');

            // If no school registered yet, fallback for easy testing
            const targetUser = savedUser ? savedUser : 'admin';
            const targetPass = savedPass ? savedPass : 'password';

            if (inputUser === targetUser && inputPass === targetPass) {
                localStorage.setItem('lamastudio_logged_in', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
