<!-- Scripts -->
    <script src="js/api.js"></script>
    <script>
        window.togglePasswordVisibility = function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = '👁️';
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            // Reset UI States
            errorMsg.classList.add('hidden');
            errorMsg.textContent = '';
            
            // Set Loading State
            setLoadingState(submitBtn, true);

            try {
                // Fetch directly from the cloud spreadsheet API
                const schools = await ApiClient.getAll();
                
                if (!Array.isArray(schools)) {
                    throw new Error("Invalid response format received from cloud database.");
                }
                
                // Match credential against cloud records with flexible key lookups
                const matchedSchool = schools.find(school => {
                    // Handle various possible key formats returned by Google Sheets Apps Script
                    const email = (school.adminEmail || school.adminemail || school.AdminEmail || "").toLowerCase();
                    const code = (school.schoolCodeId || school.schoolcodeid || school.SchoolCodeId || school.schoolId || "").toLowerCase();
                    const pass = school.adminPassword || school.adminpassword || school.AdminPassword || "";
                    const accountStatus = school.status || school.Status || "Active";

                    const isValidIdentifier = (email === identifier || code === identifier);
                    const isValidPassword = (pass === password);

                    // Store status temporarily for validation check below
                    school._resolvedStatus = accountStatus;

                    return isValidIdentifier && isValidPassword;
                });

                if (!matchedSchool) {
                    throw new Error("Invalid email/school code or password. Please try again.");
                }

                if (matchedSchool._resolvedStatus && matchedSchool._resolvedStatus !== "Active") {
                    throw new Error("Account is inactive or pending approval. Contact system administrator.");
                }

                // Cache active tenant session locally strictly for dashboard session handling
                localStorage.setItem('activeSchool', JSON.stringify(matchedSchool));
                
                // Success State & Redirect
                submitBtn.className = "w-full bg-emerald-600 text-white font-medium py-2.5 rounded-lg shadow-lg flex items-center justify-center gap-2 text-xs transition-colors";
                submitBtn.textContent = 'Success! Redirecting...';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);

            } catch (err) {
                errorMsg.textContent = err.message || "Failed to connect to authentication server.";
                errorMsg.classList.remove('hidden');
                setLoadingState(submitBtn, false);
            }
        });

        function setLoadingState(button, isLoading) {
            button.disabled = isLoading;
            if (isLoading) {
                button.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Authenticating with Cloud...</span>
                `;
            } else {
                button.innerHTML = `<span>Access ERP Dashboard</span>`;
            }
        }
    </script>
