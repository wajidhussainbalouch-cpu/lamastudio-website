<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - lamastudio.pk Cloud ERP</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800/80 rounded-2xl shadow-2xl p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <span class="inline-block px-3 py-1 text-xs font-semibold bg-indigo-500/10 text-indigo-400 rounded-full border border-indigo-500/20">
                lamastudio.pk Cloud ERP
            </span>
            <h1 class="text-2xl font-bold tracking-tight text-white">Admin Portal Login</h1>
            <p class="text-xs text-slate-400">Enter your credentials or School ID to access your ERP</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            
            <div class="space-y-1.5">
                <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider">Admin Email or School Code ID</label>
                <input type="text" id="identifier" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600"
                    placeholder="e.g. admin@school.com or SCH-001">
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <input type="password" id="password" required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600 pr-10"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 cursor-pointer text-xs">
                        <span id="eyeIcon">👁️</span>
                    </button>
                </div>
            </div>

            <!-- Error Feedback Box -->
            <div id="errorMsg" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg p-3 text-center"></div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition-all shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 cursor-pointer text-xs tracking-wide">
                <span>Access ERP Dashboard</span>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center text-xs text-slate-500 border-t border-slate-800/60 pt-4">
            Don't have an active school account? 
            <a href="register.html" class="text-indigo-400 hover:underline font-medium">Register your school</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script>
        window.togglePasswordVisibility = function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = '👁️';
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            // Reset UI States
            errorMsg.classList.add('hidden');
            errorMsg.textContent = '';
            
            // Set Loading State
            setLoadingState(submitBtn, true);

            try {
                // Fetch directly from the cloud spreadsheet API
                const schools = await ApiClient.getAll();
                
                // Match credential against cloud records
                const matchedSchool = schools.find(school => {
                    const email = (school.adminEmail || "").toLowerCase();
                    const code = (school.schoolCodeId || "").toLowerCase();
                    const pass = school.adminPassword || "";

                    const isValidIdentifier = (email === identifier || code === identifier);
                    const isValidPassword = (pass === password);

                    return isValidIdentifier && isValidPassword;
                });

                if (!matchedSchool) {
                    throw new Error("Invalid email/school code or password. Please try again.");
                }

                if (matchedSchool.status && matchedSchool.status !== "Active") {
                    throw new Error("Account is inactive or pending approval. Contact system administrator.");
                }

                // Cache active tenant session locally strictly for dashboard session handling
                localStorage.setItem('activeSchool', JSON.stringify(matchedSchool));
                
                // Success State & Redirect
                submitBtn.className = "w-full bg-emerald-600 text-white font-medium py-2.5 rounded-lg shadow-lg flex items-center justify-center gap-2 text-xs transition-colors";
                submitBtn.textContent = 'Success! Redirecting...';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);

            } catch (err) {
                errorMsg.textContent = err.message || "Failed to connect to authentication server.";
                errorMsg.classList.remove('hidden');
                setLoadingState(submitBtn, false);
            }
        });

        function setLoadingState(button, isLoading) {
            button.disabled = isLoading;
            if (isLoading) {
                button.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Authenticating with Cloud...</span>
                `;
            } else {
                button.innerHTML = `<span>Access ERP Dashboard</span>`;
            }
        }
    </script>
</body>
</html>
