
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Login | LamaStudio School Suite</title>
    <meta name="description" content="Secure school administrator login for LamaStudio School Suite.">
    <meta name="robots" content="noindex, nofollow">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/config.css">
    <script src="js/api-client.js"></script>
</head>

<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <main class="cyber-card max-w-sm w-full rounded-2xl p-8 space-y-5">

        <!-- Branding -->
        <div class="text-center space-y-1">
            <div class="w-12 h-12 mx-auto rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white font-black text-lg">
                LS
            </div>

            <h1 class="text-lg font-black uppercase tracking-wide glow-text-purple">
                School Login
            </h1>

            <p class="text-[11px] text-slate-400">
                LamaStudio School Suite
            </p>
        </div>

        <!-- Error Message -->
        <div
            id="errorBanner"
            role="alert"
            aria-live="polite"
            class="hidden bg-red-500/10 border border-red-500/30 text-red-300 text-xs rounded-xl px-4 py-2.5">
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4 text-xs">

            <!-- Email -->
            <div>
                <label for="inEmail" class="block text-[11px] text-slate-400 mb-1">
                    Admin Email
                </label>

                <input
                    required
                    type="email"
                    id="inEmail"
                    name="email"
                    autocomplete="username"
                    placeholder="principal@school.edu.pk"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-3 text-white outline-none focus:border-purple-500 transition">
            </div>

            <!-- Password -->
            <div>
                <label for="inPassword" class="block text-[11px] text-slate-400 mb-1">
                    Password
                </label>

                <div class="relative">
                    <input
                        required
                        type="password"
                        id="inPassword"
                        name="password"
                        autocomplete="current-password"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-3 pr-12 text-white outline-none focus:border-purple-500 transition">

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                        aria-pressed="false"
                        title="Show password"
                        class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-slate-400 hover:text-purple-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-purple-500 rounded-r-lg transition">

                        <!-- Eye icon -->
                        <svg
                            id="eyeOpen"
                            xmlns="http://www.w3.org/2000/svg"
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>

                        <!-- Eye-off icon -->
                        <svg
                            id="eyeClosed"
                            class="hidden"
                            xmlns="http://www.w3.org/2000/svg"
                            width="19"
                            height="19"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M3 3l18 18"/>
                            <path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a15.3 15.3 0 0 1-3.1 3.8"/>
                            <path d="M6.5 6.5C3.5 8.5 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1.1"/>
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:opacity-90 disabled:opacity-60 disabled:cursor-not-allowed text-white font-black text-xs px-4 py-3 rounded-xl transition shadow-[0_0_20px_rgba(168,85,247,0.3))]">

                Log In
            </button>
        </form>

        <!-- Registration -->
        <p class="text-center text-[11px] text-slate-400">
            New school?
            <a href="register.html" class="text-purple-400 font-bold hover:underline">
                Register here
            </a>
        </p>
    </main>

    <script>
        (() => {
            'use strict';

            const form = document.getElementById('loginForm');
            const errorBanner = document.getElementById('errorBanner');
            const submitBtn = document.getElementById('submitBtn');

            const emailInput = document.getElementById('inEmail');
            const passwordInput = document.getElementById('inPassword');

            const togglePassword = document.getElementById('togglePassword');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');

            // Show or hide password
            togglePassword.addEventListener('click', () => {
                const isVisible = passwordInput.type === 'password';

                passwordInput.type = isVisible ? 'text' : 'password';

                eyeOpen.classList.toggle('hidden', isVisible);
                eyeClosed.classList.toggle('hidden', !isVisible);

                const label = isVisible ? 'Hide password' : 'Show password';

                togglePassword.setAttribute('aria-label', label);
                togglePassword.setAttribute('aria-pressed', String(isVisible));
                togglePassword.title = label;
            });

            function showError(message) {
                errorBanner.textContent = message;
                errorBanner.classList.remove('hidden');
            }

            function setLoading(loading) {
                submitBtn.disabled = loading;
                submitBtn.textContent = loading ? 'Logging in...' : 'Log In';
            }

            // Check API client availability
            if (typeof LamaAPI === 'undefined') {
                showError('API client could not load. Please refresh the page.');
                submitBtn.disabled = true;
                return;
            }

            // Redirect existing school sessions
            try {
                if (LamaAPI.isLoggedIn('school')) {
                    window.location.replace('dashboard.html');
                    return;
                }
            } catch (error) {
                console.error('Session check failed:', error);
            }

            // Login handler
            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                errorBanner.classList.add('hidden');
                setLoading(true);

                try {
                    await LamaAPI.login(
                        emailInput.value.trim(),
                        passwordInput.value
                    );

                    window.location.replace('dashboard.html');

                } catch (error) {
                    showError(error.message || 'Login failed. Please try again.');
                    setLoading(false);
                }
            });
        })();
    </script>
</body>
</html>
