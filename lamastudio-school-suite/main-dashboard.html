<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">School Board</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/config.css">
<script src="js/api-client.js"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen pb-10">

    <!-- Cover Photo Banner -->
    <div id="coverBanner" class="w-full h-40 sm:h-56 bg-gradient-to-br from-indigo-900 via-slate-900 to-purple-900 bg-cover bg-center relative">
        <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-[#0b0f19]/40 to-transparent"></div>
        <a href="#" id="backLink" class="absolute top-4 right-4 bg-slate-900/80 hover:bg-slate-800 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition backdrop-blur">&larr; Back</a>
    </div>

    <!-- School Identity -->
    <div class="max-w-3xl mx-auto px-4 -mt-12 sm:-mt-14 relative z-10 text-center">
        <div id="schoolLogoBox" class="w-20 h-20 sm:w-24 sm:h-24 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-2xl font-black text-white shadow-2xl border-4 border-[#0b0f19]">SCH</div>
        <h1 id="headerSchoolName" class="text-2xl sm:text-4xl font-black text-white mt-3 tracking-tight">School Name</h1>
        <p id="headerSchoolMeta" class="text-xs sm:text-sm text-slate-400 mt-1">Address • Level</p>
    </div>

    <main class="max-w-3xl mx-auto px-4 py-6 space-y-6">

        <!-- Small Admin / Teacher pills -->
        <div class="flex justify-center gap-2">
            <a id="adminPortalLink" href="login.html" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold text-[11px] px-4 py-2 rounded-full transition flex items-center gap-1.5">🏛️ Admin Portal</a>
            <a id="teacherPortalLink" href="portal-login.html" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold text-[11px] px-4 py-2 rounded-full transition flex items-center gap-1.5">👩‍🏫 Teacher Portal</a>
        </div>

        <!-- BIG Student & Parent Portal CTA -->
        <a id="studentPortalLink" href="portal-login.html" class="block bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:opacity-95 rounded-3xl p-6 sm:p-8 text-center shadow-[0_0_40px_rgba(139,92,246,0.35)] transition">
            <span class="text-4xl sm:text-5xl">🎓</span>
            <h2 class="text-xl sm:text-2xl font-black text-white mt-2">Student & Parent Portal</h2>
            <p class="text-xs sm:text-sm text-white/80 mt-1">Check results, homework, attendance, and school notices here</p>
        </a>

        <!-- Exams & Tests -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <section id="examsSection" class="cyber-card rounded-2xl p-4 hidden">
                <h2 class="text-[10px] font-black uppercase text-cyan-400 mb-2">📅 Upcoming Exams</h2>
                <div id="examsList" class="space-y-1.5"></div>
            </section>
            <section id="testsSection" class="cyber-card-amber rounded-2xl p-4 hidden">
                <h2 class="text-[10px] font-black uppercase text-amber-400 mb-2">📝 Upcoming Tests & Quizzes</h2>
                <div id="testsList" class="space-y-1.5"></div>
            </section>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Notices -->
            <section class="cyber-card rounded-2xl p-5">
                <h2 class="text-xs font-black uppercase text-indigo-400 mb-3 border-b border-slate-800 pb-2">📢 Notices</h2>
                <div id="noticesList" class="space-y-2.5 text-xs"></div>
                <p id="noticesEmpty" class="text-center text-xs text-slate-500 py-6 hidden">No notices yet.</p>
            </section>

            <!-- Activities: Sports / Extracurricular / Plantation -->
            <section class="cyber-card-emerald rounded-2xl p-5">
                <h2 class="text-xs font-black uppercase text-emerald-400 mb-3 border-b border-slate-800 pb-2">🌱 Activities & Events</h2>
                <div id="activitiesList" class="space-y-2.5 text-xs"></div>
                <p id="activitiesEmpty" class="text-center text-xs text-slate-500 py-6 hidden">Nothing posted yet.</p>
            </section>
        </div>

        <!-- Resources, grouped by category -->
        <section id="resourcesContainer" class="space-y-4"></section>
    </main>

    <script>
        const ACTIVITY_ICONS = { Sports: '⚽', Extracurricular: '🎨', Plantation: '🌳', Other: '📌' };

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d)) return String(iso);
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function backLinkFor(role) {
            if (role === 'teacher') return 'portals/teacher/index.html';
            if (role === 'student') return 'portals/student/index.html';
            return 'dashboard.html';
        }

        function wirePortalLinks(role) {
            document.getElementById('adminPortalLink').href = role === 'school' ? 'dashboard.html' : 'login.html';
            document.getElementById('teacherPortalLink').href = role === 'teacher' ? 'portals/teacher/index.html' : 'portal-login.html';
            document.getElementById('studentPortalLink').href = role === 'student' ? 'portals/student/index.html' : 'portal-login.html';
        }

        function groupByCategory(items) {
            const groups = {};
            items.forEach(r => {
                const cat = r.category || 'Other';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(r);
            });
            return groups;
        }

        async function render() {
            const session = LamaAPI.getSession();
            document.getElementById('backLink').href = backLinkFor(session.role);
            wirePortalLinks(session.role);

            let data;
            try {
                data = await LamaAPI.getMainDashboardData();
            } catch (e) {
                alert('Could not load the school board: ' + e.message);
                return;
            }

            document.getElementById('pageTitle').innerText = `${data.schoolName || 'School'} | School Board`;
            document.getElementById('headerSchoolName').innerText = data.schoolName || 'School';
            document.getElementById('headerSchoolMeta').innerText = [data.address, data.level].filter(Boolean).join(' • ') || 'School Board';

            const logoBox = document.getElementById('schoolLogoBox');
            if (data.logo) {
                logoBox.innerHTML = `<img src="${data.logo}" class="w-full h-full object-cover rounded-2xl">`;
            } else {
                logoBox.innerText = LamaAPI.deriveShortCode(data.schoolName || 'SCH');
            }

            if (data.coverPhoto) {
                document.getElementById('coverBanner').style.backgroundImage = `url('${data.coverPhoto}')`;
            }

            // Notices
            const notices = data.recentNotifications || [];
            document.getElementById('noticesEmpty').classList.toggle('hidden', notices.length > 0);
            document.getElementById('noticesList').innerHTML = notices.map(n => `
                <div class="bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2">
                    <p class="font-bold text-white">${n.title}</p>
                    <p class="text-slate-400 mt-0.5">${n.message}</p>
                </div>
            `).join('');

            // Activities
            const activities = data.recentActivities || [];
            document.getElementById('activitiesEmpty').classList.toggle('hidden', activities.length > 0);
            document.getElementById('activitiesList').innerHTML = activities.map(a => `
                <div class="bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2 flex gap-2">
                    <span class="text-base">${ACTIVITY_ICONS[a.type] || '📌'}</span>
                    <div>
                        <p class="font-bold text-white">${a.title}</p>
                        <p class="text-slate-400 mt-0.5">${a.description || ''}</p>
                        <p class="text-[10px] text-emerald-400 mt-1">${formatDate(a.date)}</p>
                    </div>
                </div>
            `).join('');

            // Upcoming exams
            const exams = data.upcomingExams || [];
            document.getElementById('examsSection').classList.toggle('hidden', exams.length === 0);
            document.getElementById('examsList').innerHTML = exams.map(e => `
                <div class="bg-slate-950/60 border border-slate-800 rounded-lg px-3 py-1.5 text-[11px]">
                    <b>${e.examTitle || 'Exam'}</b> — Class ${e.class} ${e.subject || ''} • ${formatDate(e.date)}
                </div>
            `).join('');

            // Upcoming tests
            const tests = data.upcomingTests || [];
            document.getElementById('testsSection').classList.toggle('hidden', tests.length === 0);
            document.getElementById('testsList').innerHTML = tests.map(t => `
                <div class="bg-slate-950/60 border border-slate-800 rounded-lg px-3 py-1.5 text-[11px]">
                    <b>${t.subject}</b> (${t.type || 'Test'}) — Class ${t.class} • ${formatDate(t.date)}
                </div>
            `).join('');

            // Resources, grouped
            const groups = groupByCategory(data.resources || []);
            document.getElementById('resourcesContainer').innerHTML = Object.keys(groups).sort().map(cat => `
                <section class="cyber-card rounded-2xl p-5">
                    <h2 class="text-xs font-black uppercase text-purple-400 mb-3 border-b border-slate-800 pb-2">📚 ${cat}</h2>
                    <div class="space-y-2 text-xs">
                        ${groups[cat].map(r => `
                            <div class="bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2">
                                <p class="font-bold text-white">${r.title}</p>
                                ${r.description ? `<p class="text-slate-400 mt-0.5">${r.description}</p>` : ''}
                                ${r.link ? `<a href="${r.link}" target="_blank" class="text-cyan-400 underline mt-1 inline-block">Open link &rarr;</a>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </section>
            `).join('');
        }

        const session = LamaAPI.getSession();
        if (!session || !['school', 'teacher', 'student'].includes(session.role)) {
            window.location.href = 'login.html';
        } else {
            render();
        }
    </script>
</body>
</html>
