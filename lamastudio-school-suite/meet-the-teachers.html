<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet Our Teachers | Lama School Suite</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffef0;color:#263449;font:16px/1.6 system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:24px}header{text-align:center;padding:35px 12px;background:#fff6ca;border-bottom:6px solid #67e9d2}h1{font-family:Georgia,serif;color:#e95c9e;font-size:clamp(32px,5vw,56px);margin:0}header p{color:#655c83;font-weight:700}.school-logo{height:70px;max-width:100px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:22px;margin-top:24px}.card{border-radius:22px;background:#fff;border:3px solid #64e5d3;overflow:hidden;box-shadow:0 8px 28px #17304a15}.portrait{height:210px;display:grid;place-items:center;background:linear-gradient(135deg,#fbc4dc,#a9fff0);color:#7e4372;font-size:72px}.portrait img{width:100%;height:100%;object-fit:cover}.inner{padding:20px}.inner h2{margin:0;color:#a54c9e}.role{color:#168a9a;font-weight:800}.tag{display:inline-block;background:#f5eaff;border-radius:30px;padding:3px 10px;font-size:13px;margin:3px}.bio{white-space:pre-line;overflow-wrap:anywhere}a{color:#0a7190}.muted{color:#56647a}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:15px 0;padding:13px;border:1px solid #ddd6fe;border-radius:14px;background:white}.toolbar select,.toolbar button{padding:9px 12px;border-radius:9px;border:1px solid #bbb;background:white;font:inherit}.toolbar button{background:#0e7490;color:white;border:0;cursor:pointer}.grid.poster{display:block}.poster .card{max-width:760px;margin:0 auto 26px;border:0;border-radius:0;background:#fffde3;min-height:1010px;padding:38px 44px;position:relative;box-shadow:0 12px 35px #34415a2b;overflow:hidden}.poster .card:before{content:'🌷 🌿 🌼 🌸';display:block;text-align:right;font-size:46px;letter-spacing:15px}.poster .portrait{float:left;width:39%;height:350px;margin:12px 25px 15px 0;border:9px solid #f38cb7;border-radius:20px;overflow:hidden;background:#f9d4e3}.poster .inner{padding:0}.poster .inner h2{font:700 clamp(30px,5vw,52px)/1.2 Georgia,serif;color:#a97bdc;margin:10px 0 8px}.poster .role{font-size:20px}.poster .bio{background:#e5fff0;border:4px solid #62e5ce;border-radius:18px;padding:16px;min-height:120px}.poster .inner p{line-height:1.8}.poster .card:after{content:'🌿  🌷  🌼';display:block;clear:both;text-align:right;font-size:45px;margin-top:45px}.grid.modern .card{border-color:#1fb7cf;border-radius:24px}.modern .portrait{background:linear-gradient(120deg,#d8f8ff,#ffe3bd)}.grid.classic .card{border:1px solid #d6dde7;border-radius:9px}.classic .portrait{background:#f1f5f9}.classic .inner h2{color:#15324e}.classic .role{color:#23688c}footer{text-align:center;padding:30px;font-size:12px;color:#6c7180}@media(max-width:600px){.poster .card{padding:20px;min-height:0}.poster .portrait{float:none;width:100%;height:310px;margin:12px 0}.poster .card:before{font-size:28px;letter-spacing:6px}.poster .card:after{font-size:30px}}@media print{.toolbar{display:none!important}.poster .card{box-shadow:none;max-width:none;min-height:0;break-after:page;padding:10mm}.grid.poster{margin:0}.grid.poster .card{height:260mm}.wrap{padding:0}header{padding:15px}.card{break-inside:avoid}footer{padding:10px}@page{size:A4;margin:12mm}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>.faculty-photo{display:block;width:100%;height:230px;object-fit:cover;border-radius:14px}.faculty-qr{margin:12px auto;width:88px;height:88px}.faculty-qr img{width:88px;height:88px}@media print{.faculty-qr{break-inside:avoid}.card{break-inside:avoid}}</style></head><body><header><img id="logo" class="school-logo" alt="School logo" hidden><h1>Meet Our Teachers</h1><p id="school">Our School Faculty</p></header><main class="wrap"><div class="toolbar"><label for="design">Display design</label><select id="design"><option value="watercolor">🌸 Watercolor teacher poster</option><option value="modern">✨ Modern faculty cards</option><option value="classic">🏫 Professional school profile</option></select><button type="button" id="printBtn">Print / Save PDF</button><button type="button" id="shareBtn">Copy design link</button></div><p id="status" class="muted">Loading published faculty profiles…</p><section id="cards" class="grid"></section></main><footer>Powered by Lamastudio.pk</footer><script>
const API_URL='https://script.google.com/macros/s/AKfycbzKX6oxKJH98jfdMOJt9597AKG4T6yBNttfTuO3eUtgLizdVmHKGZL6fEXyn3xYJ_ydBQ/exec';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);const validStyles=['watercolor','modern','classic'];const chosen=validStyles.includes(params.get('style'))?params.get('style'):'watercolor';$('design').value=chosen;$('cards').className='grid '+(chosen==='watercolor'?'poster':chosen);$('design').addEventListener('change',()=>{params.set('style',$('design').value);history.replaceState(null,'',location.pathname+'?'+params.toString());$('cards').className='grid '+($('design').value==='watercolor'?'poster':$('design').value)});$('printBtn').addEventListener('click',()=>window.print());$('shareBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);$('shareBtn').textContent='Link copied ✓'}catch(e){prompt('Copy this link',location.href)}});async function start(){const schoolId=new URLSearchParams(location.search).get('schoolId');if(!schoolId){$('status').textContent='Open this page with ?schoolId=YOUR_SCHOOL_ID. The school administrator can share that link.';return}try{const r=await fetch(API_URL+'?action=getPublicFaculty&schoolId='+encodeURIComponent(schoolId));const d=await r.json();if(d.status!=='success')throw Error(d.message||'Could not load faculty');const data=d.data||{};$('school').textContent=data.school?.name||'Our School';if(data.school?.logo&&/^(https:\/\/|data:image\/)/.test(data.school.logo)){$('logo').src=data.school.logo;$('logo').hidden=false}const teachers=data.teachers||[];$('status').textContent=teachers.length?teachers.length+' faculty member(s)':'No faculty profiles have been published yet.';$('cards').innerHTML=teachers.map(t=>'<article class="card"><div class="portrait">👩‍🏫</div><div class="inner"><h2>'+esc(t.name)+'</h2><div class="role">'+esc(t.designation||'Teacher')+'</div>'+(t.subject?'<span class="tag">'+esc(t.subject)+'</span>':'')+(t.department?'<span class="tag">'+esc(t.department)+'</span>':'')+(t.assignedClass?'<span class="tag">Class '+esc(t.assignedClass)+'</span>':'')+(t.qualification?'<p><b>Qualification:</b> '+esc(t.qualification)+'</p>':'')+(t.education?'<p><b>Education:</b> '+esc(t.education)+'</p>':'')+(t.experience?'<p><b>Experience:</b> '+esc(t.experience)+'</p>':'')+(t.specialization?'<p><b>Specialization:</b> '+esc(t.specialization)+'</p>':'')+(t.bio?'<p class="bio">'+esc(t.bio)+'</p>':'')+(t.publicEmail?'<p><a href="mailto:'+encodeURIComponent(t.publicEmail)+'">'+esc(t.publicEmail)+'</a></p>':'')+'<div class="faculty-qr" data-faculty-id="'+esc(t.id)+'"></div><small>Lamastudio.pk</small></div></article>').join('');document.querySelectorAll('.faculty-qr').forEach(el=>{if(typeof QRCode==='function')new QRCode(el,{text:JSON.stringify({schoolId,role:'teacher',id:el.dataset.facultyId}),width:88,height:88});else el.textContent='QR unavailable'})}catch(e){$('status').textContent='Faculty unavailable: '+e.message}}start();
</script></body></html>
