<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Parent Circulars & Broadcast Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/config.css" onerror="console.warn('config.css missing');">
<script src="js/api-client.js" onerror="console.warn('api-client.js missing');"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .cyber-glow { box-shadow: 0 0 35px rgba(168, 85, 247, 0.15); }
  .card-gradient { background: linear-gradient(135deg, rgba(30, 27, 75, 0.4) 0%, rgba(15, 23, 42, 0.9) 100%); }
</style>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->
    <header class="max-w-3xl w-full mb-6 bg-slate-900/90 backdrop-blur-xl border border-purple-500/20 rounded-3xl shadow-2xl px-6 py-4 flex items-center gap-4 cyber-glow">
        <div id="schoolLogoBox" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center text-sm font-black text-white flex-shrink-0 shadow-lg shadow-purple-500/30">SCH</div>
        <div class="flex-grow">
            <h1 id="headerSchoolName" class="text-base font-extrabold tracking-wide text-white">School Name</h1>
            <p class="text-[10px] uppercase tracking-widest text-purple-400 font-bold">Parent Circulars & Broadcast Log</p>
        </div>
        <button onclick="openCircularModal()" class="bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:opacity-95 text-white font-black text-xs px-5 py-2.5 rounded-2xl transition shadow-lg shadow-purple-600/30 flex-shrink-0 flex items-center gap-2">
            <span class="text-sm">+</span> New Circular
        </button>
        <a href="main-dashboard.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold text-xs px-4 py-2.5 rounded-2xl transition flex-shrink-0 border border-slate-700">Main Dashboard</a>
        <a href="dashboard.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold text-xs px-4 py-2.5 rounded-2xl transition flex-shrink-0 border border-slate-700">Hub</a>
        <button onclick="handleLogout()" class="bg-slate-800/80 hover:bg-red-500/20 hover:text-red-400 text-slate-300 font-bold text-xs px-4 py-2.5 rounded-2xl transition flex-shrink-0 border border-slate-700">Logout</button>
    </header>

    <!-- Filter Bar -->
    <div class="max-w-3xl w-full mb-6 flex flex-wrap gap-2.5">
        <button class="filter-btn active-filter bg-purple-600 text-white text-[11px] font-extrabold uppercase px-4 py-2 rounded-xl shadow-lg shadow-purple-600/25 transition" data-filter="All">All</button>
        <button class="filter-btn bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 text-[11px] font-bold uppercase px-4 py-2 rounded-xl transition" data-filter="Sent">Sent</button>
        <button class="filter-btn bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 text-[11px] font-bold uppercase px-4 py-2 rounded-xl transition" data-filter="Scheduled">Scheduled</button>
        <button class="filter-btn bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 text-[11px] font-bold uppercase px-4 py-2 rounded-xl transition" data-filter="Draft">Draft</button>
    </div>

    <!-- Broadcast Feed -->
    <main class="max-w-3xl w-full space-y-4" id="feedContainer"></main>

    <div id="emptyState" class="max-w-3xl w-full text-center py-20 text-sm text-slate-500 hidden bg-slate-900/30 border border-dashed border-slate-800 rounded-3xl">
        <div class="text-3xl mb-2">📜</div>
        No circulars published yet. Click <b class="text-purple-400">+ New Circular</b> above to send your first broadcast.
    </div>

    <!-- New Circular Modal -->
    <div id="circularModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="card-gradient border border-purple-500/30 rounded-3xl shadow-2xl w-full max-w-lg p-7 space-y-5 my-8 cyber-glow">
            <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
                <div>
                    <h3 class="text-sm font-black uppercase text-purple-400 tracking-wider">Create New Circular</h3>
                    <p class="text-[11px] text-slate-400">Broadcast official announcements & files to parents instantly.</p>
                </div>
                <button onclick="closeCircularModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center font-bold">&times;</button>
            </div>
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Title</label>
                    <input id="inTitle" class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500 transition shadow-inner" placeholder="e.g. Mid-Term Exam Schedule Released">
                </div>
                <div class="grid grid-cols-2 gap-3.5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Audience</label>
                        <input id="inAudience" class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500 transition" placeholder="e.g. All Classes, Grade 10, Parents">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Channel</label>
                        <select id="inChannel" class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500 transition">
                            <option>WhatsApp</option>
                            <option>SMS</option>
                            <option>Printed Notice</option>
                            <option>App Notification</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Message</label>
                    <textarea id="inMessage" rows="3" class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500 transition shadow-inner resize-none" placeholder="Write the circular message here..."></textarea>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Attach Picture / PDF / File</label>
                    <input type="file" id="inFile" accept="image/*,.pdf,.doc,.docx" class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2 text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Status</label>
                    <select id="inStatus" class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500 transition">
                        <option>Sent</option>
                        <option>Scheduled</option>
                        <option>Draft</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-3 border-t border-slate-800/80">
                <button onclick="closeCircularModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-5 py-2.5 rounded-xl transition">Cancel</button>
                <button onclick="saveCircular()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-95 text-white text-xs font-black px-6 py-2.5 rounded-xl shadow-lg shadow-purple-600/30 transition">Save & Sync to Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        if (typeof window.LamaAPI === 'undefined') {
            window.LamaAPI = {
                logout: function() { localStorage.clear(); },
                requireLogin: function() { return true; },
                deriveShortCode: function(name) { return (name || 'SCH').split(' ').map(w => w[0]).join('').slice(0, 3).toUpperCase(); },
                getActiveSchool: async function() { return JSON.parse(localStorage.getItem('lama_active_school') || '{}'); },
                list: async function(key) { return JSON.parse(localStorage.getItem('lama_' + key) || '[]'); },
                add: async function(key, item) {
                    const list = JSON.parse(localStorage.getItem('lama_' + key) || '[]');
                    item.id = 'notif_' + Date.now() + Math.random().toString(36).substr(2, 4);
                    list.push(item);
                    localStorage.setItem('lama_' + key, JSON.stringify(list));
                    return item;
                },
                remove: async function(key, id) {
                    let list = JSON.parse(localStorage.getItem('lama_' + key) || '[]');
                    list = list.filter(i => i.id !== id);
                    localStorage.setItem('lama_' + key, JSON.stringify(list));
                }
            };
        }

        function handleLogout() {
            LamaAPI.logout();
            window.location.href = 'login.html';
        }

        const NOTIFICATIONS = 'notifications';
        let activeFilter = 'All';

        const STATUS_STYLES = {
            'Sent': 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30 shadow-sm shadow-emerald-500/10',
            'Scheduled': 'bg-cyan-500/10 text-cyan-300 border-cyan-500/30 shadow-sm shadow-cyan-500/10',
            'Draft': 'bg-slate-500/10 text-slate-300 border-slate-500/30'
        };

        async function renderHeader() {
            const school = (await LamaAPI.getActiveSchool()) || {};
            const schoolName = school.name || 'School Name';
            const shortCode = school.shortCode || LamaAPI.deriveShortCode(schoolName);
            document.getElementById('pageTitle').innerText = `${schoolName} | Notifications`;
            document.getElementById('headerSchoolName').innerText = schoolName;
            const logoBox = document.getElementById('schoolLogoBox');
            if (school.logo) {
                logoBox.innerHTML = `<img src="${school.logo}" class="w-full h-full object-cover rounded-2xl">`;
            } else {
                logoBox.innerText = shortCode.slice(0, 3).toUpperCase();
            }
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // Helper to push updates to main dashboard local storage feed
        async function syncToMainDashboard() {
            try {
                const allNotifs = await LamaAPI.list(NOTIFICATIONS);
                // Save formatted list so main dashboard can directly consume it
                localStorage.setItem('lama_main_dashboard_notices', JSON.stringify(allNotifs));
                
                // Also trigger storage event for cross-tab sync if needed
                window.dispatchEvent(new Event('storage'));
            } catch (err) {
                console.warn('Dashboard sync warning:', err);
            }
        }

        async function renderFeed() {
            let items;
            try {
                items = await LamaAPI.list(NOTIFICATIONS);
            } catch (e) {
                console.warn('Could not load circulars: ' + e.message);
                items = [];
            }
            items = items.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            if (activeFilter !== 'All') {
                items = items.filter(i => i.status === activeFilter);
            }

            const container = document.getElementById('feedContainer');
            document.getElementById('emptyState').classList.toggle('hidden', items.length > 0);

            container.innerHTML = items.map(item => `
                <div class="card-gradient rounded-3xl p-5 flex flex-col gap-3 border border-slate-800/80 shadow-xl transition hover:border-purple-500/30">
                    <div class="flex justify-between items-start gap-3">
                        <div>
                            <h4 class="text-sm font-extrabold text-white tracking-wide">${item.title}</h4>
                            <p class="text-[10px] text-slate-400 mt-1 font-medium flex items-center gap-2">
                                <span class="text-purple-400">${formatDate(item.createdAt)}</span> •
                                <span class="bg-slate-800/80 px-2 py-0.5 rounded-md text-slate-300">${item.audience}</span> •
                                <span class="text-indigo-300 font-semibold">${item.channel}</span>
                            </p>
                        </div>
                        <span class="text-[10px] font-extrabold uppercase px-3 py-1 rounded-full border ${STATUS_STYLES[item.status] || STATUS_STYLES['Draft']}">${item.status}</span>
                    </div>
                    <p class="text-xs text-slate-300 leading-relaxed bg-slate-950/40 p-3.5 rounded-2xl border border-slate-800/50">${item.message}</p>
                    
                    ${item.fileData ? `
                        <div class="mt-2">
                            ${item.fileType && item.fileType.startsWith('image/') ? 
                                `<div class="rounded-2xl overflow-hidden border border-slate-800 bg-black/40 p-2 max-h-60 flex justify-center"><img src="${item.fileData}" class="max-h-52 object-contain rounded-xl"></div>` :
                                `<a href="${item.fileData}" download="${item.fileName || 'attachment'}" class="flex items-center gap-2 bg-slate-800/80 hover:bg-slate-700/80 p-3 rounded-2xl border border-slate-700 text-xs text-purple-300 font-bold transition">
                                    <span class="text-base">📎</span>
                                    <span class="truncate">${item.fileName || 'Download Attached File'}</span>
                                </a>`
                            }
                        </div>
                    ` : ''}

                    <div class="flex justify-between items-center pt-2 border-t border-slate-800/80 mt-1">
                        <span class="text-[10px] text-emerald-400 font-medium">⚡ Synced to Main Dashboard</span>
                        <button onclick="deleteCircular('${item.id}')" class="text-[11px] font-bold text-red-400 hover:text-red-300 transition flex items-center gap-1 bg-red-500/10 px-3 py-1.5 rounded-xl border border-red-500/20">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');

            await syncToMainDashboard();
        }

        function openCircularModal() {
            document.getElementById('inTitle').value = '';
            document.getElementById('inAudience').value = 'All Classes';
            document.getElementById('inChannel').value = 'WhatsApp';
            document.getElementById('inMessage').value = '';
            document.getElementById('inFile').value = '';
            document.getElementById('inStatus').value = 'Sent';
            document.getElementById('circularModal').classList.remove('hidden');
        }

        function closeCircularModal() {
            document.getElementById('circularModal').classList.add('hidden');
        }

        async function saveCircular() {
            const title = document.getElementById('inTitle').value.trim();
            const message = document.getElementById('inMessage').value.trim();
            const status = document.getElementById('inStatus').value;
            const fileInput = document.getElementById('inFile');

            if (!title || !message) {
                alert('Title and message are required.');
                return;
            }

            let fileData = null;
            let fileName = null;
            let fileType = null;

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                fileName = file.name;
                fileType = file.type;
                fileData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            try {
                await LamaAPI.add(NOTIFICATIONS, {
                    title,
                    audience: document.getElementById('inAudience').value,
                    channel: document.getElementById('inChannel').value,
                    message,
                    fileData,
                    fileName,
                    fileType,
                    status,
                    isPublished: status === 'Sent',
                    createdAt: new Date().toISOString()
                });
                closeCircularModal();
                await renderFeed();
            } catch (e) {
                alert('Could not save this circular: ' + e.message);
            }
        }

        async function deleteCircular(id) {
            try {
                await LamaAPI.remove(NOTIFICATIONS, id);
                await renderFeed();
            } catch (e) {
                alert('Could not delete this circular: ' + e.message);
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeFilter = btn.dataset.filter;
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-purple-600', 'text-white', 'shadow-lg', 'shadow-purple-600/25');
                    b.classList.add('bg-slate-900/80', 'text-slate-400', 'border', 'border-slate-800');
                });
                btn.classList.remove('bg-slate-900/80', 'text-slate-400', 'border', 'border-slate-800');
                btn.classList.add('bg-purple-600', 'text-white', 'shadow-lg', 'shadow-purple-600/25');
                renderFeed();
            });
        });

        async function init() {
            await renderHeader();
            await renderFeed();
        }

        if (typeof LamaAPI.requireLogin === 'function' ? LamaAPI.requireLogin('school') : true) {
            init();
        }
    </script>
</body>
</html>
