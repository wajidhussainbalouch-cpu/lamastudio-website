<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Administrators | LAMA Studio</title><style>body{font:16px system-ui;background:#10242c;color:white;margin:0;padding:24px}main{max-width:720px;margin:auto}section{border:1px solid #557079;border-radius:14px;padding:18px;margin:16px 0}input,select,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:9px 0;border-radius:8px}button{background:#e8c36c;border:0;color:#14252c;font-weight:bold}article{border-top:1px solid #557079;padding:10px 0}</style><main><h1>School Owner — Administrators</h1><p>Verify your owner account to manage up to five active administrators.</p><section><form id="login"><input id="sid" placeholder="School ID" required><input id="email" type="email" placeholder="Owner email" required><input id="pass" type="password" placeholder="Owner password" required><button>Load administrators</button></form><p id="msg" role="status"></p></section><section id="panel" hidden><h2>Administrators</h2><div id="list"></div><form id="editor"><input id="id" type="hidden"><input id="username" placeholder="Administrator login ID" required pattern="[A-Za-z0-9._-]{3,40}"><input id="displayName" placeholder="Display name" required><input id="newPass" type="password" minlength="12" placeholder="Password (12+ characters, blank to retain when editing)"><select id="status"><option>Active</option><option>Disabled</option></select><button>Save administrator</button><button type="button" id="clear">New administrator</button></form></section><section id="campuses" hidden><h2>Campus directory</h2><p>Campus entries are administrative only until separate campus databases and permissions are activated.</p><div id="campusList"></div><form id="campusForm"><input id="campusId" type="hidden"><input id="campusName" placeholder="Campus name" maxlength="100" required><input id="campusAddress" placeholder="Campus address" maxlength="300"><select id="campusStatus"><option>Active</option><option>Disabled</option></select><button>Save campus</button><button type="button" id="newCampus">New campus</button></form></section></main><script>const $=id=>document.getElementById(id),url='https://script.google.com/macros/s/AKfycbz8Num29Df94i-TNlX4ggN6nveyVLpoPDo4feStMXV3DuAx-JoRD3nZH1Q90kVuEH57/exec';let users=[];async function api(action,more={}){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,schoolId:$('sid').value.trim(),ownerEmail:$('email').value.trim(),ownerPassword:$('pass').value,...more})});const data=await res.json();if(data.status==='error')throw Error(data.message||'Request failed');return data}async function loadCampuses(){const data=await api('ownerListCampuses');const entries=data.campuses||[];$('campuses').hidden=false;const list=$('campusList');list.replaceChildren();for(const c of entries){const item=document.createElement('article'),label=document.createElement('span');label.textContent=c.campusName+' — '+c.status;item.append(label);if(!c.isLegacy){const button=document.createElement('button');button.textContent='Edit campus';button.onclick=()=>{$('campusId').value=c.campusId;$('campusName').value=c.campusName;$('campusAddress').value=c.address||'';$('campusStatus').value=c.status};item.append(button)}list.append(item)}}function clear(){ $('editor').reset();$('id').value=''}async function load(){await loadCampuses();users=(await api('ownerListSchoolUsers')).users||[];$('panel').hidden=false;const list=$('list');list.replaceChildren();for(const u of users){const a=document.createElement('article'),t=document.createElement('span'),b=document.createElement('button');t.textContent=u.displayName+' ('+u.username+') — '+u.status;b.textContent='Edit / disable';b.onclick=()=>{$('id').value=u.id;$('username').value=u.username;$('displayName').value=u.displayName;$('status').value=u.status;$('newPass').value='';$('editor').scrollIntoView()};a.append(t,b);list.append(a)}}$('login').onsubmit=async e=>{e.preventDefault();try{await load();$('msg').textContent='Owner verified'}catch(err){$('panel').hidden=true;$('msg').textContent=err.message}};$('editor').onsubmit=async e=>{e.preventDefault();try{await api('ownerSaveSchoolUser',{id:$('id').value,username:$('username').value,displayName:$('displayName').value,password:$('newPass').value,status:$('status').value});clear();await load();$('msg').textContent='Administrator saved'}catch(err){$('msg').textContent=err.message}};$('clear').onclick=clear;$('newCampus').onclick=()=>{$('campusForm').reset();$('campusId').value=''};$('campusForm').onsubmit=async e=>{e.preventDefault();try{await api('ownerSaveCampus',{campusId:$('campusId').value,campusName:$('campusName').value,address:$('campusAddress').value,status:$('campusStatus').value});$('campusForm').reset();$('campusId').value='';await loadCampuses();$('msg').textContent='Campus directory saved'}catch(err){$('msg').textContent=err.message}};</script></html>
