<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Login | Lama School Suite</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/config.css"><script src="js/api-client.js"></script></head><body class="bg-[#0b0f19] text-white min-h-screen grid place-items-center p-4"><main class="w-full max-w-md rounded-3xl bg-slate-900 border border-slate-700 p-7 space-y-5"><h1 class="text-2xl font-black text-center">🎓 School Portal Login</h1><p class="text-center text-xs text-slate-400">Teacher and Student access</p><div class="grid grid-cols-2 gap-3" role="group" aria-label="Choose login type"><button type="button" id="studentTab" class="rounded-xl p-3 font-bold bg-slate-800">🎒 Student Login</button><button type="button" id="teacherTab" class="rounded-xl p-3 font-bold bg-slate-800">👩‍🏫 Teacher Login</button></div><p id="portalType" class="text-center text-cyan-300 font-bold"></p><p class="text-center text-xs text-slate-400">Teacher and Student accounts are separate. Use your own portal.</p><div id="error" role="alert" class="hidden text-sm text-red-300 bg-red-950 p-3 rounded-xl"></div><form id="loginForm" class="space-y-4"><label class="block text-sm">School ID / Login Code<input id="schoolId" required class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3"></label><label class="block text-sm"><span id="idLabel">Email</span><input id="identifier" required class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3"></label><label class="block text-sm">Password<div class="flex gap-2 mt-1"><input id="password" type="password" required class="min-w-0 flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3"><button type="button" id="eye" class="bg-slate-700 px-3 rounded-xl" aria-label="Show password">👁 Show</button></div></label><button id="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 rounded-xl p-3 font-bold">Log In</button></form><p class="text-center text-xs"><a href="login.html" class="text-cyan-300">School Admin login</a></p></main><script>const query=new URLSearchParams(location.search);
let role=query.get('role')==='teacher'?'teacher':'student';
const $=id=>document.getElementById(id);
function selectRole(next){
 role=next;
 $('portalType').textContent=role==='student'?'STUDENT LOGIN':'TEACHER LOGIN';
 $('idLabel').textContent=role==='student'?'Student Enrollment Number':'Teacher ID or Email';
 $('identifier').type='text';$('identifier').value='';$('password').value='';
 $('identifier').autocomplete='username';
 $('studentTab').className='rounded-xl p-3 font-bold '+(role==='student'?'bg-cyan-600 text-white':'bg-slate-800 text-slate-200');
 $('teacherTab').className='rounded-xl p-3 font-bold '+(role==='teacher'?'bg-cyan-600 text-white':'bg-slate-800 text-slate-200');
 $('error').classList.add('hidden');
 const saved=localStorage.getItem('lama_school_id_'+role);
 if(saved && !query.get('schoolId'))$('schoolId').value=saved;
 const u=new URL(location.href);u.searchParams.set('role',role);history.replaceState(null,'',u.pathname+u.search+u.hash);
}
const remembered=typeof LamaAPI!=='undefined'?(LamaAPI.getSession('school') || LamaAPI.getSession(role)):null;
$('schoolId').value=query.get('schoolId') || (remembered&&remembered.schoolId) || localStorage.getItem('lama_school_id_'+role) || '';
$('studentTab').onclick=()=>selectRole('student');
$('teacherTab').onclick=()=>selectRole('teacher');
selectRole(role);
document.getElementById('eye').onclick=()=>{const el=document.getElementById('password');el.type=el.type==='password'?'text':'password';document.getElementById('eye').textContent=el.type==='password'?'👁 Show':'🙈 Hide';};
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');err.classList.add('hidden');b.disabled=true;b.textContent='Logging in…';try{if(typeof LamaAPI==='undefined')throw Error('API client missing');const schoolId=document.getElementById('schoolId').value.trim(),id=document.getElementById('identifier').value.trim(),pw=document.getElementById('password').value;localStorage.setItem('lama_school_id_'+role,schoolId);if(role==='student'){await LamaAPI.studentLogin(schoolId,id,pw);location.assign('portals/student/student.html')}else{await LamaAPI.teacherLogin(schoolId,id,pw);location.assign('portals/teacher/index.html')}}catch(x){err.textContent=x.message;err.classList.remove('hidden');b.disabled=false;b.textContent='Log In'}})</script></body></html>
