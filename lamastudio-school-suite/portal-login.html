<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Login | Lama School Suite</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/config.css"><script src="js/api-client.js"></script></head><body class="bg-[#0b0f19] text-white min-h-screen grid place-items-center p-4"><main class="w-full max-w-md rounded-3xl bg-slate-900 border border-slate-700 p-7 space-y-5"><h1 class="text-2xl font-black text-center">🎓 School Portal Login</h1><p class="text-center text-xs text-slate-400">Teacher and Student access</p><div class="grid grid-cols-2 gap-2"><button id="teacherBtn" type="button" onclick="setRole('teacher')" class="rounded-xl p-3 bg-slate-800">Teacher</button><button id="studentBtn" type="button" onclick="setRole('student')" class="rounded-xl p-3 bg-slate-800">Student</button></div><div id="error" role="alert" class="hidden text-sm text-red-300 bg-red-950 p-3 rounded-xl"></div><form id="loginForm" class="space-y-4"><label class="block text-sm">School ID / Login Code<input id="schoolId" required class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3"></label><label class="block text-sm"><span id="idLabel">Email</span><input id="identifier" required class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3"></label><label class="block text-sm">Password<input id="password" type="password" required class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl p-3"></label><button id="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 rounded-xl p-3 font-bold">Log In</button></form><p class="text-center text-xs"><a href="login.html" class="text-cyan-300">School Admin login</a></p></main><script>let role='teacher';function setRole(r){role=r;document.getElementById('idLabel').textContent=r==='student'?'Enrollment No':'Email';document.getElementById('identifier').type=r==='student'?'text':'email';document.getElementById('teacherBtn').className='rounded-xl p-3 '+(r==='teacher'?'bg-cyan-600':'bg-slate-800');document.getElementById('studentBtn').className='rounded-xl p-3 '+(r==='student'?'bg-cyan-600':'bg-slate-800')}setRole(new URLSearchParams(location.search).get('role')==='student'?'student':'teacher');document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');err.classList.add('hidden');b.disabled=true;b.textContent='Logging in…';try{if(typeof LamaAPI==='undefined')throw Error('API client missing');const schoolId=document.getElementById('schoolId').value.trim(),id=document.getElementById('identifier').value.trim(),pw=document.getElementById('password').value;if(role==='student'){await LamaAPI.studentLogin(schoolId,id,pw);location.assign('portals/student/student.html')}else{await LamaAPI.teacherLogin(schoolId,id,pw);location.assign('portals/teacher/index.html')}}catch(x){err.textContent=x.message;err.classList.remove('hidden');b.disabled=false;b.textContent='Log In'}})</script></body></html>
