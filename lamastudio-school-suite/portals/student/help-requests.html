<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask Teacher & Sick Leave</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#080e1b;color:#e2e8f0;font-family:system-ui}.panel{background:#111b2d;border:1px solid #25344c;border-radius:20px;padding:20px}.field{background:#081121;border:1px solid #334155;border-radius:10px;padding:10px;width:100%;color:white}.btn{background:#2563eb;color:white;padding:10px 15px;border-radius:10px;font-weight:700}.muted{color:#94a3b8;font-size:13px}.pill{border:1px solid #475569;border-radius:50px;padding:3px 9px;font-size:11px}</style><script src="../../js/api-client.js"></script></head><body><main class="max-w-5xl mx-auto p-4 md:p-8 space-y-5"><header class="flex flex-wrap justify-between gap-3 items-center"><div><div class="text-cyan-400 text-xs font-bold uppercase">Lama School Suite</div><h1 class="text-2xl font-black">Ask Teacher & Sick Leave</h1><p class="muted">Requests are securely stored in your school's Google Sheets</p></div><a href="student.html" class="btn">← Dashboard</a></header><div id="error" role="alert" class="hidden rounded-xl bg-red-950 text-red-200 p-3"></div><section class="panel"><h2 class="font-bold text-lg mb-3">Submit a request</h2><form id="form" class="space-y-3"><label class="block text-sm">Request type<select id="kind" class="field mt-1"><option value="help">❓ Ask Teacher / Solve a Question</option><option value="sick_leave">🤒 Sick Leave Application</option></select></label><label class="block text-sm">Subject / Problem topic<input id="subject" class="field mt-1" maxlength="120" placeholder="e.g. Mathematics chapter 2"></label><div id="dates" class="hidden grid grid-cols-2 gap-3"><label class="text-sm">Leave from<input id="from" type="date" class="field mt-1"></label><label class="text-sm">Leave to<input id="to" type="date" class="field mt-1"></label></div><label class="block text-sm">Describe your question, problem or illness<textarea id="message" class="field mt-1" rows="4" maxlength="3000" required placeholder="Explain clearly so your teacher can help"></textarea></label><button id="send" class="btn" type="submit">Send to Class Teacher & Admin</button></form></section><section class="panel"><div class="flex justify-between items-center mb-3"><h2 class="text-lg font-bold">My requests</h2><button class="text-cyan-300 text-sm" id="refresh">Refresh ↻</button></div><p id="loading" class="muted">Loading…</p><div id="list" class="space-y-3"></div></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ROLE='student';let rows=[];function error(e){$('error').textContent=e.message||String(e);$('error').classList.remove('hidden')}function card(x){const leave=x.requestType==='sick_leave';return `<article class="rounded-xl bg-slate-950/70 border border-slate-700 p-4 space-y-2"><div class="flex flex-wrap gap-2 items-center justify-between"><div><b>${leave?'🤒 Sick Leave':'❓ Help Request'} — ${esc(x.subject||'General')}</b><p class="muted">${esc(x.studentName||'')} ${ROLE!=='student'?'· '+esc(x.class||'')+' '+esc(x.section||''):''} · ${esc(x.createdAt||'')}</p></div><span class="pill">${esc(x.status||'Pending')}</span></div>${leave?`<p class="muted">Leave: ${esc(x.leaveFrom)} to ${esc(x.leaveTo)}</p>`:''}<p class="text-sm whitespace-pre-wrap">${esc(x.message)}</p>${x.teacherReply?`<div class="text-sm border-l-2 border-cyan-500 pl-3"><b>Teacher:</b> ${esc(x.teacherReply)}</div>`:''}${x.adminReply?`<div class="text-sm border-l-2 border-violet-500 pl-3"><b>Admin:</b> ${esc(x.adminReply)}</div>`:''}${ROLE==='student'?'':`<div class="border-t border-slate-700 pt-3 space-y-2"><textarea class="field reply" data-id="${esc(x.id)}" rows="2" placeholder="Write a helpful response…"></textarea><div class="flex flex-wrap gap-2"><select class="field status" data-id="${esc(x.id)}" style="max-width:180px">${['Pending','In Review','Resolved','Approved','Rejected'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn save" data-id="${esc(x.id)}">Save Reply / Decision</button></div></div>`}</article>`}async function load(){try{$('loading').textContent='Loading requests…';rows=await LamaAPI.list('studentRequests');if(!Array.isArray(rows))throw Error('Invalid server response');rows.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));$('list').innerHTML=rows.length?rows.map(card).join(''):'<p class="muted">No requests yet.</p>';$('loading').textContent='';}catch(e){$('loading').textContent='Could not load requests.';error(e)}}$('refresh').onclick=load;document.addEventListener('click',async e=>{const b=e.target.closest('.save');if(!b)return;const id=b.dataset.id;const box=Array.from(document.querySelectorAll('.reply')).find(x=>x.dataset.id===id),sel=Array.from(document.querySelectorAll('.status')).find(x=>x.dataset.id===id);try{b.disabled=true;const patch=ROLE==='teacher'?{teacherReply:box.value.trim(),status:sel.value}:{adminReply:box.value.trim(),status:sel.value};await LamaAPI.update('studentRequests',id,patch);await load()}catch(ex){error(ex);b.disabled=false}});$('kind').onchange=()=>{$('dates').classList.toggle('hidden',$('kind').value!=='sick_leave')};$('form').onsubmit=async e=>{e.preventDefault();$('error').classList.add('hidden');const b=$('send');try{b.disabled=true;const rec={requestType:$('kind').value,subject:$('subject').value.trim(),message:$('message').value.trim(),leaveFrom:$('from').value,leaveTo:$('to').value};if(rec.requestType==='sick_leave'&&(!rec.leaveFrom||!rec.leaveTo||rec.leaveFrom>rec.leaveTo))throw Error('Choose a valid leave date range.');await LamaAPI.add('studentRequests',rec);$('form').reset();$('dates').classList.add('hidden');await load();alert('Your request was sent to your class teacher and school admin.')}catch(ex){error(ex)}finally{b.disabled=false}};if(LamaAPI.requireLogin('student','../../portal-login.html'))load();</script></body></html>
