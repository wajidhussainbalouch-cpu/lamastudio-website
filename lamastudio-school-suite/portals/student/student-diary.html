<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Diary</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../../assets/css/config.css"><script src="../../js/api-client.js"></script><style>body{background:#070b14}.card{background:#0f172add;border:1px solid #94a3b822}</style></head><body class="text-slate-100 min-h-screen"><header class="border-b border-slate-800 sticky top-0 bg-[#070b14]/90 backdrop-blur z-20"><div class="max-w-5xl mx-auto p-4 flex justify-between"><div><a href="student.html" class="text-xs text-cyan-300">← Dashboard</a><h1 class="font-black text-xl">📓 Student Diary</h1></div><a href="student-grades.html" class="card rounded-xl px-3 py-2 text-xs">🎓 Results</a></div></header><main class="max-w-5xl mx-auto p-4 space-y-5"><section class="card rounded-3xl p-5"><p id="student" class="text-xs text-slate-400">Loading…</p><div class="flex flex-wrap gap-2 mt-4"><input id="search" placeholder="Search homework…" class="flex-1 min-w-[180px] bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs"><select id="subject" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs"><option value="">All subjects</option></select></div></section><section class="grid grid-cols-3 gap-3"><div class="card rounded-2xl p-4"><small>Pending</small><b id="pending" class="block text-2xl text-amber-300">0</b></div><div class="card rounded-2xl p-4"><small>Due Today</small><b id="today" class="block text-2xl text-cyan-300">0</b></div><div class="card rounded-2xl p-4"><small>Completed</small><b id="done" class="block text-2xl text-emerald-300">0</b></div></section><section class="card rounded-3xl p-5"><h2 class="font-black">Homework & Assignments</h2><div id="list" class="mt-4 space-y-3"></div></section><section id="teacher-help" class="card rounded-3xl p-5"><p class="text-[9px] uppercase tracking-widest text-violet-300">Teacher Support</p><h2 class="text-xl font-black">Need help?</h2><p class="text-xs text-slate-400 mt-2">Send a private internal portal message to an assigned teacher. No personal phone number is exposed.</p><div id="teachers" class="grid sm:grid-cols-2 gap-3 mt-4"></div></section><div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 p-4 items-center justify-center"><div class="card rounded-3xl p-5 max-w-lg w-full"><div class="flex justify-between"><b id="mt">Message Teacher</b><button onclick="closeM()">✕</button></div><textarea id="msg" rows="5" class="w-full mt-4 bg-slate-950 border border-slate-800 rounded-xl p-3" placeholder="Write your question…"></textarea><button onclick="sendM()" class="w-full mt-3 bg-violet-600 rounded-xl py-3 font-black">Send Message</button><p id="status" class="text-xs text-center mt-2"></p></div></div></main><script>
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const P=x=>x?.isPublished===true||x?.published===true||x?.status==='published'||x?.visibility==='public';let S,ST,items=[],target;
async function init(){if(!LamaAPI.requireLogin('student','../../portal-login.html'))return;S=LamaAPI.getSession();ST=await LamaAPI.get('students',S.studentId);student.textContent=`${ST?.name||'Student'} • Class ${ST?.class||S.class||'-'}${ST?.section?'-'+ST.section:''}`;items=(await LamaAPI.list('homework').catch(()=>[])).filter(P).filter(x=>(!x.class||String(x.class)===String(ST.class))&&(!x.section||String(x.section)===String(ST.section)));[...new Set(items.map(x=>x.subject).filter(Boolean))].sort().forEach(x=>subject.insertAdjacentHTML('beforeend',`<option>${E(x)}</option>`));render();let ts=await LamaAPI.list('teachers').catch(()=>[]),tt=await LamaAPI.list('timetable').catch(()=>[]),ids=tt.filter(x=>String(x.class)===String(ST.class)&&(!x.section||String(x.section)===String(ST.section))).map(x=>x.teacherId||x.teacher).filter(Boolean);let use=ts.filter(t=>ids.includes(t.id)||ids.includes(t.teacherId)||ids.includes(t.name));if(!use.length)use=ts.filter(t=>t.classTeacher||t.isClassTeacher).slice(0,2);teachers.innerHTML=use.map(t=>`<div class="bg-slate-950/50 border border-slate-800 rounded-2xl p-4"><b class="text-sm">${E(t.name||'Teacher')}</b><p class="text-[10px] text-slate-500">${E(t.subject||t.role||'Teacher')}</p><button class="mt-3 bg-violet-600 rounded-xl px-3 py-2 text-xs font-black" onclick='openM(${JSON.stringify(t).replace(/</g,"\u003c")})'>💬 Ask Teacher</button></div>`).join('')||'<p class="text-xs text-slate-500">No teacher assignment available.</p>'}
function render(){let q=search.value.toLowerCase(),s=subject.value,f=items.filter(x=>(!q||`${x.subject} ${x.title} ${x.description}`.toLowerCase().includes(q))&&(!s||x.subject===s));list.innerHTML=f.map(x=>`<article class="bg-slate-950/50 border border-slate-800 rounded-2xl p-4"><b class="text-xs">${E(x.subject||'General')} — ${E(x.title||'Assignment')}</b><p class="text-xs text-slate-400 mt-2">${E(x.description||'')}</p><p class="text-[10px] text-amber-300 mt-2">Due: ${E(x.dueDate||'—')} • ${E(x.status||'Pending')}</p></article>`).join('')||'<p class="text-sm text-slate-500">No matching homework.</p>';pending.textContent=items.filter(x=>x.status!=='Completed').length;done.textContent=items.filter(x=>x.status==='Completed').length;today.textContent=items.filter(x=>x.dueDate===new Date().toISOString().slice(0,10)).length}
function openM(t){target=t;mt.textContent=`Message ${t.name||'Teacher'}`;msg.value='';status.textContent='';modal.classList.remove('hidden');modal.classList.add('flex')}function closeM(){modal.classList.add('hidden');modal.classList.remove('flex')}async function sendM(){if(!msg.value.trim()||!target)return;try{await LamaAPI.add('messages',{studentId:S.studentId,schoolId:S.schoolId,teacherId:target.id||target.teacherId,toTeacherId:target.id||target.teacherId,message:msg.value.trim(),createdAt:new Date().toISOString(),status:'unread'});status.textContent='Message sent successfully.';msg.value=''}catch(e){status.textContent='Messaging collection is not configured in the backend.'}}
search.oninput=render;subject.onchange=render;init().catch(console.error);
</script></body></html>
