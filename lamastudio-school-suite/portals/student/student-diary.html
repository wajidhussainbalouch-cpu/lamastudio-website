<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Diary</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../../assets/css/config.css"><script src="../../js/api-client.js?v=20261120studentattendance"></script><script src="../../js/student-homework.js?v=20261120"></script><style>body{background:#070b14}.card{background:#0f172add;border:1px solid #94a3b822}</style></head><body class="text-slate-100 min-h-screen"><header class="border-b border-slate-800 sticky top-0 bg-[#070b14]/90 backdrop-blur z-20"><div class="max-w-5xl mx-auto p-4 flex justify-between"><div><a href="student.html" class="text-xs text-cyan-300">← Dashboard</a><h1 class="font-black text-xl">📓 Student Diary</h1></div><a href="student-grades.html" class="card rounded-xl px-3 py-2 text-xs">🎓 Results</a></div></header><main class="max-w-5xl mx-auto p-4 space-y-5"><section class="card rounded-3xl p-5"><p id="student" class="text-xs text-slate-400">Loading…</p><div class="flex flex-wrap gap-2 mt-4"><input id="search" placeholder="Search homework…" class="flex-1 min-w-[180px] bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs"><select id="subject" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs"><option value="">All subjects</option></select></div></section><section class="grid grid-cols-3 gap-3"><div class="card rounded-2xl p-4"><small>Pending</small><b id="pending" class="block text-2xl text-amber-300">—</b></div><div class="card rounded-2xl p-4"><small>Due Today</small><b id="today" class="block text-2xl text-cyan-300">—</b></div><div class="card rounded-2xl p-4"><small>Completed</small><b id="done" class="block text-2xl text-emerald-300">—</b></div></section><section class="card rounded-3xl p-5"><div class="flex justify-between items-center gap-2"><h2 class="font-black">Homework &amp; Assignments</h2><button id="refreshHomework" type="button" class="bg-cyan-800 rounded-xl px-3 py-2 text-xs font-bold" disabled>Refresh</button></div><p id="homeworkStatus" role="status" aria-live="polite" class="text-xs text-cyan-200 mt-2">Loading saved homework…</p><div id="list" class="mt-4 space-y-3"></div></section><section id="teacher-help" class="card rounded-3xl p-5"><p class="text-[9px] uppercase tracking-widest text-violet-300">Teacher Support</p><h2 class="text-xl font-black">Need help?</h2><p class="text-xs text-slate-400 mt-2">Send a private internal portal message to an assigned teacher. No personal phone number is exposed.</p><div id="teachers" class="grid sm:grid-cols-2 gap-3 mt-4"></div></section><div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 p-4 items-center justify-center"><div class="card rounded-3xl p-5 max-w-lg w-full"><div class="flex justify-between"><b id="mt">Message Teacher</b><button onclick="closeM()">✕</button></div><textarea id="msg" rows="5" class="w-full mt-4 bg-slate-950 border border-slate-800 rounded-xl p-3" placeholder="Write your question…"></textarea><button onclick="sendM()" class="w-full mt-3 bg-violet-600 rounded-xl py-3 font-black">Send Message</button><p id="status" class="text-xs text-center mt-2"></p></div></div></main><script>
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=id=>document.getElementById(id),student=el('student'),search=el('search'),subject=el('subject'),list=el('list'),pending=el('pending'),today=el('today'),done=el('done'),teachers=el('teachers'),mt=el('mt'),msg=el('msg'),status=el('status'),modal=el('modal'),reload=el('refreshHomework'),note=el('homeworkStatus');
let S,ST,items=[],target,ready=false,busy=false;
async function loadHomework(){
 if(busy||!ST)return;busy=true;ready=false;reload.disabled=true;list.replaceChildren();pending.textContent=today.textContent=done.textContent='—';note.textContent='Loading saved class homework…';
 try{
 if(!LamaAPI.requireLogin('student','../../students/student-login.html'))return;
 items=LamaStudentHomework.select(await LamaAPI.list('homework'),ST,S.schoolId);
 const old=subject.value;subject.replaceChildren(new Option('All subjects',''));for(const name of [...new Set(items.map(x=>String(x.subject||'').trim()).filter(Boolean))].sort())subject.add(new Option(name,name));
 if([...subject.options].some(o=>o.value===old))subject.value=old;
 ready=true;note.textContent=items.length?items.length+' saved homework assignment(s) for your class.':'No saved homework for your class yet.';render();
 }catch(e){items=[];note.textContent='Homework could not be loaded. Tap Refresh to try again.';console.warn('Student homework read failed',e);}
 finally{busy=false;reload.disabled=false;}
}
async function init(){
 if(!LamaAPI.requireLogin('student','../../students/student-login.html'))return;
 S=LamaAPI.getSession('student');if(!S?.studentId||!S?.schoolId)throw Error('Missing student session.');
 ST=await LamaAPI.get('students',S.studentId);if(!ST)throw Error('Student record not found.');
 student.textContent=(ST.name||S.name||'Student')+' • '+(/^class\s/i.test(String(ST.class))?ST.class:'Class '+(ST.class||S.class||'-'))+(ST.section?' · '+ST.section:'');
 reload.onclick=loadHomework;await loadHomework();
 // Keep teacher support separate; an unavailable directory cannot block homework.
 try{
 const [ts,tt]=await Promise.all([LamaAPI.list('teachers'),LamaAPI.list('timetable')]);const ids=tt.filter(x=>String(x.class)===String(ST.class)&&(!x.section||String(x.section)===String(ST.section))).map(x=>x.teacherId||x.teacher).filter(Boolean).map(String);
 const use=ts.filter(t=>ids.includes(String(t.id))||ids.includes(String(t.teacherId))||ids.includes(String(t.name)));
 for(const t of use){const card=document.createElement('div');card.className='bg-slate-950/50 border border-slate-800 rounded-2xl p-4';const name=document.createElement('b');name.textContent=t.name||'Teacher';const btn=document.createElement('button');btn.type='button';btn.className='block mt-3 bg-violet-600 rounded-xl px-3 py-2 text-xs font-black';btn.textContent='Ask Teacher';btn.onclick=()=>openM(t);card.append(name,btn);teachers.append(card)}
 if(!use.length)teachers.textContent='No teacher assignment available.';
 }catch(e){teachers.textContent='Teacher support is currently unavailable.';}
}
function render(){
 if(!ready)return;
 const q=search.value.trim().toLowerCase(),s=subject.value,f=items.filter(x=>(!q||[x.subject,x.title,x.description].join(' ').toLowerCase().includes(q))&&(!s||String(x.subject||'').trim()===s));
 const groups=new Map();for(const x of f){const d=x.postingDay||'Posting date unavailable';if(!groups.has(d))groups.set(d,[]);groups.get(d).push(x);}
 list.innerHTML=[...groups].map(([d,rows])=>'<section class="space-y-2"><h3 class="font-bold text-cyan-300 text-sm">'+E(d===LamaStudentHomework.today()?'Today · '+d:d)+'</h3>'+rows.map(x=>'<article class="bg-slate-950/50 border border-slate-800 rounded-2xl p-4"><b class="text-sm">'+E(x.subject||'General')+'</b>'+(LamaStudentHomework.title(x)?'<p class="text-sm font-semibold mt-1">'+E(LamaStudentHomework.title(x))+'</p>':'')+'<p class="text-sm text-slate-200 mt-2 whitespace-pre-wrap" dir="auto">'+E(x.description||'')+'</p><p class="text-xs text-slate-400 mt-2">'+(x.assignedBy?'Teacher: '+E(x.assignedBy):'')+(x.dueDay?' · Due: '+E(x.dueDay):'')+'</p></article>').join('')+'</section>').join('')||'<p class="text-sm text-slate-400">'+(items.length?'No matching homework.':'No homework posted.')+'</p>';
 pending.textContent=items.filter(x=>!x.completed).length;done.textContent=items.filter(x=>x.completed).length;today.textContent=items.filter(x=>!x.completed&&x.dueDay===LamaStudentHomework.today()).length;
}
function openM(t){target=t;mt.textContent=`Message ${t.name||'Teacher'}`;msg.value='';status.textContent='';modal.classList.remove('hidden');modal.classList.add('flex')}function closeM(){modal.classList.add('hidden');modal.classList.remove('flex')}async function sendM(){if(!msg.value.trim()||!target)return;try{await LamaAPI.add('messages',{studentId:S.studentId,schoolId:S.schoolId,teacherId:target.id||target.teacherId,toTeacherId:target.id||target.teacherId,message:msg.value.trim(),createdAt:new Date().toISOString(),status:'unread'});status.textContent='Message sent successfully.';msg.value=''}catch(e){status.textContent='Messaging collection is not configured in the backend.'}}
search.oninput=render;subject.onchange=render;init().catch(e=>{note.textContent='Student diary could not be loaded. Please sign in again and refresh.';console.warn('Student diary load failed',e);});
</script></body></html>
