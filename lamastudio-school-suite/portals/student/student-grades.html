<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Results</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../../assets/css/config.css"><script src="../../js/api-client.js"></script><style>body{background:#070b14}.card{background:#0f172add;border:1px solid #94a3b822}</style></head><body class="text-slate-100 min-h-screen"><header class="border-b border-slate-800 sticky top-0 bg-[#070b14]/90 backdrop-blur z-20"><div class="max-w-5xl mx-auto p-4 flex justify-between"><div><a href="student.html" class="text-xs text-cyan-300">← Dashboard</a><h1 class="font-black text-xl">🎓 Academic Results</h1></div><a href="student-diary.html" class="card rounded-xl px-3 py-2 text-xs">📓 Diary</a></div></header><main class="max-w-5xl mx-auto p-4 space-y-5"><section class="card rounded-3xl p-5"><p id="student" class="text-xs text-slate-400">Loading…</p><div id="years" class="flex flex-wrap gap-2 mt-4"></div></section><section id="result" class="card rounded-3xl p-5"></section></main><script>
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=[],selected='';
function render(){let r=records.find(x=>String(x.session||x.academicSession||x.year||'Current')===selected);if(!r){result.innerHTML='<p class="text-sm text-slate-500">No result available.</p>';return}let a=r.subjects||r.marks||[];if(!Array.isArray(a))a=Object.entries(a).map(([name,v])=>typeof v==='object'?{name,...v}:{name,obtained:v});let ob=Number(r.totalObtained)||a.reduce((s,x)=>s+(Number(x.obtained??x.marks??x.mark)||0),0),tot=Number(r.totalMarks)||a.reduce((s,x)=>s+(Number(x.total??x.maxMarks??100)||0),0),p=Number(r.percentage)||tot?ob/tot*100:0;result.innerHTML=`<div class="flex justify-between items-start"><div><small class="text-violet-300 uppercase">Session</small><h2 class="text-2xl font-black">${E(selected)}</h2></div><b class="text-3xl text-cyan-300">${p.toFixed(1)}%</b></div><div class="overflow-x-auto mt-5"><table class="w-full text-xs"><thead><tr class="border-b border-slate-800 text-left"><th class="p-3">Subject</th><th class="p-3">Obtained</th><th class="p-3">Total</th><th class="p-3">%</th></tr></thead><tbody>${a.map(x=>{let o=Number(x.obtained??x.marks??x.mark)||0,t=Number(x.total??x.maxMarks??100)||0;return`<tr class="border-b border-slate-900"><td class="p-3 font-bold">${E(x.name||x.subject||'Subject')}</td><td class="p-3">${o}</td><td class="p-3">${t}</td><td class="p-3">${t?(o/t*100).toFixed(0):0}%</td></tr>`}).join('')}</tbody></table></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5"><div class="bg-slate-950/50 rounded-2xl p-4">Total<br><b>${ob}/${tot}</b></div><div class="bg-slate-950/50 rounded-2xl p-4">Position<br><b>${E(r.position||'-')}</b></div><div class="bg-slate-950/50 rounded-2xl p-4">Grade<br><b>${E(r.grade||'-')}</b></div><div class="bg-slate-950/50 rounded-2xl p-4">Remarks<br><b>${E(r.remarks||'-')}</b></div></div>`}
async function init(){if(!LamaAPI.requireLogin('student','../../portal-login.html'))return;let s=LamaAPI.getSession(),st=await LamaAPI.get('students',s.studentId);student.textContent=`${st?.name||'Student'} • Class ${st?.class||s.class||'-'}${st?.section?'-'+st.section:''}`;if(Array.isArray(st?.historicalResults))records.push(...st.historicalResults);else if(st?.historicalResults)Object.entries(st.historicalResults).forEach(([y,v])=>records.push({...v,session:y}));let rr=await LamaAPI.list('results').catch(()=>[]);records.push(...rr.filter(x=>x.studentId===s.studentId));if(st?.subjects?.length)records.push({session:st.academicSession||s.academicSession||'Current',subjects:st.subjects,position:st.position,remarks:st.remarks});let map=new Map();records.forEach(x=>map.set(String(x.session||x.academicSession||x.year||'Current'),x));records=[...map.values()].sort((a,b)=>String(b.session||b.year).localeCompare(String(a.session||a.year)));selected=String(records[0]?.session||records[0]?.academicSession||records[0]?.year||'Current');years.innerHTML=records.map(x=>{let y=String(x.session||x.academicSession||x.year||'Current');return`<button class="rounded-xl bg-slate-900 px-4 py-2 text-xs font-black" onclick="selected='${E(y)}';render();document.querySelectorAll('#years button').forEach(b=>b.classList.remove('bg-violet-600'));this.classList.add('bg-violet-600')">${E(y)}</button>`}).join('');years.firstElementChild?.classList.add('bg-violet-600');render()}init().catch(console.error);
</script></body></html>
