<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../../assets/css/config.css"><script src="../../js/api-client.js"></script><style>body{background:#070b14}.card{background:#0f172add;border:1px solid #94a3b822;backdrop-filter:blur(14px)}</style></head><body class="min-h-screen text-slate-100"><header class="sticky top-0 z-30 bg-[#070b14]/90 backdrop-blur border-b border-slate-800"><div class="max-w-6xl mx-auto p-4 flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-cyan-500 grid place-items-center">🎓</div><div><b id="school">School</b><p id="meta" class="text-[9px] text-slate-500">Student</p></div></div><div class="flex gap-2"><a href="../../main-dashboard.html" class="card rounded-xl px-3 py-2 text-xs font-bold">🏫 Board</a><button onclick="logout()" class="card rounded-xl px-3 py-2 text-xs font-bold">Logout</button></div></div></header><main class="max-w-6xl mx-auto p-4 space-y-5"><section class="card rounded-3xl p-5 flex flex-wrap gap-5 items-center"><div id="photo" class="w-20 h-20 rounded-2xl bg-slate-800 grid place-items-center text-2xl">?</div><div class="flex-1"><p class="text-[9px] uppercase tracking-widest text-cyan-400">Welcome back</p><h1 id="name" class="text-2xl font-black">Student</h1><p id="details" class="text-xs text-slate-400"></p></div><a href="student-grades.html" class="bg-violet-600 rounded-xl px-4 py-2 text-xs font-black">🎓 Results</a></section><section class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="card rounded-2xl p-4"><p class="text-[9px] text-slate-500">Attendance</p><b id="att" class="text-2xl text-cyan-300">—</b></div><div class="card rounded-2xl p-4"><p class="text-[9px] text-slate-500">Latest Result</p><b id="res" class="text-2xl text-violet-300">—</b></div><div class="card rounded-2xl p-4"><p class="text-[9px] text-slate-500">Homework</p><b id="hwcount" class="text-2xl text-amber-300">0</b></div><div class="card rounded-2xl p-4"><p class="text-[9px] text-slate-500">Notices</p><b id="ncount" class="text-2xl text-emerald-300">0</b></div></section><section class="grid lg:grid-cols-2 gap-5"><div class="card rounded-3xl p-5"><p class="text-[9px] uppercase tracking-widest text-emerald-400">Live timetable</p><h2 class="text-lg font-black">Current / Next Lesson</h2><div id="current" class="mt-4 rounded-2xl bg-slate-950/60 p-5">Loading…</div></div><div class="card rounded-3xl p-5"><div class="flex justify-between"><h2 class="font-black">📅 Today</h2><a href="student-diary.html" class="text-xs text-cyan-300">Diary →</a></div><div id="tt" class="mt-4 space-y-2"></div></div></section><section class="grid lg:grid-cols-2 gap-5"><div class="card rounded-3xl p-5"><div class="flex justify-between"><h2 class="font-black">📝 Homework</h2><a href="student-diary.html" class="text-xs text-cyan-300">View all</a></div><div id="hw" class="mt-4 space-y-2"></div></div><div class="card rounded-3xl p-5"><h2 class="font-black">📢 Notices</h2><div id="notices" class="mt-4 space-y-2"></div></div></section><section class="card rounded-3xl p-5"><h2 class="font-black">Quick Access</h2><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4"><a href="student-grades.html" class="bg-slate-900 rounded-2xl p-4 text-sm font-bold">🎓 Results</a><a href="student-diary.html" class="bg-slate-900 rounded-2xl p-4 text-sm font-bold">📓 Diary</a><a href="../../main-dashboard.html" class="bg-slate-900 rounded-2xl p-4 text-sm font-bold">🧪 Tests</a><a href="../../main-dashboard.html" class="bg-slate-900 rounded-2xl p-4 text-sm font-bold">📚 Resources</a></div></section></main><script>
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const P=x=>x?.isPublished===true||x?.published===true||x?.status==='published'||x?.visibility==='public';const S=()=>LamaAPI.getSession();const L=c=>LamaAPI.list(c).catch(()=>[]);function logout(){LamaAPI.logout();location.href='../../portal-login.html'}function mins(t){let m=String(t||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);if(!m)return null;let h=+m[1],n=+m[2];if(m[3]?.toUpperCase()==='PM'&&h<12)h+=12;if(m[3]?.toUpperCase()==='AM'&&h===12)h=0;return h*60+n}async function init(){if(!LamaAPI.requireLogin('student','../../portal-login.html'))return;let s=S(),st=await LamaAPI.get('students',s.studentId);if(!st)return;school.textContent=s.schoolName||'School';name.textContent=st.name||'Student';meta.textContent=`Class ${st.class||s.class||'-'}${st.section?'-'+st.section:''}`;details.textContent=`Enrl No: ${st.enrlNo||'-'} • Session: ${st.academicSession||s.academicSession||'-'}`;if(st.photo)photo.innerHTML=`<img src="${E(st.photo)}" class="w-full h-full object-cover rounded-2xl">`;let a=(await L('attendance')).filter(x=>x.studentId===s.studentId),p=a.filter(x=>x.status==='Present').length,m=a.filter(x=>x.status==='Present'||x.status==='Absent').length;att.textContent=m?Math.round(p/m*100)+'%':'—';let h=(await L('homework')).filter(P).filter(x=>(!x.class||String(x.class)===String(st.class))&&(!x.section||String(x.section)===String(st.section)));hwcount.textContent=h.length;hw.innerHTML=h.slice(0,5).map(x=>`<div class="bg-slate-950/50 rounded-xl p-3"><b class="text-xs">${E(x.subject||'Homework')} — ${E(x.title||'')}</b><p class="text-[10px] text-slate-500">Due: ${E(x.dueDate||'—')}</p></div>`).join('')||'<p class="text-xs text-slate-500">No homework posted.</p>';let n=(await L('notifications')).filter(P).filter(x=>!x.class||String(x.class)===String(st.class));ncount.textContent=n.length;notices.innerHTML=n.slice(0,5).map(x=>`<div class="bg-slate-950/50 rounded-xl p-3"><b class="text-xs">${E(x.title||'Notice')}</b><p class="text-[10px] text-slate-500">${E(x.message||'')}</p></div>`).join('')||'<p class="text-xs text-slate-500">No notices.</p>';let sub=st.subjects||[],to=sub.reduce((a,x)=>a+(+x.total||0),0),ob=sub.reduce((a,x)=>a+(+x.obtained||0),0);res.textContent=to?(ob/to*100).toFixed(1)+'%':'—';let day=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()],t=(await L('timetable')).filter(P).filter(x=>(!x.day||String(x.day).toLowerCase()===day.toLowerCase())&&(!x.class||String(x.class)===String(st.class))&&(!x.section||String(x.section)===String(st.section))).sort((a,b)=>(mins(a.startTime)||0)-(mins(b.startTime)||0));tt.innerHTML=t.map(x=>`<div class="bg-slate-950/50 rounded-xl p-3 flex gap-3"><span class="text-[10px] text-slate-500">${E(x.startTime||'')}–${E(x.endTime||'')}</span><div><b class="text-xs">${E(x.subject||'Period')}</b><p class="text-[10px] text-slate-500">👨‍🏫 ${E(x.teacherName||x.teacher||'Teacher not assigned')}</p></div></div>`).join('')||'<p class="text-xs text-slate-500">No timetable published.</p>';let now=new Date().getHours()*60+new Date().getMinutes(),cur=t.find(x=>mins(x.startTime)<=now&&now<=mins(x.endTime))||t.find(x=>mins(x.startTime)>now);current.innerHTML=cur?`<p class="text-[10px] uppercase text-emerald-400">${mins(cur.startTime)<=now?'● LIVE NOW':'NEXT LESSON'}</p><h3 class="text-xl font-black mt-1">${E(cur.subject||'Lesson')}</h3><p class="text-xs text-slate-400 mt-2">${E(cur.startTime||'')} – ${E(cur.endTime||'')}</p><p class="text-xs text-slate-400 mt-1">👨‍🏫 ${E(cur.teacherName||cur.teacher||'Teacher not assigned')}</p><a href="student-diary.html#teacher-help" class="inline-block mt-4 rounded-xl bg-violet-600 px-3 py-2 text-xs font-black">💬 Ask Teacher</a>`:'<p class="text-sm text-slate-400">No current or upcoming lesson.</p>'}init().catch(console.error);
</script></body></html>
