<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Teacher Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../assets/css/config.css">
<script src="../../js/api-client.js"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen">

    <!-- Header -->
    <header class="max-w-5xl mx-auto px-4 pt-6 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div id="schoolLogoBox" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-xs font-black text-white">SCH</div>
            <div>
                <h1 id="headerSchoolName" class="text-sm font-black uppercase tracking-wider text-white">School Name</h1>
                <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold">Teacher Portal — <span id="teacherClassLabel">Class</span></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span id="teacherNameLabel" class="text-xs font-bold text-slate-300 hidden sm:inline">Teacher</span>
            <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition">Logout</button>
        </div>
    </header>

    <!-- Tab Bar -->
    <nav class="max-w-5xl mx-auto px-4 mt-5 flex gap-2 flex-wrap">
        <button class="tab-btn" data-tab="attendance" onclick="switchTab('attendance')">📋 Attendance</button>
        <button class="tab-btn" data-tab="homework" onclick="switchTab('homework')">📝 Homework</button>
        <button class="tab-btn" data-tab="marks" onclick="switchTab('marks')">🎯 Marks</button>
        <button class="tab-btn" data-tab="notices" onclick="switchTab('notices')">📢 Notices</button>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-5 space-y-5">

        <!-- ATTENDANCE TAB -->
        <section id="tab-attendance" class="tab-panel cyber-card rounded-2xl p-5 space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-3">
                <h2 class="text-xs font-black uppercase text-cyan-400">Mark Attendance</h2>
                <div class="flex items-center gap-2">
                    <input type="date" id="attDate" class="bg-slate-950 border border-slate-700 text-white text-xs rounded-xl px-3 py-2">
                    <button onclick="saveAttendance()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition">💾 Save</button>
                </div>
            </div>
            <div id="attendanceList" class="space-y-2"></div>
            <p id="attendanceEmpty" class="text-center text-sm text-slate-400 py-6 hidden">No students found in your assigned class yet.</p>
        </section>

        <!-- HOMEWORK TAB -->
        <section id="tab-homework" class="tab-panel cyber-card rounded-2xl p-5 space-y-4 hidden">
            <h2 class="text-xs font-black uppercase text-amber-400">Assign Homework</h2>
            <div class="grid sm:grid-cols-2 gap-3 text-xs">
                <input id="hwSubject" placeholder="Subject" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
                <input type="date" id="hwDueDate" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
                <input id="hwTitle" placeholder="Title" class="sm:col-span-2 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
                <textarea id="hwDescription" rows="2" placeholder="Description / instructions" class="sm:col-span-2 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white"></textarea>
            </div>
            <button onclick="postHomework()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition">+ Post Homework</button>
            <div class="border-t border-slate-800 pt-3 space-y-2" id="homeworkList"></div>
        </section>

        <!-- MARKS TAB -->
        <section id="tab-marks" class="tab-panel cyber-card rounded-2xl p-5 space-y-4 hidden">
            <h2 class="text-xs font-black uppercase text-purple-400">Enter Marks</h2>
            <select id="marksStudentSelect" class="w-full bg-slate-950 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5"></select>
            <div id="marksGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px]"></div>
            <button onclick="saveMarks()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition">💾 Save Marks</button>
        </section>

        <!-- NOTICES TAB -->
        <section id="tab-notices" class="tab-panel cyber-card rounded-2xl p-5 space-y-4 hidden">
            <h2 class="text-xs font-black uppercase text-emerald-400">Send Notice to Your Class</h2>
            <input id="noticeTitle" placeholder="Title" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
            <textarea id="noticeMessage" rows="3" placeholder="Message to parents / students..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"></textarea>
            <button onclick="sendNotice()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition">📢 Send</button>
            <div class="border-t border-slate-800 pt-3 space-y-2" id="noticesList"></div>
        </section>
    </main>

    <style>
        .tab-btn { font-size: 11px; font-weight: 900; text-transform: uppercase; padding: 8px 14px; border-radius: 10px; background: #1e293b; color: #94a3b8; transition: all .15s; }
        .tab-btn.active { background: #4f46e5; color: white; }
    </style>

    <script>
        const STUDENTS = 'students', ATTENDANCE = 'attendance', HOMEWORK = 'homework', NOTIFICATIONS = 'notifications';
        const DEFAULT_SUBJECTS = ['English', 'Urdu', 'Math', 'Islamiat', 'Nazra', 'Science/GK', 'SSt'];
        let myStudents = [];

        function switchTab(tab) {
            document.querySelectorAll('.tab-panel').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
        }

        function handleLogout() {
            LamaAPI.logout();
            window.location.href = '../../portal-login.html';
        }

        async function renderHeader() {
            const session = LamaAPI.getSession();
            document.getElementById('pageTitle').innerText = `${session.schoolName || 'School'} | Teacher Portal`;
            document.getElementById('headerSchoolName').innerText = session.schoolName || 'School';
            document.getElementById('teacherClassLabel').innerText = `Class ${session.assignedClass || '-'} • ${session.subject || ''}`;
            document.getElementById('teacherNameLabel').innerText = session.name || 'Teacher';
            const logoBox = document.getElementById('schoolLogoBox');
            if (session.schoolLogo) {
                logoBox.innerHTML = `<img src="${session.schoolLogo}" class="w-full h-full object-cover rounded-xl">`;
            } else {
                logoBox.innerText = LamaAPI.deriveShortCode(session.schoolName || 'SCH');
            }
        }

        // ---- Attendance ----
        async function loadAttendanceList() {
            const date = document.getElementById('attDate').value;
            const existing = (await LamaAPI.list(ATTENDANCE)).filter(a => a.date === date);
            const list = document.getElementById('attendanceList');
            document.getElementById('attendanceEmpty').classList.toggle('hidden', myStudents.length > 0);

            list.innerHTML = myStudents.map(s => {
                const existingRecord = existing.find(a => a.studentId === s.id);
                const currentStatus = existingRecord ? existingRecord.status : 'Present';
                return `
                <div class="flex items-center justify-between bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2" data-student-id="${s.id}" data-existing-id="${existingRecord ? existingRecord.id : ''}">
                    <span class="text-xs font-semibold">${s.name} <span class="text-slate-500">(${s.enrlNo || '-'})</span></span>
                    <div class="flex gap-1">
                        <button class="att-btn ${currentStatus === 'Present' ? 'att-active-present' : ''}" data-status="Present" onclick="setAttStatus(this, 'Present')">Present</button>
                        <button class="att-btn ${currentStatus === 'Absent' ? 'att-active-absent' : ''}" data-status="Absent" onclick="setAttStatus(this, 'Absent')">Absent</button>
                        <button class="att-btn ${currentStatus === 'Leave' ? 'att-active-leave' : ''}" data-status="Leave" onclick="setAttStatus(this, 'Leave')">Leave</button>
                    </div>
                </div>`;
            }).join('');
        }

        function setAttStatus(btn, status) {
            const row = btn.closest('[data-student-id]');
            row.querySelectorAll('.att-btn').forEach(b => b.className = 'att-btn');
            btn.className = `att-btn att-active-${status.toLowerCase()}`;
            row.dataset.status = status;
        }

        async function saveAttendance() {
            const date = document.getElementById('attDate').value;
            if (!date) { alert('Pick a date first.'); return; }
            const rows = document.querySelectorAll('#attendanceList [data-student-id]');
            for (const row of rows) {
                const studentId = row.dataset.studentId;
                const existingId = row.dataset.existingId;
                const activeBtn = row.querySelector('.att-btn[class*="att-active"]');
                const status = activeBtn ? activeBtn.dataset.status : 'Present';
                const student = myStudents.find(s => s.id === studentId);
                if (existingId) {
                    await LamaAPI.update(ATTENDANCE, existingId, { status });
                } else {
                    await LamaAPI.add(ATTENDANCE, { studentId, studentName: student.name, date, status });
                }
            }
            alert('Attendance saved.');
            loadAttendanceList();
        }

        // ---- Homework ----
        async function loadHomework() {
            const items = (await LamaAPI.list(HOMEWORK)).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            document.getElementById('homeworkList').innerHTML = items.map(h => `
                <div class="flex justify-between items-start bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2">
                    <div>
                        <p class="text-xs font-bold">${h.subject} — ${h.title}</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">${h.description || ''}</p>
                        <p class="text-[9px] text-amber-400 mt-1">Due: ${h.dueDate || 'N/A'}</p>
                    </div>
                    <button onclick="deleteHomework('${h.id}')" class="text-red-500 hover:text-red-400 text-xs font-bold">✕</button>
                </div>
            `).join('');
        }

        async function postHomework() {
            const subject = document.getElementById('hwSubject').value.trim();
            const title = document.getElementById('hwTitle').value.trim();
            if (!subject || !title) { alert('Subject and title are required.'); return; }
            await LamaAPI.add(HOMEWORK, {
                subject, title,
                description: document.getElementById('hwDescription').value.trim(),
                dueDate: document.getElementById('hwDueDate').value
            });
            document.getElementById('hwSubject').value = '';
            document.getElementById('hwTitle').value = '';
            document.getElementById('hwDescription').value = '';
            document.getElementById('hwDueDate').value = '';
            loadHomework();
        }

        async function deleteHomework(id) {
            await LamaAPI.remove(HOMEWORK, id);
            loadHomework();
        }

        // ---- Marks ----
        function populateMarksStudentSelect() {
            const select = document.getElementById('marksStudentSelect');
            select.innerHTML = myStudents.map(s => `<option value="${s.id}">${s.name} (${s.enrlNo || 'N/A'})</option>`).join('');
        }

        function buildMarksGrid(student) {
            const subs = student.subjects && student.subjects.length ? student.subjects : DEFAULT_SUBJECTS.map(name => ({ name, obtained: 0, total: 100 }));
            document.getElementById('marksGrid').innerHTML = subs.map(s => `
                <div class="space-y-1">
                    <label class="block text-slate-400 uppercase font-bold">${s.name}</label>
                    <div class="flex gap-1">
                        <input type="number" class="mark-obtained w-1/2 bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white" data-name="${s.name}" value="${s.obtained}">
                        <input type="number" class="mark-total w-1/2 bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white" data-name="${s.name}" value="${s.total}">
                    </div>
                </div>
            `).join('');
        }

        async function onMarksStudentChange() {
            const id = document.getElementById('marksStudentSelect').value;
            const student = myStudents.find(s => s.id === id);
            if (student) buildMarksGrid(student);
        }

        async function saveMarks() {
            const id = document.getElementById('marksStudentSelect').value;
            if (!id) return;
            const obtainedInputs = document.querySelectorAll('.mark-obtained');
            const totalInputs = document.querySelectorAll('.mark-total');
            const subjects = Array.from(obtainedInputs).map((el, i) => ({
                name: el.dataset.name, obtained: Number(el.value) || 0, total: Number(totalInputs[i].value) || 0
            }));
            await LamaAPI.update(STUDENTS, id, { subjects });
            alert('Marks saved.');
        }

        // ---- Notices ----
        async function loadNotices() {
            const items = (await LamaAPI.list(NOTIFICATIONS)).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            document.getElementById('noticesList').innerHTML = items.slice(0, 10).map(n => `
                <div class="bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2">
                    <p class="text-xs font-bold">${n.title}</p>
                    <p class="text-[10px] text-slate-400 mt-0.5">${n.message}</p>
                </div>
            `).join('');
        }

        async function sendNotice() {
            const title = document.getElementById('noticeTitle').value.trim();
            const message = document.getElementById('noticeMessage').value.trim();
            if (!title || !message) { alert('Title and message are required.'); return; }
            const session = LamaAPI.getSession();
            await LamaAPI.add(NOTIFICATIONS, {
                title, message, audience: `Class ${session.assignedClass}`, channel: 'Portal', status: 'Sent'
            });
            document.getElementById('noticeTitle').value = '';
            document.getElementById('noticeMessage').value = '';
            loadNotices();
        }

        // ---- Init ----
        async function init() {
            await renderHeader();
            myStudents = await LamaAPI.list(STUDENTS);
            document.getElementById('attDate').value = new Date().toISOString().split('T')[0];
            populateMarksStudentSelect();
            if (myStudents.length) buildMarksGrid(myStudents[0]);
            document.getElementById('marksStudentSelect').addEventListener('change', onMarksStudentChange);
            document.getElementById('attDate').addEventListener('change', loadAttendanceList);
            await loadAttendanceList();
            await loadHomework();
            await loadNotices();
            switchTab('attendance');
        }

        if (LamaAPI.requireLogin('teacher', '../../portal-login.html')) {
            init();
        }
    </script>
    <style>
        .att-btn { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: #1e293b; color: #94a3b8; }
        .att-active-present { background: #059669; color: white; }
        .att-active-absent { background: #dc2626; color: white; }
        .att-active-leave { background: #d97706; color: white; }
    </style>
</body>
</html>
