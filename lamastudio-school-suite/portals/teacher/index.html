<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Portal | Lama School Suite</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../../assets/css/config.css"><script src="../../js/api-client.js"></script></head><body class="bg-[#0b0f19] text-white min-h-screen"><main class="max-w-5xl mx-auto px-5 py-8"><header class="flex justify-between items-center gap-4"><div><p class="text-cyan-400 text-xs uppercase tracking-widest font-bold">Lama School Suite</p><h1 class="text-3xl font-black mt-2" id="school">Teacher Portal</h1><p class="text-slate-400 text-sm mt-2" id="scope">Loading account…</p></div><button id="logout" class="rounded-xl bg-slate-800 px-4 py-2 text-sm">Logout</button></header><section class="grid md:grid-cols-3 gap-4 mt-9"><a class="rounded-2xl border border-cyan-900 bg-slate-900 p-6 hover:border-cyan-400" href="teacher-dashboard.html"><span class="text-3xl">📋</span><h2 class="font-bold text-xl mt-4">Teacher Dashboard</h2><p class="text-sm text-slate-400 mt-2">Class attendance, absentees, notices and class management</p></a><a class="rounded-2xl border border-amber-900 bg-slate-900 p-6 hover:border-amber-400" href="teacher-diary.html"><span class="text-3xl">📓</span><h2 class="font-bold text-xl mt-4">Diary & Homework</h2><p class="text-sm text-slate-400 mt-2">Create, edit and publish class homework for students</p></a><a class="rounded-2xl border border-purple-900 bg-slate-900 p-6 hover:border-purple-400" href="teacher-grades.html"><span class="text-3xl">🎯</span><h2 class="font-bold text-xl mt-4">Exam Grades</h2><p class="text-sm text-slate-400 mt-2">Store exam results by academic session without overwriting history</p></a></section><p id="warning" class="text-rose-400 text-sm mt-6"></p></main><script>document.getElementById('logout').onclick=()=>{LamaAPI.logout();location.href='../../portal-login.html'};if(LamaAPI.requireLogin('teacher','../../portal-login.html')){const s=LamaAPI.getSession()||{};document.getElementById('school').textContent=s.schoolName||'Teacher Portal';document.getElementById('scope').textContent=`${s.name||'Teacher'} · Class ${s.assignedClass||'Unassigned'} ${s.section||''} · ${s.subject||'Subject not set'}`;if(!s.schoolId||!s.assignedClass)document.getElementById('warning').textContent='School ID and assigned class are required to access records.'}</script></body></html>
