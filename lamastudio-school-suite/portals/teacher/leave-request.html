<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Leave Request — Lama School Suite</title><style>body{margin:0;background:#080d1d;color:#e5e7eb;font:15px system-ui,Arial}header{background:#101b33;border-bottom:1px solid #334155;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}main{max-width:1200px;margin:25px auto;padding:0 18px}.panel{background:#111e34;border:1px solid #334155;border-radius:18px;padding:20px;margin-bottom:18px}h1,h2{margin:0 0 15px}label{display:block;font-size:13px;color:#cbd5e1;margin:10px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;background:#0b1426;color:white;border:1px solid #475569;border-radius:9px;padding:11px}textarea{min-height:85px}button,.btn{background:#0ea5e9;color:#03111d;border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#334155;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{background:#172b44;border-radius:12px;padding:14px}.metric strong{font-size:23px;display:block}table{width:100%;border-collapse:collapse;min-width:680px}td,th{text-align:left;padding:10px;border-bottom:1px solid #334155}th{color:#67e8f9}.scroll{overflow:auto}.muted{color:#94a3b8}.err{color:#fca5a5}.ok{color:#6ee7b7}a{color:#67e8f9}nav{display:flex;gap:14px;flex-wrap:wrap}small{color:#94a3b8}@media print{header,.no-print,form,button{display:none!important}body{background:#fff;color:#111}.panel,.metric{background:#fff;color:#111;border:1px solid #aaa}th,small{color:#111}table{min-width:0}}</style></head><body><header><strong>🎓 Lama School Suite · Teacher Leave Request</strong><nav><a href="../../dashboard.html">School Dashboard</a><a href="../../finance-center.html">Finance</a><a href="../../leave-manager.html">Leave Manager</a><a href="../../document-import.html">Import</a><a href="../../identity-cards.html">ID Cards</a></nav></header><main><h1>Teacher Leave Request</h1><p id="notice" aria-live="polite" class="muted"></p><section class="panel"><h2>Request leave</h2><form id="request"><div class="grid"><div><label>From</label><input id="from" type="date" required></div><div><label>To</label><input id="to" type="date" required></div></div><label>Reason</label><textarea id="reason" maxlength="2000" required></textarea><p><button>Submit leave request</button></p></form></section><section class="panel"><h2>My leave requests</h2><div class="scroll"><table><thead><tr><th>From</th><th>To</th><th>Reason</th><th>Status</th><th>Admin reply</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="../../js/api-client.js"></script><script>const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>'Rs. '+Number(x||0).toLocaleString();const today=()=>new Date().toLocaleDateString('en-CA');function notice(s,er=false){$('notice').textContent=s;$('notice').className=er?'err':'ok'}function err(e){notice(e.message||String(e),true)}if(LamaAPI.requireLogin('teacher','../../portal-login.html')){(async()=>{try{async function load(){const rows=await LamaAPI.list('teacherLeaves');$('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.leaveFrom)}</td><td>${esc(x.leaveTo)}</td><td>${esc(x.reason)}</td><td>${esc(x.status)}</td><td>${esc(x.adminReply)}</td></tr>`).join('')||'<tr><td colspan="5">No leave requests</td></tr>'}$('request').onsubmit=async e=>{e.preventDefault();try{await LamaAPI.add('teacherLeaves',{leaveFrom:$('from').value,leaveTo:$('to').value,reason:$('reason').value});$('request').reset();await load();notice('Leave request submitted')}catch(e){err(e)}};await load();}catch(e){err(e)}})()}</script></body></html>
