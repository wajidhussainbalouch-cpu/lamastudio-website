<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Diary | LamaStudio</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../../assets/css/config.css"><script src="../../js/api-client.js"></script></head><body class="bg-[#0b0f19] text-slate-100 min-h-screen"><main class="max-w-5xl mx-auto p-5 space-y-5"><header class="flex justify-between items-center gap-3 flex-wrap"><div><a href="teacher-dashboard.html" class="text-emerald-400 text-sm">← Teacher Workspace</a><h1 class="text-3xl font-black mt-2">📓 Diary & Homework Archive</h1><p id="scope" class="text-slate-400 text-sm"></p></div><button id="new" class="bg-emerald-500 text-slate-950 font-bold rounded-xl px-4 py-3">+ New Entry</button></header><section id="editor" class="hidden bg-slate-900 border border-emerald-800 rounded-2xl p-5 space-y-3"><h2 class="font-bold">Diary Entry</h2><div class="grid sm:grid-cols-2 gap-3"><input id="subject" placeholder="Subject" class="field"><input id="dueDate" type="date" class="field"><input id="title" placeholder="Title" class="field sm:col-span-2"><textarea id="description" placeholder="Homework instructions" class="field sm:col-span-2" rows="4"></textarea></div><label class="text-sm"><input id="published" type="checkbox" checked> Publish for students and parents</label><div class="flex gap-2"><button id="save" class="bg-emerald-500 text-slate-950 px-5 py-2 rounded-lg font-bold">Save</button><button id="cancel" class="bg-slate-700 px-5 py-2 rounded-lg">Cancel</button></div></section><section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5"><div class="flex flex-wrap gap-3 mb-4"><input id="search" placeholder="Search diary..." class="field flex-1"><select id="filter" class="field"><option value="all">All entries</option><option value="published">Published</option><option value="draft">Drafts</option></select></div><div id="entries" class="space-y-3"></div></section><p id="status" class="text-sm text-slate-400" role="status"></p></main><style>.field{background:#020617;border:1px solid #334155;border-radius:10px;padding:11px;color:white;width:100%}.entry{background:#020617;border:1px solid #334155;border-radius:14px;padding:16px}.action{background:#1e293b;padding:7px 12px;border-radius:8px;font-size:12px}</style><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').trim().toLowerCase();let me,items=[],editId=null;
function scope(x){return !!me.schoolId&&norm(x.schoolId)===norm(me.schoolId)&&norm(x.class)===norm(me.assignedClass)&&(!me.section||norm(x.section)===norm(me.section))}function owned(x){return x.teacherId&&norm(x.teacherId)===norm(me.teacherId||me.id)}function visible(x){return scope(x)&&(owned(x)||(!x.teacherId&&norm(x.subject)===norm(me.subject)))}function pub(x){return x.isPublished===true||x.published===true||norm(x.status)==='published'}
async function load(){items=(await LamaAPI.list('homework')).filter(visible);render()}function render(){const q=norm($('search').value),f=$('filter').value;let a=items.filter(x=>(f==='all'||(f==='published')===pub(x))&&norm([x.title,x.subject,x.description].join(' ')).includes(q));$('entries').innerHTML=a.length?a.map(x=>`<article class="entry"><div class="flex justify-between gap-3 flex-wrap"><div><b class="text-emerald-400">${esc(x.subject)}</b><h3 class="font-bold mt-1">${esc(x.title)}</h3><p class="text-slate-300 text-sm mt-2 whitespace-pre-wrap">${esc(x.description)}</p><p class="text-slate-500 text-xs mt-2">Due ${esc(x.dueDate||'—')} · ${pub(x)?'Published':'Draft'}</p></div><div class="flex gap-2 self-start"><button class="action" data-edit="${esc(x.id)}">Edit</button><button class="action text-rose-400" data-delete="${esc(x.id)}">Delete</button></div></div></article>`).join(''):'<p class="text-slate-400">No diary entries found.</p>'}
function open(x){editId=x?.id||null;for(const k of ['title','subject','description','dueDate'])$(k).value=x?.[k]||'';$('published').checked=x?pub(x):true;$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})}
$('new').onclick=()=>open(null);$('cancel').onclick=()=>$('editor').classList.add('hidden');$('search').oninput=render;$('filter').onchange=render;$('entries').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const x=items.find(r=>String(r.id)===edit.dataset.edit);if(x&&owned(x))open(x);else alert('Only your own entries may be edited.')}if(del){const x=items.find(r=>String(r.id)===del.dataset.delete);if(!x||!owned(x))return alert('Only your own entries may be deleted.');if(confirm('Delete this diary entry?')){await LamaAPI.remove('homework',x.id);await load()}}};
$('save').onclick=async()=>{const subject=$('subject').value.trim(),title=$('title').value.trim();if(!subject||!title)return alert('Subject and title are required.');const old=items.find(x=>String(x.id)===String(editId));if(old&&!owned(old))return alert('You can edit only your own entries.');const p=$('published').checked,now=new Date().toISOString(),r={...(old||{}),subject,title,description:$('description').value.trim(),dueDate:$('dueDate').value,schoolId:me.schoolId,class:me.assignedClass,section:me.section||'',teacherId:me.teacherId||me.id,isPublished:p,published:p,status:p?'published':'draft',updatedAt:now};try{if(editId)await LamaAPI.update('homework',editId,r);else await LamaAPI.add('homework',{...r,createdAt:now});$('editor').classList.add('hidden');$('status').textContent='Saved successfully.';await load()}catch(err){$('status').textContent='Save failed: '+err.message}};
(async()=>{if(!LamaAPI.requireLogin('teacher','../../portal-login.html'))return;me=LamaAPI.getSession();if(!me?.assignedClass||!me?.schoolId)return $('status').textContent='Teacher class assignment is required.';$('scope').textContent=`Class ${me.assignedClass}${me.section?'-'+me.section:''} · ${me.name||'Teacher'}`;await load()})().catch(e=>$('status').textContent=e.message);
</script></body></html>
