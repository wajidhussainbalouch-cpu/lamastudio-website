<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Grading Matrix | LamaStudio</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../../assets/css/config.css"><script src="../../js/api-client.js"></script></head><body class="bg-[#0b0f19] text-slate-100 min-h-screen"><main class="max-w-6xl mx-auto p-5 space-y-5"><header><a href="teacher-dashboard.html" class="text-emerald-400 text-sm">← Teacher Workspace</a><h1 class="text-3xl font-black mt-2">🎯 Exam Grading Matrix</h1><p id="scope" class="text-slate-400 text-sm"></p></header><section class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="grid md:grid-cols-4 gap-3"><label>Academic Session<input id="session" class="field" placeholder="2026-2027"></label><label>Exam<input id="exam" class="field" placeholder="Mid Term"></label><label>Subject<input id="subject" class="field" placeholder="Mathematics"></label><label>Maximum Marks<input id="maximum" type="number" min="1" class="field" value="100"></label></div><button id="load" class="bg-emerald-500 text-slate-950 font-bold rounded-xl px-4 py-2 mt-4">Load Marks Matrix</button></section><section class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="overflow-x-auto"><table class="w-full text-sm min-w-[620px]"><thead><tr class="text-slate-400 border-b border-slate-700"><th class="text-left p-3">Student</th><th class="text-left p-3">Enrollment</th><th class="text-left p-3">Obtained</th><th class="text-left p-3">Maximum</th><th class="text-left p-3">Percentage</th></tr></thead><tbody id="rows"></tbody></table></div><button id="save" disabled class="bg-emerald-500 disabled:opacity-40 text-slate-950 font-bold rounded-xl px-5 py-3 mt-4">Save All Marks</button><p id="status" class="text-slate-400 text-sm mt-3" role="status"></p></section></main><style>.field{display:block;width:100%;margin-top:6px;background:#020617;border:1px solid #334155;border-radius:10px;padding:11px;color:white}td{padding:9px;border-bottom:1px solid #334155}.mark{background:#020617;border:1px solid #334155;border-radius:8px;padding:8px;width:100px}</style><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').trim().toLowerCase();let me,students=[],results=[],active=[];
function grade(p){return p>=80?'A+':p>=70?'A':p>=60?'B':p>=50?'C':p>=33?'D':'F'}function getSubject(r,name){const a=r.subjects||[];if(Array.isArray(a))return a.find(s=>norm(s.name)===norm(name));return a[name]}
$('load').onclick=async()=>{const sess=$('session').value.trim(),exam=$('exam').value.trim(),subject=$('subject').value.trim(),max=Number($('maximum').value);if(me.subject&&norm(subject)!==norm(me.subject))return alert('You may only enter marks for your assigned subject.');if(!sess||!exam||!subject||!Number.isFinite(max)||max<=0)return alert('Complete all examination fields.');results=(await LamaAPI.list('results')).filter(r=>norm(r.schoolId)===norm(me.schoolId));active=students.map(s=>({student:s,result:results.find(r=>norm(r.studentId)===norm(s.id)&&norm(r.academicSession||r.session)===norm(sess)&&norm(r.examType||r.exam)===norm(exam))}));$('rows').innerHTML=active.map(({student:s,result:r},i)=>{const v=getSubject(r||{},subject),o=v?.obtained??'';return `<tr data-index="${i}"><td>${esc(s.name)}</td><td>${esc(s.enrlNo||s.enrollmentNo||'—')}</td><td><input class="mark obtained" type="number" min="0" max="${max}" value="${esc(o)}"></td><td>${max}</td><td class="percent">${o===''?'—':(Number(o)/max*100).toFixed(1)+'%'}</td></tr>`}).join('');$('save').disabled=!active.length;$('status').textContent=active.length+' students loaded. Blank marks will remain unchanged.'};
$('rows').oninput=e=>{const row=e.target.closest('tr');if(!row)return;const v=row.querySelector('.obtained').value,max=Number($('maximum').value);row.querySelector('.percent').textContent=v===''?'—':(Number(v)/max*100).toFixed(1)+'%'};
$('save').onclick=async()=>{const max=Number($('maximum').value),subject=$('subject').value.trim(),sess=$('session').value.trim(),exam=$('exam').value.trim();if(me.subject&&norm(subject)!==norm(me.subject))return alert('Subject is not assigned to you');if(!active.length)return;let saved=0,failed=0;for(const row of $('rows').querySelectorAll('tr')){const val=row.querySelector('.obtained').value;if(val==='')continue;const n=Number(val);if(!Number.isFinite(n)||n<0||n>max){alert('Marks must be between 0 and '+max);return}}for(const row of $('rows').querySelectorAll('tr')){const val=row.querySelector('.obtained').value;if(val==='')continue;const {student:s,result:old}=active[Number(row.dataset.index)];const subjects=Array.isArray(old?.subjects)?Object.fromEntries(old.subjects.map(x=>[x.name,{obtained:Number(x.obtained),total:Number(x.total)}])):{...(old?.subjects||{})};subjects[subject]={obtained:Number(val),total:max};const totals=Object.values(subjects).reduce((a,x)=>({obtained:a.obtained+Number(x.obtained||0),total:a.total+Number(x.total||0)}),{obtained:0,total:0});const percentage=totals.total?Number((totals.obtained/totals.total*100).toFixed(2)):0;const data={...(old||{}),studentId:s.id,schoolId:me.schoolId,class:s.class,section:s.section||'',academicSession:sess,examType:exam,subjects,totalObtained:totals.obtained,totalMarks:totals.total,percentage,grade:grade(percentage),lastEditedBy:me.teacherId||me.id,updatedAt:new Date().toISOString()};try{if(old?.id)await LamaAPI.update('results',old.id,data);else await LamaAPI.add('results',{...data,createdAt:new Date().toISOString()});saved++}catch(e){failed++}}$('status').textContent=`Saved ${saved} student results; ${failed} failed. Previous exam/session records remain separate.`};
(async()=>{if(!LamaAPI.requireLogin('teacher','../../portal-login.html'))return;me=LamaAPI.getSession();if(!me?.assignedClass||!me?.schoolId)return $('status').textContent='Teacher class assignment is required.';$('scope').textContent=`Class ${me.assignedClass}${me.section?'-'+me.section:''} · ${me.name||'Teacher'}`;students=(await LamaAPI.list('students')).filter(s=>norm(s.schoolId)===norm(me.schoolId)&&norm(s.class)===norm(me.assignedClass)&&(!me.section||norm(s.section)===norm(me.section)));$('status').textContent=students.length+' students in assigned class.'})().catch(e=>$('status').textContent=e.message);
</script></body></html>
