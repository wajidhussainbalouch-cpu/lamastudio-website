<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply for LamaStudio School Suite</title><script src="https://cdn.tailwindcss.com"></script><script src="js/api-client.js"></script></head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex items-center justify-center">
<main class="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-3xl p-6 sm:p-8 space-y-5">
<div class="flex justify-between items-center"><h1 class="text-xl font-bold">Register Your School</h1><a class="text-cyan-400 text-sm" href="login.html">Existing school login</a></div>
<p class="text-slate-300 text-sm">Submit your application. Choose an administrator ID and password now. Your account becomes active after approval.</p>
<form id="form" class="grid gap-3 text-sm">
<label>School Name *<input id="name" required minlength="3" maxlength="140" class="field" placeholder="School name"></label>
<div class="grid grid-cols-2 gap-3"><label>Type<select id="type" class="field"><option>Private</option><option>Government</option></select></label><label>Level<select id="level" class="field"><option>Primary</option><option>Middle</option><option>High</option><option>Higher Secondary</option></select></label></div>
<label>Principal / Owner Name<input id="principal" class="field" maxlength="120"></label>
<label>Principal Email *<input id="adminEmail" type="email" required class="field" placeholder="principal@example.com"></label>
<fieldset class="border border-slate-600 p-3 rounded-xl"><legend>Administrator Login</legend><label>Admin Name<input id="adminDisplayName" class="field" required maxlength="100"></label><label>Admin ID<input id="adminUsername" class="field" required pattern="[A-Za-z0-9._-]{3,40}"></label><label>Password<input id="adminPassword" class="field" type="password" required minlength="12"></label><label>Confirm Password<input id="confirmPassword" class="field" type="password" required minlength="12"></label></fieldset><label>Phone<input id="phone" class="field" maxlength="80"></label>
<label>School Address<input id="address" class="field" maxlength="300"></label>
<label>Requested Subscription<select id="plan" class="field"><option value="Trial">Trial</option><option value="Monthly">Monthly plan</option><option value="Annual">Annual plan</option></select></label>
<label>Requirements / Classes / Notes<textarea id="requirements" class="field" rows="3" maxlength="400" placeholder="e.g. Prep, Class 1–8, fees and attendance"></textarea></label>
<p class="text-xs text-slate-400">Your administrator account activates after Super Admin approval.</p>
<button id="submit" class="bg-indigo-600 hover:bg-indigo-500 rounded-xl p-3 font-bold">Submit for Approval</button>
</form><p id="message" class="hidden text-sm rounded-xl p-3" role="status"></p>
</main>
<style>.field{display:block;width:100%;margin-top:5px;background:#020617;border:1px solid #475569;border-radius:10px;padding:11px;color:white}label{color:#cbd5e1}</style>
<script>
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();const btn=document.getElementById('submit'),msg=document.getElementById('message');btn.disabled=true;btn.textContent='Submitting...';msg.className='hidden';
 if(document.getElementById('adminPassword').value!==document.getElementById('confirmPassword').value){msg.className='text-red-400';msg.textContent='Passwords do not match';btn.disabled=false;return;}
 const fields=['adminUsername','adminDisplayName','adminPassword','name','type','level','principal','adminEmail','phone','address','plan','requirements'];const data=Object.fromEntries(fields.map(k=>[k,document.getElementById(k).value.trim()]));
 try{await LamaAPI.requestSchoolRegistration(data);document.getElementById('form').classList.add('hidden');msg.className='bg-emerald-950 border border-emerald-700 text-emerald-200 p-3 rounded-xl text-sm';msg.textContent='Application received. LamaStudio will review it. Your administrator login will activate after approval.';}
 catch(err){msg.className='bg-red-950 border border-red-700 text-red-200 p-3 rounded-xl text-sm';msg.textContent=err.message;btn.disabled=false;btn.textContent='Submit for Approval';}
});
</script></body></html>
