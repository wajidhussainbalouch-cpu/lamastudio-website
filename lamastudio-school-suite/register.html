<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Suite Registration | lamastudio.pk</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="assets/css/config.css">
    
    <!-- Lamastudio Storage & API Layer (Fallbacks handled gracefully) -->
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/school-store.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md sticky top-0 z-40 py-3 px-4 md:px-8 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <a href="index.html" class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer">&larr; Home</a>
            <h1 class="text-xs font-black tracking-wider text-indigo-600 dark:text-indigo-400">LAMASTUDIO SCHOOL SUITE</h1>
        </div>
        <span class="text-[10px] bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full text-indigo-600 dark:text-indigo-400 font-bold">
            Suite Registration Portal
        </span>
    </header>

    <!-- Main Form Container -->
    <main class="max-w-2xl w-full mx-auto px-4 py-12 flex-grow flex flex-col justify-center">
        <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
            
            <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-4">
                <div>
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white">Register School Suite Workspace</h3>
                    <p class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold mt-1">Set up your institution's central administrative cloud account</p>
                </div>
            </div>

            <!-- Unified Registration Form -->
            <form id="registrationForm" class="space-y-4" onsubmit="handleRegistration(event)">
                
                <!-- Admin Credentials Section -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-indigo-500/5 p-4 rounded-2xl border border-indigo-500/20">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Admin Username / Email</label>
                        <input type="email" id="adminEmail" required placeholder="admin@school.edu.pk" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Admin Password</label>
                        <div class="relative">
                            <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 pr-10">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer text-xs">
                                <span id="eyeIcon">👁️</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- School Logo Upload (Optimized for 15KB - 30KB Target) -->
                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/80 space-y-2">
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">School Crest / Logo Upload</label>
                    <div class="flex items-center gap-3">
                        <input type="file" id="schoolLogoFile" accept="image/png, image/jpeg, image/webp" onchange="validateAndCompressLogo(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600 dark:file:bg-indigo-950 dark:file:text-indigo-300 hover:file:bg-indigo-100 cursor-pointer">
                    </div>
                    <p id="logoStatusText" class="text-[10px] text-slate-400">Target file weight: 15 KB – 30 KB. Formats: PNG, JPG, WebP.</p>
                    <input type="hidden" id="schoolLogoBase64">
                </div>

                <!-- Government or Private Sector Switcher -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Institution Sector</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="btnPrivate" onclick="setSector('Private')" class="py-2.5 px-4 rounded-xl text-xs font-bold border transition bg-indigo-600 text-white border-indigo-600 shadow-sm cursor-pointer">
                            🏫 Private Institution
                        </button>
                        <button type="button" id="btnGovt" onclick="setSector('Government')" class="py-2.5 px-4 rounded-xl text-xs font-bold border transition bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700 cursor-pointer">
                            🏛️ Government School
                        </button>
                    </div>
                    <input type="hidden" id="schoolSector" value="Private">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Official School Name</label>
                        <input type="text" id="schoolName" required placeholder="e.g., Lahore Grammar School" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">School ID / Code Prefix</label>
                        <input type="text" id="schoolCodeId" required placeholder="e.g., lgs_gulberg" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">School Full Address</label>
                        <input type="text" id="schoolAddress" required placeholder="Main Boulevard, Gulberg" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">District</label>
                        <input type="text" id="schoolDistrict" required placeholder="e.g., Lahore" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Map Location Link / GPS Coords</label>
                    <div class="flex gap-2">
                        <input type="text" id="mapLocation" placeholder="Paste Google Maps pin link or coordinates" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                        <button type="button" onclick="openMapPinHelper()" class="bg-slate-200 dark:bg-slate-700 px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap cursor-pointer hover:bg-slate-300">Open Map 🗺️</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">School Level</label>
                        <select id="schoolLevel" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white">
                            <option value="Primary">Primary (1-5)</option>
                            <option value="Middle">Middle (6-8)</option>
                            <option value="High" selected>High (9-10)</option>
                            <option value="Higher Secondary">Higher Secondary (11-12)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Gender</label>
                        <select id="schoolGender" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white">
                            <option value="Combined">Combined / Co-Ed</option>
                            <option value="Boys Only">Boys Only</option>
                            <option value="Girls Only">Girls Only</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Custom School ID Pattern</label>
                        <input type="text" id="idPattern" placeholder="e.g., LGS-2026-###" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Total Strength (Students)</label>
                        <input type="number" id="totalStrength" required placeholder="e.g., 450" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Total Staff Members</label>
                        <input type="number" id="totalStaff" required placeholder="e.g., 35" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Principal Name</label>
                        <input type="text" id="principalName" required placeholder="Mr. Ahmed Khan" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
                        <input type="text" id="principalPhone" required placeholder="03001234567" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                </div>

                <!-- Dynamic Sector Block -->
                <div id="dynamicVerificationBlock" class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/80 space-y-3">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300" id="privateCodeLabel">Private Registration / License Number</label>
                        <div id="privateToggleContainer" class="flex space-x-1">
                            <button type="button" onclick="setPrivateCodeType('RegNum')" id="btnRegNum" class="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded-lg font-bold transition">Reg Number</button>
                            <button type="button" onclick="setPrivateCodeType('EMIS')" id="btnPrivateEMIS" class="text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-lg font-bold transition">EMIS Code</button>
                        </div>
                    </div>
                    <input type="hidden" id="privateCodeMode" value="RegNum">
                    <input type="text" id="institutionCodeInput" required placeholder="e.g., REG-LHR-2026-99" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1 mt-2">Fee Transaction Note / Reference Code (EasyPaisa/JazzCash/Bank)</label>
                        <input type="text" id="receiptNote" required placeholder="e.g., TrxID: 839201928" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Subscription Package Tier</label>
                        <select id="selectedPackage" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white">
                            <option value="Standard Tier (PKR 1,500/mo)">Standard Tier (PKR 1,500/mo)</option>
                            <option value="Professional Tier (PKR 3,600/mo)" selected>Professional Tier (PKR 3,600/mo)</option>
                        </select>
                    </div>
                </div>

                <div id="formError" class="text-xs text-rose-500 font-bold hidden"></div>
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-600/30 mt-2 cursor-pointer">
                    Sync to Google Sheet & Complete Registration 🚀
                </button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-5 px-6 text-center text-xs text-slate-500 space-y-1">
        <p>&copy; 2026 lamastudio.pk • Google Sheets Cloud Provisioning Engine</p>
    </footer>

    <!-- Google Sheets Sync Script with 15KB - 30KB Logo Compressor & Fallbacks -->
    <script>
        if (typeof SchoolStore === 'undefined') {
            window.SchoolStore = {
                upsert: async function(payload) {
                    const existingSchools = JSON.parse(localStorage.getItem('lamastudio_schools_db')) || [];
                    existingSchools.push(payload);
                    localStorage.setItem('lamastudio_schools_db', JSON.stringify(existingSchools));
                    localStorage.setItem('lamastudio_active_school', JSON.stringify(payload));
                    return { success: true };
                }
            };
        }

        window.togglePasswordVisibility = function() {
            const passwordInput = document.getElementById('adminPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = '👁️';
            }
        };

        // Automatic Logo Compressor to fit within 15 KB to 30 KB bounds
        window.validateAndCompressLogo = function(event) {
            const file = event.target.files[0];
            const statusText = document.getElementById('logoStatusText');
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const MAX_DIMENSION = 120;
                    if (width > height) {
                        if (width > MAX_DIMENSION) {
                            height *= MAX_DIMENSION / width;
                            width = MAX_DIMENSION;
                        }
                    } else {
                        if (height > MAX_DIMENSION) {
                            width *= MAX_DIMENSION / height;
                            height = MAX_DIMENSION;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    let quality = 0.7;
                    let dataUrl = canvas.toDataURL('image/jpeg', quality);
                    let sizeKB = Math.round((dataUrl.length * (3/4)) / 1024);
                    
                    while (sizeKB > 30 && quality > 0.1) {
                        quality -= 0.1;
                        dataUrl = canvas.toDataURL('image/jpeg', quality);
                        sizeKB = Math.round((dataUrl.length * (3/4)) / 1024);
                    }

                    document.getElementById('schoolLogoBase64').value = dataUrl;
                    statusText.innerHTML = `<span class="text-emerald-500 font-bold">✔ Crest optimized successfully! Final size: ~${sizeKB} KB (Target: 15K–30K)</span>`;
                };
            };
            reader.readAsDataURL(file);
        };

        window.setSector = function(sector) {
            document.getElementById('schoolSector').value = sector;
            const btnPrivate = document.getElementById('btnPrivate');
            const btnGovt = document.getElementById('btnGovt');
            const dynamicBlock = document.getElementById('dynamicVerificationBlock');

            if (sector === 'Private') {
                btnPrivate.className = "py-2.5 px-4 rounded-xl text-xs font-bold border transition bg-indigo-600 text-white border-indigo-600 shadow-sm cursor-pointer";
                btnGovt.className = "py-2.5 px-4 rounded-xl text-xs font-bold border transition bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700 cursor-pointer";
                
                dynamicBlock.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300" id="privateCodeLabel">Private Registration / License Number</label>
                        <div id="privateToggleContainer" class="flex space-x-1">
                            <button type="button" onclick="setPrivateCodeType('RegNum')" id="btnRegNum" class="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded-lg font-bold transition">Reg Number</button>
                            <button type="button" onclick="setPrivateCodeType('EMIS')" id="btnPrivateEMIS" class="text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-lg font-bold transition">EMIS Code</button>
                        </div>
                    </div>
                    <input type="hidden" id="privateCodeMode" value="RegNum">
                    <input type="text" id="institutionCodeInput" required placeholder="e.g., REG-LHR-2026-99" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1 mt-2">Fee Transaction Note / Reference Code (EasyPaisa/JazzCash/Bank)</label>
                        <input type="text" id="receiptNote" required placeholder="e.g., TrxID: 839201928" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Subscription Package Tier</label>
                        <select id="selectedPackage" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white">
                            <option value="Standard Tier (PKR 1,500/mo)">Standard Tier (PKR 1,500/mo)</option>
                            <option value="Professional Tier (PKR 3,600/mo)" selected>Professional Tier (PKR 3,600/mo)</option>
                        </select>
                    </div>
                `;
            } else {
                btnGovt.className = "py-2.5 px-4 rounded-xl text-xs font-bold border transition bg-indigo-600 text-white border-indigo-600 shadow-sm cursor-pointer";
                btnPrivate.className = "py-2.5 px-4 rounded-xl text-xs font-bold border transition bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700 cursor-pointer";

                dynamicBlock.innerHTML = `
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Government School EMIS Code</label>
                        <input type="text" id="institutionCodeInput" required placeholder="e.g., EMIS-PK-55201" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1 mt-2">Fee Transaction Note / Reference Code (EasyPaisa/JazzCash/Bank)</label>
                        <input type="text" id="receiptNote" required placeholder="e.g., Govt Fund TrxID: 442910" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Subscription Package Tier</label>
                        <select id="selectedPackage" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-900 dark:text-white">
                            <option value="Standard Tier (PKR 1,500/mo)">Standard Tier (PKR 1,500/mo)</option>
                            <option value="Professional Tier (PKR 3,600/mo)" selected>Professional Tier (PKR 3,600/mo)</option>
                        </select>
                    </div>
                `;
            }
        };

        window.setPrivateCodeType = function(type) {
            document.getElementById('privateCodeMode').value = type;
            const btnRegNum = document.getElementById('btnRegNum');
            const btnPrivateEMIS = document.getElementById('btnPrivateEMIS');
            const label = document.getElementById('privateCodeLabel');
            const input = document.getElementById('institutionCodeInput');

            if (type === 'RegNum') {
                btnRegNum.className = "text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded-lg font-bold transition";
                btnPrivateEMIS.className = "text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-lg font-bold transition";
                label.innerText = "Private Registration / License Number";
                input.placeholder = "e.g., REG-LHR-2026-99";
            } else {
                btnPrivateEMIS.className = "text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded-lg font-bold transition";
                btnRegNum.className = "text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-lg font-bold transition";
                label.innerText = "Private School EMIS Code";
                input.placeholder = "e.g., EMIS-PRV-9921";
            }
        };

        window.openMapPinHelper = function() {
            const query = prompt("Enter location name to search on Google Maps:", "Lahore");
            if (query) {
                window.open(`https://www.google.com/maps/search/${encodeURIComponent(query)}`, '_blank');
            }
        };

        async function handleRegistration(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const errorEl = document.getElementById('formError');
            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "Syncing with Google Sheet... ⏳";

            const payload = {
                adminEmail: document.getElementById('adminEmail').value.trim(),
                adminPassword: document.getElementById('adminPassword').value.trim(),
                schoolLogo: document.getElementById('schoolLogoBase64').value || '',
                schoolSector: document.getElementById('schoolSector').value,
                schoolName: document.getElementById('schoolName').value.trim(),
                schoolCodeId: document.getElementById('schoolCodeId').value.trim(),
                schoolAddress: document.getElementById('schoolAddress').value.trim(),
                schoolDistrict: document.getElementById('schoolDistrict').value.trim(),
                mapLocation: document.getElementById('mapLocation').value.trim(),
                schoolLevel: document.getElementById('schoolLevel').value,
                schoolGender: document.getElementById('schoolGender').value,
                idPattern: document.getElementById('idPattern').value.trim(),
                totalStrength: document.getElementById('totalStrength').value.trim(),
                totalStaff: document.getElementById('totalStaff').value.trim(),
                principalName: document.getElementById('principalName').value.trim(),
                principalPhone: document.getElementById('principalPhone').value.trim(),
                verificationCodeType: document.getElementById('privateCodeMode') ? document.getElementById('privateCodeMode').value : 'EMIS',
                institutionCode: document.getElementById('institutionCodeInput').value.trim(),
                receiptNote: document.getElementById('receiptNote').value.trim(),
                packageTier: document.getElementById('selectedPackage').value
            };

            try {
                const result = await SchoolStore.upsert(payload);

                if (result && result.success !== false) {
                    alert("School Suite Workspace registered & synced successfully!");
                    window.location.href = "login.html";
                } else {
                    throw new Error(result.message || "Cloud registration server rejected payload.");
                }
            } catch (err) {
                errorEl.innerText = "Sync Error: " + err.message;
                errorEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = "Sync to Google Sheet & Complete Registration 🚀";
            }
        }
    </script>
</body>
</html>
