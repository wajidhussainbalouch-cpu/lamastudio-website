<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Administrator Login | Lama School Suite</title><script src="https://cdn.tailwindcss.com"></script><script src="js/api-client.js?v=admin-subscription-merged-1"></script></head><body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4"><main class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-7"><a href="main-dashboard.html" class="text-cyan-300 text-sm">← School Board</a><p class="text-cyan-400 text-xs font-black tracking-widest mt-5">LAMA SCHOOL SUITE</p><h1 class="text-2xl font-black mt-2">School Administrator</h1><p class="text-slate-400 text-sm mt-2">Only administrators appointed by the Platform Super Admin can sign in.</p><p id="school" class="text-sm text-emerald-300 mt-3"></p><form id="login" class="space-y-3 mt-6"><input id="username" autocomplete="username" required placeholder="Admin username" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"><div class="relative"><input id="password" type="password" autocomplete="current-password" required placeholder="Admin password" class="w-full pr-14 bg-slate-950 border border-slate-700 rounded-xl p-3"><button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-cyan-300 text-xs font-bold px-2 py-2" aria-label="Show password" aria-pressed="false" data-eye="password">Show</button></div><button class="w-full bg-cyan-500 text-slate-950 font-bold rounded-xl p-3">Log in to Administration</button></form><p id="status" role="alert" class="text-sm text-amber-300 mt-4"></p></main><script>
const $=id=>document.getElementById(id),school=LamaAPI.getSession('school');if(!school?.schoolId){location.replace('login.html')}else{$('school').textContent=(school.name||'School')+' · '+school.schoolId}
document.querySelectorAll('[data-eye]').forEach(btn=>btn.addEventListener('click',()=>{
 const field=$(btn.dataset.eye),show=field.type==='password';
 field.type=show?'text':'password';btn.textContent=show?'Hide':'Show';
 btn.setAttribute('aria-label',show?'Hide password':'Show password');btn.setAttribute('aria-pressed',String(show));
}));
$('login').onsubmit=async e=>{e.preventDefault();$('status').textContent='Verifying…';try{const d=await LamaAPI.schoolAdminLogin(school.schoolId,$('username').value,$('password').value);sessionStorage.setItem('lama_school_admin_auth',JSON.stringify(d.result));location.replace('dashboard.html')}catch(err){$('status').textContent=err.message}};
</script></body></html>
