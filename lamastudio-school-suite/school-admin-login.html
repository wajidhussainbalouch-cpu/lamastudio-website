<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Administrator Login | Lama School Suite</title><script src="https://cdn.tailwindcss.com"></script><script src="js/api-client.js?v=admin-subscription-merged-1"></script></head><body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4"><main class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-7"><a href="main-dashboard.html" class="text-cyan-300 text-sm">← School Board</a><p class="text-cyan-400 text-xs font-black tracking-widest mt-5">LAMA SCHOOL SUITE</p><h1 class="text-2xl font-black mt-2">School Administrator</h1><p class="text-slate-400 text-sm mt-2">Sign in to your school, then verify your authorized administrator account. Both steps stay on this page.</p><p id="school" class="text-sm text-emerald-300 mt-3"></p><form id="schoolLogin" class="space-y-3 mt-6 hidden"><h2 class="text-cyan-300 font-bold text-sm">Step 1 of 2 · School account</h2><label class="block text-xs text-slate-300" for="schoolEmail">School email</label><input id="schoolEmail" type="email" autocomplete="username" required placeholder="principal@school.edu.pk" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"><label class="block text-xs text-slate-300" for="schoolPassword">School password</label><input id="schoolPassword" type="password" autocomplete="current-password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"><button type="submit" class="w-full bg-indigo-500 text-white font-bold rounded-xl p-3">Continue to administrator verification</button></form><form id="login" class="space-y-3 mt-6 hidden"><h2 class="text-cyan-300 font-bold text-sm">Step 2 of 2 · Authorized administrator</h2><input id="username" autocomplete="username" required placeholder="Admin username" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"><div class="relative"><input id="password" type="password" autocomplete="current-password" required placeholder="Admin password" class="w-full pr-14 bg-slate-950 border border-slate-700 rounded-xl p-3"><button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-cyan-300 text-xs font-bold px-2 py-2" aria-label="Show password" aria-pressed="false" data-eye="password">Show</button></div><button class="w-full bg-cyan-500 text-slate-950 font-bold rounded-xl p-3">Log in to Administration</button></form><button id="changeSchool" type="button" class="hidden text-sm text-cyan-300 underline mt-4">Use another school account</button><p id="status" role="alert" class="text-sm text-amber-300 mt-4"></p></main><script>
const $=id=>document.getElementById(id);
let school=LamaAPI.getSession('school');
function showStage(){school=LamaAPI.getSession('school');const ready=!!school?.schoolId;$('schoolLogin').classList.toggle('hidden',ready);$('login').classList.toggle('hidden',!ready);$('changeSchool').classList.toggle('hidden',!ready);$('school').textContent=ready?(school.name||'School')+' · '+school.schoolId:'First verify your school account to continue.';$('status').textContent='';}
showStage();
$('schoolLogin').onsubmit=async e=>{e.preventDefault();const btn=$('schoolLogin').querySelector('button[type=submit]');btn.disabled=true;$('status').textContent='Checking school credentials…';try{await LamaAPI.login($('schoolEmail').value.trim(),$('schoolPassword').value);$('schoolPassword').value='';showStage()}catch(err){$('status').textContent=err.message||'Unable to sign in to school.'}finally{btn.disabled=false}};
$('changeSchool').onclick=()=>{sessionStorage.removeItem('lama_school_admin_auth');LamaAPI.logout('school');showStage()};
document.querySelectorAll('[data-eye]').forEach(btn=>btn.addEventListener('click',()=>{
 const field=$(btn.dataset.eye),show=field.type==='password';
 field.type=show?'text':'password';btn.textContent=show?'Hide':'Show';
 btn.setAttribute('aria-label',show?'Hide password':'Show password');btn.setAttribute('aria-pressed',String(show));
}));
$('login').onsubmit=async e=>{e.preventDefault();$('status').textContent='Verifying…';try{const current=LamaAPI.getSession('school');if(!current?.schoolId){showStage();throw Error('School session expired. Sign in to your school again.')}const d=await LamaAPI.schoolAdminLogin(current.schoolId,$('username').value,$('password').value);sessionStorage.setItem('lama_school_admin_auth',JSON.stringify(d.result));location.replace('dashboard.html')}catch(err){$('status').textContent=err.message}};
</script></body></html>
