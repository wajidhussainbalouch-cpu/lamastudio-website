<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My staff attendance | LAMA School Suite</title><script src="../js/api-client.js?v=20261119staff"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef4f2;color:#19372f;font:15px system-ui,sans-serif}header{padding:18px;background:#103f34;color:#fff}main{max-width:760px;margin:auto;padding:14px}.panel{background:#fff;border-radius:18px;margin:12px 0;padding:18px;box-shadow:0 3px 15px #1232}header a{color:#fff}h1,h2{margin:6px 0 12px}label{display:block;font-weight:650;margin:10px 0}input{width:100%;font:inherit;border:1px solid #b5c6bf;border-radius:10px;padding:12px;margin-top:5px}button{border:0;border-radius:9px;background:#17614d;color:#fff;font:600 14px system-ui;padding:12px 15px;cursor:pointer}button:disabled{opacity:.6}.hidden{display:none!important}.muted{font-size:13px;color:#61776e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#edf5f1;border-radius:13px;padding:12px}.stat strong{display:block;font-size:23px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #d6e4dd;padding:8px;text-align:left;vertical-align:top}.error{color:#991b1b}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.present{color:#047857}.absent{color:#be123c}.leave{color:#92400e}</style></head><body><header><a id="back" href="../portal-login.html">← School portals</a><h1>Staff Attendance Portal</h1><p>My attendance and leave records</p></header><main><section class="panel" id="loginPanel"><h2>Non-teaching staff login</h2><p class="muted">Use the login ID and password issued by your school administrator.</p><form id="login"><label>School ID<input id="schoolId" required autocomplete="organization"></label><label>Staff login ID<input id="loginId" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button id="signIn" type="submit">Sign in</button></form></section><p id="status" role="status"></p><section class="panel hidden" id="portal"><div class="actions"><div style="flex:1"><h2 id="staffName"></h2><p id="designation" class="muted"></p></div><button id="logout" type="button">Logout</button></div><label>Attendance month<input type="month" id="month"></label><button id="refresh" type="button">Refresh records</button><p class="muted">Read-only register. Contact your school administrator for corrections.</p><div class="grid" id="stats"></div><div class="scroll"><table><thead><tr><th>Date</th><th>Attendance</th><th>Reason / note</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const role=new URLSearchParams(location.search).get('role')==='teacher'?'teacher':'staff';let busy=false;function msg(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function reveal(){if(!LamaAPI.requireLogin(role,role==='teacher'?'../teacher-login.html':location.pathname))return;$('loginPanel').classList.add('hidden');$('portal').classList.remove('hidden');const sess=LamaAPI.getSession(role);$('staffName').textContent=sess?.name||'Employee';$('designation').textContent=[sess?.designation,sess?.schoolName].filter(Boolean).join(' · ');load()}
async function load(){if(busy)return;busy=true;$('refresh').disabled=true;$('stats').replaceChildren();$('rows').replaceChildren();try{const month=$('month').value;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))throw Error('Select a valid month.');const data=await LamaAPI.staffOwnAttendance(month);if(!Array.isArray(data?.records)||!Array.isArray(data.closedDates))throw Error('Invalid attendance response.');const closed=new Set(data.closedDates),byDay=new Map(),duplicates=new Set();for(const r of data.records){if(byDay.has(r.date))duplicates.add(r.date);else byDay.set(r.date,r)}const max=new Date(Date.UTC(Number(month.slice(0,4)),Number(month.slice(5)),0)).getUTCDate();let present=0,absent=0,casual=0,other=0,working=0,missing=0,html='';for(let i=1;i<=max;i++){const day=month+'-'+String(i).padStart(2,'0'),r=byDay.get(day),holiday=closed.has(day),past=day<=today();if(!holiday&&past)working++;let label=holiday?'Holiday':past?'Not marked':'Future date',note='',kind='';if(duplicates.has(day)){label='Duplicate — contact administrator';kind='absent'}else if(r){label=r.status==='Leave'?(r.leaveType?r.leaveType+' leave':'Unclassified leave'):r.status;note=r.remarks||'';kind=r.status==='Present'?'present':r.status==='Absent'?'absent':'leave';if(holiday)label+=' (holiday record)';if(!holiday&&past){if(r.status==='Present')present++;else if(r.status==='Absent')absent++;else if(r.status==='Leave'&&r.leaveType==='Casual')casual++;else if(r.status==='Leave')other++}}else if(!holiday&&past)missing++;html+='<tr><td>'+esc(day)+'</td><td class="'+kind+'">'+esc(label)+'</td><td>'+esc(note||'—')+'</td></tr>'}const limit=data.casualLimit,stats=[['Present',present],['Absent',absent],['Casual leave',casual],['Other leave',other],['Elapsed working days',working],['Unmarked',missing],['CL allowance',limit===null?'Not set':limit],['CL remaining',limit===null?'—':Math.max(0,limit-casual)]];$('stats').innerHTML=stats.map(([k,v])=>'<div class="stat"><span class="muted">'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');$('rows').innerHTML=html;msg(duplicates.size?'Duplicate records detected; ask your administrator to review.':'Attendance records loaded.',!!duplicates.size)}catch(e){msg('Could not load attendance: '+e.message,true)}finally{busy=false;$('refresh').disabled=false}}
$('month').value=today().slice(0,7);$('month').onchange=load;$('refresh').onclick=load;$('logout').onclick=()=>{LamaAPI.logout(role);location.href=role==='teacher'?'../teacher-login.html':'../portal-login.html'};$('login').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('signIn').disabled=true;try{await LamaAPI.staffLogin($('schoolId').value.trim(),$('loginId').value.trim(),$('password').value);$('password').value='';busy=false;reveal()}catch(err){msg('Login failed: '+err.message+(/Unknown action/i.test(err.message)?' — school backend upgrade required.':''),true)}finally{busy=false;$('signIn').disabled=false}};
if(role==='teacher'){$('loginPanel').classList.add('hidden');$('back').href='../portals/teacher/index.html';reveal()}else if(LamaAPI.getSession('staff'))reveal();
</script></body></html>
