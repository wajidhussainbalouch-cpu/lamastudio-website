<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student ID Format · Lama School Suite</title><style>body{font:16px system-ui;background:#f3f7f6;color:#14352c;margin:0;padding:22px}main{max-width:760px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 22px #163b2917}input,button{font:inherit;padding:12px;border-radius:8px}input{border:1px solid #aaa;width:95%;margin:12px 0}button{background:#146343;color:white;border:0;margin:6px 6px 6px 0}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.warn{color:#ae2828}#output{white-space:pre-wrap}</style><script src="../js/api-client.js?v=20261030-student-ids-v1"></script></head><body><main><h1>Student ID Format</h1><p>School administrators can generate IDs using each student's original enrollment number. Internal record IDs and existing passwords are never changed.</p><label for="prefix">School prefix (example: AIMS-STU-)</label><input id="prefix" value="AIMS-STU-" maxlength="26"><div><button id="preview">Preview all IDs</button><button id="apply" disabled>Apply to all students</button></div><p id="output" role="status">Preview changes before applying.</p><div style="overflow:auto"><table><thead><tr><th>Enrollment</th><th>New Student ID</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const p=document.getElementById('prefix'),out=document.getElementById('output'),apply=document.getElementById('apply'),body=document.getElementById('rows');let verified='';
document.getElementById('preview').onclick=async()=>{apply.disabled=true;out.textContent='Checking school student records…';body.textContent='';try{if(!LamaAPI.requireLogin('school','../login.html'))return;const r=await LamaAPI.previewStudentIds(p.value);if(!r.success)throw Error('Preview unavailable');verified=r.prefix;out.textContent=r.total+' students · '+r.changed+' IDs to update · '+r.pendingEnrollment+' missing enrollment numbers';r.preview.forEach(x=>{const tr=document.createElement('tr');for(const v of [x.enrollment||'✱ Missing enrollment',x.studentCode]){const td=document.createElement('td');td.textContent=v;if(!x.enrollment)td.className='warn';tr.appendChild(td)}body.appendChild(tr)});apply.disabled=false}catch(e){out.textContent='Preview failed: '+e.message}};
p.oninput=()=>{apply.disabled=true;verified=''};
apply.onclick=async()=>{if(!verified||verified!==p.value.trim().toUpperCase())return;if(!confirm('Update display Student IDs for ALL students in this school? Existing enrollment numbers, passwords, and internal IDs will remain unchanged.'))return;apply.disabled=true;out.textContent='Applying IDs…';try{const r=await LamaAPI.applyStudentIds(verified);out.textContent='Updated: '+r.changed+' IDs. '+r.pendingEnrollment+' pending enrollment numbers.'}catch(e){out.textContent='Update failed: '+e.message+' Check school records before retrying.'}};
</script></body></html>
