<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student / Parent Login | Lama School Suite</title><script src="https://cdn.tailwindcss.com"></script><script src="../js/api-client.js"></script></head>
<body class="bg-[#081923] text-white min-h-screen grid place-items-center p-4"><main class="w-full max-w-md bg-[#102a35] rounded-3xl border border-teal-700/50 p-6 sm:p-8 shadow-2xl">
<div class="text-center"><div class="text-4xl">🎓</div><h1 class="text-2xl font-black mt-3">Student / Parent Login</h1><p class="text-sm text-slate-300 mt-2">Your private student portal · Lama School Suite</p></div>
<div id="error" role="alert" class="hidden mt-5 rounded-xl bg-rose-950 border border-rose-700 p-3 text-sm text-rose-100"></div>
<form id="form" class="space-y-4 mt-6" autocomplete="off">
<label class="block text-sm font-bold">School ID <span class="text-lime-300">(saved on this device)</span><input id="schoolId" name="schoolId" required autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full mt-2 rounded-xl bg-slate-950 border border-slate-600 p-3" placeholder="Enter your School ID"></label>
<label class="block text-sm font-bold">Student enrollment number<input id="identifier" name="identifier" required autocomplete="username" class="w-full mt-2 rounded-xl bg-slate-950 border border-slate-600 p-3" placeholder="Enrollment number"></label>
<label class="block text-sm font-bold">Password<div class="relative mt-2"><input id="password" name="password" type="password" required autocomplete="current-password" class="w-full rounded-xl bg-slate-950 border border-slate-600 p-3 pr-20"><button type="button" id="show" class="absolute right-2 top-2 text-xs bg-slate-700 rounded-lg p-2">Show</button></div></label>
<button id="submit" type="submit" class="w-full rounded-xl bg-[#bcd82c] text-[#12383b] p-3 font-black">Sign in</button></form>
<div class="border-t border-slate-700 mt-6 pt-5 flex flex-wrap justify-center gap-4 text-xs text-teal-200 underline"><a href="../teacher-login.html">Teacher login</a><a href="../login.html">School Admin</a><a href="../main-dashboard.html">← Main dashboard</a></div>
</main><script>
'use strict';
const $ = id => document.getElementById(id);
const schoolKey = 'lama_student_remembered_school_id';
const schoolInput = $('schoolId');
try { schoolInput.value = localStorage.getItem(schoolKey) || ''; } catch (_e) {}
function rememberSchool() { try { localStorage.setItem(schoolKey, schoolInput.value.trim()); } catch (_e) {} }
schoolInput.addEventListener('input', rememberSchool);
schoolInput.addEventListener('change', rememberSchool);
$('show').onclick = () => { const x=$('password'); x.type=x.type==='password'?'text':'password'; $('show').textContent=x.type==='password'?'Show':'Hide'; };
$('form').onsubmit = async e => {
 e.preventDefault(); const btn=$('submit'); btn.disabled=true; btn.textContent='Signing in…'; $('error').classList.add('hidden');
 try {
  if (typeof LamaAPI === 'undefined') throw Error('API client did not load.');
  const schoolId=schoolInput.value.trim(), id=$('identifier').value.trim(), pw=$('password').value;
  if (!schoolId || !id || !pw) throw Error('Please complete all fields.');
  rememberSchool();
  await LamaAPI.studentLogin(schoolId,id,pw);
  location.replace('../portals/student/student.html');
 } catch (err) { $('error').textContent=err.message||'Login failed'; $('error').classList.remove('hidden'); btn.disabled=false; btn.textContent='Sign in'; }
};
if (typeof LamaAPI !== 'undefined' && LamaAPI.isLoggedIn('student')) location.replace('../portals/student/student.html');
</script></body></html>
