<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4637"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="./manifest.webmanifest"><title>LAMA Super Admin</title><style>body{margin:0;background:#071e1a;color:#f4f8f5;font:16px system-ui}main{max-width:800px;margin:auto;padding:22px}h1{color:#f3cc75}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #49796d;font:inherit}button{background:#d7b666;color:#112c25;font-weight:700;cursor:pointer}input{background:#15382f;color:white}.card{background:#12382f;border:1px solid #356c5a;border-radius:18px;padding:18px;margin:14px 0}.muted{color:#bdd2c9}header{display:flex;justify-content:space-between;align-items:center}header button{width:auto}#dashboard{display:none}#message{white-space:pre-wrap}small{color:#c6d4cd}</style></head><body><main><header><h1>LAMA Super Admin</h1></header><section id="login" class="card"><h2>Private sign in</h2><p class="muted">Use your existing Super Admin password.</p><input id="password" type="password" autocomplete="current-password" placeholder="Super Admin password"><button id="signIn">Sign in</button></section><section id="dashboard"><button id="signOut">Sign out</button><h2>Registered schools</h2><button id="refresh">Refresh schools</button><div id="schools"></div></section><p id="message" role="status"></p><small>Private access requires server authentication. Do not share your password or install this on a shared device.</small></main><script src="./app.js"></script></body></html>
