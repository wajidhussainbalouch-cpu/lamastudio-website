<script>
    // Handle Master Super Admin Login Locally
    function handleSuperLogin(event) {
        event.preventDefault();
        const username = document.getElementById('masterUser').value.trim();
        const password = document.getElementById('masterPass').value.trim();
        const errorEl = document.getElementById('loginError');

        errorEl.classList.add('hidden');

        // Use SchoolStore for super authentication
        const auth = SchoolStore.authenticateSuper(username, password);
        if (auth.success) {
            localStorage.setItem('lamastudio_super_logged', 'true');
            showDashboard();
        } else {
            errorEl.innerText = auth.message || "Invalid master credentials.";
            errorEl.classList.remove('hidden');
        }
    }

    function showDashboard() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('loggedOutNav').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('loggedInNav').classList.remove('hidden');
        loadSchoolsData();
    }

    function handleLogout() {
        SchoolStore.clearSuperSession();
        localStorage.removeItem('lamastudio_super_logged');
        location.reload();
    }

    // Load Schools Data directly from local SchoolStore
    function loadSchoolsData() {
        const tbody = document.getElementById('schoolsTableBody');
        tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-500">Loading local cloud records...</td></tr>`;

        const schools = SchoolStore.getAll();
        
        document.getElementById('statTotalSchools').innerText = schools.length;
        
        let totalStudents = 0;
        schools.forEach(s => totalStudents += parseInt(s.enrollment || 0, 10));
        document.getElementById('statTotalStudents').innerText = totalStudents;

        if (schools.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-500">No schools registered yet.</td></tr>`;
            return;
        }

        tbody.innerHTML = schools.map(s => `
            <tr class="hover:bg-slate-900/50 transition">
                <td class="py-3 px-3">
                    <span class="font-bold text-white block">${s.name}</span>
                    <span class="text-[10px] text-purple-400 font-mono">${s.id}</span>
                </td>
                <td class="py-3 px-3">
                    <span class="font-bold text-slate-300 block">${s.principal || 'N/A'}</span>
                    <span class="text-[10px] text-slate-500">${s.district || 'General'}</span>
                </td>
                <td class="py-3 px-3 font-mono text-cyan-300">${s.adminUsername}</td>
                <td class="py-3 px-3 font-mono text-amber-400">${s.adminPassword}</td>
                <td class="py-3 px-3 font-bold text-emerald-400">${s.enrollment || 0} students</td>
                <td class="py-3 px-3 text-right">
                    <button onclick="openPasswordModal('${s.id}', '${s.name}')" class="bg-purple-600/20 text-purple-300 border border-purple-500/30 hover:bg-purple-600 hover:text-white px-3 py-1.5 rounded-lg text-[10px] font-bold transition cursor-pointer">
                        Reset Pass
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function openPasswordModal(schoolId, schoolName) {
        document.getElementById('modalSchoolId').value = schoolId;
        document.getElementById('modalSchoolName').innerText = schoolName;
        document.getElementById('newAdminPasswordInput').value = '';
        document.getElementById('passwordModal').classList.remove('hidden');
    }

    function closePasswordModal() {
        document.getElementById('passwordModal').classList.add('hidden');
    }

    // Reset password locally in SchoolStore
    function submitPasswordReset() {
        const schoolId = document.getElementById('modalSchoolId').value;
        const newPassword = document.getElementById('newAdminPasswordInput').value.trim();

        if (!newPassword) {
            alert("Please enter a new password.");
            return;
        }

        const schools = SchoolStore.getAll();
        const schoolIndex = schools.findIndex(s => s.id === schoolId);

        if (schoolIndex > -1) {
            schools[schoolIndex].adminPassword = newPassword;
            localStorage.setItem(SchoolStore.STORAGE_KEY, JSON.stringify(schools));
            alert("Password updated successfully!");
            closePasswordModal();
            loadSchoolsData();
        } else {
            alert("Error: School not found.");
        }
    }

    // Check active session on page load
    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('lamastudio_super_logged') === 'true' || SchoolStore.isSuperLoggedIn()) {
            showDashboard();
        }
    });
</script>
