<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Teacher Attendance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/config.css">
<script src="js/api-client.js"></script>
<style>
    .att-btn { font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 8px; background: #1e293b; color: #94a3b8; }
    .att-active-present { background: #059669; color: white; }
    .att-active-absent { background: #dc2626; color: white; }
    .att-active-leave { background: #d97706; color: white; }
</style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen">

    <header class="max-w-4xl mx-auto px-4 pt-6 flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-3">
            <div id="schoolLogoBox" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-xs font-black text-white">SCH</div>
            <div>
                <h1 id="headerSchoolName" class="text-sm font-black uppercase tracking-wider text-white">School Name</h1>
                <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold">Teacher Attendance</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <input type="date" id="attDate" class="bg-slate-950 border border-slate-700 text-white text-xs rounded-xl px-3 py-2">
            <a href="dashboard.html" class="bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition">&larr; Dashboard</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-5 space-y-5">

        <!-- Not-yet-marked-attendance alert -->
        <section id="notMarkedSection" class="cyber-card-amber rounded-2xl p-5 hidden">
            <h2 class="text-xs font-black uppercase text-amber-400 mb-3">⏰ Haven't Marked Student Attendance Today</h2>
            <div id="notMarkedList" class="space-y-2"></div>
        </section>

        <!-- Teacher attendance marking -->
        <section class="cyber-card rounded-2xl p-5 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-black uppercase text-cyan-400">Mark Today's Teacher Attendance</h2>
                <button onclick="saveTeacherAttendance()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition">💾 Save</button>
            </div>
            <div id="teacherAttList" class="space-y-2"></div>
            <p id="teacherAttEmpty" class="text-center text-sm text-slate-400 py-6 hidden">No teachers added yet — add some from Manage Teachers first.</p>
        </section>
    </main>

    <script>
        const TEACHERS = 'teachers', TEACHER_ATTENDANCE = 'teacherAttendance', ATTENDANCE = 'attendance';
        let allTeachers = [];

        async function renderHeader() {
            const school = await LamaAPI.getActiveSchool() || {};
            document.getElementById('pageTitle').innerText = `${school.name || 'School'} | Teacher Attendance`;
            document.getElementById('headerSchoolName').innerText = school.name || 'School';
            const logoBox = document.getElementById('schoolLogoBox');
            if (school.logo) {
                logoBox.innerHTML = `<img src="${school.logo}" class="w-full h-full object-cover rounded-xl">`;
            } else {
                logoBox.innerText = school.shortCode || LamaAPI.deriveShortCode(school.name || 'SCH');
            }
        }

        async function renderNotMarked() {
            let stats;
            try {
                stats = await LamaAPI.getDashboardStats();
            } catch (e) {
                return;
            }
            const notMarked = stats.teachersNotMarked || [];
            document.getElementById('notMarkedSection').classList.toggle('hidden', notMarked.length === 0);
            document.getElementById('notMarkedList').innerHTML = notMarked.map(t => `
                <div class="flex justify-between items-center bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2">
                    <span class="text-xs font-semibold">${t.name} <span class="text-slate-500">— Class ${t.assignedClass}</span></span>
                    <button onclick="pingTeacher('${t.id}', '${t.name.replace(/'/g, "\\'")}')" class="bg-amber-600 hover:bg-amber-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg">🔔 Ping</button>
                </div>
            `).join('');
        }

        async function pingTeacher(teacherId, name) {
            try {
                await LamaAPI.pingTeacher(teacherId, "Please mark today's student attendance.");
                alert(`Reminder sent to ${name}.`);
            } catch (e) {
                alert('Could not send the reminder: ' + e.message);
            }
        }

        async function renderTeacherAttendance() {
            const date = document.getElementById('attDate').value;
            try {
                allTeachers = await LamaAPI.list(TEACHERS);
            } catch (e) {
                alert('Could not load teachers: ' + e.message);
                return;
            }
            document.getElementById('teacherAttEmpty').classList.toggle('hidden', allTeachers.length > 0);

            let existing = [];
            try {
                existing = (await LamaAPI.list(TEACHER_ATTENDANCE)).filter(a => a.date === date);
            } catch (e) { /* fine, treat as none marked yet */ }

            document.getElementById('teacherAttList').innerHTML = allTeachers.map(t => {
                const existingRecord = existing.find(a => a.teacherId === t.id);
                const currentStatus = existingRecord ? existingRecord.status : 'Present';
                return `
                <div class="flex items-center justify-between bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2" data-teacher-id="${t.id}" data-existing-id="${existingRecord ? existingRecord.id : ''}">
                    <span class="text-xs font-semibold">${t.name} <span class="text-slate-500">(${t.subject || '-'} • Class ${t.assignedClass || '-'})</span></span>
                    <div class="flex gap-1">
                        <button class="att-btn ${currentStatus === 'Present' ? 'att-active-present' : ''}" data-status="Present" onclick="setAttStatus(this, 'Present')">Present</button>
                        <button class="att-btn ${currentStatus === 'Absent' ? 'att-active-absent' : ''}" data-status="Absent" onclick="setAttStatus(this, 'Absent')">Absent</button>
                        <button class="att-btn ${currentStatus === 'Leave' ? 'att-active-leave' : ''}" data-status="Leave" onclick="setAttStatus(this, 'Leave')">Leave</button>
                    </div>
                </div>`;
            }).join('');
        }

        function setAttStatus(btn, status) {
            const row = btn.closest('[data-teacher-id]');
            row.querySelectorAll('.att-btn').forEach(b => b.className = 'att-btn');
            btn.className = `att-btn att-active-${status.toLowerCase()}`;
        }

        async function saveTeacherAttendance() {
            const date = document.getElementById('attDate').value;
            const rows = document.querySelectorAll('#teacherAttList [data-teacher-id]');
            for (const row of rows) {
                const teacherId = row.dataset.teacherId;
                const existingId = row.dataset.existingId;
                const activeBtn = row.querySelector('.att-btn[class*="att-active"]');
                const status = activeBtn ? activeBtn.dataset.status : 'Present';
                const teacher = allTeachers.find(t => t.id === teacherId);
                try {
                    if (existingId) {
                        await LamaAPI.update(TEACHER_ATTENDANCE, existingId, { status });
                    } else {
                        await LamaAPI.add(TEACHER_ATTENDANCE, { teacherId, teacherName: teacher.name, date, status });
                    }
                } catch (e) {
                    alert(`Could not save attendance for ${teacher ? teacher.name : teacherId}: ` + e.message);
                }
            }
            alert('Teacher attendance saved.');
            renderTeacherAttendance();
        }

        async function init() {
            await renderHeader();
            document.getElementById('attDate').value = new Date().toISOString().split('T')[0];
            await renderNotMarked();
            await renderTeacherAttendance();
            document.getElementById('attDate').addEventListener('change', renderTeacherAttendance);
        }

        if (LamaAPI.requireLogin('school', 'login.html')) {
            init();
        }
    </script>
</body>
</html>
