<script src="js/lama-api.js"></script>
<script>
// Use the correct collection string identifier that LamaAPI recognizes for tests
const COLLECTION = 'tests'; 
const FIELDS = {"class":"class","subject":"subject","type":"type","date":"date","totalMarks":"totalMarks","topics":"topics"}; 
const $ = id => document.getElementById(id); 
let rows = [];

function id(x){ return String(x?.id ?? x?._id ?? ''); } 
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pub(x){ return x?.isPublished === true || x?.published === true || String(x?.status || '').toLowerCase() === 'published'; }

function resetForm(){ $('form').reset();$('editId').value = ''; }

function edit(x){ 
    $('editId').value = id(x); 
    Object.keys(FIELDS).forEach(k => { if($(FIELDS[k])) $(FIELDS[k]).value = x[k] ?? ''; });$('isPublished').checked = pub(x); 
    scrollTo({ top: 0, behavior: 'smooth' }); 
}

async function load(){
    try {
        rows = await LamaAPI.list(COLLECTION) || [];
        rows = Array.isArray(rows) ? rows : [];
        $('list').innerHTML = rows.length ? rows.map(x => `
            <article class="item">
                <div class="head">
                    <div>
                        <b>${esc(x.subject || x.title || 'Online Test')}</b>
                        <div class="muted">Class: ${esc(x.class || 'N/A')} • ${esc(x.date || '')}</div>
                    </div>
                    <span class="badge ${pub(x) ? 'pub' : 'draft'}">${pub(x) ? 'PUBLISHED' : 'DRAFT'}</span>
                </div>
                <div class="muted" style="margin-top:8px">${esc(x.topics || x.description || '')}</div>
                <div class="actions">
                    <button class="btn" onclick='edit(${JSON.stringify(x).replace(/'/g, "&#39;")})'>Edit</button>
                    <button class="btn ${pub(x) ? 'red' : 'green'}" onclick="toggle('${id(x)}')">${pub(x) ? 'Unpublish' : 'Publish'}</button>
                    <button class="btn red" onclick="del('${id(x)}')">Delete</button>
                </div>
            </article>
        `).join('') : '<div class="muted" style="text-align:center;padding:35px">No records yet.</div>';
    } catch(e) {
        $('list').innerHTML = '<div class="muted">Load failed: ' + esc(e.message) + '</div>';
    }
}

$('form').addEventListener('submit', async e => {
    e.preventDefault();
    const r = {};
    Object.keys(FIELDS).forEach(k => r[k] = $(FIELDS[k]).value.trim());
    const p = $('isPublished').checked;
    r.isPublished = p;
    r.published = p;
    r.status = p ? 'published' : 'draft';
    r.updatedAt = new Date().toISOString();
    
    try {
        const eid = $('editId').value;
        if(eid) {
            await LamaAPI.update(COLLECTION, eid, r);
        } else {
            r.createdAt = new Date().toISOString();
            await LamaAPI.add(COLLECTION, r);
        }
        resetForm();
        await load();
        alert(p ? 'Published — it will appear on the Main Dashboard.' : 'Saved as draft — it will remain hidden.');
    } catch(e) {
        alert('Save failed: ' + e.message);
    }
});

async function toggle(i){
    const x = rows.find(r => id(r) === String(i));
    if(!x) return;
    const p = !pub(x);
    await LamaAPI.update(COLLECTION, i, { ...x, isPublished: p, published: p, status: p ? 'published' : 'draft', updatedAt: new Date().toISOString() });
    load();
}

async function del(i){
    if(!confirm('Delete this record?')) return;
    await LamaAPI.remove(COLLECTION, i);
    load();
}

load();
</script>
