<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tests Manager | Lama School Suite</title><script src="https://cdn.tailwindcss.com"></script><script src="js/api-client.js"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#e2e8f0}.glass{background:#101e33;border:1px solid #293a55;border-radius:20px}.field{width:100%;background:#0b1527;border:1px solid #34445f;border-radius:11px;padding:10px 12px;color:#f8fafc}.field:focus{outline:2px solid #22d3ee}.btn{border-radius:10px;padding:8px 12px;background:#334155;color:white;font-weight:700;font-size:12px}.btn.green{background:#047857}.btn.red{background:#9f1239}.item{padding:16px;border:1px solid #334155;border-radius:15px;background:#0b1527}.muted{font-size:12px;color:#94a3b8}.badge{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px}.badge.pub{color:#6ee7b7;background:#064e3b}.badge.draft{color:#fcd34d;background:#78350f}.head,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions{justify-content:flex-start;margin-top:12px}</style></head><body><header class="max-w-6xl mx-auto px-4 py-6 flex flex-wrap justify-between gap-4 items-center"><div><p class="text-cyan-400 text-xs font-bold">LAMA SCHOOL SUITE · ADMIN</p><h1 class="text-2xl font-black">Tests & Assessments</h1><p class="muted">Publish tests to the School Board and Student Portal</p></div><a class="btn" href="main-dashboard.html">← Main Dashboard</a></header><main class="max-w-6xl mx-auto px-4 pb-12 grid lg:grid-cols-5 gap-6"><section class="glass p-5 lg:col-span-2"><h2 class="font-bold text-lg mb-4">Create / Edit Test</h2><form id="form" class="space-y-3"><input type="hidden" id="editId"><label class="block text-xs">Class <input id="class" class="field mt-1" placeholder="Grade-6" required></label><label class="block text-xs">Subject <input id="subject" class="field mt-1" placeholder="Science" required></label><label class="block text-xs">Test Type <select id="type" class="field mt-1"><option>Monthly Test</option><option>Weekly Test</option><option>Quiz</option><option>Unit Test</option><option>Online Test</option><option>Assessment</option></select></label><label class="block text-xs">Date <input id="date" type="date" class="field mt-1" required></label><label class="block text-xs">Total Marks <input id="totalMarks" type="number" min="0" class="field mt-1" placeholder="20"></label><label class="block text-xs">Topics <textarea id="topics" class="field mt-1" rows="3" placeholder="Chapters and learning outcomes"></textarea></label><label class="block text-xs">Online Test Link (optional) <input id="link" type="url" class="field mt-1" placeholder="https://..."></label><label class="flex items-center gap-2 text-sm"><input id="isPublished" type="checkbox" class="w-4 h-4"> Publish to Main Dashboard</label><div class="flex gap-2"><button class="btn green flex-1" type="submit" id="saveBtn">Save Test</button><button class="btn" type="button" onclick="resetForm()">Clear</button></div></form><p id="saveStatus" role="status" class="muted mt-3"></p></section><section class="glass p-5 lg:col-span-3"><div class="flex flex-wrap justify-between items-center gap-3 mb-4"><h2 class="font-bold text-lg">Saved Tests</h2><button class="btn" onclick="loadRecords()">↻ Refresh</button></div><div id="list" class="space-y-3"><p class="muted">Loading...</p></div></section></main><script>
const COLLECTION='tests', FIELDS={class:'class',subject:'subject',type:'type',date:'date',totalMarks:'totalMarks',topics:'topics',link:'link'};
const $=id=>document.getElementById(id); let rows=[]; const getId=x=>String(x?.id??x?._id??'');
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const isPublished=x=>x?.isPublished===true||x?.published===true||String(x?.status||'').toLowerCase()==='published';
function resetForm(){$('form').reset();$('editId').value='';$('saveStatus').textContent='';}
function editRecord(id){const x=rows.find(r=>getId(r)===String(id));if(!x)return;$('editId').value=getId(x);Object.keys(FIELDS).forEach(k=>{$(FIELDS[k]).value=x[k]??''});$('isPublished').checked=isPublished(x);window.scrollTo({top:0,behavior:'smooth'});}
function assertAPI(){if(typeof LamaAPI==='undefined'||!LamaAPI.list||!LamaAPI.add||!LamaAPI.update||!LamaAPI.remove)throw Error('LamaAPI unavailable. Check js/api-client.js and admin login.');}
async function loadRecords(){try{assertAPI();const result=await LamaAPI.list(COLLECTION);rows=Array.isArray(result)?result:result?.records||[];const el=$('list');el.innerHTML=rows.length?rows.map(x=>`<article class="item"><div class="head"><div><b>${escapeHtml(x.subject||'Test')}</b><div class="muted">${escapeHtml(x.class||'N/A')} · ${escapeHtml(x.type||'Test')} · ${escapeHtml(x.date||'TBD')}</div></div><span class="badge ${isPublished(x)?'pub':'draft'}">${isPublished(x)?'PUBLISHED':'DRAFT'}</span></div><p class="muted mt-2">${escapeHtml(x.topics||'No topics')} · ${escapeHtml(x.totalMarks||'—')} marks</p><div class="actions"><button class="btn" data-action="edit" data-id="${escapeHtml(getId(x))}">Edit</button><button class="btn ${isPublished(x)?'red':'green'}" data-action="publish" data-id="${escapeHtml(getId(x))}">${isPublished(x)?'Unpublish':'Publish'}</button><button class="btn red" data-action="delete" data-id="${escapeHtml(getId(x))}">Delete</button></div></article>`).join(''):'<p class="muted">No test records yet.</p>';}catch(e){$('list').textContent='Unable to load tests: '+e.message;}}
$('list').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id, x=rows.find(r=>getId(r)===id);if(!x)return;if(b.dataset.action==='edit'){editRecord(id);return;}try{assertAPI();if(b.dataset.action==='publish'){const p=!isPublished(x);await LamaAPI.update(COLLECTION,id,{isPublished:p,published:p,status:p?'published':'draft',updatedAt:new Date().toISOString()});}else if(b.dataset.action==='delete'){if(!confirm('Delete this test permanently?'))return;await LamaAPI.remove(COLLECTION,id);}await loadRecords();}catch(err){alert('Action failed: '+err.message);}});
$('form').addEventListener('submit',async e=>{e.preventDefault();const b=$('saveBtn');b.disabled=true;try{assertAPI();const r={};Object.keys(FIELDS).forEach(k=>r[k]=$(FIELDS[k]).value.trim());const p=$('isPublished').checked;Object.assign(r,{isPublished:p,published:p,status:p?'published':'draft',updatedAt:new Date().toISOString()});const id=$('editId').value;if(id)await LamaAPI.update(COLLECTION,id,r);else await LamaAPI.add(COLLECTION,{...r,createdAt:new Date().toISOString()});resetForm();await loadRecords();$('saveStatus').textContent=p?'Published successfully. Refresh the School Board.':'Draft saved successfully.';}catch(err){$('saveStatus').textContent='Save failed: '+err.message;}finally{b.disabled=false;}});
document.addEventListener('DOMContentLoaded',loadRecords);
</script></body></html>
