<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LamaStudio Portal - Sign In</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 id="form-title" class="text-2xl font-bold text-center text-slate-800 mb-6">Welcome to LamaStudio</h2>
        
        <!-- Status Messages -->
        <div id="message" class="mb-4 text-sm text-center font-medium"></div>

        <!-- Google Sign-In Button -->
        <button id="google-btn" type="button" class="w-full bg-white border border-slate-300 text-slate-700 p-2.5 rounded-lg font-semibold flex items-center justify-center gap-3 mb-4 hover:bg-slate-50 transition shadow-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.17 21.36 7.22 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.39-1.5-.39-2.24s.14-1.52.39-2.24V6.6H1.19C.43 8.13 0 9.87 0 11.7s.43 3.57 1.19 5.1l4.08-2.56z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.64 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Continue with Google
        </button>

        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase tracking-wider">or email</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Main Form -->
        <form id="auth-form" class="space-y-4 mt-2">
            <div>
                <label class="block text-sm font-medium text-slate-700">Email Address</label>
                <input type="email" id="email" required class="w-full mt-1 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div id="password-group">
                <label class="block text-sm font-medium text-slate-700">Password</label>
                <input type="password" id="password" class="w-full mt-1 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white p-2.5 rounded-lg font-semibold hover:bg-blue-700 transition shadow-sm">Sign In</button>
        </form>

        <!-- Toggle Links -->
        <div class="mt-6 text-sm text-center space-y-2">
            <p><a href="#" id="toggle-mode" class="text-blue-600 hover:underline">Don't have an account? Sign Up</a></p>
            <p><a href="#" id="forgot-password" class="text-slate-500 hover:underline">Forgot your password?</a></p>
        </div>
    </div>

    <!-- Firebase Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendPasswordResetEmail,
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC0vca_Ed_k8hCmxgPqd7URoHerNiGXdO0",
            authDomain: "lamastudio-web.firebaseapp.com",
            projectId: "lamastudio-web",
            storageBucket: "lamastudio-web.firebasestorage.app",
            messagingSenderId: "60066283145",
            appId: "1:60066283145:web:6f0ad2d1e596711d5cd058",
            measurementId: "G-PRFCQHGWCH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const passwordGroup = document.getElementById('password-group');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleMode = document.getElementById('toggle-mode');
        const forgotPasswordLink = document.getElementById('forgot-password');
        const messageBox = document.getElementById('message');
        const googleBtn = document.getElementById('google-btn');

        let mode = 'signin'; 

        // Google Sign-In Handler with Redirect
        googleBtn.addEventListener('click', () => {
            messageBox.textContent = '';
            signInWithPopup(auth, googleProvider)
                .then((result) => {
                    messageBox.className = "mb-4 text-sm text-center font-medium text-green-600";
                    messageBox.textContent = "Success! Redirecting to tools...";
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Change to your tool/dashboard page if separate
                    }, 1000);
                })
                .catch((error) => {
                    messageBox.className = "mb-4 text-sm text-center font-medium text-red-600";
                    messageBox.textContent = error.message;
                });
        });

        toggleMode.addEventListener('click', (e) => {
            e.preventDefault();
            messageBox.textContent = '';
            if (mode === 'signin') {
                mode = 'signup';
                formTitle.textContent = 'Create LamaStudio Account';
                submitBtn.textContent = 'Sign Up';
                toggleMode.textContent = 'Already have an account? Sign In';
                passwordGroup.style.display = 'block';
            } else {
                mode = 'signin';
                formTitle.textContent = 'Welcome to LamaStudio';
                submitBtn.textContent = 'Sign In';
                toggleMode.textContent = "Don't have an account? Sign Up";
                passwordGroup.style.display = 'block';
            }
        });

        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            mode = 'forgot';
            formTitle.textContent = 'Reset Password';
            submitBtn.textContent = 'Send Reset Email';
            passwordGroup.style.display = 'none';
            messageBox.textContent = '';
            toggleMode.textContent = 'Back to Sign In';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;
            messageBox.textContent = '';

            if (mode === 'signin') {
                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        messageBox.className = "mb-4 text-sm text-center font-medium text-green-600";
                        messageBox.textContent = "Success! Redirecting...";
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    })
                    .catch((error) => {
                        messageBox.className = "mb-4 text-sm text-center font-medium text-red-600";
                        messageBox.textContent = error.message;
                    });
            } else if (mode === 'signup') {
                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        messageBox.className = "mb-4 text-sm text-center font-medium text-green-600";
                        messageBox.textContent = "Account created successfully! Redirecting...";
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1200);
                    })
                    .catch((error) => {
                        messageBox.className = "mb-4 text-sm text-center font-medium text-red-600";
                        messageBox.textContent = error.message;
                    });
            } else if (mode === 'forgot') {
                sendPasswordResetEmail(auth, email)
                    .then(() => {
                        messageBox.className = "mb-4 text-sm text-center font-medium text-green-600";
                        messageBox.textContent = "Password reset email sent! Check your inbox.";
                    })
                    .catch((error) => {
                        messageBox.className = "mb-4 text-sm text-center font-medium text-red-600";
                        messageBox.textContent = error.message;
                    });
            }
        });
    </script>
</body>
</html>
