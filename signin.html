<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand">
        <span class="brand-mark">L</span>
        <span>LamaStudio<small>App & Software Portal</small></span>
      </a>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn-ghost" style="font-size: 0.85rem; padding: 0.4rem 0.8rem;">← Back to Home</a>
    </div>
  </div>
</header>

<main style="max-width: 450px; margin: 80px auto; padding: 0 20px; font-family: 'Inter', sans-serif;">
  <div style="background: var(--surface, #1e1e1e); border: 1px solid var(--border, #333); border-radius: 20px; padding: 40px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    
    <div style="text-align: center; margin-bottom: 30px;">
      <span class="brand-mark" style="width: 40px; height: 40px; font-size: 1.2rem; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center;">L</span>
      <h1 style="color: var(--text, #fff); font-size: 1.8rem; margin-bottom: 8px;">Welcome Back</h1>
      <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">Sign in to access your LamaStudio account and utilities.</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('Sign in integration placeholder. Connect your backend or authentication provider here!');" style="display: flex; flex-direction: column; gap: 20px;">
      
      <div>
        <label style="display: block; color: rgba(255,255,255,0.8); font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Email Address</label>
        <input type="email" placeholder="name@example.com" required style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--category-color, #174ea6)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
      </div>

      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label style="color: rgba(255,255,255,0.8); font-size: 0.85rem; font-weight: 600;">Password</label>
          <a href="#" style="color: var(--category-color, #174ea6); font-size: 0.8rem; text-decoration: none;">Forgot password?</a>
        </div>
        <input type="password" placeholder="••••••••" required style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--category-color, #174ea6)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
      </div>

      <button type="submit" class="btn-action" style="width: 100%; padding: 12px; text-align: center; justify-content: center; font-weight: 600; margin-top: 10px; border: none; cursor: pointer;">
        <span>Sign In</span>
      </button>

    </form>

    <div style="text-align: center; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
      <p style="color: rgba(255,255,255,0.6); font-size: 0.85rem;">
        Don't have an account? <a href="#" style="color: var(--text, #fff); font-weight: 600; text-decoration: underline;">Create one</a>
      </p>
    </div>

  </div>
</main>

</body>
</html>
