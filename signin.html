<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Access — LamaStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="util-row">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="brand">
        <span class="brand-mark">L</span>
        <span>LamaStudio<small>App & Software Portal</small></span>
      </a>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn-ghost" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; text-decoration: none;">← Back to Home</a>
    </div>
  </div>
</header>

<main style="max-width: 440px; margin: 60px auto; padding: 0 20px; font-family: 'Inter', sans-serif;">
  <div style="background: var(--surface, #1e1e1e); border: 1px solid var(--border, #333); border-radius: 20px; padding: 35px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    
    <div style="text-align: center; margin-bottom: 25px;">
      <span class="brand-mark" style="width: 40px; height: 40px; font-size: 1.2rem; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center;">L</span>
      <h1 id="formTitle" style="color: var(--text, #fff); font-size: 1.6rem; margin-bottom: 6px;">Welcome Back</h1>
      <p id="formSubtitle" style="color: rgba(255,255,255,0.6); font-size: 0.85rem;">Access your LamaStudio developer portal & apps.</p>
    </div>

    <!-- Google Auto-Sync Button -->
    <button onclick="handleGoogleSignIn()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 11px 16px; color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.06)'">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.18 21.31 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.1 0 9.89 0 12s.43 3.9 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.18 2.69 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Continue with Google
    </button>

    <div style="display: flex; align-items: center; margin: 20px 0; color: rgba(255,255,255,0.3); font-size: 0.8rem;">
      <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
      <span style="padding: 0 10px;">or email</span>
      <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)" style="display: flex; flex-direction: column; gap: 15px;">
      
      <div id="nameFieldGroup" style="display: none;">
        <label style="display: block; color: rgba(255,255,255,0.8); font-size: 0.82rem; font-weight: 600; margin-bottom: 6px;">Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe" style="width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none;">
      </div>

      <div>
        <label style="display: block; color: rgba(255,255,255,0.8); font-size: 0.82rem; font-weight: 600; margin-bottom: 6px;">Email Address</label>
        <input type="email" id="emailInput" placeholder="name@example.com" required style="width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none;">
      </div>

      <div id="passwordGroup">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label style="color: rgba(255,255,255,0.8); font-size: 0.82rem; font-weight: 600;">Password</label>
          <a href="#" onclick="switchMode('forgot'); return false;" style="color: var(--category-color, #174ea6); font-size: 0.78rem; text-decoration: none;">Forgot password?</a>
        </div>
        <input type="password" id="passwordInput" placeholder="••••••••" required style="width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none;">
      </div>

      <button type="submit" id="submitBtn" class="btn-action" style="width: 100%; padding: 11px; text-align: center; justify-content: center; font-weight: 600; margin-top: 5px; border: none; cursor: pointer;">
        <span id="submitBtnText">Sign In</span>
      </button>

    </form>

    <div style="text-align: center; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 18px;">
      <p id="switchText" style="color: rgba(255,255,255,0.6); font-size: 0.83rem;">
        Don't have an account? <a href="#" onclick="switchMode('signup'); return false;" style="color: var(--text, #fff); font-weight: 600; text-decoration: underline;">Create account</a>
      </p>
    </div>

  </div>
</main>

<script>
  let currentMode = 'signin';

  function switchMode(mode) {
    currentMode = mode;
    const title = document.getElementById('formTitle');
    const subtitle = document.getElementById('formSubtitle');
    const nameGroup = document.getElementById('nameFieldGroup');
    const passwordGroup = document.getElementById('passwordGroup');
    const submitBtnText = document.getElementById('submitBtnText');
    const switchText = document.getElementById('switchText');

    if (mode === 'signin') {
      title.innerText = 'Welcome Back';
      subtitle.innerText = 'Access your LamaStudio developer portal & apps.';
      nameGroup.style.display = 'none';
      passwordGroup.style.display = 'block';
      submitBtnText.innerText = 'Sign In';
      switchText.innerHTML = `Don't have an account? <a href="#" onclick="switchMode('signup'); return false;" style="color: var(--text, #fff); font-weight: 600; text-decoration: underline;">Create account</a>`;
    } else if (mode === 'signup') {
      title.innerText = 'Create Account';
      subtitle.innerText = 'Join LamaStudio to manage apps & track utilities.';
      nameGroup.style.display = 'block';
      passwordGroup.style.display = 'block';
      submitBtnText.innerText = 'Create Account';
      switchText.innerHTML = `Already have an account? <a href="#" onclick="switchMode('signin'); return false;" style="color: var(--text, #fff); font-weight: 600; text-decoration: underline;">Sign In</a>`;
    } else if (mode === 'forgot') {
      title.innerText = 'Reset Password';
      subtitle.innerText = 'Enter your email and we will send you a recovery link.';
      nameGroup.style.display = 'none';
      passwordGroup.style.display = 'none';
      submitBtnText.innerText = 'Send Reset Link';
      switchText.innerHTML = `Remembered your password? <a href="#" onclick="switchMode('signin'); return false;" style="color: var(--text, #fff); font-weight: 600; text-decoration: underline;">Sign In</a>`;
    }
  }

  function handleGoogleSignIn() {
    // Simulate auto-syncing Google account name/email
    const googleUser = {
      name: "Google Viewer",
      email: "viewer@gmail.com"
    };
    localStorage.setItem("lamastudio_user", JSON.stringify(googleUser));
    alert("Google Account synced successfully!");
    window.location.href = 'index.html';
  }

  function handleAuth(event) {
    event.preventDefault();
    const email = document.getElementById('emailInput').value;

    if (currentMode === 'forgot') {
      alert('Password reset link dispatched to ' + email);
      switchMode('signin');
      return;
    }

    let name = "Valued Viewer";
    if (currentMode === 'signup') {
      name = document.getElementById('fullName').value || "New User";
    } else {
      // Extract name portion from email if signing in directly
      name = email.split('@')[0];
      name = name.charAt(0).toUpperCase() + name.slice(1);
    }

    // Save session record locally
    const userData = { name: name, email: email };
    localStorage.setItem("lamastudio_user", JSON.stringify(userData));

    alert('Welcome back, ' + name + '!');
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
